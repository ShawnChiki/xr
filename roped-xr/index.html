<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roped XR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f2e8d2;font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif}
  #stage canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #vr{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);font:400 22px/1 Bungee,Rubik,sans-serif;letter-spacing:.03em;padding:16px 30px 14px;
    background:#ffd21f;color:#161412;border:4px solid #161412;box-shadow:7px 7px 0 #e3218e,7px 7px 0 4px #161412;cursor:pointer}
  #vr:active{transform:translate(calc(-50% + 4px),4px);box-shadow:3px 3px 0 #e3218e,3px 3px 0 4px #161412}
  #vr[hidden],#help[hidden]{display:none}
  #help{position:fixed;left:12px;top:12px;font:500 13px/1.5 Rubik,system-ui,sans-serif;color:#161412;background:#fffdf7;border:2px solid #161412;
    box-shadow:4px 4px 0 #161412;padding:8px 12px;max-width:min(340px,calc(100vw - 48px))}
  #help b{font-weight:800}
</style>
</head>
<body>
<div id="stage"></div>
<div id="help"><b>No headset?</b> You can try it here: drag to look, WASD to walk, Space to jump, hold Shift to grab, Q/E to reel, M for the menu. Click the signs.</div>
<button id="vr" hidden>Enter VR</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
/* ================= Roped XR: two climbers on one rope, each with their own gravity, in first person.
   Level, rope and bodies come from the phone game Roped (games repo); the VR parts are new:
   your hands grab fences and poles, your head is the camera, and the lobby has a character maker. ================= */
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const G = 12, R = 0.4;
const ROLES = { A: { up: V(0, 1, 0), hue: '#e3218e' }, B: { up: V(1, 0, 0), hue: '#1c4fe0' } };
const PAL = ['#e8202a', '#ffd21f', '#1c4fe0', '#e3218e', '#ff7a00', '#00a651', '#6b2bd9', '#00b4e6', '#a8e000', '#ff8fc7'];

// the route: a wandering spine; A travels on top faces near (cx, cy), B on +X faces near (cx + 2.2, cy - 1.5)
const LANE_B = V(2.2, -1.5, 0);
function spine(z) { return V(1.6 * Math.sin(z * 0.065), 1.3 * Math.sin(z * 0.047 + 1), z); }
function laneA(z) { return spine(z); }
function laneB(z) { return spine(z).add(LANE_B); }

/* ---------- colliders ---------- */
function mkBox(c, q, h, mat, color, extra) { const o = { kind: 'box', c, q, inv: q.clone().invert(), h, mat, color, br: h.length() }; return Object.assign(o, extra || {}); }
function mkCyl(c, q, r, hh, mat, color) { return { kind: 'cyl', c, q, inv: q.clone().invert(), r, hh, mat, color, br: Math.hypot(r, hh) }; }
function mkSphere(c, r, mat, color) { return { kind: 'sphere', c, r, mat, color, br: r }; }
function mkPole(a, b, r, color) { const c = a.clone().add(b).multiplyScalar(0.5); return { kind: 'pole', a, b, r, mat: 'pole', color, c, br: a.distanceTo(b) / 2 + r }; }
const _t1 = V(), _t2 = V(), _t3 = V();
// nearest point on the collider's surface to p, the outward normal there, and whether p is inside
function nearest(col, p, out) {
  if (col.kind === 'sphere') { const d = _t1.copy(p).sub(col.c), l = d.length() || 1e-6; out.n.copy(d).divideScalar(l); out.q.copy(col.c).addScaledVector(out.n, col.r); out.inside = l < col.r; return out; }
  if (col.kind === 'pole') {
    const ab = _t1.copy(col.b).sub(col.a), t = clamp(_t2.copy(p).sub(col.a).dot(ab) / ab.lengthSq(), 0, 1);
    const cp = _t2.copy(col.a).addScaledVector(ab, t), d = _t3.copy(p).sub(cp), l = d.length() || 1e-6;
    out.n.copy(d).divideScalar(l); out.q.copy(cp).addScaledVector(out.n, col.r); out.inside = l < col.r; out.t = t; return out;
  }
  const L = _t1.copy(p).sub(col.c).applyQuaternion(col.inv);
  if (col.kind === 'box') {
    const h = col.h, inside = Math.abs(L.x) < h.x && Math.abs(L.y) < h.y && Math.abs(L.z) < h.z;
    const Q = _t2.set(clamp(L.x, -h.x, h.x), clamp(L.y, -h.y, h.y), clamp(L.z, -h.z, h.z)), N = _t3.set(0, 0, 0);
    if (inside) { const dx = h.x - Math.abs(L.x), dy = h.y - Math.abs(L.y), dz = h.z - Math.abs(L.z);
      if (dx <= dy && dx <= dz) { Q.x = Math.sign(L.x || 1) * h.x; N.x = Math.sign(L.x || 1); } else if (dy <= dz) { Q.y = Math.sign(L.y || 1) * h.y; N.y = Math.sign(L.y || 1); } else { Q.z = Math.sign(L.z || 1) * h.z; N.z = Math.sign(L.z || 1); } }
    else { N.copy(L).sub(Q).normalize(); }
    out.q.copy(Q).applyQuaternion(col.q).add(col.c); out.n.copy(N).applyQuaternion(col.q); out.inside = inside; return out;
  }
  // cylinder, axis = local Y
  const rad = Math.hypot(L.x, L.z), inside = rad < col.r && Math.abs(L.y) < col.hh;
  const Q = _t2.copy(L), N = _t3.set(0, 0, 0);
  if (rad > col.r) { Q.x *= col.r / rad; Q.z *= col.r / rad; }
  Q.y = clamp(L.y, -col.hh, col.hh);
  if (inside) { if (col.r - rad < col.hh - Math.abs(L.y)) { const k = col.r / (rad || 1e-6); Q.x = L.x * k; Q.z = L.z * k; N.set(L.x, 0, L.z).normalize(); } else { Q.y = Math.sign(L.y || 1) * col.hh; N.set(0, Math.sign(L.y || 1), 0); } }
  else N.copy(L).sub(Q).normalize();
  out.q.copy(Q).applyQuaternion(col.q).add(col.c); out.n.copy(N).applyQuaternion(col.q); out.inside = inside; return out;
}
const NR = { q: V(), n: V(), inside: false, t: 0 };

/* ---------- procedural level: a floating Kandinsky composition along the route ---------- */
function quatFromUp(up, spin) { const q = new THREE.Quaternion().setFromUnitVectors(V(0, 1, 0), up.clone().normalize()); if (spin) q.multiply(new THREE.Quaternion().setFromAxisAngle(V(0, 1, 0), spin)); return q; }
function tilt(rng, up, deg) { const a = (rng() - 0.5) * 2 * deg * Math.PI / 180, b = (rng() - 0.5) * 2 * deg * Math.PI / 180; return up.clone().applyEuler(new THREE.Euler(a, 0, b)).normalize(); }
function genLevel(seed) {
  const rng = mulberry(seed), cols = [], decor = [], cps = [];
  const pick = () => PAL[Math.floor(rng() * PAL.length)];
  const L = { cols, decor, cps, seed };
  const shared = (z0, len, color) => { // one block: its top is A's floor, its right face is B's floor
    const zc = z0 + len / 2, s = spine(zc);
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, (rng() - 0.5) * 0.12, (rng() - 0.5) * 0.1));
    cols.push(mkBox(V(s.x + 0.35, s.y - 1.55, zc), q, V(1.45, 1.15, len / 2), 'block', color || pick(), { tex: Math.floor(rng() * 6) }));
  };
  const sepA = (zc) => { const s = laneA(zc), r = 0.9 + rng() * 0.6; const up = tilt(rng, V(0, 1, 0), 16);
    if (rng() < 0.55) cols.push(mkCyl(V(s.x + (rng() - 0.5) * 0.8, s.y - 0.4 - 0.2, zc), quatFromUp(up), r, 0.2, 'block', pick()));
    else cols.push(mkBox(V(s.x + (rng() - 0.5) * 0.6, s.y - 0.4 - 0.18, zc), quatFromUp(up, rng() * 3), V(r * 0.9, 0.18, r * 0.75), 'block', pick(), { tex: Math.floor(rng() * 6) })); };
  const sepB = (zc) => { const s = laneB(zc), r = 0.85 + rng() * 0.55; const up = tilt(rng, V(1, 0, 0), 16);
    if (rng() < 0.55) cols.push(mkCyl(V(s.x - 0.4 - 0.2, s.y + (rng() - 0.5) * 0.8, zc), quatFromUp(up), r, 0.2, 'block', pick()));
    else cols.push(mkBox(V(s.x - 0.4 - 0.18, s.y + (rng() - 0.5) * 0.6, zc), quatFromUp(up, rng() * 3), V(r * 0.75, 0.18, r * 0.9), 'block', pick(), { tex: Math.floor(rng() * 6) })); };
  const ramp = (z0, len) => { // a 45° slab both can stand on
    const zc = z0 + len / 2, n = V(1, 1, 0).normalize(), a = laneA(zc), b = laneB(zc);
    const d = Math.min(n.dot(a), n.dot(b)) - R, m = a.clone().add(b).multiplyScalar(0.5);
    const c = m.clone().addScaledVector(n, -(n.dot(m) - d)).addScaledVector(n, -0.16);
    const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(V(1, -1, 0).normalize(), n, V(0, 0, 1)));
    cols.push(mkBox(c, q, V(2.6, 0.16, len / 2), 'block', pick(), { tex: Math.floor(rng() * 6) }));
  };
  const gridSheet = (z0, len) => { // a tilted chain-link sheet across both lanes: climb it
    const zc = z0 + len / 2, a = laneA(zc), b = laneB(zc), along = b.clone().sub(a).normalize(), n = V(-along.y, along.x, 0).normalize();
    const flip = rng() < 0.5 ? 1 : -1, c = a.clone().add(b).multiplyScalar(0.5).addScaledVector(n, flip * 0.45);
    const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(along, n, V(0, 0, 1)));
    cols.push(mkBox(c, q, V(2.7, 0.03, len / 2), 'grid', pick()));
  };
  const glossGap = (z0, len) => {
    const zc = z0 + len / 2, a = laneA(zc), b = laneB(zc);
    cols.push(mkSphere(V(a.x - 0.2, a.y - 1.7, zc), 1.35, 'gloss', pick()));
    cols.push(mkSphere(V(b.x - 1.9, b.y + 0.3, zc + 0.6), 1.1, 'gloss', pick()));
    cols.push(mkPole(V(a.x + 0.9, a.y + 1.3, z0 - 0.6), V(a.x + 1.2, a.y + 0.9, z0 + len + 0.6), 0.09, pick()));
  };
  const poles = (z0, len) => {
    const a = laneA(z0), a2 = laneA(z0 + len), b = laneB(z0), b2 = laneB(z0 + len);
    cols.push(mkPole(V(a.x - 0.3, a.y + 0.55, z0 - 0.5), V(a2.x + 0.4, a2.y + 0.35, z0 + len + 0.5), 0.09, pick()));
    cols.push(mkPole(V(b.x + 0.55, b.y + 0.3, z0 - 0.5), V(b2.x + 0.35, b2.y - 0.4, z0 + len + 0.5), 0.09, pick()));
  };
  // build
  let z = -4; shared(z, 8, '#ffd21f'); cps.push({ z: 0 }); z += 8;
  const goalZ = 104; let nextCp = 26;
  while (z < goalZ - 6) {
    const k = clamp(z / goalZ, 0, 1), gap = 0.5 + rng() * (0.6 + k * 0.9);
    z += gap;
    if (z >= nextCp) { shared(z, 4); cps.push({ z: z + 2 }); z += 4; nextCp += 26; continue; }
    const r = rng();
    if (r < 0.24) { const len = 2 + rng() * 2.5; shared(z, len); z += len; }
    else if (r < 0.5) { const len = 2.2 + rng() * 1.2; sepA(z + len / 2 + (rng() - 0.5) * 0.6); sepB(z + len / 2 + (rng() - 0.5) * 0.6); if (rng() < 0.3) { sepA(z + len + 1.2); z += 1.2; } z += len; }
    else if (r < 0.62) { const len = 2.5 + rng() * 2; ramp(z, len); z += len; }
    else if (r < 0.76) { const len = 3.5 + rng() * 2; gridSheet(z, len); z += len; }
    else if (r < 0.88) { const len = 3.4; glossGap(z, len); z += len; }
    else { const len = 3.5 + rng() * 1.5; poles(z, len); z += len; }
  }
  z += 0.8; shared(z, 7, '#ffd21f'); L.goalZ = z + 3.5;
  // repair pass: wherever a lane has nothing to stand on or grab for more than a jump, drop in a stepping stone
  const support = (role, z) => {
    const up = ROLES[role].up, p0 = (role === 'A' ? laneA(z) : laneB(z)).addScaledVector(up, 0.6), near = cols.filter(c => Math.abs(c.c.z - z) < c.br + 1);
    const out = { q: V(), n: V() };
    for (let d = 0; d < 2.8; d += 0.15) { const p = p0.clone().addScaledVector(up, -d);
      for (const c of near) { nearest(c, p, out); const dist = p.distanceTo(out.q);
        if ((c.mat === 'block' && dist < 0.45 && out.n.dot(up) > 0.6) || ((c.mat === 'grid' || c.mat === 'pole') && dist < 1.0)) return true; } }
    return false;
  };
  for (const role of ['A', 'B']) {
    let start = null;
    for (let zz = 0; zz < L.goalZ; zz += 0.25) {
      if (support(role, zz)) { if (start !== null && zz - start > 2.4) { const n = Math.ceil((zz - start) / 2.2); for (let i = 1; i < n; i++) { const zc = start + (zz - start) * i / n; role === 'A' ? sepA(zc) : sepB(zc); } } start = null; }
      else if (start === null) start = zz;
    }
  }
  // Kandinsky decor that floats around the route (not solid)
  for (let dz = -10; dz < L.goalZ + 14; dz += 0.9) {
    const s = spine(dz), ang = rng() * Math.PI * 2, dist = 3.6 + rng() * 10;
    const p = V(s.x + 1.1 + Math.cos(ang) * dist, s.y - 0.7 + Math.sin(ang) * dist, dz + rng());
    const t = rng();
    decor.push({ kind: t < 0.3 ? 'rings' : t < 0.48 ? 'tri' : t < 0.62 ? 'line' : t < 0.76 ? 'checker' : t < 0.9 ? 'disc' : 'arc', p, rot: [rng() * 6, rng() * 6, rng() * 6], s: 0.5 + rng() * 1.8, color: pick(), color2: pick() });
  }
  return L;
}

/* ---------- rope: the taut route between two points, wrapped around solids ---------- */
const NB = 14;
function makeBand(a, b) { const pts = []; for (let i = 0; i < NB; i++) pts.push(a.clone().lerp(b, i / (NB - 1))); return pts; }
function pushOut(p, cols, r) {
  for (const c of cols) {
    if (c.mat === 'grid') continue;
    if (Math.abs(p.z - c.c.z) > c.br + r || p.distanceToSquared(c.c) > (c.br + r) * (c.br + r)) continue;
    nearest(c, p, NR);
    if (NR.inside) p.copy(NR.q).addScaledVector(NR.n, r);
    else if (p.distanceToSquared(NR.q) < r * r) p.copy(NR.q).addScaledVector(NR.n, r);
  }
}
function stepBand(band, a, b, cols) {
  band[0].copy(a); band[NB - 1].copy(b);
  const m = V();
  for (let it = 0; it < 4; it++) for (let i = 1; i < NB - 1; i++) {
    m.copy(band[i - 1]).add(band[i + 1]).multiplyScalar(0.5);
    band[i].lerp(m, 0.6); pushOut(band[i], cols, 0.07);
  }
  let l = 0; for (let i = 0; i < NB - 1; i++) l += band[i].distanceTo(band[i + 1]);
  return l;
}

/* ---------- a climber's body ---------- */
function makeBody(role, p) {
  return { role, up: ROLES[role].up.clone(), p: p.clone(), v: V(), state: 'ground', groundN: ROLES[role].up.clone(), airT: 0, yankT: 0, grabCool: 0,
    grab: null, grabKind: 'grid', grabAxis: null, grabN: V(), grabPt: V(), halfL: 2.2, mouth: 0,
    input: { x: 0, y: 0, jump: false, grab: false, rin: false, rout: false }, jumpWas: false, speed: 0,
    hands: null, desk: false, walk: V(), look: V(0, 0, 1) };
}
// forward and right in the climber's floor plane, from where it is looking
function bodyBasis(b) {
  const f = b.look.clone(); f.addScaledVector(b.up, -f.dot(b.up));
  if (f.lengthSq() < 1e-4) { f.set(0, 0, 1); f.addScaledVector(b.up, -f.dot(b.up)); }
  f.normalize(); return { f, r: V().crossVectors(f, b.up).normalize() };
}
function nearCols(cols, p, pad) { const out = []; for (const c of cols) if (Math.abs(p.z - c.c.z) < c.br + pad && p.distanceToSquared(c.c) < (c.br + pad) * (c.br + pad)) out.push(c); return out; }
const WALK = 2.8, JUMP = 6.0, CLIMB = 2.1, GRAB_R = 0.3, GRAB_R_DESK = 0.55, FLING = 7;
// push a body out of anything solid; returns the averaged normal of what it stands on (or null)
function collide(b, near, standable, dt) {
  let grounded = false; const gN = V();
  for (let pass = 0; pass < 2; pass++) for (const c of near) {
    if (c.kind === 'pole') continue; // poles are thin: you grab them, you don't stand on them
    nearest(c, b.p, NR);
    if (!NR.inside && b.p.distanceToSquared(NR.q) >= R * R) continue;
    const n = NR.n.clone(); b.p.copy(NR.q).addScaledVector(n, R);
    const vn = b.v.dot(n); if (vn < 0) b.v.addScaledVector(n, -vn);
    if (standable && c.mat === 'block' && n.dot(b.up) > 0.6) { grounded = true; gN.add(n); }
    else if (standable && c.mat === 'grid') b.v.multiplyScalar(1 - Math.min(1, 3 * dt));
  }
  return grounded ? gN.normalize() : null;
}
// one physics step for a locally controlled climber.
// b.hands (yours only): [{ w: hand in the world, grip, held, anchor }]. A held hand stays where it grabbed,
// so moving your real hand moves your body the other way: pull down to go up, hand over hand.
function stepBody(b, dt, cols, events) {
  const I = b.input, up = b.up, near = nearCols(cols, b.p, 1.8);
  const jumpPress = I.jump && !b.jumpWas; b.jumpWas = I.jump;
  b.grabCool -= dt; b.yankT -= dt;
  const { f, r } = bodyBasis(b);
  const wish = V().addScaledVector(f, I.y).addScaledVector(r, I.x); if (wish.lengthSq() > 1) wish.normalize();
  const H = b.hands, p0 = b.p.clone();
  if (H) {
    for (const h of H) {
      if (!h.grip) { h.held = false; h.lock = false; continue; }
      if (h.held || h.lock || b.grabCool > 0) continue;
      let best = null, bd = b.desk ? GRAB_R_DESK : GRAB_R;
      for (const c of near) if (c.mat === 'grid' || c.mat === 'pole') { nearest(c, h.w, NR); const d = h.w.distanceTo(NR.q); if (d < bd) { bd = d; best = c; } }
      if (best) { h.held = true; h.col = best; h.anchor = h.w.clone(); h.buzz = true; events.push('grab'); }
    }
    const held = H.filter(h => h.held);
    if (held.length) {
      if (b.state !== 'grab') { b.state = 'grab'; b.airT = 0; b.v.set(0, 0, 0); }
      if (jumpPress) { // push off whatever you're holding
        b.v.copy(b.grabN).multiplyScalar(3.6).addScaledVector(up, 4.5).addScaledVector(wish, 2.5);
        b.state = 'air'; b.grab = null; b.airT = 0; b.grabCool = 0.35; for (const h of held) { h.held = false; h.lock = true; } events.push('jump');
      } else {
        const c = held[0].col; let move = wish.clone();
        if (c.kind === 'pole') { const ax = c.b.clone().sub(c.a).normalize(); move = ax.multiplyScalar(move.dot(ax)); }
        else { nearest(c, b.p, NR); move.addScaledVector(NR.n, -move.dot(NR.n)); }
        move.multiplyScalar(CLIMB * dt); // the stick slides you along what you hold, too
        const d = V(), gp = V();
        for (const h of held) { h.anchor.add(move); d.add(h.anchor).sub(h.w); gp.add(h.anchor); }
        d.divideScalar(held.length).clampLength(0, 0.4); gp.divideScalar(held.length);
        b.p.add(d); collide(b, near, false, dt);
        const vNow = b.p.clone().sub(p0).divideScalar(dt); b.v.lerp(vNow, 0.3);
        nearest(c, gp, NR); b.grabN.copy(NR.n); b.grabPt.copy(gp); b.grab = c; b.grabKind = c.kind; b.speed = vNow.length();
        b.grabAxis = c.kind === 'pole' ? c.b.clone().sub(c.a).normalize() : null;
      }
    } else if (b.state === 'grab') { // let go: you fly off with your swing
      b.state = 'air'; b.grab = null; b.airT = 0; b.grabCool = 0.1; b.v.clampLength(0, FLING);
    }
  } else if (b.state === 'grab') { // someone not being driven (the other climber when practising) just keeps holding
    if (I.grab) { b.v.set(0, 0, 0); b.speed = 0; } else { b.state = 'air'; b.grab = null; b.v.set(0, 0, 0); b.grabCool = 0.25; }
  }
  if (b.state !== 'grab') {
    b.v.addScaledVector(up, -G * dt);
    const vUp = b.v.dot(up), vPl = b.v.clone().addScaledVector(up, -vUp);
    if (b.state === 'ground') {
      const target = wish.clone().multiplyScalar(WALK); target.addScaledVector(b.groundN, -target.dot(b.groundN));
      vPl.lerp(target.clone().addScaledVector(up, -target.dot(up)), 1 - Math.exp(-14 * dt));

    const L = v => toLocal(v.clone().sub(p));
    const prims = [{ s: bellyC, r: SH.bR, sy: SH.bSy, k: 0.2 }, { s: headC, r: SH.hR, k: 0.22 }];
    for (const A of ch.arms) { const s0 = L(A.S), e = L(A.E), h = L(A.H); prims.push({ a: s0.clone().lerp(V(bellyC.x, shY, bellyC.z), 0.35), b: e, r: 0.085, k: 0.14 }, { a: e, b: h, r: 0.075, k: 0.06 }, { s: h, r: 0.1, k: 0.06 }); }

  ch.strands.forEach((st, si) => {
    const root = toWorld(st.anchor.clone().multiplyScalar(hk).applyEuler(ch.head.rotation).add(headC));
    const dirW = st.dir ? st.dir.clone().applyQuaternion(hq) : null;

      const v = st.p[i].clone().sub(st.q[i]).multiplyScalar(0.8); st.q[i].copy(st.p[i]); st.p[i].add(v).addScaledVector(g, h2);

    const last = st.p[segs - 1].clone(); if (dirW) last.addScaledVector(dirW, 0.02); else last.addScaledVector(up, -0.03);

/* ---------- rope: drapes when slack, follows the wrapped taut route when tight ---------- */
const RN = 24;
const ropeW = new THREE.Mesh(new THREE.BufferGeometry(), toon({ color: 0xffffff })), ropeO = new THREE.Mesh(new THREE.BufferGeometry(), INK);
scene.add(ropeW, ropeO);
const rope = { p: [], q: [] };
function resetRopeDraw(a, b) { rope.p = []; rope.q = []; for (let i = 0; i < RN; i++) { const v = a.clone().lerp(b, i / (RN - 1)); rope.p.push(v); rope.q.push(v.clone()); } }
function drawRope(a, b, gA, gB, L, band, taut, cols, dt) {
  if (!rope.p.length) resetRopeDraw(a, b);
  const segL = L / (RN - 1), h2 = Math.min(dt, 1 / 30) ** 2;
  const bandAt = u => { const x = u * (NB - 1), k = Math.min(NB - 2, Math.floor(x)); return band[k].clone().lerp(band[k + 1], x - k); };
  for (let i = 1; i < RN - 1; i++) {
    const p = rope.p[i], v = p.clone().sub(rope.q[i]).multiplyScalar(0.95); rope.q[i].copy(p);
    p.add(v).addScaledVector(gA.clone().lerp(gB, i / (RN - 1)).normalize(), -G * h2 * 0.6);
    p.lerp(bandAt(i / (RN - 1)), taut ? 0.6 : 0.02);
  }
  const near = nearCols(cols, a.clone().add(b).multiplyScalar(0.5), L / 2 + 1.5);
  for (let it = 0; it < 12; it++) {
    rope.p[0].copy(a); rope.p[RN - 1].copy(b);
    for (let i = 0; i < RN - 1; i++) { const p = rope.p[i], q = rope.p[i + 1], d = q.clone().sub(p), l = d.length(); if (l > segL) { const k = (l - segL) / l * 0.5; if (i > 0) p.addScaledVector(d, k); if (i + 1 < RN - 1) q.addScaledVector(d, -k); } }
    if (it % 3 === 2) for (let i = 1; i < RN - 1; i++) pushOut(rope.p[i], near, 0.06);
  }
  rope.p[0].copy(a); rope.p[RN - 1].copy(b);
  const curve = new THREE.CatmullRomCurve3(rope.p, false, 'centripetal');
  ropeW.geometry.dispose(); ropeO.geometry.dispose();
  ropeW.geometry = new THREE.TubeGeometry(curve, 48, 0.045, 6, false); ropeO.geometry = new THREE.TubeGeometry(curve, 48, 0.075, 6, false);
}

  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.out = this.ctx.createGain(); this.out.gain.value = 0.5; this.out.connect(this.ctx.destination); } catch (e) {} },

  setTimeout(() => { if (!NET.on && NET.code === code && NET.joining) { NET.joining = false; lob("Couldn't connect. Check the code and try again."); } }, 20000);
}
function attach(c) {
  c.on('open', () => { NET.conn = c; try { c.send({ t: 'look', look: myLook }); } catch (e) {}
    if (NET.host) { lob(''); sfx.play('cp'); voiceCall(c.peer); if (game.mode === 'lobby') game.lr = makeRemote('A', LOBBY_SPAWN[1]); }
    else { Object.assign(NET, { on: true, host: false, joining: false }); game.me = 'B'; UI.page = 'home'; lob(''); refreshLooks(); voiceInit(); sfx.play('cp'); toLobby(); } });
  c.on('data', netData); c.on('close', netDrop); c.on('error', netDrop);
}
function netSend(m) { if (!NET.conn) return; try { NET.conn.open !== false && NET.conn.send(m); } catch (e) {} }
function netDrop() {
  if (!NET.conn && !NET.joining) return;
  const playing = game.mode !== 'lobby';
  if (NET.host) { NET.conn = null; game.lr = null; const msg = 'Your partner left. Waiting for someone new…'; lob(msg); if (playing) toLobby(msg); }
  else { netReset(); UI.page = 'home'; const msg = 'The host left the game.'; lob(msg); if (playing) toLobby(msg); }
}
const r2 = v => Math.round(v * 100) / 100, a3 = v => [r2(v.x), r2(v.y), r2(v.z)];
function netFrame(dt) {
  if (!NET.conn || game.mode === 'end') return;
  NET.sendT -= dt; if (NET.sendT > 0) return; NET.sendT = 1 / 20;
  const b = activeBody(); if (!b) return;
  netSend({ t: 's', m: game.mode === 'lobby' ? 'l' : 'p', p: a3(b.p), v: a3(b.v), st: STATES.indexOf(b.state), at: r2(b.airT), hl: r2(b.halfL), mo: r2(b.mouth || 0),
    gp: a3(b.grabPt), gn: a3(b.grabN), gk: b.grabKind === 'pole' ? 'pole' : 'grid', sp: r2(b.speed || 0), lk: a3(b.look), h: HANDS.map(h => handOn(h.side) ? a3(h.w) : 0) });
}
function netData(m) {
  switch (m.t) {
    case 'look': partnerLook = cleanLook(m.look); refreshLooks(); break;
    case 's': { const r = m.m === 'l' ? (game.mode === 'lobby' ? game.lr : null) : (game.mode !== 'lobby' && game.net ? game[other(game.me)] : null); if (r && r.remote) applySnap(r, m); break; }
    case 'start': if (!NET.host) { game.me = 'B'; startGame(m.seed, true); } break;
    case 'fell': if (NET.host) onFell(m.r); break;
    case 'resp': if (!NET.host) { game.lives = m.lives; if (m.over) { game.over = true; endGame(false); } else { toast(`${roleName(m.by)} fell. ${m.lives} ${m.lives === 1 ? 'life' : 'lives'} left.`); sfx.play('fall'); buzzAll(0.6, 250); game.respawnT = 1.2; game.cp = m.cp; } } break;
    case 'cp': if (!NET.host && m.i > game.cp) { game.cp = m.i; toast('Checkpoint'); sfx.play('cp'); } break;
    case 'win': if (!NET.host) { game.lives = m.lives; game.over = true; endGame(true); } break;
    case 'lobby': if (game.mode !== 'lobby') toLobby(); break;
    case 'full': lob('That game already has two climbers.'); netReset(); break;
    case 'bye': netDrop(); break;
  }
}

/* ---------- voice: hear each other from where you are, and your mouths move when you talk ---------- */
const VOICE = { local: null, calls: {}, nodes: {}, an: null, buf: null, muted: false, ready: null };
function silentStream() { sfx.init(); return sfx.ctx ? sfx.ctx.createMediaStreamDestination().stream : new MediaStream(); }
function voiceInit() {
  if (VOICE.ready) return VOICE.ready; sfx.init();
  VOICE.ready = (async () => { if (NET.test || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    try { VOICE.local = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch (e) { VOICE.local = null; lob('No microphone: you can still hear your partner.'); return; }
    if (sfx.ctx) { const an = sfx.ctx.createAnalyser(); an.fftSize = 512; sfx.ctx.createMediaStreamSource(VOICE.local).connect(an); VOICE.an = an; VOICE.buf = new Float32Array(an.fftSize); }
    syncMic(); })();
  return VOICE.ready;
}
function voiceCall(id) { if (!NET.peer || NET.test) return; (VOICE.ready || voiceInit()).then(() => { try { const call = NET.peer.call(id, VOICE.local || silentStream()); if (call) voiceAttach(call); } catch (e) {} }); }
function voiceAnswer(call) { (VOICE.ready || voiceInit()).then(() => { try { call.answer(VOICE.local || silentStream()); voiceAttach(call); } catch (e) {} }); }
function voiceAttach(call) { VOICE.calls[call.peer] = call; call.on('stream', st => voicePlay(call.peer, st)); call.on('close', () => voiceUnplug(call.peer)); call.on('error', () => voiceUnplug(call.peer)); }
function voicePlay(id, st) {
  sfx.init(); const ctx = sfx.ctx; if (!ctx) return; voiceUnplug(id, true);
  // Chrome only lets a remote stream into Web Audio while it's also on a (silent) audio element
  const el = new Audio(); el.muted = true; el.autoplay = true; el.playsInline = true; el.srcObject = st; el.play && el.play().catch(() => {});
  const src = ctx.createMediaStreamSource(st), g = ctx.createGain(), pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null; g.gain.value = 1.6;
  src.connect(g); if (pan) { g.connect(pan); pan.connect(ctx.destination); } else g.connect(ctx.destination);
  VOICE.nodes[id] = { src, g, pan, el };
}
function voiceUnplug(id, keepCall) { const n = VOICE.nodes[id]; if (n) { try { n.src.disconnect(); n.g.disconnect(); n.pan && n.pan.disconnect(); n.el.srcObject = null; } catch (e) {} delete VOICE.nodes[id]; }
  if (!keepCall) { const c = VOICE.calls[id]; if (c) { delete VOICE.calls[id]; try { c.close(); } catch (e) {} } } }
function voiceStop() { for (const id of Object.keys(VOICE.nodes).concat(Object.keys(VOICE.calls))) voiceUnplug(id); if (VOICE.local) VOICE.local.getTracks().forEach(t => t.stop()); Object.assign(VOICE, { local: null, an: null, ready: null }); }
function syncMic() { if (VOICE.local) VOICE.local.getAudioTracks().forEach(t => { t.enabled = !VOICE.muted; }); }
const vQ = new THREE.Quaternion(), vP = V(), vR = V();
function voiceFrame(dt) {
  const b = activeBody(); if (b) { let lv = 0; if (VOICE.an && !VOICE.muted) { VOICE.an.getFloatTimeDomainData(VOICE.buf); let s = 0; for (const v of VOICE.buf) s += v * v; lv = clamp((Math.sqrt(s / VOICE.buf.length) - 0.012) * 9, 0, 1); }
    b.mouth = lerp(b.mouth || 0, lv, Math.min(1, dt * 18)); }
  const ctx = sfx.ctx, r = game.mode === 'lobby' ? game.lr : (game.net ? game[other(game.me)] : null); if (!ctx || !r) return;
  camera.getWorldPosition(vP); camera.getWorldQuaternion(vQ); vR.set(1, 0, 0).applyQuaternion(vQ);
  const d = r.p.clone().addScaledVector(r.up, EYE).sub(vP), dist = d.length() || 1;
  for (const id in VOICE.nodes) { const n = VOICE.nodes[id];
    if (n.pan) n.pan.pan.setTargetAtTime(clamp(d.dot(vR) / dist, -1, 1) * 0.8, ctx.currentTime, 0.08);
    n.g.gain.setTargetAtTime(1.6 * Math.max(0.35, 1 / (1 + (dist / 8) ** 2)), ctx.currentTime, 0.15); }
}

/* ================= start up ================= */
const stageEl = document.getElementById('stage'), cv = renderer.domElement; stageEl.appendChild(cv);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
cv.addEventListener('pointerdown', e => { sfx.init(); if (e.button === 2) { mouse.right = true; return; } mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; mouse.moved = 0; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
cv.addEventListener('pointermove', e => {
  if (mouse.down) { const dx = e.clientX - mouse.x, dy = e.clientY - mouse.y; rig.yawA -= dx * 0.005; deskPitch = clamp(deskPitch - dy * 0.004, -1.3, 1.3); mouse.moved += Math.abs(dx) + Math.abs(dy); }
  mouse.x = e.clientX; mouse.y = e.clientY;
});
cv.addEventListener('pointerup', e => { if (e.button === 2) { mouse.right = false; return; } if (mouse.down && mouse.moved < 6) mouse.click = true; mouse.down = false; });
cv.addEventListener('pointerleave', () => { if (!mouse.down) mouse.x = -1; });
cv.addEventListener('contextmenu', e => e.preventDefault());

const vrBtn = document.getElementById('vr'), help = document.getElementById('help');
if (navigator.xr && navigator.xr.isSessionSupported) navigator.xr.isSessionSupported('immersive-vr').then(ok => { if (ok) vrBtn.hidden = false; }).catch(() => {});
vrBtn.addEventListener('click', async () => {
  sfx.init();
  try { const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] }); await renderer.xr.setSession(s); }
  catch (e) { toast("Couldn't start VR: " + (e && e.message || e)); }
});
renderer.xr.addEventListener('sessionstart', () => { vrBtn.hidden = true; help.hidden = true; deskPitch = 0; placeHud(); for (const P of PANELS) P.last = ''; });
renderer.xr.addEventListener('sessionend', () => { vrBtn.hidden = false; help.hidden = false; for (const hd of ['left', 'right']) HAND[hd].src = null; placeHud(); for (const P of PANELS) P.last = ''; });
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('400 40px Bungee'), document.fonts.load('700 30px Rubik'), document.fonts.load('800 30px Rubik')]).then(() => { fontsReady = true; LABEL.you.userData.redraw(); LABEL.partner.userData.redraw(); }).catch(() => { fontsReady = true; });
else fontsReady = true;

// a painting to look at from the lobby, then into the lobby
game.level = genLevel((Math.random() * 1e9) | 0); buildLevelMeshes(game.level);
game.lb = makeBody('A', LOBBY_SPAWN[0]); rig.yawA = yawToward(LOBBY_SPAWN[0], mainP.g.position); placeRig(game.lb);
if (/[?&]practice/.test(location.search)) startGame(+((location.search.match(/seed=(\d+)/) || [])[1] || 7), false);
renderer.setAnimationLoop(loop);
