<!--
  CHIKI KIT · BLANK TOOL
  A modeling tool that models nothing in particular. It exists to test the parts every one of Shawn's tools shares:
  the settings master list, the one-canvas menu (left rail of phase icons, scrolling pages, pop-outs, colour picker),
  Quest controllers with painted buttons, the VR / MR toggle, the phone + headset link and the phone-camera view.
  Everything above the APP line in the script is the kit; below it is the little "place shapes" app used to test it.
  Runs as a Claude artifact (link through the artifact room) or on GitHub Pages (link through PeerJS + room code).
-->
