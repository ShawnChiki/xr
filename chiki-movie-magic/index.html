<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

/* ============================================================
   ChikiMovieMagic v0.4 — BUILD, CHARACTERS, PERFORM, SHOOT, EDIT
   - World layers are the scenery (BUILD). They never move.
   - Characters live in their own studio (CHARACTERS) with their own
     view and size. A character is a puppet (head + hands) or a prop
     (one piece). Its parts are layers inside the character's root.
   - PERFORM places characters into the world, grabs them, steps into
     puppets, and records motion (root in world space, parts in
     character space) plus voice.
   - Windows (menu, layers, camera) can be pulled out with the grip,
     left in the room, or dropped onto the left hand to dock.
   Every sculpt stamp goes through applyOp(op) for future multiplayer.
   ============================================================ */

const VERSION = '0.4';
const MUXER_URL = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.mjs';
const CN = 16, CN3 = CN*CN*CN;
const DMAX = 1.5;
const MAXVOX = 16;
const DETAILS = [3.2,1.6,0.8,0.4,0.2,0.1,0.05,0.025,0.0125,0.00625,0.003125,0.0015625];
const SMIN = 0.005, SMAX = 200;

const PALETTE = ['#ff3b30','#ff9500','#ffd400','#34c759','#00c7be','#1e6bff',
                 '#5e2bff','#ff2d95','#ffffff','#9aa0a6','#2b2b2b','#a0522d'];
const PHASES = [
  {id:'build',      name:'BUILD',      col:'#ff9500'},
  {id:'light',      name:'LIGHT',      col:'#ffd400'},
  {id:'characters', name:'CHARACTERS', col:'#34c759'},
  {id:'perform',    name:'PERFORM',    col:'#ff2d95'},
  {id:'shoot',      name:'SHOOT',      col:'#1e6bff'},
  {id:'edit',       name:'EDIT',       col:'#5e2bff'},
];
const PLANNED = { light: ['Lights','Materials','Bake'] };
const RAILS = {
  build:      [['tools','Sculpt'],['color','Color'],['doodle','Doodle'],['blocks','Blocks'],['layers','Layers'],['world','World'],['scene','Scene']],
  characters: [['chars','Characters'],['tools','Sculpt'],['color','Color'],['doodle','Doodle'],['blocks','Blocks'],['layers','Parts'],['scene','Scene']],
  perform:    [['perform','Perform'],['tracks','Motion'],['scene','Scene']],
  shoot:      [['takes','Takes'],['path','Path'],['keys','Keys'],['lens','Lens'],['scene','Scene']],
  edit:       [['timeline','Timeline'],['export','Export'],['scene','Scene']],
};
const FIRST_PAGE = {build:'tools', characters:'chars', perform:'perform', shoot:'takes', edit:'timeline'};
const SCULPT_PHASES = ['build','characters'];
const SKIES = {
  day:    {name:'Day',    top:'#1e6bff', hor:'#aee9ff', low:'#3fbf5f', light:1},
  sunset: {name:'Sunset', top:'#5e2bff', hor:'#ff9500', low:'#ff2d95', light:0.85},
  night:  {name:'Night',  top:'#03051c', hor:'#1e2a78', low:'#07071a', light:0.45, stars:true},
  candy:  {name:'Candy',  top:'#ff2d95', hor:'#ffd400', low:'#00c7be', light:1},
  toxic:  {name:'Toxic',  top:'#34c759', hor:'#ffd400', low:'#5e2bff', light:0.95},
  deep:   {name:'Deep',   top:'#001a5c', hor:'#00c7be', low:'#002a8f', light:0.75, stars:true},
  lava:   {name:'Lava',   top:'#2b0000', hor:'#ff3b30', low:'#ff9500', light:0.8},
  white:  {name:'White',  top:'#ffffff', hor:'#ffffff', low:'#e4e4e4', light:1.05},
  black:  {name:'Black',  top:'#000000', hor:'#000000', low:'#000000', light:0.9},
  custom: {name:'Mine'},
};
const SHAPES = {cube:[1,1,1], brick:[1,0.5,0.5], plank:[2,0.125,0.5], pillar:[0.5,2,0.5]};
const PART_NAMES = {head:'Head', lh:'Left hand', rh:'Right hand', body:'Body', extra:'Extra'};

const state = {
  phase:'build', page:'tools', dialOpen:false,
  tool:'clay', lastTool:'smooth', lastSculpt:'clay', carve:false,
  size:0.08, strength:0.6, color:'#ff9500',
  doodle:'tube', doodleSize:0.012,
  blockMode:'stamp', blockShape:'cube', blockSize:0.1, blockSnap:true, blockMix:false,
  flySpeed:2.0, panelOpen:true, activeWorld:1, activePart:null, selChar:null,
  labels:true, mic:false, mirror:true, win:{layers:true, preview:true},
  world:{sky:'day', water:true, fog:true, custom:{top:[220,0.5], hor:[195,0.8], low:[140,0.45]}},
  fov:50,
  confirm:null, toastMsg:'', toastT:0,
};
const shots = {takes:[], seq:[], sel:null, seqSel:null, aspect:'16:9', res:1080, fps:30, blackRoom:true, showAll:false, playhead:0, takeSeq:1, keyT:0, keySel:-1};
const show = {tracks:{}, audio:[], chars:[], t:0, playing:false, rec:null, grab:null, embodied:null, charSeq:1, audioSeq:1};

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.domElement.id = 'gl';
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const rig = new THREE.Group(); scene.add(rig);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.02, 5000);
camera.position.set(0, 7, 15);
rig.add(camera);

const hemi = new THREE.HemisphereLight('#d6f0ff', '#ff9f43', 1.4); scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 2.2); sun.position.set(20, 40, 15); scene.add(sun);

const water = new THREE.Mesh(new THREE.CircleGeometry(600, 64),
  new THREE.MeshStandardMaterial({color:'#1e6bff', roughness:0.35, metalness:0.0}));
water.rotation.x = -Math.PI/2; water.position.y = -0.02; scene.add(water);

const world = new THREE.Group(); scene.add(world);       // scenery layers
const actors = new THREE.Group(); scene.add(actors);     // character roots
const studio = new THREE.Group(); scene.add(studio); studio.visible = false;
{
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,0.04,64), new THREE.MeshStandardMaterial({color:'#ffd400', roughness:0.6}));
  disc.position.y = -0.02; studio.add(disc);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(1.16,1.16,0.03,64), new THREE.MeshStandardMaterial({color:'#ff2d95', roughness:0.6}));
  rim.position.y = -0.035; studio.add(rim);
  const mark = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.012,0.3), new THREE.MeshStandardMaterial({color:'#1e6bff'}));
  mark.position.set(0,0.005,0.85); studio.add(mark);   // the "front" of the stage, facing you
}
const STUDIO_BG = new THREE.Color('#1b2050');
const clayMat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.85, metalness:0});

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.mouseButtons = {LEFT:-1, MIDDLE:THREE.MOUSE.PAN, RIGHT:THREE.MOUSE.ROTATE};
controls.enableDamping = true;
controls.update();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- helpers ---------------- */
const V = () => new THREE.Vector3();
const ONE = new THREE.Vector3(1,1,1);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const ckey = (x,y,z) => x+','+y+','+z;
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function toast(msg){
  state.toastMsg = msg; state.toastT = 3; requestUI();
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._h); toast._h = setTimeout(()=>t.style.display='none', 3000);
}
function rng(seed){ let s = seed>>>0 || 1; return () => { s ^= s<<13; s ^= s>>>17; s ^= s<<5; return (s>>>0)/4294967296; }; }
function fmtLen(m){ return m>=1 ? (+m.toFixed(2))+' m' : m>=0.01 ? (+(m*100).toFixed(2))+' cm' : (+(m*1000).toFixed(1))+' mm'; }
function fmtTime(s){ s=Math.max(0,s); const m=Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function detailFor(target){ let best=DETAILS[0]; for (const d of DETAILS) if (Math.abs(Math.log(d/target)) < Math.abs(Math.log(best/target))) best=d; return best; }
function yourScale(){ return renderer.xr.isPresenting ? rig.scale.x : Math.max(0.05, camera.position.distanceTo(controls.target)/3); }
function unscaled(obj){ obj.updateMatrixWorld(true); const p=V(), q=new THREE.Quaternion(), s=V(); obj.matrixWorld.decompose(p,q,s); return new THREE.Matrix4().compose(p,q,ONE); }
function setObjMatrix(obj, m){ const p=V(), q=new THREE.Quaternion(), s=V(); m.decompose(p,q,s); obj.position.copy(p); obj.quaternion.copy(q); obj.scale.setScalar(s.x); obj.updateMatrixWorld(true); }
const poseOfObj = o => ({p:o.position.toArray(), q:o.quaternion.toArray(), s:o.scale.x});
function setPoseObj(o, pose){ o.position.fromArray(pose.p); o.quaternion.fromArray(pose.q); o.scale.setScalar(pose.s); }
const inStudio = () => state.phase==='characters';

/* ---------------- sky / world ---------------- */
let skyTex = null;
function hsl(h,l){ return '#'+new THREE.Color().setHSL(h/360, 0.9, l).getHexString(); }
function skyColors(){
  const w = state.world;
  if (w.sky==='custom'){ const c = w.custom; return {top:hsl(...c.top), hor:hsl(...c.hor), low:hsl(...c.low), light:1}; }
  return SKIES[w.sky] || SKIES.day;
}
function applyWorld(){
  const Sk = skyColors();
  const skyCanvas = document.createElement('canvas'); skyCanvas.width = 1024; skyCanvas.height = 512;
  const g2 = skyCanvas.getContext('2d'), H = skyCanvas.height;
  const gr = g2.createLinearGradient(0,0,0,H);
  gr.addColorStop(0, Sk.top); gr.addColorStop(0.47, Sk.hor); gr.addColorStop(0.5, Sk.hor);
  gr.addColorStop(0.502, Sk.low); gr.addColorStop(1, Sk.low);
  g2.fillStyle = gr; g2.fillRect(0,0,skyCanvas.width,H);
  if (Sk.stars){ const R=rng(7); g2.fillStyle='#fff'; for (let i=0;i<700;i++){ g2.globalAlpha=0.4+R()*0.6; g2.fillRect(R()*skyCanvas.width, R()*H*0.46, 1, 1); } g2.globalAlpha=1; }
  if (skyTex) skyTex.dispose();
  skyTex = new THREE.CanvasTexture(skyCanvas);
  skyTex.mapping = THREE.EquirectangularReflectionMapping; skyTex.colorSpace = THREE.SRGBColorSpace;
  hemi.intensity = 1.4*Sk.light; sun.intensity = 2.2*Sk.light;
}
let _fog = null; function fogObj(){ const Sk = skyColors(); if (!_fog) _fog = new THREE.Fog(Sk.hor, 60, 300); _fog.color.set(Sk.hor); return _fog; }
applyWorld();
// what's on stage this frame: the world, or the character studio
function applyStage(){
  const st = inStudio();
  world.visible = !st; studio.visible = st;
  if (st){ water.visible = false; scene.background = STUDIO_BG; scene.fog = null; }
  else { water.visible = state.world.water; scene.background = skyTex; scene.fog = state.world.fog ? fogObj() : null; }
  for (const c of show.chars) c.root.visible = st ? c.id===state.selChar : c.placed;
}

/* ---------------- layers & chunks ---------------- */
let layers = []; let layerSeq = 1;
function makeLayer(name, vs, id, parent){
  const L = {id: id ?? layerSeq++, name, vs, visible:true, locked:false, char:null, part:null,
             chunks:new Map(), group:new THREE.Group(), strokes:[], rest:{p:[0,0,0], q:[0,0,0,1], s:1}};
  layerSeq = Math.max(layerSeq, L.id+1);
  (parent || world).add(L.group); layers.push(L); return L;
}
const layerById = id => layers.find(l => l.id === +id);
const worldLayers = () => layers.filter(L => !L.char);
const partsOf = c => layers.filter(L => L.char===c.id);
function activeLayer(){
  if (inStudio()){ const c = selChar(); const L = layerById(state.activePart); return (c && L && L.char===c.id) ? L : (c ? partsOf(c)[0] : null); }
  const L = layerById(state.activeWorld); return (L && !L.char) ? L : worldLayers()[0];
}
const domainLayers = () => inStudio() ? (selChar() ? partsOf(selChar()) : []) : worldLayers();
function setActive(L){ if (L.char) state.activePart = L.id; else state.activeWorld = L.id; requestUI(); }
function layerHasClay(L){ for (const ch of L.chunks.values()) if (ch.d) return true; return false; }
function layerCenter(L){ const b = new THREE.Box3().setFromObject(L.group); return b.isEmpty() ? L.group.getWorldPosition(V()) : b.getCenter(V()); }
function layerOf(obj){ let o = obj; while (o){ for (const L of layers) if (L.group===o) return L; o = o.parent; } return null; }
function removeLayer(L){
  L.group.parent?.remove(L.group); disposeMesh(L.group); layers = layers.filter(l=>l!==L); delete show.tracks[String(L.id)];
  for (const k of [...dirty.keys()]) if (k.startsWith(L.id+'|')) dirty.delete(k);
}
// world <-> layer space (works through any parent: world, a character root, or the studio)
function wToL(L, p){ L.group.updateMatrixWorld(true); return L.group.worldToLocal(p.clone()); }
function rToL(L, r){ return r / L.group.getWorldScale(V()).x; }
function qToL(L, q){ return L.group.getWorldQuaternion(new THREE.Quaternion()).invert().multiply(q); }
function dToL(L, d){ return d.clone().applyQuaternion(L.group.getWorldQuaternion(new THREE.Quaternion()).invert()); }

function getChunk(L, cx, cy, cz, create){
  const k = ckey(cx,cy,cz); let ch = L.chunks.get(k);
  if (!ch && create){ ch = {cx,cy,cz,k,d:null,c:null,mesh:null}; L.chunks.set(k, ch); }
  return ch;
}
function alloc(ch){
  if (ch.d) return;
  ch.d = new Float32Array(CN3).fill(-DMAX);
  ch.c = new Uint8Array(CN3*3).fill(200);
}
const dirty = new Map();
function markDirty(L, ch){ dirty.set(L.id+'|'+ch.k, {L, ch}); }
function markAround(L, cx0,cy0,cz0, cx1,cy1,cz1){
  for (let cz=cz0; cz<=cz1; cz++) for (let cy=cy0; cy<=cy1; cy++) for (let cx=cx0; cx<=cx1; cx++)
    markDirty(L, getChunk(L, cx,cy,cz, true));
}

/* ---------------- sculpt ops (layer space, multiplayer-ready) ---------------- */
const _cache = {k:null, ch:null};
function sampleD(L, gx, gy, gz){
  const cx = Math.floor(gx/CN), cy = Math.floor(gy/CN), cz = Math.floor(gz/CN);
  const k = L.id+'|'+cx+','+cy+','+cz;
  let ch;
  if (_cache.k === k) ch = _cache.ch; else { ch = L.chunks.get(ckey(cx,cy,cz)); _cache.k = k; _cache.ch = ch; }
  if (!ch || !ch.d) return -DMAX;
  return ch.d[(gx-cx*CN) + CN*((gy-cy*CN) + CN*(gz-cz*CN))];
}
function applyOp(op, undoMap){
  const L = layerById(op.L); if (!L) return;
  const VS = L.vs;
  _cache.k = null;
  const r = op.r, rv = r/VS, px=op.p[0], py=op.p[1], pz=op.p[2];
  const pad = op.t==='clay' || op.t==='carve' ? DMAX+1 : 1;
  const g0 = [Math.floor(px/VS - rv - pad), Math.floor(py/VS - rv - pad), Math.floor(pz/VS - rv - pad)];
  const g1 = [Math.ceil (px/VS + rv + pad), Math.ceil (py/VS + rv + pad), Math.ceil (pz/VS + rv + pad)];
  const c0 = g0.map(v=>Math.floor(v/CN)), c1 = g1.map(v=>Math.floor(v/CN));
  const col = op.col, s = op.s;
  const writes = [];
  let changed = false;
  for (let cz=c0[2]; cz<=c1[2]; cz++) for (let cy=c0[1]; cy<=c1[1]; cy++) for (let cx=c0[0]; cx<=c1[0]; cx++){
    let ch = getChunk(L, cx,cy,cz, op.t==='clay');
    if (!ch) continue;
    if (!ch.d && op.t!=='clay') continue;
    const bx=cx*CN, by=cy*CN, bz=cz*CN;
    const lx0=Math.max(0,g0[0]-bx), lx1=Math.min(CN-1,g1[0]-bx);
    const ly0=Math.max(0,g0[1]-by), ly1=Math.min(CN-1,g1[1]-by);
    const lz0=Math.max(0,g0[2]-bz), lz1=Math.min(CN-1,g1[2]-bz);
    if (lx0>lx1||ly0>ly1||lz0>lz1) continue;
    for (let lz=lz0; lz<=lz1; lz++){
      const wz=(bz+lz)*VS - pz;
      for (let ly=ly0; ly<=ly1; ly++){
        const wy=(by+ly)*VS - py;
        for (let lx=lx0; lx<=lx1; lx++){
          const wx=(bx+lx)*VS - px;
          const dist = Math.sqrt(wx*wx+wy*wy+wz*wz);
          const field = (r - dist)/VS;
          if (field < -pad) continue;
          const i = lx + CN*(ly + CN*lz);
          const old = ch.d ? ch.d[i] : -DMAX;
          if (op.t==='clay'){
            const target = Math.min(DMAX, Math.max(old, field));
            if (target <= old + 1e-4) continue;
            if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, ch.d ? {d:ch.d.slice(), c:ch.c.slice()} : null);
            alloc(ch);
            ch.d[i] = old + (target-old)*s;
            if (old < 0.6 && field > -1){
              const w = old < -0.4 ? 1 : 0.65, i3=i*3;
              ch.c[i3]  += (col[0]-ch.c[i3])*w;
              ch.c[i3+1]+= (col[1]-ch.c[i3+1])*w;
              ch.c[i3+2]+= (col[2]-ch.c[i3+2])*w;
            }
            changed = true;
          } else if (op.t==='carve'){
            const target = Math.max(-DMAX, Math.min(old, -field));
            if (target >= old - 1e-4) continue;
            if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, {d:ch.d.slice(), c:ch.c.slice()});
            ch.d[i] = old + (target-old)*s;
            changed = true;
          } else if (op.t==='smooth'){
            if (field <= 0) continue;
            const gx=bx+lx, gy=by+ly, gz=bz+lz;
            const avg = (old + sampleD(L,gx+1,gy,gz)+sampleD(L,gx-1,gy,gz)+sampleD(L,gx,gy+1,gz)
                        +sampleD(L,gx,gy-1,gz)+sampleD(L,gx,gy,gz+1)+sampleD(L,gx,gy,gz-1))/7;
            const w = clamp(field/Math.max(1,rv*0.5),0,1)*s;
            if (Math.abs(avg-old) < 1e-3) continue;
            writes.push(ch, i, old + (avg-old)*w);
          } else if (op.t==='paint'){
            if (field <= 0 || old < -1.2) continue;
            const w = clamp(field/Math.max(1,rv*0.5),0,1)*s*0.8, i3=i*3;
            if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, {d:ch.d.slice(), c:ch.c.slice()});
            ch.c[i3]  += (col[0]-ch.c[i3])*w;
            ch.c[i3+1]+= (col[1]-ch.c[i3+1])*w;
            ch.c[i3+2]+= (col[2]-ch.c[i3+2])*w;
            changed = true;
          }
        }
      }
    }
  }
  for (let w=0; w<writes.length; w+=3){
    const ch=writes[w];
    if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, {d:ch.d.slice(), c:ch.c.slice()});
    ch.d[writes[w+1]] = writes[w+2]; changed = true;
  }
  if (changed){
    markAround(L, Math.floor((g0[0]-1)/CN), Math.floor((g0[1]-1)/CN), Math.floor((g0[2]-1)/CN),
                  Math.floor((g1[0]+1)/CN), Math.floor((g1[1]+1)/CN), Math.floor((g1[2]+1)/CN));
    sceneDirty = true;
  }
}

/* ---------------- surface-nets mesher ---------------- */
const S = CN+2, C = CN+1;
const sd = new Float32Array(S*S*S), sc = new Uint8Array(S*S*S*3);
const vidx = new Int32Array(C*C*C);
const offA = new Int8Array(S), locA = new Int8Array(S);
for (let i=0;i<S;i++){ const gg=i-1; const o=Math.floor(gg/CN); offA[i]=o; locA[i]=gg-o*CN; }
const CORN = []; for (let n=0;n<8;n++) CORN.push([n&1,(n>>1)&1,(n>>2)&1]);
const EDGES = []; for (let n=0;n<8;n++) for (const b of [1,2,4]) if(!(n&b)) EDGES.push([n,n|b]);

function srgb2lin(c){ return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
function meshChunk(L, ch){
  const VS = L.vs;
  const nbs = new Array(27);
  for (let z=-1;z<=1;z++) for (let y=-1;y<=1;y++) for (let x=-1;x<=1;x++)
    nbs[(x+1)+3*((y+1)+3*(z+1))] = L.chunks.get(ckey(ch.cx+x, ch.cy+y, ch.cz+z));
  let anyIn=false, anyOut=false;
  for (let k=0;k<S;k++) for (let j=0;j<S;j++) for (let i=0;i<S;i++){
    const si = i + S*(j + S*k);
    const nb = nbs[(offA[i]+1)+3*((offA[j]+1)+3*(offA[k]+1))];
    if (nb && nb.d){
      const li = locA[i] + CN*(locA[j] + CN*locA[k]);
      const v = nb.d[li]; sd[si]=v;
      sc[si*3]=nb.c[li*3]; sc[si*3+1]=nb.c[li*3+1]; sc[si*3+2]=nb.c[li*3+2];
      if (v>0) anyIn=true; else anyOut=true;
    } else { sd[si]=-DMAX; anyOut=true; }
  }
  if (!anyIn || !anyOut){ dropMesh(L, ch); return; }
  const pos=[], nor=[], colr=[], ind=[];
  const bx=ch.cx*CN-1, by=ch.cy*CN-1, bz=ch.cz*CN-1;
  vidx.fill(-1);
  for (let k=0;k<C;k++) for (let j=0;j<C;j++) for (let i=0;i<C;i++){
    let mask=0;
    for (let n=0;n<8;n++){
      const c=CORN[n]; const v = sd[(i+c[0]) + S*((j+c[1]) + S*(k+c[2]))];
      cd[n]=v; if (v>0) mask|=1<<n;
    }
    if (mask===0 || mask===255) continue;
    let ax=0,ay=0,az=0,cnt=0;
    for (const [a,b] of EDGES){
      const da=cd[a], db=cd[b];
      if ((da>0)===(db>0)) continue;
      const t = da/(da-db); const A=CORN[a], B=CORN[b];
      ax+=A[0]+(B[0]-A[0])*t; ay+=A[1]+(B[1]-A[1])*t; az+=A[2]+(B[2]-A[2])*t; cnt++;
    }
    ax/=cnt; ay/=cnt; az/=cnt;
    const gx=(cd[1]+cd[3]+cd[5]+cd[7])-(cd[0]+cd[2]+cd[4]+cd[6]);
    const gy=(cd[2]+cd[3]+cd[6]+cd[7])-(cd[0]+cd[1]+cd[4]+cd[5]);
    const gz=(cd[4]+cd[5]+cd[6]+cd[7])-(cd[0]+cd[1]+cd[2]+cd[3]);
    const gl=Math.hypot(gx,gy,gz)||1;
    let cr=0,cg=0,cb=0,cw=0;
    for (let n=0;n<8;n++){ if (cd[n]<=0) continue; const c=CORN[n];
      const si=((i+c[0]) + S*((j+c[1]) + S*(k+c[2])))*3; const w=cd[n]+0.05;
      cr+=sc[si]*w; cg+=sc[si+1]*w; cb+=sc[si+2]*w; cw+=w; }
    vidx[i + C*(j + C*k)] = pos.length/3;
    pos.push((bx+i+ax)*VS, (by+j+ay)*VS, (bz+k+az)*VS);
    nor.push(-gx/gl, -gy/gl, -gz/gl);
    colr.push(srgb2lin(cr/cw/255), srgb2lin(cg/cw/255), srgb2lin(cb/cw/255));
  }

  const quad = (a,b,c,d,flip) => {

  };
  for (let k=1;k<=CN;k++) for (let j=1;j<=CN;j++) for (let i=1;i<=CN;i++){
    const d0 = sd[i + S*(j + S*k)];
    const in0 = d0>0;
    const dx = sd[(i+1) + S*(j + S*k)];
    if (in0 !== (dx>0)) quad(vi(i,j,k), vi(i,j-1,k), vi(i,j-1,k-1), vi(i,j,k-1), !in0);
    const dy = sd[i + S*((j+1) + S*k)];
    if (in0 !== (dy>0)) quad(vi(i,j,k), vi(i,j,k-1), vi(i-1,j,k-1), vi(i-1,j,k), !in0);
    const dz = sd[i + S*(j + S*(k+1))];
    if (in0 !== (dz>0)) quad(vi(i,j,k), vi(i-1,j,k), vi(i-1,j-1,k), vi(i,j-1,k), !in0);
  }
  if (!ind.length){ dropMesh(L, ch); return; }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(colr,3));
  geo.setIndex(pos.length/3 > 65535 ? new THREE.Uint32BufferAttribute(ind,1) : new THREE.Uint16BufferAttribute(ind,1));
  geo.computeBoundingSphere();
  if (!ch.mesh){ ch.mesh = new THREE.Mesh(geo, clayMat); ch.mesh.userData.clay = true; L.group.add(ch.mesh); }
  else { ch.mesh.geometry.dispose(); ch.mesh.geometry = geo; }
}
function dropMesh(L, ch){ if (ch.mesh){ L.group.remove(ch.mesh); ch.mesh.geometry.dispose(); ch.mesh=null; } }
function processRemesh(budgetMs){
  if (!dirty.size) return;
  const t0 = performance.now();
  for (const [k, e] of dirty){
    dirty.delete(k);
    if (layers.includes(e.L)) meshChunk(e.L, e.ch);
    if (performance.now() - t0 > budgetMs) break;
  }
}

/* ---------------- starter island ---------------- */
function islandH(x,z){
  const r = Math.hypot(x,z);
  return 1.7*Math.exp(-(r*r)/(2*4.3*4.3)) + 0.22*Math.sin(x*0.7+1)*Math.cos(z*0.6) + 0.35 - Math.max(0, r-5.8)*0.7;
}
function genIsland(L){
  const VS = L.vs, R = 9, y0=-1.2, y1=2.8;
  const gx0=Math.floor(-R/VS), gx1=Math.ceil(R/VS), gy0=Math.floor(y0/VS), gy1=Math.ceil(y1/VS);
  const grass=hexRgb('#34c759'), sand=hexRgb('#ffd400'), dirt=hexRgb('#ff9500');
  for (let cz=Math.floor(gx0/CN); cz<=Math.floor(gx1/CN); cz++)
  for (let cy=Math.floor(gy0/CN); cy<=Math.floor(gy1/CN); cy++)
  for (let cx=Math.floor(gx0/CN); cx<=Math.floor(gx1/CN); cx++){
    const ch = getChunk(L,cx,cy,cz,true); let any=false;
    const d = new Float32Array(CN3).fill(-DMAX), c = new Uint8Array(CN3*3).fill(200);
    for (let lz=0;lz<CN;lz++) for (let lx=0;lx<CN;lx++){
      const x=(cx*CN+lx)*VS, z=(cz*CN+lz)*VS; const h=islandH(x,z);
      for (let ly=0;ly<CN;ly++){
        const gy=cy*CN+ly, y=gy*VS;
        if (gy<gy0 || gy>gy1) continue;
        let v = clamp((h-y)/VS, -DMAX, DMAX);
        if (gy===gy0) v = Math.min(v, -0.5);
        const i = lx + CN*(ly + CN*lz);
        d[i]=v; if (v>-DMAX) any=true;
        const col = (h-y) < 0.35 ? (y > 0.28 ? grass : sand) : dirt;
        c[i*3]=col[0]; c[i*3+1]=col[1]; c[i*3+2]=col[2];
      }
    }
    if (any){ ch.d=d; ch.c=c; }
  }
  for (const ch of L.chunks.values()) markDirty(L, ch);
}

/* ---------------- doodle + block strokes (stored in layer space) ---------------- */
const boxGeo = new THREE.BoxGeometry(1,1,1);
function buildStrokeMesh(s){
  if (s.type==='blocks'){
    const n = s.items.length/13; if (!n) return null;
    const im = new THREE.InstancedMesh(boxGeo, new THREE.MeshStandardMaterial({roughness:0.6}), n);
    const m4=new THREE.Matrix4(), p=V(), q=new THREE.Quaternion(), sc3=V(), col=new THREE.Color();
    for (let i=0;i<n;i++){ const o=i*13, it=s.items;
      p.set(it[o],it[o+1],it[o+2]); q.set(it[o+3],it[o+4],it[o+5],it[o+6]); sc3.set(it[o+7],it[o+8],it[o+9]);
      m4.compose(p,q,sc3); im.setMatrixAt(i,m4); col.setRGB(it[o+10]/255,it[o+11]/255,it[o+12]/255, THREE.SRGBColorSpace); im.setColorAt(i,col); }
    im.computeBoundingSphere(); im.userData.stroke = s; return im;
  }
  const n = s.pts.length/3; if (n < 2) return null;
  const P = []; for (let i=0;i<n;i++) P.push(new THREE.Vector3(s.pts[i*3], s.pts[i*3+1], s.pts[i*3+2]));
  let mesh;
  if (s.type==='tube'){
    const curve = new THREE.CatmullRomCurve3(P);
    const geo = new THREE.TubeGeometry(curve, Math.min(800, n*3), s.r, 8, false);
    const mat = new THREE.MeshStandardMaterial({color:s.col, roughness:0.45});
    mesh = new THREE.Mesh(geo, mat);
    const cap = new THREE.SphereGeometry(s.r, 10, 8);
    for (const p of [P[0], P[n-1]]){ const m=new THREE.Mesh(cap, mat); m.position.copy(p); mesh.add(m); }
  } else if (s.type==='ribbon'){
    const pos=[], idx=[]; const t=V(), up=V(), side=V();
    for (let i=0;i<n;i++){
      t.subVectors(P[Math.min(n-1,i+1)], P[Math.max(0,i-1)]).normalize();
      up.set(s.ups[i*3], s.ups[i*3+1], s.ups[i*3+2]);
      side.crossVectors(t, up); if (side.lengthSq()<1e-6) side.set(1,0,0);
      side.normalize().multiplyScalar(s.r*3);
      pos.push(P[i].x-side.x, P[i].y-side.y, P[i].z-side.z, P[i].x+side.x, P[i].y+side.y, P[i].z+side.z);
      if (i<n-1){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    geo.setIndex(idx); geo.computeVertexNormals(); geo.computeBoundingSphere();

  } else {
    const R = rng(s.seed); const geo = new THREE.IcosahedronGeometry(1, 1);
    const im = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({roughness:0.4}), n);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc3 = V(), col = new THREE.Color();
    for (let i=0;i<n;i++){
      const k = s.r*(0.6 + R()*1.6); sc3.set(k,k,k);
      const p = P[i].clone().add(new THREE.Vector3(R()-.5,R()-.5,R()-.5).multiplyScalar(s.r*2));
      m4.compose(p, q, sc3); im.setMatrixAt(i, m4);
      col.set(PALETTE[Math.floor(R()*8)]); im.setColorAt(i, col);
    }
    im.computeBoundingSphere();
    mesh = im;
  }

}
function disposeMesh(m){ m.traverse(o => { if (o.geometry && o.geometry!==boxGeo) o.geometry.dispose(); if (o.material && o.material!==clayMat) o.material.dispose?.(); }); }
function rebuildStroke(L, s){
  if (s._mesh){ L.group.remove(s._mesh); disposeMesh(s._mesh); s._mesh=null; }
  const m = buildStrokeMesh(s); if (m){ s._mesh=m; L.group.add(m); }
}
function dropStroke(L, s){ if (s._mesh){ L.group.remove(s._mesh); disposeMesh(s._mesh); s._mesh=null; } L.strokes = L.strokes.filter(x=>x!==s); }
function snapStrokes(L){ return {list:L.strokes.slice(), items:new Map(L.strokes.filter(s=>s.type==='blocks').map(s=>[s, s.items.slice()]))}; }
function restoreStrokes(L, snap){
  for (const s of L.strokes) if (s._mesh){ L.group.remove(s._mesh); disposeMesh(s._mesh); s._mesh=null; }
  L.strokes = snap.list.slice();
  for (const [s, it] of snap.items) s.items = it.slice();

function eraseInside(L, p, r){
  let any = false; const tmp = V();
  for (const s of [...L.strokes]){
    if (s.type==='blocks'){
      const it = s.items, keep = []; let gone = false;
      for (let o=0;o<it.length;o+=13){
        tmp.set(it[o],it[o+1],it[o+2]); const half = 0.5*Math.hypot(it[o+7],it[o+8],it[o+9]);
        if (tmp.distanceTo(p) + half <= r){ gone = true; continue; }
        for (let k=0;k<13;k++) keep.push(it[o+k]);
      }
      if (gone){ any = true; s.items = keep; if (keep.length) rebuildStroke(L, s); else dropStroke(L, s); }
    } else if (s.pts){
      let all = true; for (let o=0;o<s.pts.length;o+=3){ tmp.set(s.pts[o],s.pts[o+1],s.pts[o+2]); if (tmp.distanceTo(p) + s.r > r){ all=false; break; } }
      if (all){ any = true; dropStroke(L, s); }

}

/* ---------------- tool strokes + undo ---------------- */
let stroke = null; let sceneDirty = false;
const undoStack = [], redoStack = [];
function pushUndo(r){ undoStack.push(r); if (undoStack.length>50) undoStack.shift(); redoStack.length=0; }
function canEdit(){
  if (!SCULPT_PHASES.includes(state.phase)) return false;
  const L = activeLayer();
  if (!L){ toast(inStudio() ? 'Make a character first' : 'Make a layer first'); return false; }
  if (L.locked){ toast('"'+L.name+'" is locked'); return false; }
  if (!L.visible){ toast('"'+L.name+'" is hidden'); return false; }
  return true;
}
let hintT = -1e9;
function beginStroke(rWorld){
  if (!canEdit()) return false;
  const L = activeLayer();
  if (state.tool==='doodle'){
    stroke = {kind:'doodle', L, snap:snapStrokes(L), s:{type:state.doodle, pts:[], ups:[], r:0, col:state.color, seed:(Math.random()*1e9)|0}, last:null, lastBuild:0};
  } else if (state.tool==='blocks'){
    const s = {type:'blocks', items:[]};
    stroke = {kind: state.blockMode==='angle' ? 'angle' : 'blocks', L, snap:snapStrokes(L), s, A:null, last:null, cells:new Set(), lastBuild:0, stage:0};
    L.strokes.push(s);
  } else if (state.tool==='erase'){
    stroke = {kind:'erase', L, snap:snapStrokes(L), changed:false};
  } else {
    const base = rToL(L, rWorld ?? 0.1);
    if (performance.now() - hintT > 6000){
      if (base < L.vs*0.7){ toast('Brush is finer than this layer — tap + New layer'); hintT = performance.now(); }
      else if (base > L.vs*MAXVOX){ toast('Brush is bigger than this layer allows — tap + New layer'); hintT = performance.now(); }
    }
    stroke = {kind:'vox', L, map:new Map(), last:null, t:0, snap:snapStrokes(L), strokesChanged:false};
  }
  return true;
}
const _lp = V();
function strokeTo(pW, rWorld, pressure, upW, dt, qW){
  if (!stroke) return;
  const L = stroke.L;
  if (stroke.kind==='blocks'){ blockStrokeTo(pW, qW); return; }
  if (stroke.kind==='angle') return;
  const p = wToL(L, pW), up = upW ? dToL(L, upW) : new THREE.Vector3(0,1,0), rL = rToL(L, rWorld);
  if (stroke.kind==='vox'){
    const r = clamp(rL, L.vs*0.7, L.vs*MAXVOX);
    const step = Math.max(r*0.3, L.vs*0.5);
    if (!stroke.last){ stamp(p, r, pressure); stroke.last=p.clone(); stroke.t=0; return; }
    const dist = p.distanceTo(stroke.last); stroke.t += dt;
    if (dist >= step){
      const n = Math.min(8, Math.floor(dist/step));
      for (let i=1;i<=n;i++){ _lp.lerpVectors(stroke.last, p, i/n); stamp(_lp, r, pressure); }
      stroke.last.copy(p); stroke.t=0;
    } else if (stroke.t > 0.06){ stamp(p, r, pressure); stroke.t=0; }
  } else if (stroke.kind==='doodle'){
    const s = stroke.s;
    if (!s.r) s.r = rL;
    const spacing = s.type==='dots' ? s.r*2.6 : Math.max(s.r*0.8, 1e-5);
    if (stroke.last && p.distanceTo(stroke.last) < spacing) return;
    s.pts.push(+p.x.toFixed(5), +p.y.toFixed(5), +p.z.toFixed(5));
    s.ups.push(+up.x.toFixed(3), +up.y.toFixed(3), +up.z.toFixed(3));
    stroke.last = p.clone();
    const now = performance.now();
    if (now - stroke.lastBuild > 70){ rebuildStroke(L, s); stroke.lastBuild = now; }
  } else if (stroke.kind==='erase'){
    eraseAt(p, rL);
  }
}
function stamp(p, r, pressure){
  const t = state.tool==='clay' ? (state.carve ? 'carve' : 'clay') : state.tool;
  applyOp({t, L:stroke.L.id, p:[p.x,p.y,p.z], r, s:clamp(state.strength*(0.35+0.65*pressure),0.02,1), col:hexRgb(state.color)}, stroke.map);
  if (t==='carve' && eraseInside(stroke.L, p, r)) stroke.strokesChanged = true;
}
function endStroke(cancel){
  if (!stroke) return;
  const L = stroke.L;
  if (stroke.kind==='vox'){
    const parts = [];
    if (stroke.map.size) parts.push({type:'vox', L:L.id, map:stroke.map});
    if (stroke.strokesChanged) parts.push({type:'strokes', L:L.id, snap:stroke.snap});
    if (parts.length) pushUndo(parts.length===1 ? parts[0] : {type:'multi', parts});
  } else if (stroke.kind==='doodle'){
    const s = stroke.s;
    if (s.pts.length/3 >= 2){ rebuildStroke(L, s); L.strokes.push(s); pushUndo({type:'strokes', L:L.id, snap:stroke.snap}); sceneDirty=true; }
    else if (s._mesh){ L.group.remove(s._mesh); disposeMesh(s._mesh); s._mesh=null; }
  } else if (stroke.kind==='blocks' || stroke.kind==='angle'){
    const s = stroke.s;
    if (s.items.length && !cancel){ rebuildStroke(L, s); pushUndo({type:'strokes', L:L.id, snap:stroke.snap}); sceneDirty=true; }
    else dropStroke(L, s);
  } else if (stroke.kind==='erase'){
    if (stroke.changed){ pushUndo({type:'strokes', L:L.id, snap:stroke.snap}); sceneDirty=true; }
  }
  stroke = null; requestUI();
}

/* blocks: computed in world, stored in the layer's space */
function blockDims(){ return SHAPES[state.blockShape]; }
function blockColor(){ return hexRgb(state.blockMix ? PALETTE[Math.floor(Math.random()*8)] : state.color); }
function pushBlockW(s, L, pW, qW, dW, col){
  const p = wToL(L, pW), q = qToL(L, qW), k = 1/L.group.getWorldScale(V()).x;
  s.items.push(+p.x.toFixed(5),+p.y.toFixed(5),+p.z.toFixed(5), +q.x.toFixed(5),+q.y.toFixed(5),+q.z.toFixed(5),+q.w.toFixed(5),
    +(dW[0]*k).toFixed(5), +(dW[1]*k).toFixed(5), +(dW[2]*k).toFixed(5), col[0],col[1],col[2]);
}
const QI = new THREE.Quaternion();
function cellCenter(p, d){ return new THREE.Vector3((Math.floor(p.x/d[0])+0.5)*d[0], (Math.floor(p.y/d[1])+0.5)*d[1], (Math.floor(p.z/d[2])+0.5)*d[2]); }
function cellIdx(p, d){ return [Math.floor(p.x/d[0]), Math.floor(p.y/d[1]), Math.floor(p.z/d[2])]; }
function blockSizeWorld(){ return state.blockSize * yourScale(); }
function blockStrokeTo(p, q){
  const st = stroke, s = st.s, L = st.L, u = st.u ?? (st.u = blockSizeWorld());
  const k = blockDims(); const d = [k[0]*u, k[1]*u, k[2]*u];
  const mode = state.blockMode, snap = state.blockSnap;
  if (mode==='stamp'){
    if (snap){
      const ci = cellIdx(p, d).join(',');
      if (st.cells.has(ci)) return; st.cells.add(ci);
      pushBlockW(s, L, cellCenter(p,d), QI, d, blockColor());
    } else {
      if (st.last && p.distanceTo(st.last) < Math.min(d[0],d[1],d[2])*1.05) return;
      pushBlockW(s, L, p, q || QI, d, blockColor()); st.last = p.clone();

        mn = new THREE.Vector3(Math.min(a[0],b[0])*u, Math.min(a[1],b[1])*u, Math.min(a[2],b[2])*u);
        mx = new THREE.Vector3((Math.max(a[0],b[0])+1)*u, (Math.max(a[1],b[1])+1)*u, (Math.max(a[2],b[2])+1)*u); }
      else { mn = V().copy(st.A).min(p); mx = V().copy(st.A).max(p); mx.max(V().copy(mn).addScalar(u*0.2)); }
      const c = V().addVectors(mn,mx).multiplyScalar(0.5), sz = V().subVectors(mx,mn);
      st.boxCol = st.boxCol || blockColor();
      pushBlockW(s, L, c, QI, [sz.x, sz.y, sz.z], st.boxCol);
    } else {
      const a = cellIdx(st.A,d), b = cellIdx(p,d);
      st.fillCols = st.fillCols || [];
      let n = 0;
      for (let z=Math.min(a[2],b[2]); z<=Math.max(a[2],b[2]); z++)
      for (let y=Math.min(a[1],b[1]); y<=Math.max(a[1],b[1]); y++)
      for (let x=Math.min(a[0],b[0]); x<=Math.max(a[0],b[0]); x++){

/* ============================================================

  if (t <= S9[0] || n===1){ outP.set(S9[1],S9[2],S9[3]); outQ.set(S9[4],S9[5],S9[6],S9[7]); return S9[8]; }
  if (t >= S9[(n-1)*9]){ const o=(n-1)*9; outP.set(S9[o+1],S9[o+2],S9[o+3]); outQ.set(S9[o+4],S9[o+5],S9[o+6],S9[o+7]); return S9[o+8]; }

  return set;
}

/* audio */
let actx = null; const audioBufs = new Map(); let audioSrcs = []; let audioToken = 0;
function ac(){ if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if (actx.state==='suspended') actx.resume(); return actx; }
async function decodeClip(c){
  if (audioBufs.has(c.id)) return audioBufs.get(c.id);
  if (!c.b64) return null;
  const u8 = b64ToU8(c.b64); const buf = await ac().decodeAudioData(u8.buffer.slice(0));
  audioBufs.set(c.id, buf); if (!c.dur){ c.dur = buf.duration; } return buf;
}

async function audioPlayFrom(t, rate=1){
  audioStop(); const token = audioToken;
  for (const c of show.audio){
    let buf = null; try { buf = await decodeClip(c); } catch(e){}
    if (!buf || token!==audioToken || t >= buf.duration) continue;
    const src = ac().createBufferSource(); src.buffer = buf; src.playbackRate.value = rate; src.connect(ac().destination); src.start(0, Math.max(0,t)); audioSrcs.push(src);
  }
}
let micStream = null;
async function ensureMic(){

  catch(e){ toast('Mic was blocked — allow it in the browser'); state.mic = false; requestUI(); }
  return micStream;
}

/* step into a puppet */
function stepIn(c){

  if (show.rec) return;
  if (!c.placed) placeChar(c);
  stopShow(); show.grab = null;
  applyShowPose(0);
  c.root.updateMatrixWorld(true);
  const H = partLayer(c,'head'), LH = partLayer(c,'lh'), RH = partLayer(c,'rh');
  rig.scale.setScalar(c.place.s || 1); rig.updateMatrixWorld(true);
  if (H){ const hc = layerCenter(H), cw = V(); camera.getWorldPosition(cw); rig.position.add(hc.sub(cw)); rig.updateMatrixWorld(true); }
  const parts = [];
  if (H) parts.push({L:H, tracker:camera, off: unscaled(camera).invert().multiply(H.group.matrixWorld.clone())});
  for (const [Lh, cc] of [[LH, ctrl.left], [RH, ctrl.right]]){
    if (!Lh || !cc) continue;
    const gp = V(); cc.grip.getWorldPosition(gp);
    const shift = new THREE.Matrix4().makeTranslation(...gp.sub(layerCenter(Lh)).toArray());
    const wantW = shift.multiply(Lh.group.matrixWorld.clone());
    parts.push({L:Lh, tracker:cc.grip, off: unscaled(cc.grip).invert().multiply(wantW)});
  }
  show.embodied = {c, parts};
  placeMirror(); toast('You are '+c.name+' — A records, B plays'); requestUI();

  if (!('VideoEncoder' in window)){ toast('This browser can’t make MP4s — try desktop Chrome'); return; }
  const clips = filmClips(); if (!clips.length){ toast('No clips on the timeline yet'); return; }
  stopPlay(); stopShow();
  const [W,H] = exportSize(), fps = shots.fps, total = filmLength();
  const frames = Math.max(1, Math.round(total*fps));
  exporting = {i:0, frames}; requestUI();
  let er = null;
  try {
    const {Muxer, ArrayBufferTarget} = await import(MUXER_URL);
    const big = Math.max(W,H) > 2000;
    const cands = big ? ['avc1.640034','avc1.640033','avc1.4d0034','avc1.420034'] : ['avc1.640028','avc1.64002a','avc1.4d0028','avc1.42002a','avc1.42001f'];
    let config = null;
    for (const codec of cands){
      const cfg = {codec, width:W, height:H, bitrate: big ? 40e6 : 12e6, framerate:fps};
      try { const s = await VideoEncoder.isConfigSupported(cfg); if (s.supported){ config = cfg; break; } } catch(e){}
    }
    if (!config) throw new Error('no H.264 encoder for '+W+'×'+H);
    const target = new ArrayBufferTarget();
    const muxer = new Muxer({target, video:{codec:'avc', width:W, height:H, frameRate:fps}, fastStart:'in-memory'});
    let encErr = null;
    const enc = new VideoEncoder({output:(chunk, meta)=>muxer.addVideoChunk(chunk, meta), error:e=>{ encErr = e; }});
    enc.configure(config);
    er = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
    er.setPixelRatio(1); er.setSize(W, H, false); er.outputColorSpace = THREE.SRGBColorSpace;
    const cam = new THREE.PerspectiveCamera(50, W/H, 0.01, 5000);
    for (let i=0;i<frames;i++){
      if (encErr) throw encErr;
      const f = filmAt(i/fps); if (!f) break;
      evalTake(f.tk, f.u, cam.position, cam.quaternion);
      cam.fov = fovAt(f.tk, f.u); cam.aspect = W/H; const s=f.tk.scale||1; cam.near=0.01*s; cam.far=5000*s; cam.updateProjectionMatrix(); cam.updateMatrixWorld();
      applyShowPose(f.u);
      withShotView(() => er.render(scene, cam));
      const vf = new VideoFrame(er.domElement, {timestamp: Math.round(i*1e6/fps), duration: Math.round(1e6/fps)});
      enc.encode(vf, {keyFrame: i % (fps*2) === 0}); vf.close();
      while (enc.encodeQueueSize > 4) await new Promise(r=>setTimeout(r, 2));
      exporting.i = i+1;
      if (i % 4 === 0){ requestUI(); await new Promise(r=>setTimeout(r, 0)); }
    }
    await enc.flush(); enc.close(); muxer.finalize();
    const blob = new Blob([target.buffer], {type:'video/mp4'});
    const d = new Date(), pad=n=>String(n).padStart(2,'0');
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `chikimoviemagic-${W}x${H}-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.mp4`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
    window.__lastExport = {bytes: blob.size, W, H, frames, codec:config.codec};
    toast('MP4 saved · '+W+'×'+H);
  } catch(e){ console.error(e); toast('Export failed: '+(e.message||e)); window.__lastExport = {error:String(e)}; }
  finally { if (er){ er.dispose(); er.forceContextLoss?.(); } exporting = null; requestUI(); }
}

    if (mode===2){
      nav.W1 = rig.localToWorld(ctrl.left.grip.position.clone());
      nav.W2 = rig.localToWorld(ctrl.right.grip.position.clone());
      nav.theta = rigYaw();
    } else {
      const c = mode==='l' ? ctrl.left : ctrl.right;
      nav.W = rig.localToWorld(c.grip.position.clone());
    }
    return;
  }
  if (mode===2){
    const L1 = ctrl.left.grip.position, L2 = ctrl.right.grip.position;
    const lv = _l.subVectors(L2, L1), wv = _m.subVectors(nav.W2, nav.W1);
    const ll = lv.length(); if (ll < 0.02) return;
    const s = clamp(wv.length()/ll, SMIN, SMAX);
    let theta = nav.theta;
    if (Math.hypot(lv.x,lv.z) > 0.04) theta = Math.atan2(wv.x, wv.z) - Math.atan2(lv.x, lv.z);
    nav.theta = theta;
    _q.setFromAxisAngle(_y, theta);
    const lmid = V().addVectors(L1,L2).multiplyScalar(0.5).applyQuaternion(_q).multiplyScalar(s);
    const wmid = V().addVectors(nav.W1, nav.W2).multiplyScalar(0.5);
    rig.quaternion.copy(_q); rig.scale.setScalar(s); rig.position.subVectors(wmid, lmid);
    if (++scaleUITick % 10 === 0) requestUI();
  } else {
    const c = mode==='l' ? ctrl.left : ctrl.right;
    rig.updateMatrixWorld(true);
    const cur = rig.localToWorld(c.grip.position.clone());
    rig.position.add(_w1.subVectors(nav.W, cur));
  }
  rig.updateMatrixWorld(true);
}
function rigYaw(){ const e = new THREE.Euler().setFromQuaternion(rig.quaternion, 'YXZ'); return e.y; }
function resetScale(){
  if (!renderer.xr.isPresenting){ toast('Desktop is always human size'); return; }
  if (show.embodied){ toast('Step out of the puppet first'); return; }
  rig.updateMatrixWorld(true);
  const head = V(); camera.getWorldPosition(head);
  rig.scale.setScalar(1);
  _q.setFromAxisAngle(_y, rigYaw()); rig.quaternion.copy(_q);
  const headLocal = camera.position.clone().applyQuaternion(_q);
  rig.position.set(head.x - headLocal.x, head.y - headLocal.y, head.z - headLocal.z);
  toast('Human size'); requestUI();
}

let keyGrab = null;
const _m4 = new THREE.Matrix4();
function tryGrabKey(R){
  const tk = selTake(); if (!tk || !keyDots.length) return false;
  const gp = V(); R.grip.getWorldPosition(gp);
  let best=null, bd = 0.07*rig.scale.x;
  for (const d of keyDots){ const dd = d.position.distanceTo(gp); if (dd<bd){ bd=dd; best=d; } }
  if (!best) return false;
  const km = new THREE.Matrix4().compose(best.position, best.quaternion, ONE);
  keyGrab = {tk, i:best.userData.i, rel: unscaled(R.ray).invert().multiply(km), before:snapShots()};
  shots.keySel = best.userData.i; shots.keyT = tk.keys[best.userData.i].t;
  pulse('right',0.5,30); requestUI(); return true;
}
function updateKeyGrab(R){
  if (!keyGrab) return;
  _m4.copy(unscaled(R.ray)).multiply(keyGrab.rel);
  const kp=V(), kq=new THREE.Quaternion(), ks=V(); _m4.decompose(kp,kq,ks);
  const k = keyGrab.tk.keys[keyGrab.i]; k.p = kp.toArray(); k.q = kq.toArray();
  keyGrab.tk.edited = true; pathDirty = true;
}
function endKeyGrab(){ if (!keyGrab) return; pushShotsUndo(keyGrab.before); keyGrab = null; sceneDirty = true; requestUI(); }

// the window under the right controller's ray, if any
function rayWindow(R){
  const meshes = [];
  for (const w of WINS){ if (!w.mesh.visible) continue; meshes.push(w.mesh); if (w===previewWin) meshes.push(previewScreen); }
  if (!meshes.length) return null;
  ray.set(_o, _d); ray.far = 1.2*rig.scale.x;
  const h = ray.intersectObjects(meshes, false)[0];
  return h ? {h, win:h.object.userData.win, screen:h.object===previewScreen} : null;
}

const _tip = V(), _up = V(), _o = V(), _d = V(), _tq = new THREE.Quaternion();
let uiCapture = null;
function xrUpdate(dt){
  const L = ctrl.left, R = ctrl.right;
  const pl = L ? readPad(L) : null, pr = R ? readPad(R) : null;
  const ph = state.phase, shoot = ph==='shoot', edit = ph==='edit', sculpt = SCULPT_PHASES.includes(ph), perform = ph==='perform';
  const embodied = !!show.embodied;

  if (L && pl){
    if (edge(L,pl,'trigP')){ state.panelOpen = !state.panelOpen; pulse('left',0.2,20); }
    if (edge(L,pl,'a')) undo();
    if (edge(L,pl,'b')) redo();
    const dz = Math.abs(pl.sy) > 0.15 ? pl.sy : 0, dx = Math.abs(pl.sx) > 0.15 ? pl.sx : 0;
    if (dz || dx){
      camera.getWorldDirection(_d); const right = V().crossVectors(_d, _y).normalize();
      const sp = state.flySpeed * rig.scale.x * dt;
      rig.position.addScaledVector(_d, -dz*sp).addScaledVector(right, dx*sp);
    }
  }
  // right controller ray (used for windows)
  let hover = null;
  if (R){
    R.ray.updateMatrixWorld(true);
    _o.setFromMatrixPosition(R.ray.matrixWorld);
    _d.set(0,0,-1).transformDirection(R.ray.matrixWorld);
    hover = rayWindow(R);
  }
  let rightGripUsed = false;
  if (R && pr){
    if (edge(R,pr,'a')){
      if (sculpt) flipCarve(); else if (shoot) (play ? stopPlay() : startPlay('take')); else if (edit) (play ? stopPlay() : startPlay('film'));
      else if (perform) (show.rec ? cutShowRec() : startShowRec());
      pulse('right',0.3,20);
    }
    if (edge(R,pr,'b')){
      if (shoot) nextTake(); else if (sculpt){ if (stroke && stroke.kind==='angle') endStroke(true); else swapTool(); } else if (perform) (show.playing ? stopShow() : playShow());
      pulse('right',0.3,20);
    }
    if (sculpt){
      if (Math.abs(pr.sy) > 0.2){
        if (state.tool==='blocks') state.blockSize = clamp(state.blockSize*Math.exp(-pr.sy*dt*1.6), 0.02, 0.5);
        else if (state.tool==='doodle') state.doodleSize = clamp(state.doodleSize*Math.exp(-pr.sy*dt*1.6), 0.002, 0.05);
        else state.size = clamp(state.size*Math.exp(-pr.sy*dt*1.6), 0.01, 0.3);
        requestUI();
      }
      if (Math.abs(pr.sx) > 0.3){ state.strength = clamp(state.strength + pr.sx*dt*0.7, 0.05, 1); requestUI(); }
    }
    if (shoot && Math.abs(pr.sy) > 0.3) lensNudge(pr.sy*dt*30);
    // right grip: a window you point at, else the thing under your hand, else the world
    if (edge(R,pr,'grip')){
      const gp = V(); R.grip.getWorldPosition(gp);
      if (hover && !(pl && pl.grip)) startWinGrab(hover.win, R);
      else if (shoot && !keyGrab) tryGrabKey(R);
      else if (sculpt && !blockGrab){ const b = findBlockAt(gp); if (b) startBlockGrab(b, unscaled(R.grip)); }
      else if (perform && !embodied && !show.grab){ const c = findCharAt(gp); if (c) startCharGrab(c, unscaled(R.grip)); }
    }
    if (!pr.grip){ if (winGrab) endWinGrab(); if (keyGrab) endKeyGrab(); if (blockGrab) endBlockGrab(); if (show.grab) endCharGrab(); }
    rightGripUsed = !!(winGrab || keyGrab || blockGrab || show.grab);
  }
  if (!embodied) navUpdate(pl?.grip, pr?.grip && !rightGripUsed); else nav = null;
  rig.updateMatrixWorld(true);
  if (winGrab && R) moveWinGrab(R);
  if (keyGrab && R) updateKeyGrab(R);
  if (blockGrab && R) moveBlockGrab(unscaled(R.grip));
  if (show.grab && R) moveCharGrab(unscaled(R.grip));
  updateEmbodied();

  let onPanel = false;
  if (R){
    R.ray.updateMatrixWorld(true);
    _o.setFromMatrixPosition(R.ray.matrixWorld);
    _d.set(0,0,-1).transformDirection(R.ray.matrixWorld);
    hover = winGrab ? null : rayWindow(R);
    if (hover){
      onPanel = true; const h = hover.h;
      pointerDot.visible = true; pointerDot.position.copy(h.point); pointerDot.scale.setScalar(rig.scale.x);
      pointer.visible = true; pointer.scale.z = h.distance / rig.scale.x;
      if (!hover.screen){
        const x = h.uv.x*hover.win.cw, y = (1-h.uv.y)*hover.win.ch;
        if (pr && edge(R,pr,'trigP') && !(stroke && stroke.kind!=='angle') && !rec){ uiCapture = hover.win; uiPointer(hover.win, 'down', x, y); }
        else if (uiCapture===hover.win && pr?.trigP) uiPointer(hover.win, 'move', x, y);
      }
    }
    if (!onPanel){ pointer.visible = !shoot && (menuWin.mesh.visible || layersWin.mesh.visible); pointer.scale.z = 0.25; pointerDot.visible = false; }
    if (uiCapture && !pr?.trigP){ uiPointer(uiCapture, 'up',0,0); uiCapture = null; }

    R.grip.updateMatrixWorld(true);
    _tip.set(0, -0.01, -0.07); R.grip.localToWorld(_tip);
    _up.set(0,1,0).transformDirection(R.grip.matrixWorld);
    R.grip.getWorldQuaternion(_tq);
    const L2 = activeLayer();
    const isVox = ['clay','smooth','paint'].includes(state.tool);
    const base = (state.tool==='doodle' ? state.doodleSize : state.size) * rig.scale.x;
    const rShown = isVox && L2 ? clamp(rToL(L2,base), L2.vs*0.7, L2.vs*MAXVOX)*L2.group.getWorldScale(V()).x : base;
    const showTool = sculpt && !onPanel && !uiCapture && !blockGrab && !winGrab;
    cursor.visible = showTool && state.tool!=='blocks';
    ghost.visible = false;
    if (showTool){
      if (state.tool==='blocks'){ if (!stroke || state.blockMode==='stamp' || state.blockMode==='angle') showBlockGhost(_tip, _tq); }
      else { cursor.position.copy(_tip); cursor.scale.setScalar(rShown); styleCursor(); }
    }
    const pressEdge = pr && edge(R,pr,'trigP');
    if (sculpt && state.tool==='blocks' && state.blockMode==='angle'){
      const held = !!(pr && pr.trig > 0.12);
      if (showTool && pressEdge){ if (!stroke) { if (beginStroke(base)) { stroke.A = _tip.clone(); } } else angleClick(); }
      if (stroke && stroke.kind==='angle'){ const side = V().set(1,0,0).transformDirection(R.grip.matrixWorld); angleUpdate(_tip, stroke.stage===0 && held, side); }
    } else if (showTool && pr && pr.trig > 0.12){
      if (!stroke) beginStroke(base);
      if (stroke) strokeTo(_tip, base, pr.trig, _up, dt, _tq);
    } else if (stroke && stroke.kind!=='angle' && (!pr || pr.trig < 0.08)) endStroke();

    camModel.visible = shoot;
    if (shoot){
      lensTip.updateMatrixWorld(true);
      lensTip.getWorldPosition(camPoseP); lensTip.getWorldQuaternion(camPoseQ);
      if (!onPanel && !uiCapture && pr){
        if (pressEdge && !rec) startRecording();
        if (rec && !pr.trigP) stopRecording();
      }
      if (!play){ shotCam.position.copy(camPoseP); shotCam.quaternion.copy(camPoseQ); shotCam.fov=state.fov; shotCam.near=0.01*rig.scale.x; shotCam.far=5000*rig.scale.x; shotCam.aspect=ASPECTS[shots.aspect]; shotCam.updateProjectionMatrix(); shotCam.updateMatrixWorld(); }
    }
  }
  if (edit && !play){ const f = filmAt(shots.playhead); if (f) poseShotCam(f.tk, f.u); }
  updateGhostCam(1);
  bigScreen.visible = edit;
  hudLabel.visible = !!(show.rec || (rec && !camModel.visible));
  legMeshL.visible = legMeshR.visible = state.labels;
  if (L && pl) L.prev = pl;
  if (R && pr) R.prev = pr;
}

/* ---------------- main loop ---------------- */
const BLACK = new THREE.Color('#000');
const clock = new THREE.Clock();
function currentShowTime(){
  const ph = state.phase;
  if (ph==='perform') return show.t;
  if (ph==='shoot'){ if (rec && rec.phase==='rec') return rec.t; if (play?.mode==='take') return play.t; return 0; }
  if (ph==='edit'){ const f = filmAt(play ? play.t : shots.playhead); return f ? f.u : 0; }
  return 0;
}
function setAspect(a){
  shots.aspect = a; const r = ASPECTS[a];
  rtW = r>=1 ? 512 : Math.round(512*r); rtH = r>=1 ? Math.round(512/r) : 512;
  rt.setSize(rtW, rtH);
  const w = 0.09; handMonitor.scale.set(r>=1? w : w*r, r>=1 ? w/r : w, 1);
  sizeBigScreen(); sizePreview(); requestUI();
}
renderer.setAnimationLoop(() => {
  const raw = clock.getDelta();
  const dt = Math.min(raw, 0.05);
  const tdt = Math.min(raw, 0.25);
  if (state.toastT > 0){ state.toastT -= tdt; if (state.toastT <= 0) requestUI(); }
  const xr = renderer.xr.isPresenting;
  if (xr) xrUpdate(dt); else desktopUpdate(dt);
  updateRecording(tdt); updatePlay(tdt);
  applyShowPose(currentShowTime());
  updateShow(tdt);
  if (rec){ uiTick += dt; if (uiTick > 0.25){ uiTick = 0; requestUI(); } }
  processRemesh(xr ? 5 : 10);
  if (pathDirty) rebuildPaths();
  if (uiNeeds) drawUI();
  updateWins();
  autosaveTick(dt);
  applyStage();
  if (xr){
    if (state.phase==='shoot' || state.phase==='edit') renderPreview(shotCam);
    else if (state.phase==='perform' && state.mirror && show.embodied) renderPreview(mirrorCam);
    const dark = state.phase==='edit' && shots.blackRoom;
    const wv = world.visible, wa = water.visible, bg = scene.background, fg = scene.fog, av = actors.visible;
    const headL = show.embodied ? show.embodied.parts.find(p=>p.tracker===camera)?.L : null;
    const hv = headL ? headL.group.visible : false;
    if (headL) headL.group.visible = false;   // don't see the inside of your own puppet head
    if (dark){ world.visible = false; actors.visible = false; water.visible = false; scene.background = BLACK; scene.fog = null; }
    renderer.render(scene, camera);
    if (dark){ world.visible = wv; actors.visible = av; water.visible = wa; scene.background = bg; scene.fog = fg; }
    if (headL) headL.group.visible = hv;
  } else desktopRender();
});
function desktopRender(){
  const W = innerWidth, H = innerHeight;
  if (state.phase==='edit'){
    renderer.setScissorTest(false); renderer.setViewport(0,0,W,H);
    renderer.setClearColor('#000'); renderer.clear();
    const r = ASPECTS[shots.aspect]; const availW = W - 370, availH = H - 140;
    let vw = availW, vh = vw / r; if (vh > availH){ vh = availH; vw = vh*r; }
    const vx = 355 + (availW - vw)/2, vy = 70 + (availH - vh)/2;
    renderer.setScissorTest(true); renderer.setScissor(vx,vy,vw,vh); renderer.setViewport(vx,vy,vw,vh);
    withShotView(() => renderer.render(scene, shotCam));
    renderer.setScissorTest(false); renderer.setViewport(0,0,W,H);
    return;
  }
  renderer.setViewport(0,0,W,H); renderer.render(scene, camera);
  if (state.phase==='shoot'){
    const r = ASPECTS[shots.aspect]; const iw = r>=1 ? 380 : 220, ih = iw/r;
    const ix = W - iw - 16, iy = 16;
    renderer.setScissorTest(true); renderer.setScissor(ix-4,iy-4,iw+8,ih+8); renderer.setViewport(ix-4,iy-4,iw+8,ih+8);
    renderer.setClearColor(rec && rec.phase==='rec' ? '#ff3b30' : '#ffd400'); renderer.clear();
    renderer.setScissor(ix,iy,iw,ih); renderer.setViewport(ix,iy,iw,ih);
    withShotView(() => renderer.render(scene, shotCam));
    renderer.setScissorTest(false); renderer.setViewport(0,0,W,H); renderer.setClearColor('#000');
  }
}

  let loaded = false;
