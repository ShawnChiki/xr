let netMute = 0, netInOp = 0, uidSeq = 0, netChain = Promise.resolve(), netRecvChain = Promise.resolve();

const netSettle = new Map(), netVox = new Map(), netStTouch = new Map(), netStDrop = new Map(), netStFull = new Set(), netHash = new Map(), netPose = new Map(), netLastPose = new Map(), netRemote = new Map();

function Em(){ this._h = {}; } Em.prototype.on = function(k,f){ (this._h[k] = this._h[k] || []).push(f); return this; }; Em.prototype.emit = function(k,...a){ (this._h[k] || []).forEach(f => f(...a)); };

  this.bc.onmessage = e => { const m = e.data; if (m.to !== this.id) return; const c = this.conns[m.from];
    if (m.k==='conn'){ const n = new BCConn(this, m.from); this.conns[m.from] = n; this.emit('connection', n); n.ready(); this.bc.postMessage({to:m.from, from:this.id, k:'ok'}); }

async function makeIce(){
  const stun = [{urls:'stun:stun.l.google.com:19302'}, {urls:'stun:stun1.l.google.com:19302'}];
  try { const user = Math.floor(Date.now()/1000 + 24*3600)+':cmm';
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode('openrelayprojectsecret'), {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
    const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(user))), H = 'staticauth.openrelay.metered.ca';
    return stun.concat([{urls:['turn:'+H+':80', 'turn:'+H+':80?transport=tcp', 'turn:'+H+':443', 'turns:'+H+':443?transport=tcp'], username:user, credential:btoa(String.fromCharCode(...sig))}]);
  } catch(e){ return stun; } }
async function loadPeer(){ if (NET.test) return; if (!NET.ice) NET.ice = await makeIce(); if (window.Peer) return;
  await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'; sc.onload = res; sc.onerror = () => rej(new Error('load')); document.head.append(sc); }); }

function netErrText(e){ return e.type==='peer-unavailable' ? 'No room with that code. Check it and try again.' : (e.type==='network' || e.type==='server-error' || e.type==='socket-error') ? "Can't reach the internet matchmaker. Try again." : 'Something went wrong ('+e.type+'). Try again.'; }
function netStatus(t){ NET.status = t; requestUI(); }
async function zipU8(u8, unzip){
  if (typeof CompressionStream === 'undefined') return u8;
  const s = new Blob([u8]).stream().pipeThrough(unzip ? new DecompressionStream('deflate') : new CompressionStream('deflate'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
// every send goes through one queue so things arrive in the order they happened
// PeerJS drops the whole connection if one message is 16 KB or more, so everything goes as small text pieces,
// and we wait whenever the line is backed up so a big world never floods it
const PIECE = 4000;
let pieceSeq = 0; const pieceBuf = new Map();
async function sendStr(c, str){
  const pace = async () => { const dc = c.dataChannel; let n = 0; while (dc && dc.bufferedAmount > 256*1024 && n++ < 500) await new Promise(r => setTimeout(r, 20)); };
  if (str.length <= PIECE){ await pace(); try { c.send(str); } catch(e){} return; }
  const id = netTag + (++pieceSeq), n = Math.ceil(str.length/PIECE);
  for (let i=0;i<n;i++){ await pace(); if (!c.open && !NET.test) return; try { c.send('\u0001'+id+'|'+i+'|'+n+'|'+str.slice(i*PIECE, (i+1)*PIECE)); } catch(e){} }
}
function netDecode(d, key){
  if (typeof d !== 'string') return d;
  if (d.charCodeAt(0) === 1){
    const a = d.indexOf('|'), b = d.indexOf('|', a+1), c2 = d.indexOf('|', b+1), id = key+':'+d.slice(1,a), i = +d.slice(a+1,b), n = +d.slice(b+1,c2);
    let e = pieceBuf.get(id); if (!e){ e = {parts:new Array(n), got:0}; pieceBuf.set(id, e); }
    if (e.parts[i] == null){ e.parts[i] = d.slice(c2+1); e.got++; }
    if (e.got < n) return null; pieceBuf.delete(id); d = e.parts.join('');
  }
  try { return JSON.parse(d); } catch(e){ return null; }
}
async function rawSend(m, to){
  const str = JSON.stringify(m);
  const targets = NET.host ? (to ? [NET.conns[to]] : Object.keys(NET.conns).filter(id => id !== m.via).map(id => NET.conns[id])) : [NET.conn];
  for (const c of targets) if (c) await sendStr(c, str);
}
function netSend(m, to){ netChain = netChain.then(async () => { const mm = typeof m === 'function' ? await m() : m; if (mm) await rawSend(mm, to); }).catch(e => console.warn(e)); }

function netReset(){
  for (const id in NET.conns) try { NET.conns[id].close(); } catch(e){}
  try { NET.conn && NET.conn.close(); } catch(e){} try { NET.peer && NET.peer.destroy(); } catch(e){}
  for (const p of NET.peers.values()) dropAvatar(p);
  state.camOn = false; state.roam = false; state.gPick = false;
  Object.assign(NET, {camPeer:null, camPose:null, on:false, host:false, guest:false, synced:false, code:'', peer:null, conns:{}, conn:null, me:'host', n:1, hostRig:null, snapParts:null});
  NET.peers.clear(); NET.assign.clear(); netRemote.clear(); netPose.clear(); netLastPose.clear(); netHash.clear();
  netOps = []; netVox.clear(); netSettle.clear(); netStTouch.clear(); netStDrop.clear(); netStFull.clear(); netMetaSig = '';
  requestUI();
}
async function netHost(){
  netReset(); netStatus('Opening a room…');
  try { await loadPeer(); } catch(e){ return netStatus("Couldn't load the together part. Check the internet."); }
  const go = () => { const code = NET.test ? '1234' : String(1000 + Math.floor(Math.random()*9000)), peer = makePeer(NET_PREFIX+code); NET.peer = peer;
    peer.on('open', () => { Object.assign(NET, {host:true, on:true, synced:true, code, me:'host', n:1}); netStatus(''); toast('Room '+code+' is open. Type it in on her headset (APP → Together).'); });
    peer.on('connection', c => {
      c.on('open', () => { if (Object.keys(NET.conns).length >= MAX_GUESTS){ try { c.send(JSON.stringify({t:'full'})); } catch(e){} setTimeout(() => c.close(), 400); return; } hostWelcome(c); });
      c.on('data', d => { const m = netDecode(d, c.peer); if (m) netRecvChain = netRecvChain.then(() => onNet(m, c.peer)).catch(e => console.warn(e)); });
      const drop = () => { if (!NET.conns[c.peer]) return; delete NET.conns[c.peer]; const p = NET.peers.get(c.peer);

async function netJoin(code, retry){

/* voice pitch: stretch the sound in time without changing its pitch (WSOLA), then play it back faster or slower */
const pitchCache = new Map();
function wsola(x, f){
  const W = 1024, Hs = 512, Ha = Hs/f, tol = 192, n = x.length, outLen = Math.floor(n*f) + W;
  const y = new Float32Array(outLen), ws = new Float32Array(outLen), win = new Float32Array(W);
  for (let i=0;i<W;i++) win[i] = 0.5 - 0.5*Math.cos(2*Math.PI*i/W);
  let prev = 0;
  for (let k=0;;k++){
    const outPos = k*Hs, nom = Math.round(k*Ha); if (nom + W >= n || outPos + W >= outLen) break;
    let best = nom;
    if (k > 0){ const tgt = prev + Hs; if (tgt + W < n){ let bc = -Infinity;
      for (let d=-tol; d<=tol; d+=4){ const p = nom + d; if (p < 0 || p + W >= n) continue; let c = 0; for (let i=0;i<W;i+=8) c += x[p+i]*x[tgt+i]; if (c > bc){ bc = c; best = p; } } } }
    for (let i=0;i<W;i++){ y[outPos+i] += x[best+i]*win[i]; ws[outPos+i] += win[i]; }
    prev = best;
  }
  for (let i=0;i<outLen;i++) if (ws[i] > 1e-3) y[i] /= ws[i];
  return y;
}

    const b0 = a.at || 0, b1 = b0 + (a.dur || 0); if (b1 <= a0 || b0 >= a1) return [a];
    if (b0 >= a0 - 0.05 && b1 <= a1 + 0.05) return [];   // fully covered: gone
    return [{...a, _peaks:null, mute: [...(a.mute || []), [+Math.max(a0, b0).toFixed(3), +Math.min(a1, b1).toFixed(3)]]}];
  });
}

  for (let ch=0; ch<buf.numberOfChannels; ch++){ const d = out.getChannelData(ch); d.set(buf.getChannelData(ch));

      for (let k=1;k<=fade;k++){ const g2 = k/fade; if (i0-k >= 0) d[i0-k] *= g2; if (i1+k-1 < d.length) d[i1+k-1] *= g2; } } }

}
function pitchBuf(c, buf){

  const key = c.id+'|'+c.pitch+'|'+buf.length; if (pitchCache.has(key)) return pitchCache.get(key);

/* ============================================================
   EXPORT: MP4 via WebCodecs (picture only for now)
   ============================================================ */
let exporting = null, lastMP4 = null;
function saveMP4(){
  if (!lastMP4) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(lastMP4.blob); a.download = lastMP4.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
  document.getElementById('savemp4').style.display = 'none';
}
document.getElementById('savemp4').onclick = saveMP4;
function exportSize(){
  const base = shots.res; const r = ASPECTS[shots.aspect];
  if (r > 1) return [Math.round(base*r/2)*2, base];
  if (r < 1) return [base, Math.round(base/r/2)*2];
  return [base, base];
}
async function exportMP4(){
  if (exporting) return;
  if (renderer.xr.isPresenting && state.confirm!=='exportvr'){ state.confirm='exportvr'; toast('Making an MP4 in the headset can take a while (you can cancel). Tap Export again to start.'); requestUI(); return; }
  state.confirm = null;
  if (!('VideoEncoder' in window)){ toast('This browser can’t make MP4s — try desktop Chrome'); return; }
  const clips = filmClips(); if (!clips.length){ toast('No clips on the timeline yet'); return; }
  stopPlay(); stopShow(); const startScene = curScene;
  const [W,H] = exportSize(), fps = shots.fps, total = filmLength();
  const frames = Math.max(1, Math.round(total*fps));
  exporting = {i:0, frames, cancel:false}; workView(); requestUI();
  let er = null;
  try {
    const {Muxer, ArrayBufferTarget} = await import(MUXER_URL);
    const big = Math.max(W,H) > 2000;
    const cands = big ? ['avc1.640034','avc1.640033','avc1.4d0034','avc1.420034'] : ['avc1.640028','avc1.64002a','avc1.4d0028','avc1.42002a','avc1.42001f'];
    let config = null;
    for (const codec of cands){
      const cfg = {codec, width:W, height:H, bitrate: big ? 40e6 : 12e6, framerate:fps};
      try { const s = await VideoEncoder.isConfigSupported(cfg); if (s.supported){ config = cfg; break; } } catch(e){}
    }
    if (!config) throw new Error('no H.264 encoder for '+W+'×'+H);
    const target = new ArrayBufferTarget();
    stashScene();
    let abuf = null, aCfg = null;
    if ('AudioEncoder' in window){
      try { abuf = await renderFilmAudio(total); } catch(e){ console.warn('audio mix failed', e); }
      if (abuf) for (const codec of ['mp4a.40.2','opus']){ const c = {codec, sampleRate:48000, numberOfChannels:2, bitrate:160000}; try { if ((await AudioEncoder.isConfigSupported(c)).supported){ aCfg = c; break; } } catch(e){} }
    }
    const muxer = new Muxer({target, video:{codec:'avc', width:W, height:H, frameRate:fps}, ...(aCfg ? {audio:{codec: aCfg.codec==='opus' ? 'opus' : 'aac', numberOfChannels:2, sampleRate:48000}} : {}), fastStart:'in-memory'});
    if (aCfg){
      const aenc = new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m), error:e=>console.warn(e)}); aenc.configure(aCfg);
      const N = abuf.length, L0 = abuf.getChannelData(0), R0 = abuf.numberOfChannels > 1 ? abuf.getChannelData(1) : L0;
      for (let o=0; o<N; o+=4800){ const n = Math.min(4800, N-o), data = new Float32Array(n*2); data.set(L0.subarray(o,o+n), 0); data.set(R0.subarray(o,o+n), n);
        const ad = new AudioData({format:'f32-planar', sampleRate:48000, numberOfFrames:n, numberOfChannels:2, timestamp:Math.round(o/48000*1e6), data}); aenc.encode(ad); ad.close(); }
      await aenc.flush(); aenc.close();
    }
    let encErr = null;
    const enc = new VideoEncoder({output:(chunk, meta)=>muxer.addVideoChunk(chunk, meta), error:e=>{ encErr = e; }});
    enc.configure(config);
    er = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
    er.setPixelRatio(1); er.setSize(W, H, false); er.outputColorSpace = THREE.SRGBColorSpace;
    const cam = new THREE.PerspectiveCamera(50, W/H, 0.01, 5000);
    for (let i=0;i<frames;i++){
      if (encErr) throw encErr;
      if (exporting.cancel) throw new Error('cancelled');
      const f = filmAt(i/fps); if (!f) break; activateScene(f.tk.sceneId);
      evalTake(f.tk, f.u, cam.position, cam.quaternion);
      finishShotCam(cam, vfov(fovAt(f.tk, f.u), W/H), W/H, f.tk.shiftX, f.tk.shiftY, f.tk.straight, f.tk.scale);
      applyShowPose(f.u); applyFace(1/fps, f.u); updateArms(); animateDoodles(i/fps);
      withShotView(() => er.render(scene, cam));
      const vf = new VideoFrame(er.domElement, {timestamp: Math.round(i*1e6/fps), duration: Math.round(1e6/fps)});
      enc.encode(vf, {keyFrame: i % (fps*2) === 0}); vf.close();
      while (enc.encodeQueueSize > 4) await new Promise(r=>setTimeout(r, 2));
      exporting.i = i+1;
      if (i % 4 === 0){ requestUI(); await new Promise(r=>setTimeout(r, 0)); }
    }
    await enc.flush(); enc.close(); muxer.finalize();
    const blob = new Blob([target.buffer], {type:'video/mp4'});
    const d = new Date(), pad=n=>String(n).padStart(2,'0');
    lastMP4 = {blob, name:`chikimoviemagic-${W}x${H}-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.mp4`};
    window.__lastExport = {bytes: blob.size, W, H, frames, codec:config.codec, audio: aCfg ? aCfg.codec : null};
    if (renderer.xr.isPresenting){ document.getElementById('savemp4').style.display = ''; toast('MP4 ready'+(aCfg?' with voices':'')+'. Exit VR and tap the green Save MP4 button.'); }
    else { saveMP4(); toast('MP4 saved · '+W+'×'+H+(aCfg?' · with voices':'')); }
  } catch(e){ console.error(e); toast(String(e.message||e)==='cancelled' ? 'Export cancelled' : 'Export failed: '+(e.message||e)); window.__lastExport = {error:String(e)}; }
  finally { activateScene(startScene); if (er){ er.dispose(); er.forceContextLoss?.(); } exporting = null; workView(); requestUI(); }
}

/* ---------------- LIGHT: colored point lights you place and grab ---------------- */
const lightGroup = new THREE.Group(); scene.add(lightGroup);

function changeDetail(L, dir){
  if (!L) return;
  const i = DETAILS.indexOf(L.vs); const j = clamp((i<0?5:i) - dir, 0, DETAILS.length-1);
  const nv = DETAILS[j];
  if (nv===L.vs){ toast(dir<0 ? 'That is the finest detail' : 'That is the coarsest detail'); return; }
  if (!layerHasClay(L)){
    for (const ch of L.chunks.values()) dropMesh(L, ch);
    for (const k of [...dirty.keys()]) if (k.startsWith(L.id+'|')) dirty.delete(k);
    L.chunks = new Map(); L.vs = nv; toast('"'+L.name+'" detail '+fmtLen(nv)); sceneDirty = true; requestUI(); return;
  }
  const keys = resampleKeys(L, nv), key = 'detail'+L.id+':'+nv;
  if (keys.size > 2500 && state.confirm !== key){
    state.confirm = key; toast('That makes about '+keys.size+' pieces of clay, so it could be slow or crash. Tap again to do it anyway.'); requestUI(); return;
  }
  state.confirm = null;
  const before = {vs:L.vs, chunks:L.chunks};
  resampleLayer(L, nv, keys);
  pushUndo({type:'detail', L:L.id, vs:before.vs, chunks:before.chunks});
  toast('"'+L.name+'" detail '+fmtLen(L.vs)); sceneDirty = true; requestUI();
}
// which new chunks the clay will need at the new detail
function resampleKeys(L, nv){
  const ov = L.vs, keys = new Set();
  for (const ch of L.chunks.values()){
    if (!ch.d) continue;
    let any = false; for (let i=0;i<CN3;i++) if (ch.d[i] > -DMAX+0.01){ any = true; break; }
    if (!any) continue;
    const lo = [ch.cx,ch.cy,ch.cz].map(c=>Math.floor((c*CN-1.5)*ov/nv/CN)), hi = [ch.cx,ch.cy,ch.cz].map(c=>Math.floor(((c+1)*CN+0.5)*ov/nv/CN));
    for (let z=lo[2]; z<=hi[2]; z++) for (let y=lo[1]; y<=hi[1]; y++) for (let x=lo[0]; x<=hi[0]; x++) keys.add(ckey(x,y,z));
  }
  return keys;
}
function resampleLayer(L, nv, keys){
  const ov = L.vs, q = nv/ov, old = L.chunks, out = new Map();
  let lcx = 1e9, lcy = 1e9, lcz = 1e9, lch = null;
  const chunkAt = (gx,gy,gz) => { const cx = gx>>4, cy = gy>>4, cz = gz>>4; if (cx!==lcx||cy!==lcy||cz!==lcz){ lcx=cx; lcy=cy; lcz=cz; lch = old.get(cx+','+cy+','+cz) || null; } return lch; };
  const D = (gx,gy,gz) => { const ch = chunkAt(gx,gy,gz); return ch && ch.d ? ch.d[(gx&15)+16*((gy&15)+16*(gz&15))] : -DMAX; };
  for (const key of keys){
    const [cx,cy,cz] = key.split(',').map(Number);
    const d = new Float32Array(CN3), c = new Uint8Array(CN3*3).fill(200); let any = false;
    for (let lz=0; lz<CN; lz++) for (let ly=0; ly<CN; ly++) for (let lx=0; lx<CN; lx++){
      const fx = (cx*CN+lx)*q, fy = (cy*CN+ly)*q, fz = (cz*CN+lz)*q;
      const x0 = Math.floor(fx), y0 = Math.floor(fy), z0 = Math.floor(fz), tx = fx-x0, ty = fy-y0, tz = fz-z0;
      const c00 = D(x0,y0,z0)*(1-tx) + D(x0+1,y0,z0)*tx, c10 = D(x0,y0+1,z0)*(1-tx) + D(x0+1,y0+1,z0)*tx;
      const c01 = D(x0,y0,z0+1)*(1-tx) + D(x0+1,y0,z0+1)*tx, c11 = D(x0,y0+1,z0+1)*(1-tx) + D(x0+1,y0+1,z0+1)*tx;
      const v = clamp(((c00*(1-ty) + c10*ty)*(1-tz) + (c01*(1-ty) + c11*ty)*tz)/q, -DMAX, DMAX);
      const i = lx + CN*(ly + CN*lz); d[i] = v;
      if (v > -DMAX+0.01){
        any = true;
        const gx = Math.round(fx), gy = Math.round(fy), gz = Math.round(fz), ch = chunkAt(gx,gy,gz);
        if (ch && ch.c){ const i3 = ((gx&15)+16*((gy&15)+16*(gz&15)))*3; c[i*3]=ch.c[i3]; c[i*3+1]=ch.c[i3+1]; c[i*3+2]=ch.c[i3+2]; }
      }
    }
    if (any) out.set(key, {cx,cy,cz,k:key,d,c,mesh:null});
  }
  for (const ch of old.values()) dropMesh(L, ch);
  for (const k of [...dirty.keys()]) if (k.startsWith(L.id+'|')) dirty.delete(k);
  L.chunks = out; L.vs = nv;
  for (const ch of [...out.values()]) markAround(L, ch.cx-1,ch.cy-1,ch.cz-1, ch.cx+1,ch.cy+1,ch.cz+1);
}

const embGrab = {left:null, right:null}, climb = {left:null, right:null};

function nom(){ const a = ac(), t = a.currentTime;

  const reach = 0.11*rig.scale.x; if (bx.distanceToPoint(mw) > reach) return;

    if (k < 1) return requestAnimationFrame(step);

/* ============ v0.17: a real editor (stacked takes you cut between, audio lanes), editing together, roaming, live strokes, handing over the camera ============ */

// ---- the film: a row of clips; a clip can hold several takes of the same moment stacked on lanes, and switches say which one shows from when
function newClip(ids){ shots.clipSeq = Math.max(shots.clipSeq||1, 1); return {id:shots.clipSeq++, takes:ids.slice(), sw:[], cin:null, cout:null}; }

function clipRange(c){

    const push = (u1) => { if (u1 - u0 < 1e-4) return; const tk = takeById(c.takes[k0]) || R.T[0], seg = Object.create(tk);
      seg.inT = u0; seg.outT = u1; seg.speed = R.sp; seg.autoEnd = false; seg._clip = c; seg._k = k0; seg._snd = c.soundFrom != null ? takeById(c.soundFrom) || null : null; seg._seg = c.id+':'+(i++); seg._start = start; out.push(seg); start += (u1-u0)/R.sp; };

// ---- smooth a whole layer of clay (thin bits stay)
function smoothLayer(L){
  if (!L || L.locked){ toast(L ? 'That layer is locked' : 'Pick a layer first'); return; }
  const P = CN+2, pad = new Float32Array(P*P*P), news = [], map = new Map(), t0 = performance.now();
  for (const ch of L.chunks.values()){
    if (!ch.d) continue;
    let any = false;   // skip chunks with no surface in or next to them
    for (let i=0;i<CN3;i++) if (ch.d[i] > -DMAX+1e-3 && ch.d[i] < DMAX-1e-3){ any = true; break; }
    if (!any) continue;
    for (let z=0;z<P;z++) for (let y=0;y<P;y++) for (let x=0;x<P;x++){
      const gx = ch.cx*CN + x-1, gy = ch.cy*CN + y-1, gz = ch.cz*CN + z-1;
      let nb = ch, lx = x-1, ly = y-1, lz = z-1;
      if (lx<0 || ly<0 || lz<0 || lx>=CN || ly>=CN || lz>=CN){ const cx = Math.floor(gx/CN), cy = Math.floor(gy/CN), cz = Math.floor(gz/CN); nb = L.chunks.get(ckey(cx,cy,cz)); lx = gx-cx*CN; ly = gy-cy*CN; lz = gz-cz*CN; }
      pad[x + P*(y + P*z)] = nb && nb.d ? nb.d[lx + CN*(ly + CN*lz)] : -DMAX;
    }
    const nd = new Float32Array(CN3);
    for (let z=0;z<CN;z++) for (let y=0;y<CN;y++) for (let x=0;x<CN;x++){
      const pi = (x+1) + P*((y+1) + P*(z+1)), c = pad[pi];
      const xm = pad[pi-1], xp = pad[pi+1], ym = pad[pi-P], yp = pad[pi+P], zm = pad[pi-P*P], zp = pad[pi+P*P];
      let v = (2*c + xm + xp + ym + yp + zm + zp)/8;
      if (c > 0 && ((xm<=0 && xp<=0) || (ym<=0 && yp<=0) || (zm<=0 && zp<=0))) v = Math.max(v, Math.min(c, 0.6));   // a skinny bit: keep it
      nd[x + CN*(y + CN*z)] = v;
    }
    news.push([ch, nd]);
  }

  for (const [ch, nd] of news){ map.set(ch.k, {d:ch.d, c:ch.c.slice()}); ch.d = nd; markAround(L, ch.cx-1,ch.cy-1,ch.cz-1, ch.cx+1,ch.cy+1,ch.cz+1); }

}
