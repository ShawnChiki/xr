<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

/* ============================================================
   ChikiMovieMagic v0.3 — BUILD, CAST, PERFORM, SHOOT, EDIT
   Every sculpt stamp goes through applyOp(op) so it can be
   sent to other players later (multiplayer).
   Layers are objects: each has a pose (its group transform);
   clay, doodles and blocks live in the layer's own space.
   ============================================================ */

const VERSION = '0.3';
const MUXER_URL = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.mjs';
const CN = 16, CN3 = CN*CN*CN;
const DMAX = 1.5;
const MAXVOX = 16;
const DETAILS = [3.2,1.6,0.8,0.4,0.2,0.1,0.05,0.025,0.0125,0.00625,0.003125,0.0015625];
const SMIN = 0.005, SMAX = 200;

const PALETTE = ['#ff3b30','#ff9500','#ffd400','#34c759','#00c7be','#1e6bff',
                 '#5e2bff','#ff2d95','#ffffff','#9aa0a6','#2b2b2b','#a0522d'];
const PHASES = [
  {id:'build',   name:'BUILD',   col:'#ff9500'},
  {id:'light',   name:'LIGHT',   col:'#ffd400'},
  {id:'cast',    name:'CAST',    col:'#34c759'},
  {id:'perform', name:'PERFORM', col:'#ff2d95'},
  {id:'shoot',   name:'SHOOT',   col:'#1e6bff'},
  {id:'edit',    name:'EDIT',    col:'#5e2bff'},
];
const PLANNED = { light: ['Lights','Materials','Bake'] };
const RAILS = {
  build:   [['tools','Sculpt'],['color','Color'],['doodle','Doodle'],['blocks','Blocks'],['layers','Layers'],['world','World'],['scene','Scene']],
  cast:    [['puppets','Puppets'],['layers','Layers'],['scene','Scene']],
  perform: [['perform','Perform'],['tracks','Motion'],['scene','Scene']],
  shoot:   [['takes','Takes'],['path','Path'],['keys','Keys'],['lens','Lens'],['scene','Scene']],
  edit:    [['timeline','Timeline'],['export','Export'],['scene','Scene']],
};
const FIRST_PAGE = {build:'tools', cast:'puppets', perform:'perform', shoot:'takes', edit:'timeline'};
const SKIES = {
  day:    {name:'Day',    top:'#1e6bff', hor:'#aee9ff', low:'#3fbf5f', light:1},
  sunset: {name:'Sunset', top:'#5e2bff', hor:'#ff9500', low:'#ff2d95', light:0.85},
  night:  {name:'Night',  top:'#03051c', hor:'#1e2a78', low:'#07071a', light:0.45, stars:true},
  candy:  {name:'Candy',  top:'#ff2d95', hor:'#ffd400', low:'#00c7be', light:1},
  toxic:  {name:'Toxic',  top:'#34c759', hor:'#ffd400', low:'#5e2bff', light:0.95},
  deep:   {name:'Deep',   top:'#001a5c', hor:'#00c7be', low:'#002a8f', light:0.75, stars:true},
  lava:   {name:'Lava',   top:'#2b0000', hor:'#ff3b30', low:'#ff9500', light:0.8},
  white:  {name:'White',  top:'#ffffff', hor:'#ffffff', low:'#e4e4e4', light:1.05},
  black:  {name:'Black',  top:'#000000', hor:'#000000', low:'#000000', light:0.9},
  custom: {name:'Mine'},
};
const SHAPES = {cube:[1,1,1], brick:[1,0.5,0.5], plank:[2,0.125,0.5], pillar:[0.5,2,0.5]};

const state = {
  phase:'build', page:'tools', dialOpen:false,
  tool:'clay', lastTool:'smooth', lastSculpt:'clay', carve:false,
  size:0.08, strength:0.6, color:'#ff9500',
  doodle:'tube', doodleSize:0.012,
  blockMode:'stamp', blockShape:'cube', blockSize:0.1, blockSnap:true, blockMix:false,
  flySpeed:2.0, panelOpen:true, activeLayer:1, labels:true, mic:false, mirror:true,
  world:{sky:'day', water:true, fog:true, custom:{top:[220,0.5], hor:[195,0.8], low:[140,0.45]}},
  fov:50,
  confirm:null, toastMsg:'', toastT:0,
};
const shots = {takes:[], seq:[], sel:null, seqSel:null, aspect:'16:9', res:1080, fps:30, blackRoom:true, showAll:false, playhead:0, takeSeq:1, keyT:0, keySel:-1};
const show = {tracks:{}, audio:[], puppets:[], puppetSel:null, t:0, playing:false, rec:null, grab:null, embodied:null, puppetSeq:1, audioSeq:1};

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.domElement.id = 'gl';
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const rig = new THREE.Group(); scene.add(rig);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.02, 5000);
camera.position.set(0, 7, 15);
rig.add(camera);

const hemi = new THREE.HemisphereLight('#d6f0ff', '#ff9f43', 1.4); scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 2.2); sun.position.set(20, 40, 15); scene.add(sun);

const water = new THREE.Mesh(new THREE.CircleGeometry(600, 64),
  new THREE.MeshStandardMaterial({color:'#1e6bff', roughness:0.35, metalness:0.0}));
water.rotation.x = -Math.PI/2; water.position.y = -0.02; scene.add(water);

const world = new THREE.Group(); scene.add(world);
const clayMat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.85, metalness:0});

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.mouseButtons = {LEFT:-1, MIDDLE:THREE.MOUSE.PAN, RIGHT:THREE.MOUSE.ROTATE};
controls.enableDamping = true;
controls.update();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- helpers ---------------- */
const V = () => new THREE.Vector3();
const ONE = new THREE.Vector3(1,1,1);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const ckey = (x,y,z) => x+','+y+','+z;
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function toast(msg){
  state.toastMsg = msg; state.toastT = 3; requestUI();
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._h); toast._h = setTimeout(()=>t.style.display='none', 3000);
}
function rng(seed){ let s = seed>>>0 || 1; return () => { s ^= s<<13; s ^= s>>>17; s ^= s<<5; return (s>>>0)/4294967296; }; }
function fmtLen(m){ return m>=1 ? (+m.toFixed(2))+' m' : m>=0.01 ? (+(m*100).toFixed(2))+' cm' : (+(m*1000).toFixed(1))+' mm'; }
function fmtTime(s){ s=Math.max(0,s); const m=Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function detailFor(target){ let best=DETAILS[0]; for (const d of DETAILS) if (Math.abs(Math.log(d/target)) < Math.abs(Math.log(best/target))) best=d; return best; }
function yourScale(){ return renderer.xr.isPresenting ? rig.scale.x : Math.max(0.05, camera.position.distanceTo(controls.target)/3); }
function unscaled(obj){ obj.updateMatrixWorld(true); const p=V(), q=new THREE.Quaternion(), s=V(); obj.matrixWorld.decompose(p,q,s); return new THREE.Matrix4().compose(p,q,ONE); }

/* ---------------- sky / world ---------------- */
let skyTex = null;
function hsl(h,l){ return '#'+new THREE.Color().setHSL(h/360, 0.9, l).getHexString(); }
function skyColors(){
  const w = state.world;
  if (w.sky==='custom'){ const c = w.custom; return {top:hsl(...c.top), hor:hsl(...c.hor), low:hsl(...c.low), light:1}; }
  return SKIES[w.sky] || SKIES.day;
}
function applyWorld(){
  const w = state.world, Sk = skyColors();
  const skyCanvas = document.createElement('canvas'); skyCanvas.width = 1024; skyCanvas.height = 512;
  const g2 = skyCanvas.getContext('2d'), H = skyCanvas.height;
  const gr = g2.createLinearGradient(0,0,0,H);
  gr.addColorStop(0, Sk.top); gr.addColorStop(0.47, Sk.hor); gr.addColorStop(0.5, Sk.hor);
  gr.addColorStop(0.502, Sk.low); gr.addColorStop(1, Sk.low);
  g2.fillStyle = gr; g2.fillRect(0,0,skyCanvas.width,H);
  if (Sk.stars){ const R=rng(7); g2.fillStyle='#fff'; for (let i=0;i<700;i++){ g2.globalAlpha=0.4+R()*0.6; g2.fillRect(R()*skyCanvas.width, R()*H*0.46, 1, 1); } g2.globalAlpha=1; }
  if (skyTex) skyTex.dispose();
  skyTex = new THREE.CanvasTexture(skyCanvas);
  skyTex.mapping = THREE.EquirectangularReflectionMapping; skyTex.colorSpace = THREE.SRGBColorSpace;
  scene.background = skyTex;
  scene.fog = w.fog ? fogObj() : null;
  water.visible = w.water;
  hemi.intensity = 1.4*Sk.light; sun.intensity = 2.2*Sk.light;
}
let _fog = null; function fogObj(){ const Sk = skyColors(); if (!_fog) _fog = new THREE.Fog(Sk.hor, 60, 300); _fog.color.set(Sk.hor); return _fog; }
applyWorld();

/* ---------------- layers & chunks ---------------- */
let layers = []; let layerSeq = 1;
function makeLayer(name, vs, id){
  const L = {id: id ?? layerSeq++, name, vs, visible:true, locked:false,
             chunks:new Map(), group:new THREE.Group(), strokes:[], rest:{p:[0,0,0], q:[0,0,0,1], s:1}};
  layerSeq = Math.max(layerSeq, L.id+1);
  world.add(L.group); layers.push(L); return L;
}
const layerById = id => layers.find(l => l.id === id);
const activeLayer = () => layerById(state.activeLayer) || layers[0];
function layerHasClay(L){ for (const ch of L.chunks.values()) if (ch.d) return true; return false; }
function setPose(L, p, q, s){ L.group.position.fromArray(p); L.group.quaternion.fromArray(q); L.group.scale.setScalar(s); L.group.updateMatrixWorld(true); }
function poseOf(L){ return {p:L.group.position.toArray(), q:L.group.quaternion.toArray(), s:L.group.scale.x}; }
function setGroupMatrix(L, m){ const p=V(), q=new THREE.Quaternion(), s=V(); m.decompose(p,q,s); L.group.position.copy(p); L.group.quaternion.copy(q); L.group.scale.setScalar(s.x); L.group.updateMatrixWorld(true); }
function layerCenter(L){ const b = new THREE.Box3().setFromObject(L.group); return b.isEmpty() ? L.group.position.clone() : b.getCenter(V()); }
function layerOf(obj){ let o = obj; while (o){ for (const L of layers) if (L.group===o) return L; o = o.parent; } return null; }
// world <-> layer space
function wToL(L, p){ L.group.updateMatrixWorld(true); return L.group.worldToLocal(p.clone()); }
function rToL(L, r){ return r / L.group.scale.x; }
function qToL(L, q){ return L.group.quaternion.clone().invert().multiply(q); }
function dToL(L, d){ return d.clone().applyQuaternion(L.group.quaternion.clone().invert()); }

function getChunk(L, cx, cy, cz, create){
  const k = ckey(cx,cy,cz); let ch = L.chunks.get(k);
  if (!ch && create){ ch = {cx,cy,cz,k,d:null,c:null,mesh:null}; L.chunks.set(k, ch); }
  return ch;
}
function alloc(ch){
  if (ch.d) return;
  ch.d = new Float32Array(CN3).fill(-DMAX);
  ch.c = new Uint8Array(CN3*3).fill(200);
}
const dirty = new Map();
function markDirty(L, ch){ dirty.set(L.id+'|'+ch.k, {L, ch}); }
function markAround(L, cx0,cy0,cz0, cx1,cy1,cz1){
  for (let cz=cz0; cz<=cz1; cz++) for (let cy=cy0; cy<=cy1; cy++) for (let cx=cx0; cx<=cx1; cx++)
    markDirty(L, getChunk(L, cx,cy,cz, true));
}

/* ---------------- sculpt ops (layer space, multiplayer-ready) ---------------- */
// op = {t:'clay'|'carve'|'smooth'|'paint', L:layerId, p:[x,y,z] (layer space), r, s, col:[r,g,b]}
const _cache = {k:null, ch:null};
function sampleD(L, gx, gy, gz){
  const cx = Math.floor(gx/CN), cy = Math.floor(gy/CN), cz = Math.floor(gz/CN);
  const k = L.id+'|'+cx+','+cy+','+cz;
  let ch;
  if (_cache.k === k) ch = _cache.ch; else { ch = L.chunks.get(ckey(cx,cy,cz)); _cache.k = k; _cache.ch = ch; }
  if (!ch || !ch.d) return -DMAX;
  return ch.d[(gx-cx*CN) + CN*((gy-cy*CN) + CN*(gz-cz*CN))];
}
function applyOp(op, undoMap){
  const L = layerById(op.L); if (!L) return;
  const VS = L.vs;
  _cache.k = null;
  const r = op.r, rv = r/VS, px=op.p[0], py=op.p[1], pz=op.p[2];
  const pad = op.t==='clay' || op.t==='carve' ? DMAX+1 : 1;
  const g0 = [Math.floor(px/VS - rv - pad), Math.floor(py/VS - rv - pad), Math.floor(pz/VS - rv - pad)];
  const g1 = [Math.ceil (px/VS + rv + pad), Math.ceil (py/VS + rv + pad), Math.ceil (pz/VS + rv + pad)];
  const c0 = g0.map(v=>Math.floor(v/CN)), c1 = g1.map(v=>Math.floor(v/CN));
  const col = op.col, s = op.s;
  const writes = [];
  let changed = false;
  for (let cz=c0[2]; cz<=c1[2]; cz++) for (let cy=c0[1]; cy<=c1[1]; cy++) for (let cx=c0[0]; cx<=c1[0]; cx++){
    let ch = getChunk(L, cx,cy,cz, op.t==='clay');
    if (!ch) continue;
    if (!ch.d && op.t!=='clay') continue;
    const bx=cx*CN, by=cy*CN, bz=cz*CN;
    const lx0=Math.max(0,g0[0]-bx), lx1=Math.min(CN-1,g1[0]-bx);
    const ly0=Math.max(0,g0[1]-by), ly1=Math.min(CN-1,g1[1]-by);
    const lz0=Math.max(0,g0[2]-bz), lz1=Math.min(CN-1,g1[2]-bz);
    if (lx0>lx1||ly0>ly1||lz0>lz1) continue;
    for (let lz=lz0; lz<=lz1; lz++){
      const wz=(bz+lz)*VS - pz;
      for (let ly=ly0; ly<=ly1; ly++){
        const wy=(by+ly)*VS - py;
        for (let lx=lx0; lx<=lx1; lx++){
          const wx=(bx+lx)*VS - px;
          const dist = Math.sqrt(wx*wx+wy*wy+wz*wz);
          const field = (r - dist)/VS;
          if (field < -pad) continue;
          const i = lx + CN*(ly + CN*lz);
          const old = ch.d ? ch.d[i] : -DMAX;
          if (op.t==='clay'){
            const target = Math.min(DMAX, Math.max(old, field));
            if (target <= old + 1e-4) continue;
            if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, ch.d ? {d:ch.d.slice(), c:ch.c.slice()} : null);
            alloc(ch);
            ch.d[i] = old + (target-old)*s;
            if (old < 0.6 && field > -1){
              const w = old < -0.4 ? 1 : 0.65, i3=i*3;
              ch.c[i3]  += (col[0]-ch.c[i3])*w;
              ch.c[i3+1]+= (col[1]-ch.c[i3+1])*w;
              ch.c[i3+2]+= (col[2]-ch.c[i3+2])*w;
            }
            changed = true;
          } else if (op.t==='carve'){
            const target = Math.max(-DMAX, Math.min(old, -field));
            if (target >= old - 1e-4) continue;
            if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, {d:ch.d.slice(), c:ch.c.slice()});
            ch.d[i] = old + (target-old)*s;
            changed = true;
          } else if (op.t==='smooth'){
            if (field <= 0) continue;
            const gx=bx+lx, gy=by+ly, gz=bz+lz;
            const avg = (old + sampleD(L,gx+1,gy,gz)+sampleD(L,gx-1,gy,gz)+sampleD(L,gx,gy+1,gz)
                        +sampleD(L,gx,gy-1,gz)+sampleD(L,gx,gy,gz+1)+sampleD(L,gx,gy,gz-1))/7;
            const w = clamp(field/Math.max(1,rv*0.5),0,1)*s;
            if (Math.abs(avg-old) < 1e-3) continue;
            writes.push(ch, i, old + (avg-old)*w);
          } else if (op.t==='paint'){
            if (field <= 0 || old < -1.2) continue;
            const w = clamp(field/Math.max(1,rv*0.5),0,1)*s*0.8, i3=i*3;
            if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, {d:ch.d.slice(), c:ch.c.slice()});
            ch.c[i3]  += (col[0]-ch.c[i3])*w;
            ch.c[i3+1]+= (col[1]-ch.c[i3+1])*w;
            ch.c[i3+2]+= (col[2]-ch.c[i3+2])*w;
            changed = true;
          }
        }
      }
    }
  }
  for (let w=0; w<writes.length; w+=3){
    const ch=writes[w];
    if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, {d:ch.d.slice(), c:ch.c.slice()});
    ch.d[writes[w+1]] = writes[w+2]; changed = true;
  }
  if (changed){
    markAround(L, Math.floor((g0[0]-1)/CN), Math.floor((g0[1]-1)/CN), Math.floor((g0[2]-1)/CN),
                  Math.floor((g1[0]+1)/CN), Math.floor((g1[1]+1)/CN), Math.floor((g1[2]+1)/CN));
    sceneDirty = true;
  }
}

/* ---------------- surface-nets mesher ---------------- */
const S = CN+2, C = CN+1;
const sd = new Float32Array(S*S*S), sc = new Uint8Array(S*S*S*3);
const vidx = new Int32Array(C*C*C);
const offA = new Int8Array(S), locA = new Int8Array(S);
for (let i=0;i<S;i++){ const g=i-1; const o=Math.floor(g/CN); offA[i]=o; locA[i]=g-o*CN; }
const CORN = []; for (let n=0;n<8;n++) CORN.push([n&1,(n>>1)&1,(n>>2)&1]);
const EDGES = []; for (let n=0;n<8;n++) for (const b of [1,2,4]) if(!(n&b)) EDGES.push([n,n|b]);
const cd = new Float32Array(8);
function srgb2lin(c){ return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
function meshChunk(L, ch){
  const VS = L.vs;
  const nbs = new Array(27);
  for (let z=-1;z<=1;z++) for (let y=-1;y<=1;y++) for (let x=-1;x<=1;x++)
    nbs[(x+1)+3*((y+1)+3*(z+1))] = L.chunks.get(ckey(ch.cx+x, ch.cy+y, ch.cz+z));
  let anyIn=false, anyOut=false;
  for (let k=0;k<S;k++) for (let j=0;j<S;j++) for (let i=0;i<S;i++){
    const si = i + S*(j + S*k);
    const nb = nbs[(offA[i]+1)+3*((offA[j]+1)+3*(offA[k]+1))];
    if (nb && nb.d){
      const li = locA[i] + CN*(locA[j] + CN*locA[k]);
      const v = nb.d[li]; sd[si]=v;
      sc[si*3]=nb.c[li*3]; sc[si*3+1]=nb.c[li*3+1]; sc[si*3+2]=nb.c[li*3+2];
      if (v>0) anyIn=true; else anyOut=true;
    } else { sd[si]=-DMAX; anyOut=true; }
  }
  if (!anyIn || !anyOut){ dropMesh(L, ch); return; }
  const pos=[], nor=[], colr=[], ind=[];
  const bx=ch.cx*CN-1, by=ch.cy*CN-1, bz=ch.cz*CN-1;
  vidx.fill(-1);
  for (let k=0;k<C;k++) for (let j=0;j<C;j++) for (let i=0;i<C;i++){
    let mask=0;
    for (let n=0;n<8;n++){
      const c=CORN[n]; const v = sd[(i+c[0]) + S*((j+c[1]) + S*(k+c[2]))];
      cd[n]=v; if (v>0) mask|=1<<n;
    }
    if (mask===0 || mask===255) continue;
    let ax=0,ay=0,az=0,cnt=0;
    for (const [a,b] of EDGES){
      const da=cd[a], db=cd[b];
      if ((da>0)===(db>0)) continue;
      const t = da/(da-db); const A=CORN[a], B=CORN[b];
      ax+=A[0]+(B[0]-A[0])*t; ay+=A[1]+(B[1]-A[1])*t; az+=A[2]+(B[2]-A[2])*t; cnt++;
    }

/* ---------------- starter island ---------------- */
function islandH(x,z){
  const r = Math.hypot(x,z);
  return 1.7*Math.exp(-(r*r)/(2*4.3*4.3)) + 0.22*Math.sin(x*0.7+1)*Math.cos(z*0.6) + 0.35 - Math.max(0, r-5.8)*0.7;

function genIsland(L){
  const VS = L.vs, R = 9, y0=-1.2, y1=2.8;
  const gx0=Math.floor(-R/VS), gx1=Math.ceil(R/VS), gy0=Math.floor(y0/VS), gy1=Math.ceil(y1/VS);
  const grass=hexRgb('#34c759'), sand=hexRgb('#ffd400'), dirt=hexRgb('#ff9500');
  for (let cz=Math.floor(gx0/CN); cz<=Math.floor(gx1/CN); cz++)
  for (let cy=Math.floor(gy0/CN); cy<=Math.floor(gy1/CN); cy++)
  for (let cx=Math.floor(gx0/CN); cx<=Math.floor(gx1/CN); cx++){
    const ch = getChunk(L,cx,cy,cz,true); let any=false;
    const d = new Float32Array(CN3).fill(-DMAX), c = new Uint8Array(CN3*3).fill(200);
    for (let lz=0;lz<CN;lz++) for (let lx=0;lx<CN;lx++){
      const x=(cx*CN+lx)*VS, z=(cz*CN+lz)*VS; const h=islandH(x,z);
      for (let ly=0;ly<CN;ly++){
        const gy=cy*CN+ly, y=gy*VS;
        if (gy<gy0 || gy>gy1) continue;
        let v = clamp((h-y)/VS, -DMAX, DMAX);
        if (gy===gy0) v = Math.min(v, -0.5);
        const i = lx + CN*(ly + CN*lz);
        d[i]=v; if (v>-DMAX) any=true;
        const col = (h-y) < 0.35 ? (y > 0.28 ? grass : sand) : dirt;
        c[i*3]=col[0]; c[i*3+1]=col[1]; c[i*3+2]=col[2];
      }
    }
    if (any){ ch.d=d; ch.c=c; }

}

const _lp = V();

  const p = wToL(L, pW), up = upW ? dToL(L, upW) : new THREE.Vector3(0,1,0), rL = rToL(L, rWorld);

const _tp = V(), _tq2 = new THREE.Quaternion(), _tq3 = new THREE.Quaternion();
function trackAt(tr, t, outP, outQ){

  const a=lo*9, b=hi*9, u=(t-S9[a])/Math.max(1e-6, S9[b]-S9[a]);
  outP.set(S9[a+1]+(S9[b+1]-S9[a+1])*u, S9[a+2]+(S9[b+2]-S9[a+2])*u, S9[a+3]+(S9[b+3]-S9[a+3])*u);

  keyDots.length = 0;

    const isSel = tk.id===shots.sel; if (!isSel && !shots.showAll) continue;

/* ============================================================
   EXPORT: MP4 via WebCodecs, rendered frame by frame (picture only for now)
   ============================================================ */
let exporting = null;
function exportSize(){
  const base = shots.res; const r = ASPECTS[shots.aspect];
  if (r > 1) return [Math.round(base*r/2)*2, base];
  if (r < 1) return [base, Math.round(base/r/2)*2];
  return [base, base];
}
async function exportMP4(){
  if (exporting) return;
  if (renderer.xr.isPresenting){ toast('Export from the desktop (exit VR first)'); return; }
  if (!('VideoEncoder' in window)){ toast('This browser can’t make MP4s — try desktop Chrome'); return; }
  const clips = filmClips(); if (!clips.length){ toast('No clips on the timeline yet'); return; }
  stopPlay(); stopShow();
  const [W,H] = exportSize(), fps = shots.fps, total = filmLength();
  const frames = Math.max(1, Math.round(total*fps));
  exporting = {i:0, frames}; requestUI();
  let er = null;
  try {
    const {Muxer, ArrayBufferTarget} = await import(MUXER_URL);
    const big = Math.max(W,H) > 2000;
    const cands = big ? ['avc1.640034','avc1.640033','avc1.4d0034','avc1.420034'] : ['avc1.640028','avc1.64002a','avc1.4d0028','avc1.42002a','avc1.42001f'];
    let config = null;
    for (const codec of cands){
      const cfg = {codec, width:W, height:H, bitrate: big ? 40e6 : 12e6, framerate:fps};
      try { const s = await VideoEncoder.isConfigSupported(cfg); if (s.supported){ config = cfg; break; } } catch(e){}
    }
    if (!config) throw new Error('no H.264 encoder for '+W+'×'+H);
    const target = new ArrayBufferTarget();
    const muxer = new Muxer({target, video:{codec:'avc', width:W, height:H, frameRate:fps}, fastStart:'in-memory'});
    let encErr = null;
    const enc = new VideoEncoder({output:(chunk, meta)=>muxer.addVideoChunk(chunk, meta), error:e=>{ encErr = e; }});
    enc.configure(config);
    er = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
    er.setPixelRatio(1); er.setSize(W, H, false); er.outputColorSpace = THREE.SRGBColorSpace;
    const cam = new THREE.PerspectiveCamera(50, W/H, 0.01, 5000);
    for (let i=0;i<frames;i++){
      if (encErr) throw encErr;
      const f = filmAt(i/fps); if (!f) break;
      evalTake(f.tk, f.u, cam.position, cam.quaternion);
      cam.fov = fovAt(f.tk, f.u); cam.aspect = W/H; const s=f.tk.scale||1; cam.near=0.01*s; cam.far=5000*s; cam.updateProjectionMatrix(); cam.updateMatrixWorld();
      applyShowPose(f.u);
      withShotView(() => er.render(scene, cam));
      const vf = new VideoFrame(er.domElement, {timestamp: Math.round(i*1e6/fps), duration: Math.round(1e6/fps)});
      enc.encode(vf, {keyFrame: i % (fps*2) === 0}); vf.close();
      while (enc.encodeQueueSize > 4) await new Promise(r=>setTimeout(r, 2));
      exporting.i = i+1;
      if (i % 4 === 0){ requestUI(); await new Promise(r=>setTimeout(r, 0)); }
    }
    await enc.flush(); enc.close(); muxer.finalize();
    const blob = new Blob([target.buffer], {type:'video/mp4'});
    const d = new Date(), pad=n=>String(n).padStart(2,'0');
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `chikimoviemagic-${W}x${H}-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.mp4`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
    window.__lastExport = {bytes: blob.size, W, H, frames, codec:config.codec};
    toast('MP4 saved · '+W+'×'+H);
  } catch(e){ console.error(e); toast('Export failed: '+(e.message||e)); window.__lastExport = {error:String(e)}; }
  finally { if (er){ er.dispose(); er.forceContextLoss?.(); } exporting = null; requestUI(); }
}

  const hitsR = ray.intersectObjects(targets, true).filter(h => !live || (h.object!==live && h.object.parent!==live));
  if (hitsR.length){ const h=hitsR[0]; let n = V().set(0,1,0);

  else if (k==='[') { state.size=clamp(state.size/1.15,0.01,0.3); requestUI(); }
  else if (k===']') { state.size=clamp(state.size*1.15,0.01,0.3); requestUI(); }
  else if (state.phase==='build' && k>='1' && k<='6') setTool(['clay','smooth','paint','doodle','blocks','erase'][+k-1]);
  else if (k==='tab'){ state.panelOpen=!state.panelOpen; uiCanvas.style.display=state.panelOpen?'block':'none'; e.preventDefault(); }
});
function desktopUpdate(dt){
  controls.enabled = state.phase!=='edit' && !deskGrab;
  controls.update();
  cursor.visible = false; ghost.visible = false;
  if (state.phase==='build' && lastHover && !deskGrab){
    const p = desktopPoint(lastHover);
    if (state.tool==='blocks'){ if (!stroke) showBlockGhost(p); }
    else { const L = activeLayer(); const vox = ['clay','smooth','paint'].includes(state.tool);
      cursor.visible = true; cursor.position.copy(p); cursor.scale.setScalar(vox && L ? clamp(rToL(L,desktopRadius()), L.vs*0.7, L.vs*MAXVOX)*L.group.scale.x : desktopRadius()); styleCursor(); }
  }
  if (state.phase==='shoot'){
    camera.getWorldPosition(camPoseP); camera.getWorldQuaternion(camPoseQ);
    if (!play){ shotCam.position.copy(camPoseP); shotCam.quaternion.copy(camPoseQ); shotCam.fov = state.fov; shotCam.near=0.02; shotCam.far=5000; shotCam.aspect=ASPECTS[shots.aspect]; shotCam.updateProjectionMatrix(); shotCam.updateMatrixWorld(); }
  }
  if (state.phase==='edit' && !play){ const f = filmAt(shots.playhead); if (f) poseShotCam(f.tk, f.u); }
  updateGhostCam(2);
}
function updateGhostCam(mult){
  const tk = selTake();
  if (state.phase==='shoot' && play?.mode==='take'){ ghostCam.visible = true; ghostCam.position.copy(shotCam.position); ghostCam.quaternion.copy(shotCam.quaternion); ghostCam.scale.setScalar(mult*(play.tk.scale||1)); }
  else if (state.phase==='shoot' && state.page==='keys' && tk){ ghostCam.visible = true; evalTake(tk, shots.keyT, ghostCam.position, ghostCam.quaternion); ghostCam.scale.setScalar(mult*(tk.scale||1)); }
  else ghostCam.visible = false;
}

/* ---------------- VR ---------------- */
const vrBtn = document.getElementById('vrbtn');
let xrRigSaved = null, deskCam = null;
if (navigator.xr){
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    vrBtn.disabled = !ok; vrBtn.textContent = ok ? 'Enter VR' : 'VR not available here';
  });
} else { vrBtn.textContent = 'VR not available here'; }
vrBtn.onclick = async () => {
  if (renderer.xr.isPresenting){ renderer.xr.getSession().end(); return; }
  try {
    if (state.mic) ensureMic();
    const session = await navigator.xr.requestSession('immersive-vr', {optionalFeatures:['local-floor','bounded-floor']});
    await renderer.xr.setSession(session);
  } catch(e){ console.error(e); toast('Could not start VR'); }
};
renderer.xr.addEventListener('sessionstart', () => {
  deskCam = {p:camera.position.clone(), q:camera.quaternion.clone()};
  camera.position.set(0,0,0); camera.quaternion.identity();
  if (xrRigSaved){ rig.position.fromArray(xrRigSaved.p); rig.quaternion.fromArray(xrRigSaved.q); rig.scale.setScalar(xrRigSaved.s); }
  else { rig.position.set(0, Math.max(0, islandH(0,7)), 7); rig.quaternion.identity(); rig.scale.setScalar(1); }
  vrBtn.textContent = 'Exit VR'; panelMesh.visible = state.panelOpen;
  setTimeout(()=>{ placeBigScreen(); if (state.phase==='perform') placeMirror(); }, 300); requestUI();
});
renderer.xr.addEventListener('sessionend', () => {
  if (show.embodied) stepOut();
  xrRigSaved = {p:rig.position.toArray(), q:rig.quaternion.toArray(), s:rig.scale.x};
  rig.position.set(0,0,0); rig.quaternion.identity(); rig.scale.setScalar(1);
  if (deskCam){ camera.position.copy(deskCam.p); camera.quaternion.copy(deskCam.q); }
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); controls.update();
  vrBtn.textContent = 'Enter VR'; if (stroke) endStroke(true); if (rec) stopRecording(true); if (show.rec) cutShowRec(true);
  camModel.visible = false; bigScreen.visible = false; hudLabel.visible = false; requestUI();
});

const ctrl = {left:null, right:null};
const factory = new XRControllerModelFactory();
const panelMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.2*UIH/UIW),
  new THREE.MeshBasicMaterial({map:panelTex, toneMapped:false}));
panelMesh.position.set(0.0, 0.13, -0.07); panelMesh.rotation.x = -0.75;
const pointerGeo = new THREE.BufferGeometry().setFromPoints([V(), new THREE.Vector3(0,0,-1)]);
const pointer = new THREE.Line(pointerGeo, new THREE.LineBasicMaterial({color:'#ffd400'}));
pointer.scale.z = 0.3; pointer.visible = false;
const pointerDot = new THREE.Mesh(new THREE.SphereGeometry(0.004,10,8), new THREE.MeshBasicMaterial({color:'#ffd400'}));
scene.add(pointerDot); pointerDot.visible = false;
for (let i=0;i<2;i++){
  const rayC = renderer.xr.getController(i), grip = renderer.xr.getControllerGrip(i);
  rig.add(rayC); rig.add(grip); shotHidden.push(rayC, grip);
  grip.add(factory.createControllerModel(grip));
  rayC.addEventListener('connected', e => {
    const hand = e.data.handedness; if (hand!=='left' && hand!=='right') return;
    ctrl[hand] = {ray:rayC, grip, src:e.data, prev:{}};
    if (hand==='left'){ grip.add(panelMesh); grip.add(legMeshL); }
    if (hand==='right'){ rayC.add(pointer); rayC.add(camModel); grip.add(legMeshR); }
  });
  rayC.addEventListener('disconnected', () => {
    for (const h of ['left','right']) if (ctrl[h] && ctrl[h].ray===rayC) ctrl[h]=null;
  });
}
shotHidden.push(cursor, ghost, pointerDot, pathGroup, ghostCam, bigScreen, camModel);

function pulse(hand, v, ms){ try { ctrl[hand]?.src?.gamepad?.hapticActuators?.[0]?.pulse(v, ms); } catch(e){} }
function readPad(c){
  const gp = c?.src?.gamepad; if (!gp) return null; const b = gp.buttons;
  return {trig:b[0]?.value||0, trigP:!!b[0]?.pressed, grip:!!b[1]?.pressed, a:!!b[4]?.pressed, b:!!b[5]?.pressed,
          sx:gp.axes[2]||0, sy:gp.axes[3]||0};
}
const edge = (c, pad, k) => pad[k] && !c.prev[k];

let nav = null;
const _w1=V(), _l=V(), _m=V(), _q=new THREE.Quaternion(), _y=new THREE.Vector3(0,1,0);
let scaleUITick = 0;
function navUpdate(gl, gr){
  const mode = gl && gr ? 2 : gl ? 'l' : gr ? 'r' : 0;
  if (!mode){ nav = null; return; }
  if (!nav || nav.mode !== mode){
    rig.updateMatrixWorld(true);
    nav = {mode};
    if (mode===2){
      nav.W1 = rig.localToWorld(ctrl.left.grip.position.clone());
      nav.W2 = rig.localToWorld(ctrl.right.grip.position.clone());
      nav.theta = rigYaw();
    } else {
      const c = mode==='l' ? ctrl.left : ctrl.right;
      nav.W = rig.localToWorld(c.grip.position.clone());
    }
    return;
  }
  if (mode===2){
    const L1 = ctrl.left.grip.position, L2 = ctrl.right.grip.position;
    const lv = _l.subVectors(L2, L1), wv = _m.subVectors(nav.W2, nav.W1);
    const ll = lv.length(); if (ll < 0.02) return;
    const s = clamp(wv.length()/ll, SMIN, SMAX);
    let theta = nav.theta;
    if (Math.hypot(lv.x,lv.z) > 0.04) theta = Math.atan2(wv.x, wv.z) - Math.atan2(lv.x, lv.z);
    nav.theta = theta;
    _q.setFromAxisAngle(_y, theta);
    const lmid = V().addVectors(L1,L2).multiplyScalar(0.5).applyQuaternion(_q).multiplyScalar(s);
    const wmid = V().addVectors(nav.W1, nav.W2).multiplyScalar(0.5);
    rig.quaternion.copy(_q); rig.scale.setScalar(s); rig.position.subVectors(wmid, lmid);
    if (++scaleUITick % 10 === 0) requestUI();
  } else {
    const c = mode==='l' ? ctrl.left : ctrl.right;
    rig.updateMatrixWorld(true);
    const cur = rig.localToWorld(c.grip.position.clone());
    rig.position.add(_w1.subVectors(nav.W, cur));
  }
  rig.updateMatrixWorld(true);
}
function rigYaw(){ const e = new THREE.Euler().setFromQuaternion(rig.quaternion, 'YXZ'); return e.y; }
function resetScale(){
  if (!renderer.xr.isPresenting){ toast('Desktop is always human size'); return; }
  if (show.embodied){ toast('Step out of the puppet first'); return; }
  rig.updateMatrixWorld(true);
  const head = V(); camera.getWorldPosition(head);
  rig.scale.setScalar(1);
  _q.setFromAxisAngle(_y, rigYaw()); rig.quaternion.copy(_q);
  const headLocal = camera.position.clone().applyQuaternion(_q);
  rig.position.set(head.x - headLocal.x, head.y - headLocal.y, head.z - headLocal.z);
  toast('Human size'); requestUI();
}

/* key grabbing (SHOOT) */
let keyGrab = null;
const _m4 = new THREE.Matrix4();
function tryGrabKey(R){
  const tk = selTake(); if (!tk || !keyDots.length) return false;
  const gp = V(); R.grip.getWorldPosition(gp);
  let best=null, bd = 0.07*rig.scale.x;
  for (const d of keyDots){ const dd = d.position.distanceTo(gp); if (dd<bd){ bd=dd; best=d; } }
  if (!best) return false;
  const km = new THREE.Matrix4().compose(best.position, best.quaternion, ONE);
  keyGrab = {tk, i:best.userData.i, rel: unscaled(R.ray).invert().multiply(km), before:snapShots()};
  shots.keySel = best.userData.i; shots.keyT = tk.keys[best.userData.i].t;
  pulse('right',0.5,30); requestUI(); return true;
}
function updateKeyGrab(R){
  if (!keyGrab) return;
  _m4.copy(unscaled(R.ray)).multiply(keyGrab.rel);
  const kp=V(), kq=new THREE.Quaternion(), ks=V(); _m4.decompose(kp,kq,ks);
  const k = keyGrab.tk.keys[keyGrab.i]; k.p = kp.toArray(); k.q = kq.toArray();
  keyGrab.tk.edited = true; pathDirty = true;
}
function endKeyGrab(){ if (!keyGrab) return; pushShotsUndo(keyGrab.before); keyGrab = null; sceneDirty = true; requestUI(); }

const _tip = V(), _up = V(), _o = V(), _d = V(), _tq = new THREE.Quaternion();
let uiCapture = false;
function xrUpdate(dt){
  const L = ctrl.left, R = ctrl.right;
  const pl = L ? readPad(L) : null, pr = R ? readPad(R) : null;
  const ph = state.phase, shoot = ph==='shoot', edit = ph==='edit', build = ph==='build', perform = ph==='perform';
  const embodied = !!show.embodied;

  if (L && pl){
    if (edge(L,pl,'trigP')){ state.panelOpen = !state.panelOpen; panelMesh.visible = state.panelOpen; pulse('left',0.2,20); }
    if (edge(L,pl,'a')) undo();
    if (edge(L,pl,'b')) redo();
    const dz = Math.abs(pl.sy) > 0.15 ? pl.sy : 0, dx = Math.abs(pl.sx) > 0.15 ? pl.sx : 0;
    if (dz || dx){
      camera.getWorldDirection(_d); const right = V().crossVectors(_d, _y).normalize();
      const sp = state.flySpeed * rig.scale.x * dt;
      rig.position.addScaledVector(_d, -dz*sp).addScaledVector(right, dx*sp);
    }
  }
  let rightGripUsed = false;
  if (R && pr){
    if (edge(R,pr,'a')){
      if (build) flipCarve(); else if (shoot) (play ? stopPlay() : startPlay('take')); else if (edit) (play ? stopPlay() : startPlay('film'));
      else if (perform) (show.rec ? cutShowRec() : startShowRec());
      pulse('right',0.3,20);
    }
    if (edge(R,pr,'b')){
      if (shoot) nextTake(); else if (build){ if (stroke && stroke.kind==='angle') endStroke(true); else swapTool(); } else if (perform) (show.playing ? stopShow() : playShow());
      pulse('right',0.3,20);
    }
    if (build){
      if (Math.abs(pr.sy) > 0.2){
        if (state.tool==='blocks') state.blockSize = clamp(state.blockSize*Math.exp(-pr.sy*dt*1.6), 0.02, 0.5);
        else if (state.tool==='doodle') state.doodleSize = clamp(state.doodleSize*Math.exp(-pr.sy*dt*1.6), 0.002, 0.05);
        else state.size = clamp(state.size*Math.exp(-pr.sy*dt*1.6), 0.01, 0.3);
        requestUI();
      }
      if (Math.abs(pr.sx) > 0.3){ state.strength = clamp(state.strength + pr.sx*dt*0.7, 0.05, 1); requestUI(); }
    }
    if (shoot && Math.abs(pr.sy) > 0.3) lensNudge(pr.sy*dt*30);
    // right grip: grab the thing under your hand, otherwise the world
    if (edge(R,pr,'grip')){
      const gp = V(); R.grip.getWorldPosition(gp);
      if (shoot && !keyGrab) tryGrabKey(R);
      else if (build && !blockGrab){ const b = findBlockAt(gp); if (b) startBlockGrab(b, unscaled(R.grip)); }
      else if (perform && !embodied && !show.grab){ const Lg = findLayerAt(gp); if (Lg) startLayerGrab(Lg, unscaled(R.grip)); }
    }
    if (keyGrab && !pr.grip) endKeyGrab();
    if (blockGrab && !pr.grip) endBlockGrab();
    if (show.grab && !pr.grip) endLayerGrab();
    rightGripUsed = !!(keyGrab || blockGrab || show.grab);
  }
  if (!embodied) navUpdate(pl?.grip, pr?.grip && !rightGripUsed); else nav = null;
  rig.updateMatrixWorld(true);
  if (keyGrab && R) updateKeyGrab(R);
  if (blockGrab && R) moveBlockGrab(unscaled(R.grip));
  if (show.grab && R) moveLayerGrab(unscaled(R.grip));
  updateEmbodied();

  let onPanel = false;
  if (R){
    R.ray.updateMatrixWorld(true);
    _o.setFromMatrixPosition(R.ray.matrixWorld);
    _d.set(0,0,-1).transformDirection(R.ray.matrixWorld);
    if (panelMesh.visible && L){
      ray.set(_o, _d); ray.far = 2*rig.scale.x;
      const h = ray.intersectObject(panelMesh, false)[0];
      if (h && h.uv){
        onPanel = true; pointerDot.visible = true; pointerDot.position.copy(h.point); pointerDot.scale.setScalar(rig.scale.x);
        pointer.visible = true; pointer.scale.z = h.distance / rig.scale.x;
        const x = h.uv.x*UIW, y = (1-h.uv.y)*UIH;
        if (pr && edge(R,pr,'trigP') && !(stroke && stroke.kind!=='angle') && !rec){ uiCapture = true; uiPointer('down', x, y); }
        else if (uiCapture && pr?.trigP) uiPointer('move', x, y);
      }
    }
    if (!onPanel){ pointer.visible = panelMesh.visible && !shoot; pointer.scale.z = 0.25; pointerDot.visible = false; }
    if (uiCapture && !pr?.trigP){ uiCapture = false; uiPointer('up',0,0); }

    R.grip.updateMatrixWorld(true);
    _tip.set(0, -0.01, -0.07); R.grip.localToWorld(_tip);
    _up.set(0,1,0).transformDirection(R.grip.matrixWorld);
    R.grip.getWorldQuaternion(_tq);
    const L2 = activeLayer();
    const isVox = ['clay','smooth','paint'].includes(state.tool);
    const base = (state.tool==='doodle' ? state.doodleSize : state.size) * rig.scale.x;
    const rShown = isVox && L2 ? clamp(rToL(L2,base), L2.vs*0.7, L2.vs*MAXVOX)*L2.group.scale.x : base;
    const showTool = build && !onPanel && !uiCapture && !blockGrab;
    cursor.visible = showTool && state.tool!=='blocks';
    ghost.visible = false;
    if (showTool){
      if (state.tool==='blocks'){ if (!stroke || state.blockMode==='stamp' || state.blockMode==='angle') showBlockGhost(_tip, _tq); }
      else { cursor.position.copy(_tip); cursor.scale.setScalar(rShown); styleCursor(); }
    }
    const pressEdge = pr && edge(R,pr,'trigP');
    if (state.tool==='blocks' && state.blockMode==='angle' && build){
      const held = !!(pr && pr.trig > 0.12);
      if (showTool && pressEdge){ if (!stroke) { if (beginStroke(base)) { stroke.A = _tip.clone(); } } else angleClick(); }
      if (stroke && stroke.kind==='angle'){ const side = V().set(1,0,0).transformDirection(R.grip.matrixWorld); angleUpdate(_tip, stroke.stage===0 && held, side); }
    } else if (showTool && pr && pr.trig > 0.12){
      if (!stroke) beginStroke(base);
      if (stroke) strokeTo(_tip, base, pr.trig, _up, dt, _tq);
    } else if (stroke && stroke.kind!=='angle' && (!pr || pr.trig < 0.08)) endStroke();

    camModel.visible = shoot;
    if (shoot){
      lensTip.updateMatrixWorld(true);
      lensTip.getWorldPosition(camPoseP); lensTip.getWorldQuaternion(camPoseQ);
      if (!onPanel && !uiCapture && pr){
        if (pressEdge && !rec) startRecording();
        if (rec && !pr.trigP) stopRecording();
      }
      if (!play){ shotCam.position.copy(camPoseP); shotCam.quaternion.copy(camPoseQ); shotCam.fov=state.fov; shotCam.near=0.01*rig.scale.x; shotCam.far=5000*rig.scale.x; shotCam.aspect=ASPECTS[shots.aspect]; shotCam.updateProjectionMatrix(); shotCam.updateMatrixWorld(); }
    }
  }
  if (edit && !play){ const f = filmAt(shots.playhead); if (f) poseShotCam(f.tk, f.u); }
  updateGhostCam(1);
  bigScreen.visible = edit || (shoot && !!play) || (perform && state.mirror);
  hudLabel.visible = !!(show.rec || (rec && !camModel.visible));
  legMeshL.visible = legMeshR.visible = state.labels;
  if (L && pl) L.prev = pl;
  if (R && pr) R.prev = pr;
}

/* ---------------- main loop ---------------- */
const BLACK = new THREE.Color('#000');
const clock = new THREE.Clock();
function currentShowTime(){
  const ph = state.phase;
  if (ph==='perform') return show.t;
  if (ph==='shoot'){ if (rec && rec.phase==='rec') return rec.t; if (play?.mode==='take') return play.t; return 0; }
  if (ph==='edit'){ const f = filmAt(play ? play.t : shots.playhead); return f ? f.u : 0; }
  return 0;
}
renderer.setAnimationLoop(() => {
  const raw = clock.getDelta();
  const dt = Math.min(raw, 0.05);      // for hand movement
  const tdt = Math.min(raw, 0.25);     // recording and playback keep real time even when frames drop
  if (state.toastT > 0){ state.toastT -= tdt; if (state.toastT <= 0) requestUI(); }
  const xr = renderer.xr.isPresenting;
  if (xr) xrUpdate(dt); else desktopUpdate(dt);
  updateRecording(tdt); updatePlay(tdt);
  applyShowPose(currentShowTime());
  updateShow(tdt);
  if (rec){ uiTick += dt; if (uiTick > 0.25){ uiTick = 0; requestUI(); } }
  processRemesh(xr ? 5 : 10);
  if (pathDirty) rebuildPaths();
  if (uiNeeds) drawUI();
  autosaveTick(dt);
  if (xr){
    if (state.phase==='shoot' || state.phase==='edit') renderPreview(shotCam);
    else if (state.phase==='perform' && state.mirror) renderPreview(mirrorCam);
    const dark = state.phase==='edit' && shots.blackRoom;
    const wv = world.visible, wa = water.visible, bg = scene.background, fg = scene.fog;
    const headL = show.embodied ? show.embodied.parts.find(p=>p.tracker===camera)?.L : null;
    const hv = headL ? headL.group.visible : false;
    if (headL) headL.group.visible = false;   // don't see the inside of your own puppet head
    if (dark){ world.visible = false; water.visible = false; scene.background = BLACK; scene.fog = null; }
    renderer.render(scene, camera);
    if (dark){ world.visible = wv; water.visible = wa; scene.background = bg; scene.fog = fg; }
    if (headL) headL.group.visible = hv;
  } else desktopRender();
});
function desktopRender(){
  const W = innerWidth, H = innerHeight;
  if (state.phase==='edit'){
    renderer.setScissorTest(false); renderer.setViewport(0,0,W,H);
    renderer.setClearColor('#000'); renderer.clear();
    const r = ASPECTS[shots.aspect]; const availW = W - 370, availH = H - 140;
    let vw = availW, vh = vw / r; if (vh > availH){ vh = availH; vw = vh*r; }
    const vx = 355 + (availW - vw)/2, vy = 70 + (availH - vh)/2;
    renderer.setScissorTest(true); renderer.setScissor(vx,vy,vw,vh); renderer.setViewport(vx,vy,vw,vh);
    withShotView(() => renderer.render(scene, shotCam));
    renderer.setScissorTest(false); renderer.setViewport(0,0,W,H);
    return;
  }
  renderer.setViewport(0,0,W,H); renderer.render(scene, camera);
  if (state.phase==='shoot'){
    const r = ASPECTS[shots.aspect]; const iw = r>=1 ? 380 : 220, ih = iw/r;
    const ix = W - iw - 16, iy = 16;
    renderer.setScissorTest(true); renderer.setScissor(ix-4,iy-4,iw+8,ih+8); renderer.setViewport(ix-4,iy-4,iw+8,ih+8);
    renderer.setClearColor(rec && rec.phase==='rec' ? '#ff3b30' : '#ffd400'); renderer.clear();
    renderer.setScissor(ix,iy,iw,ih); renderer.setViewport(ix,iy,iw,ih);
    withShotView(() => renderer.render(scene, shotCam));
    renderer.setScissorTest(false); renderer.setViewport(0,0,W,H); renderer.setClearColor('#000');
  }
}

/* ---------------- start ---------------- */
(async () => {
  let loaded = false;
  try { const s = await idbGet('scene'); if (s){ deserialize(JSON.parse(s)); loaded = true; } } catch(e){ console.warn('no saved scene', e); }
  if (!loaded){ const L = makeLayer('Ground', 0.1); state.activeLayer = L.id; genIsland(L); setAspect('16:9'); }
  requestUI();
  window.__cmm = {state, shots, show, layers:()=>layers, applyOp, dirty, serialize, deserialize, rig, camera, scene, undo, redo, controls,
    setPhase, openPage, startRecording, stopRecording, startPlay, stopPlay, exportMP4, filmLength, newScene, setAspect, makeStarterPuppet,
    startShowRec, cutShowRec, playShow, stopShow, startLayerGrab, moveLayerGrab, endLayerGrab, layerById, addKeyAt, deleteKey, lensNudge,
    findBlockAt, startBlockGrab, moveBlockGrab, endBlockGrab, beginStroke, angleUpdate, angleClick, setTool,
    get rec(){return rec;}, get play(){return play;}, get stroke(){return stroke;}};
})();
