const SHAPES = {cube:[1,1,1], brick:[1,0.5,0.5], plank:[2,0.125,0.5], pillar:[0.5,2,0.5]};

const RIDERS = ['eye','mouth','hair','extra'];   // parts that sit on the head and go wherever it goes
/* ============================================================
   PLAY TOGETHER: a room with a 4-digit code (PeerJS, like the other Chiki XR apps)
   The host runs every menu. Players sculpt, doodle and build with their own color and size,
   ride along at the host's size, and can be handed a puppet to play (body, eyes, mouth, voice).
   Clay travels as the sculpt ops themselves; undo / detail changes travel as whole chunks.
   ?nettest swaps PeerJS for a BroadcastChannel so two tabs on one computer can try it.
   ============================================================ */
const NET = {on:false, host:false, guest:false, synced:false, code:'', peer:null, conns:{}, conn:null, me:'host', n:1, status:'',
             test:/[?&]nettest/.test(location.search), peers:new Map(), assign:new Map(), hostRig:null, off:[0,0,0], typed:'', snapParts:null, lightSig:''};
const NET_PREFIX = 'chiki-moviemagic-', MAX_GUESTS = 3, PLAYER_COL = ['#ff2d95','#00c7be','#ffd400','#5e2bff'];
const netTag = Math.random().toString(36).slice(2,6);
let netMute = 0, netInOp = 0, uidSeq = 0, netChain = Promise.resolve(), netRecvChain = Promise.resolve();
let netOps = [], netMetaSig = '', netMetaT = 0, netTickT = 0, netStT = 0, netPoseT = 0, netPoseFullT = 0, netMeT = 0, guestRec = null;
const netGrabs = new Map(), netSocks = new Map(); let netSockT = 0, netLastCk = '';   // host: things partners are holding from outside, by key (r = puppet, L = set piece, T = eye target)
const netSettle = new Map(), netVox = new Map(), netStTouch = new Map(), netStDrop = new Map(), netStFull = new Set(), netHash = new Map(), netPose = new Map(), netLastPose = new Map(), netRemote = new Map();
const netQuiet = () => !NET.on || netMute > 0;
const playerName = n => n===1 ? 'Host' : 'Player '+n;
function Em(){ this._h = {}; } Em.prototype.on = function(k,f){ (this._h[k] = this._h[k] || []).push(f); return this; }; Em.prototype.emit = function(k,...a){ (this._h[k] || []).forEach(f => f(...a)); };
function BCConn(o, r){ Em.call(this); this.o = o; this.peer = r; this.open = false; } BCConn.prototype = Object.create(Em.prototype);
BCConn.prototype.ready = function(){ if (this.open) return; this.open = true; setTimeout(() => this.emit('open'), 0); };
BCConn.prototype.send = function(d){ if (typeof d !== 'string' || d.length > 16000) console.error('net: message too big for PeerJS', typeof d === 'string' ? d.length : typeof d); this.o.bc.postMessage({to:this.peer, from:this.o.id, k:'data', d}); };
BCConn.prototype.close = function(){ this.o.bc.postMessage({to:this.peer, from:this.o.id, k:'close'}); };
function BCPeer(id){ Em.call(this); this.id = id || 'g'+Math.random().toString(36).slice(2,9); this.conns = {}; this.bc = new BroadcastChannel('cmm-net');
  this.bc.onmessage = e => { const m = e.data; if (m.to !== this.id) return; const c = this.conns[m.from];
    if (m.k==='conn'){ const n = new BCConn(this, m.from); this.conns[m.from] = n; this.emit('connection', n); n.ready(); this.bc.postMessage({to:m.from, from:this.id, k:'ok'}); }
    else if (m.k==='ok') c && c.ready(); else if (m.k==='data') c && c.emit('data', m.d); else if (m.k==='close') c && c.emit('close'); };
  setTimeout(() => this.emit('open', this.id), 10); }
BCPeer.prototype = Object.create(Em.prototype);
BCPeer.prototype.connect = function(id){ const c = new BCConn(this, id); this.conns[id] = c; this.bc.postMessage({to:id, from:this.id, k:'conn'}); setTimeout(() => { if (!c.open) this.emit('error', {type:'peer-unavailable'}); }, 1500); return c; };
BCPeer.prototype.destroy = function(){ try { this.bc.close(); } catch(e){} };
// the relay (TURN) servers come from the repo's shared turn-config.js, loaded in <head>
function makeIce(){ return [{urls:'stun:stun.l.google.com:19302'}].concat(window.CHIKI_TURN || []); }
async function loadPeer(){ if (NET.test) return; if (!NET.ice) NET.ice = makeIce(); if (window.Peer) return;
  await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'; sc.onload = res; sc.onerror = () => rej(new Error('load')); document.head.append(sc); }); }
function makePeer(id){ if (NET.test) return new BCPeer(id); const o = {debug:1, config:{iceServers:NET.ice}}; return id ? new window.Peer(id, o) : new window.Peer(o); }
function netErrText(e){ return e.type==='peer-unavailable' ? 'No room with that code. Check it and try again.' : (e.type==='network' || e.type==='server-error' || e.type==='socket-error') ? "Can't reach the internet matchmaker. Try again." : 'Something went wrong ('+e.type+'). Try again.'; }
function netStatus(t){ NET.status = t; requestUI(); }
async function zipU8(u8, unzip){
  if (typeof CompressionStream === 'undefined') return u8;
  const s = new Blob([u8]).stream().pipeThrough(unzip ? new DecompressionStream('deflate') : new CompressionStream('deflate'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
// every send goes through one queue so things arrive in the order they happened
// PeerJS drops the whole connection if one message is 16 KB or more, so everything goes as small text pieces,
// and we wait whenever the line is backed up so a big world never floods it
const PIECE = 4000;
let pieceSeq = 0; const pieceBuf = new Map();
async function sendStr(c, str){
  const pace = async () => { const dc = c.dataChannel; let n = 0; while (dc && dc.bufferedAmount > 256*1024 && n++ < 500) await new Promise(r => setTimeout(r, 20)); };
  if (str.length <= PIECE){ await pace(); try { c.send(str); } catch(e){} return; }
  const id = netTag + (++pieceSeq), n = Math.ceil(str.length/PIECE);
  for (let i=0;i<n;i++){ await pace(); if (!c.open && !NET.test) return; try { c.send('\u0001'+id+'|'+i+'|'+n+'|'+str.slice(i*PIECE, (i+1)*PIECE)); } catch(e){} }
}
function netDecode(d, key){
  if (typeof d !== 'string') return d;
  if (d.charCodeAt(0) === 1){
    const a = d.indexOf('|'), b = d.indexOf('|', a+1), c2 = d.indexOf('|', b+1), id = key+':'+d.slice(1,a), i = +d.slice(a+1,b), n = +d.slice(b+1,c2);
    let e = pieceBuf.get(id); if (!e){ e = {parts:new Array(n), got:0}; pieceBuf.set(id, e); }
    if (e.parts[i] == null){ e.parts[i] = d.slice(c2+1); e.got++; }
    if (e.got < n) return null; pieceBuf.delete(id); d = e.parts.join('');
  }
  try { return JSON.parse(d); } catch(e){ return null; }
}
async function rawSend(m, to){
  const str = JSON.stringify(m);
  const targets = NET.host ? (to ? [NET.conns[to]] : Object.keys(NET.conns).filter(id => id !== m.via).map(id => NET.conns[id])) : [NET.conn];
  for (const c of targets) if (c) await sendStr(c, str);
}
function netSend(m, to){ netChain = netChain.then(async () => { const mm = typeof m === 'function' ? await m() : m; if (mm) await rawSend(mm, to); }).catch(e => console.warn(e)); }

function netReset(){
  for (const id in NET.conns) try { NET.conns[id].close(); } catch(e){}
  try { NET.conn && NET.conn.close(); } catch(e){} try { NET.peer && NET.peer.destroy(); } catch(e){}
  for (const p of NET.peers.values()) dropAvatar(p);
  state.camOn = false; state.roam = false; state.gPick = false;
  Object.assign(NET, {trkSig:null, lastRx:0, hbT:0, keptId:null, keptName:null, camPeer:null, camPose:null, on:false, host:false, guest:false, synced:false, code:'', peer:null, conns:{}, conn:null, me:'host', n:1, hostRig:null, snapParts:null});
  NET.peers.clear(); NET.assign.clear(); netRemote.clear(); netPose.clear(); netLastPose.clear(); netHash.clear();
  netOps = []; netVox.clear(); netSettle.clear(); netStTouch.clear(); netStDrop.clear(); netStFull.clear(); netMetaSig = '';
  requestUI();
}
async function netHost(){
  netReset(); netStatus('Opening a room…');
  try { await loadPeer(); } catch(e){ return netStatus("Couldn't load the together part. Check the internet."); }
  const go = () => { const code = NET.test ? '1234' : String(1000 + Math.floor(Math.random()*9000)), peer = makePeer(NET_PREFIX+code); NET.peer = peer;
    vcListen(peer); VC.ec = true; if (state.talk !== false) vcMic();
    peer.on('open', () => { Object.assign(NET, {host:true, on:true, synced:true, code, me:'host', n:1}); netStatus(''); toast('Room '+code+' is open. Type it in on her headset (APP → Together).'); });
    peer.on('connection', c => {
      c.on('open', () => { if (Object.keys(NET.conns).length >= MAX_GUESTS){ try { c.send(JSON.stringify({t:'full'})); } catch(e){} setTimeout(() => c.close(), 400); return; } hostWelcome(c); });
      c.on('data', d => { const m = netDecode(d, c.peer); if (m) netRecvChain = netRecvChain.then(() => onNet(m, c.peer)).catch(e => console.warn(e)); });
      const drop = () => { if (!NET.conns[c.peer]) return; delete NET.conns[c.peer]; const p = NET.peers.get(c.peer);
        for (const [cid, pid] of [...NET.assign]) if (pid === c.peer){ NET.assign.delete(cid); netRemote.delete(cid); }
        if (p){ dropAvatar(p); NET.peers.delete(c.peer); toast(playerName(p.n)+' left'); }
        netSend({t:'bye', from:c.peer}); requestUI(); };
      c.on('close', drop); c.on('error', e => console.warn('net', e));   // a refused message is not someone leaving
    });
    peer.on('error', e => { if (e.type==='unavailable-id'){ try { peer.destroy(); } catch(_){} go(); return; } if (!NET.on) netStatus(netErrText(e)); });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch(e){} }); };
  go();
}
async function netJoin(code, retry){
  code = String(code||'').trim(); if (!/^\d{4}$/.test(code)) return netStatus('Type the 4-digit room code.');
  if (!retry){ state.mic = true; ensureMic(); }   // asked now, while the button press counts as a tap
  if (!retry) try { await saveLocal(true); } catch(e){}
  netReset(); NET.code = code; NET.retry = retry || 0; netStatus('Joining '+code+'…');
  try { await loadPeer(); } catch(e){ return netStatus("Couldn't load the together part. Check the internet."); }
  const peer = makePeer(); NET.peer = peer; vcListen(peer); let done = false;
  peer.on('open', () => { const c = peer.connect(NET_PREFIX+code, {reliable:true}); NET.conn = c;
    c.on('open', () => { done = true; NET.on = true; NET.guest = true; NET.me = peer.id; netStatus('Getting the world…'); });
    c.on('data', d => { NET.lastRx = performance.now(); const m = netDecode(d, 'host'); if (m) netRecvChain = netRecvChain.then(() => onNet(m, null)).catch(e => console.warn(e)); });
    const gone = () => { if (!NET.on) return;
      if (!NET.synced && (NET.retry||0) < 2){ const r2 = (NET.retry||0) + 1; netStatus('Connection hiccup, trying again…'); setTimeout(() => netJoin(code, r2), 1200); return; }   // dropped while loading: try again by itself
      netLeave(true); };
    c.on('close', gone); c.on('error', e => console.warn('net', e)); });
  peer.on('error', e => { if (!done) netStatus(netErrText(e)); });
  setTimeout(() => { if (!done && NET.code === code) netStatus("Couldn't connect. Check the code and the internet, then try again."); }, 20000);
}
async function netLeave(lost, keep){
  vcEnd();

  if (show.embodied && wasGuest){ show.embodied = null; }
  const synced = NET.synced, keepIt = wasGuest && synced && (lost || keep), kid = NET.keptId, kname = NET.keptName;
  netReset(); netStatus('');
  if (keepIt){
    let nm = kname, miss = missingVoices();
    try { if (kid){ await idbSet('world:'+kid, JSON.stringify(serialize())); const w = worldList.find(x => x.id === kid); if (w){ w.saved = Date.now(); await idbSet('worlds', JSON.stringify(worldList)); } state.worldId = kid; }   // the newest version of it
          else { nm = await keepWorldHere(); state.worldId = NET.keptId; } } catch(e){ console.error(e); }
    NET.keptId = null; NET.keptName = null;
    try { await idbSet('cur', state.worldId); } catch(e){}

  }

// ---- big transfers (the world when someone joins, a fresh copy before a phone export): numbered parts, the player keeps every part
// that arrived (even across a dropped connection) and asks again only for the missing ones, until it has everything
const BX_PART = 60000, bxIn = new Map(), bxOut = new Map();
const fnvStr = s => { let h = 2166136261; for (let i=0;i<s.length;i+=7){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(36)+'.'+s.length; };
function worldForPlayer(){ const o = serialize(), views = o.views; delete o.views; delete o.saved; return {json:JSON.stringify(o), views}; }
function bxOffer(to, kind, json, extra){
  netSend(async () => {
    const d = u8ToB64(await zipU8(new TextEncoder().encode(json))), n = Math.max(1, Math.ceil(d.length/BX_PART)), id = fnvStr(d);

let skyTex = null;

function skyColors(){

}
function applyWorld(){

  const g2 = skyCanvas.getContext('2d'), H = skyCanvas.height;
  const gr = g2.createLinearGradient(0,0,0,H);

  gr.addColorStop(0.502, Sk.low); gr.addColorStop(1, Sk.low);
  g2.fillStyle = gr; g2.fillRect(0,0,skyCanvas.width,H);
  if (Sk.stars){ const R=rng(7); g2.fillStyle='#fff'; for (let i=0;i<700;i++){ g2.globalAlpha=0.4+R()*0.6; g2.fillRect(R()*skyCanvas.width, R()*H*0.46, 1, 1); } g2.globalAlpha=1; }

        int k = int(h*97.0) - 6*int(h*97.0/6.0); vec3 col = k==0 ? vec3(1.0,0.18,0.58) : k==1 ? vec3(1.0,0.83,0.0) : k==2 ? vec3(0.0,0.78,0.75) : k==3 ? vec3(0.12,0.42,1.0) : k==4 ? vec3(0.37,0.17,1.0) : vec3(1.0);

let _xrFog = null;

let _fog = null; function fogObj(){ const Sk = skyColors(); if (!_fog) _fog = new THREE.Fog(Sk.hor, 60, 300); _fog.color.set(Sk.hor); return _fog; }

// what's on stage this frame: the world, or the character studio

  if (st){ water.visible = false; scene.background = STUDIO_BG; scene.fog = null; sun.position.set(10, 26, 46); }   // the studio is lit from the front, where you stand

// stepping in sizes you so your eyes meet its eyes, which also sizes your controllers: draw the guides at that same size

/* ---------------- layers & chunks ---------------- */
let layers = []; let layerSeq = 1;
// per-layer clay material (LIGHT > Materials). Glow lights the clay up in its own colors.
// finishes: grains, flakes and sheens worked out in the layer's own space, so they ride along on a moving puppet
const FINISHES = [['none','Plain'],['sand','Sand'],['glitter','Glitter'],['pearl','Pearl'],['velvet','Velvet'],['terrazzo','Terrazzo'],['marble','Marble'],['lava','Lava']];
const finIndex = f => Math.max(0, FINISHES.findIndex(x => x[0]===(f||'none')));
let finTime = {value:0};
function makeClayMat(){
  const m = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.85, metalness:0, emissive:'#ffffff', emissiveIntensity:0});
  m.userData.uFin = {value:0}; m.userData.uInv = {value:new THREE.Matrix4()}; m.userData.uFinS = {value:1};

    sh.uniforms.uFin = m.userData.uFin; sh.uniforms.uInv = m.userData.uInv; sh.uniforms.uFinS = m.userData.uFinS; sh.uniforms.uFT = finTime;
    sh.vertexShader = 'uniform mat4 uInv; varying vec3 vLP;\n' + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n{ vec4 lp = vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nlp = instanceMatrix*lp;\n#endif\nvLP = (uInv*modelMatrix*lp).xyz; }');
    sh.fragmentShader = 'uniform int uFin; uniform float uFinS, uFT; varying vec3 vLP;\n' + GLSL_NOISE + '\n' + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
  vec3 fp = vLP/uFinS; float fN = 0.0;
  if (uFin==1){ fN = h31(floor(fp*420.0)); diffuseColor.rgb *= 0.82 + 0.3*fN; }
  else if (uFin==5){ vec3 q = fp*40.0, i = floor(q); float h = h31(i); vec3 e = fract(q)-0.5-(h33(i)-0.5)*0.4; if (h > 0.45 && length(e) < 0.12 + 0.12*h){ int k = int(h*97.0) - 6*int(h*97.0/6.0);

  if (uFin==1){ normal = normalize(normal + 0.35*(h33(floor(vLP/uFinS*420.0))-0.5)); }
  else if (uFin==2){ normal = normalize(normal + 0.12*(h33(floor(vLP/uFinS*300.0))-0.5)); }`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
#ifdef USE_COLOR

#endif
  { vec3 vd = normalize(vViewPosition); float fr = 1.0 - max(dot(normal, vd), 0.0);
    if (uFin==2){ vec3 q = vLP/uFinS*160.0, i = floor(q); vec3 e = fract(q)-0.5-(h33(i+7.0)-0.5)*0.3; vec3 rd = h33(i)*2.0-1.0; float hit = ss(0.3, 0.12, length(e))*step(0.35, h31(i+3.0));
      vec3 fl = normalize(normal + rd*0.55); float sp = pow(max(dot(fl, vd), 0.0), 24.0); float tw = 0.5 + 0.5*sin(uFT*5.0 + h31(i)*60.0);

}
function finishTick(time){ finTime.value = time; for (const L of layers) if (L.matProps && L.matProps.fin && L.matProps.fin !== 'none'){ L.group.updateMatrixWorld(); L.mat.userData.uInv.value.copy(L.group.matrixWorld).invert(); } }
function setLayerMat(L, props){ L.matProps = {rough:0.85, metal:0, glow:0, ...(L.matProps||{}), ...props}; L.mat.roughness = L.matProps.rough; L.mat.metalness = L.matProps.metal; L.mat.emissiveIntensity = L.matProps.glow; L.mat.envMap = L.matProps.metal > 0.05 ? skyTex : null; if (L.mat.userData.uFin){ L.mat.userData.uFin.value = finIndex(L.matProps.fin); } L.mat.needsUpdate = true; }

function removeLayer(L){

  for (const k of [...dirty.keys()]) if (k.startsWith(L.id+'|')) dirty.delete(k);
}
// world <-> layer space (works through any parent: world, a character root, or the studio)
function wToL(L, p){ L.group.updateMatrixWorld(true); return L.group.worldToLocal(p.clone()); }
function rToL(L, r){ return r / L.group.getWorldScale(V()).x; }
function autoFiner(L, rL){   // you shrank your brush past this layer's detail: make the layer finer (if it stays light), so the brush really is that small
  if (!L || L.locked || NET.guest) return false; let n = 0;
  while (rL < L.vs*0.7 && n < 4){ const i = DETAILS.indexOf(L.vs); if (i < 0 || i >= DETAILS.length-1) break;
    if (layerHasClay(L) && resampleKeys(L, DETAILS[i+1]).size > 2500) break;
    const vs0 = L.vs; changeDetail(L, -1); if (L.vs === vs0) break; n++; }
  if (n) toast('Small brush: "'+layerLabel(L)+'" now has finer detail ('+fmtLen(L.vs)+')');
  return rL >= L.vs*0.7;
}
function qToL(L, q){ return L.group.getWorldQuaternion(new THREE.Quaternion()).invert().multiply(q); }
function dToL(L, d){ return d.clone().applyQuaternion(L.group.getWorldQuaternion(new THREE.Quaternion()).invert()); }

function getChunk(L, cx, cy, cz, create){
  const k = ckey(cx,cy,cz); let ch = L.chunks.get(k);
  if (!ch && create){ ch = {cx,cy,cz,k,d:null,c:null,mesh:null}; L.chunks.set(k, ch); }
  return ch;
}
function alloc(ch){
  if (ch.d) return;
  ch.d = new Float32Array(CN3).fill(-DMAX);
  ch.c = new Uint8Array(CN3*3).fill(200);
}
const dirty = new Map();
function markDirty(L, ch){ dirty.set(L.id+'|'+ch.k, {L, ch});
  if (NET.on){ if (netInOp){ netHash.delete(L.id+'|'+ch.k); if (NET.host) netSettle.set(L.id+'|'+ch.k, performance.now()); } else if (!netMute){ let st = netVox.get(L.id); if (!st) netVox.set(L.id, st = new Set()); st.add(ch.k); } } }
function markAround(L, cx0,cy0,cz0, cx1,cy1,cz1){
  for (let cz=cz0; cz<=cz1; cz++) for (let cy=cy0; cy<=cy1; cy++) for (let cx=cx0; cx<=cx1; cx++)
    markDirty(L, getChunk(L, cx,cy,cz, true));
}

/* ---------------- sculpt ops (layer space, multiplayer-ready) ---------------- */
const _cache = {k:null, ch:null};
function sampleD(L, gx, gy, gz){
  const cx = Math.floor(gx/CN), cy = Math.floor(gy/CN), cz = Math.floor(gz/CN);
  const k = L.id+'|'+cx+','+cy+','+cz;
  let ch;
  if (_cache.k === k) ch = _cache.ch; else { ch = L.chunks.get(ckey(cx,cy,cz)); _cache.k = k; _cache.ch = ch; }
  if (!ch || !ch.d) return -DMAX;
  return ch.d[(gx-cx*CN) + CN*((gy-cy*CN) + CN*(gz-cz*CN))];
}
function applyOp(op, undoMap){
  if (!netQuiet() && layerById(op.L)) netOps.push(op);
  netInOp++; try { applyOp0(op, undoMap); } finally { netInOp--; }
}
function applyOp0(op, undoMap){
  const L = layerById(op.L); if (!L) return;
  const VS = L.vs;
  _cache.k = null;
  const r = op.r, rv = r/VS, px=op.p[0], py=op.p[1], pz=op.p[2];
  const pad = op.t==='clay' || op.t==='carve' ? DMAX+1 : 1;
  const g0 = [Math.floor(px/VS - rv - pad), Math.floor(py/VS - rv - pad), Math.floor(pz/VS - rv - pad)];
  const g1 = [Math.ceil (px/VS + rv + pad), Math.ceil (py/VS + rv + pad), Math.ceil (pz/VS + rv + pad)];
  const c0 = g0.map(v=>Math.floor(v/CN)), c1 = g1.map(v=>Math.floor(v/CN));
  const col = op.col, s = op.s;
  const writes = [];
  let changed = false;
  for (let cz=c0[2]; cz<=c1[2]; cz++) for (let cy=c0[1]; cy<=c1[1]; cy++) for (let cx=c0[0]; cx<=c1[0]; cx++){
    let ch = getChunk(L, cx,cy,cz, op.t==='clay');
    if (!ch) continue;
    if (!ch.d && op.t!=='clay') continue;
    const bx=cx*CN, by=cy*CN, bz=cz*CN;
    const lx0=Math.max(0,g0[0]-bx), lx1=Math.min(CN-1,g1[0]-bx);
    const ly0=Math.max(0,g0[1]-by), ly1=Math.min(CN-1,g1[1]-by);
    const lz0=Math.max(0,g0[2]-bz), lz1=Math.min(CN-1,g1[2]-bz);
    if (lx0>lx1||ly0>ly1||lz0>lz1) continue;
    for (let lz=lz0; lz<=lz1; lz++){
      const wz=(bz+lz)*VS - pz;
      for (let ly=ly0; ly<=ly1; ly++){
        const wy=(by+ly)*VS - py;
        for (let lx=lx0; lx<=lx1; lx++){
          const wx=(bx+lx)*VS - px;
          const dist = Math.sqrt(wx*wx+wy*wy+wz*wz);
          const field = (r - dist)/VS;
          if (field < -pad) continue;
          const i = lx + CN*(ly + CN*lz);
          const old = ch.d ? ch.d[i] : -DMAX;
          if (op.t==='clay'){
            const target = Math.min(DMAX, Math.max(old, field));
            if (target <= old + 1e-4) continue;
            if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, ch.d ? {d:ch.d.slice(), c:ch.c.slice()} : null);
            alloc(ch);
            ch.d[i] = old + (target-old)*s;
            if (old < 0.6 && field > -1){
              const w = old < -0.4 ? 1 : 0.65, i3=i*3;
              ch.c[i3]  += (col[0]-ch.c[i3])*w;
              ch.c[i3+1]+= (col[1]-ch.c[i3+1])*w;
              ch.c[i3+2]+= (col[2]-ch.c[i3+2])*w;
            }
            changed = true;
          } else if (op.t==='carve'){
            const target = Math.max(-DMAX, Math.min(old, -field));
            if (target >= old - 1e-4) continue;
            if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, {d:ch.d.slice(), c:ch.c.slice()});
            ch.d[i] = old + (target-old)*s;
            changed = true;
          } else if (op.t==='smooth'){
            if (field <= 0) continue;
            const gx=bx+lx, gy=by+ly, gz=bz+lz;
            const avg = (old + sampleD(L,gx+1,gy,gz)+sampleD(L,gx-1,gy,gz)+sampleD(L,gx,gy+1,gz)
                        +sampleD(L,gx,gy-1,gz)+sampleD(L,gx,gy,gz+1)+sampleD(L,gx,gy,gz-1))/7;
            const w = clamp(field/Math.max(1,rv*0.5),0,1)*s;
            if (Math.abs(avg-old) < 1e-3) continue;
            writes.push(ch, i, old + (avg-old)*w);
          } else if (op.t==='spray'){
            if (field <= 0 || old < -1.2) continue;
            const gx=bx+lx, gy=by+ly, gz=bz+lz, f = clamp(field/rv,0,1);
            const rnd = Math.abs(Math.sin(gx*12.9898 + gy*78.233 + gz*37.719 + (op.seed||0))*43758.5453) % 1;
            if (rnd > f*(0.35+0.65*s)) continue;
            const w = 0.85, i3=i*3;
            if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, {d:ch.d.slice(), c:ch.c.slice()});
            ch.c[i3]  += (col[0]-ch.c[i3])*w; ch.c[i3+1]+= (col[1]-ch.c[i3+1])*w; ch.c[i3+2]+= (col[2]-ch.c[i3+2])*w;
            changed = true;
          } else if (op.t==='paint'){
            if (field <= 0 || old < -1.2) continue;
            const w = clamp(field/Math.max(1,rv*0.5),0,1)*s*0.8, i3=i*3;
            if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, {d:ch.d.slice(), c:ch.c.slice()});
            ch.c[i3]  += (col[0]-ch.c[i3])*w;
            ch.c[i3+1]+= (col[1]-ch.c[i3+1])*w;
            ch.c[i3+2]+= (col[2]-ch.c[i3+2])*w;
            changed = true;
          }
        }
      }
    }
  }
  for (let w=0; w<writes.length; w+=3){
    const ch=writes[w];
    if (undoMap && !undoMap.has(ch.k)) undoMap.set(ch.k, {d:ch.d.slice(), c:ch.c.slice()});
    ch.d[writes[w+1]] = writes[w+2]; changed = true;
  }
  if (changed){
    markAround(L, Math.floor((g0[0]-1)/CN), Math.floor((g0[1]-1)/CN), Math.floor((g0[2]-1)/CN),
                  Math.floor((g1[0]+1)/CN), Math.floor((g1[1]+1)/CN), Math.floor((g1[2]+1)/CN));
    sceneDirty = true;
  }
}

/* ---------------- surface-nets mesher ---------------- */
const S = CN+2, C = CN+1;
const sd = new Float32Array(S*S*S), sc = new Uint8Array(S*S*S*3);
const vidx = new Int32Array(C*C*C);
const offA = new Int8Array(S), locA = new Int8Array(S);
for (let i=0;i<S;i++){ const gg=i-1; const o=Math.floor(gg/CN); offA[i]=o; locA[i]=gg-o*CN; }
const CORN = []; for (let n=0;n<8;n++) CORN.push([n&1,(n>>1)&1,(n>>2)&1]);
const EDGES = []; for (let n=0;n<8;n++) for (const b of [1,2,4]) if(!(n&b)) EDGES.push([n,n|b]);
const cd = new Float32Array(8);
function srgb2lin(c){ return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
function meshChunk(L, ch){
  if (L.lightMesh){ unlight(L); L._lightAt = performance.now() + 1500; }
  const VS = L.vs;
  const nbs = new Array(27);
  for (let z=-1;z<=1;z++) for (let y=-1;y<=1;y++) for (let x=-1;x<=1;x++)
    nbs[(x+1)+3*((y+1)+3*(z+1))] = L.chunks.get(ckey(ch.cx+x, ch.cy+y, ch.cz+z));
  let anyIn=false, anyOut=false;
  for (let k=0;k<S;k++) for (let j=0;j<S;j++) for (let i=0;i<S;i++){
    const si = i + S*(j + S*k);
    const nb = nbs[(offA[i]+1)+3*((offA[j]+1)+3*(offA[k]+1))];
    if (nb && nb.d){
      const li = locA[i] + CN*(locA[j] + CN*locA[k]);
      const v = nb.d[li]; sd[si]=v;
      sc[si*3]=nb.c[li*3]; sc[si*3+1]=nb.c[li*3+1]; sc[si*3+2]=nb.c[li*3+2];
      if (v>0) anyIn=true; else anyOut=true;
    } else { sd[si]=-DMAX; anyOut=true; }
  }
  if (!anyIn || !anyOut){ dropMesh(L, ch); return; }
  const pos=[], nor=[], colr=[], ind=[];
  const bx=ch.cx*CN-1, by=ch.cy*CN-1, bz=ch.cz*CN-1;
  vidx.fill(-1);
  for (let k=0;k<C;k++) for (let j=0;j<C;j++) for (let i=0;i<C;i++){
    let mask=0;
    for (let n=0;n<8;n++){
      const c=CORN[n]; const v = sd[(i+c[0]) + S*((j+c[1]) + S*(k+c[2]))];
      cd[n]=v; if (v>0) mask|=1<<n;
    }
    if (mask===0 || mask===255) continue;
    let ax=0,ay=0,az=0,cnt=0;
    for (const [a,b] of EDGES){
      const da=cd[a], db=cd[b];
      if ((da>0)===(db>0)) continue;
      const t = da/(da-db); const A=CORN[a], B=CORN[b];
      ax+=A[0]+(B[0]-A[0])*t; ay+=A[1]+(B[1]-A[1])*t; az+=A[2]+(B[2]-A[2])*t; cnt++;
    }
    ax/=cnt; ay/=cnt; az/=cnt;
    const gx=(cd[1]+cd[3]+cd[5]+cd[7])-(cd[0]+cd[2]+cd[4]+cd[6]);
    const gy=(cd[2]+cd[3]+cd[6]+cd[7])-(cd[0]+cd[1]+cd[4]+cd[5]);
    const gz=(cd[4]+cd[5]+cd[6]+cd[7])-(cd[0]+cd[1]+cd[2]+cd[3]);
    const gl=Math.hypot(gx,gy,gz)||1;
    let cr=0,cg=0,cb=0,cw=0;
    for (let n=0;n<8;n++){ if (cd[n]<=0) continue; const c=CORN[n];
      const si=((i+c[0]) + S*((j+c[1]) + S*(k+c[2])))*3; const w=cd[n]+0.05;
      cr+=sc[si]*w; cg+=sc[si+1]*w; cb+=sc[si+2]*w; cw+=w; }
    vidx[i + C*(j + C*k)] = pos.length/3;
    pos.push((bx+i+ax)*VS, (by+j+ay)*VS, (bz+k+az)*VS);
    nor.push(-gx/gl, -gy/gl, -gz/gl);
    colr.push(srgb2lin(cr/cw/255), srgb2lin(cg/cw/255), srgb2lin(cb/cw/255));
  }
  const vi = (i,j,k) => vidx[i + C*(j + C*k)];
  const quad = (a,b,c,d,flip) => {
    if (a<0||b<0||c<0||d<0) return;
    if (!flip) ind.push(a,b,c, a,c,d); else ind.push(a,c,b, a,d,c);
  };
  for (let k=1;k<=CN;k++) for (let j=1;j<=CN;j++) for (let i=1;i<=CN;i++){
    const d0 = sd[i + S*(j + S*k)];
    const in0 = d0>0;
    const dx = sd[(i+1) + S*(j + S*k)];
    if (in0 !== (dx>0)) quad(vi(i,j,k), vi(i,j-1,k), vi(i,j-1,k-1), vi(i,j,k-1), !in0);
    const dy = sd[i + S*((j+1) + S*k)];
    if (in0 !== (dy>0)) quad(vi(i,j,k), vi(i,j,k-1), vi(i-1,j,k-1), vi(i-1,j,k), !in0);
    const dz = sd[i + S*(j + S*(k+1))];
    if (in0 !== (dz>0)) quad(vi(i,j,k), vi(i-1,j,k), vi(i-1,j-1,k), vi(i,j-1,k), !in0);
  }
  if (!ind.length){ dropMesh(L, ch); return; }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(colr,3));
  geo.setIndex(pos.length/3 > 65535 ? new THREE.Uint32BufferAttribute(ind,1) : new THREE.Uint16BufferAttribute(ind,1));
  geo.computeBoundingSphere();
  if (!ch.mesh){ ch.mesh = new THREE.Mesh(geo, L.mat || clayMat); ch.mesh.userData.clay = true; L.group.add(ch.mesh); }
  else { ch.mesh.geometry.dispose(); ch.mesh.geometry = geo; ch.mesh.visible = true; }
}
function dropMesh(L, ch){ if (L.lightMesh){ unlight(L); L._lightAt = performance.now() + 1500; } if (ch.mesh){ L.group.remove(ch.mesh); ch.mesh.geometry.dispose(); ch.mesh=null; } }
function processRemesh(budgetMs){
  if (!dirty.size) return;
  const t0 = performance.now();
  for (const [k, e] of dirty){
    dirty.delete(k);
    if (layers.includes(e.L)) meshChunk(e.L, e.ch);
    if (performance.now() - t0 > budgetMs) break;
  }
}

/* ---------------- starter island ---------------- */
function islandH(x,z){
  const r = Math.hypot(x,z);
  return 1.7*Math.exp(-(r*r)/(2*4.3*4.3)) + 0.22*Math.sin(x*0.7+1)*Math.cos(z*0.6) + 0.35 - Math.max(0, r-5.8)*0.7;
}
function genIsland(L){
  const VS = L.vs, R = 9, y0=-1.2, y1=2.8;
  const gx0=Math.floor(-R/VS), gx1=Math.ceil(R/VS), gy0=Math.floor(y0/VS), gy1=Math.ceil(y1/VS);
  const grass=hexRgb('#34c759'), sand=hexRgb('#ffd400'), dirt=hexRgb('#ff9500');
  for (let cz=Math.floor(gx0/CN); cz<=Math.floor(gx1/CN); cz++)
  for (let cy=Math.floor(gy0/CN); cy<=Math.floor(gy1/CN); cy++)
  for (let cx=Math.floor(gx0/CN); cx<=Math.floor(gx1/CN); cx++){
    const ch = getChunk(L,cx,cy,cz,true); let any=false;
    const d = new Float32Array(CN3).fill(-DMAX), c = new Uint8Array(CN3*3).fill(200);
    for (let lz=0;lz<CN;lz++) for (let lx=0;lx<CN;lx++){
      const x=(cx*CN+lx)*VS, z=(cz*CN+lz)*VS; const h=islandH(x,z);
      for (let ly=0;ly<CN;ly++){
        const gy=cy*CN+ly, y=gy*VS;
        if (gy<gy0 || gy>gy1) continue;
        let v = clamp((h-y)/VS, -DMAX, DMAX);
        if (gy===gy0) v = Math.min(v, -0.5);
        const i = lx + CN*(ly + CN*lz);
        d[i]=v; if (v>-DMAX) any=true;
        const col = (h-y) < 0.35 ? (y > 0.28 ? grass : sand) : dirt;
        c[i*3]=col[0]; c[i*3+1]=col[1]; c[i*3+2]=col[2];
      }
    }
    if (any){ ch.d=d; ch.c=c; }
  }
  for (const ch of L.chunks.values()) markDirty(L, ch);
}

/* ---------------- doodle + block strokes (stored in layer space) ---------------- */
const boxGeo = new THREE.BoxGeometry(1,1,1);
const FORM_GEO = {box:boxGeo, ball:new THREE.SphereGeometry(0.5, 20, 14), cylinder:new THREE.CylinderGeometry(0.5,0.5,1,24), cone:new THREE.ConeGeometry(0.5,1,24),
  pyramid:new THREE.ConeGeometry(Math.SQRT1_2,1,4).rotateY(Math.PI/4), donut:new THREE.TorusGeometry(0.33,0.17,12,28).rotateX(Math.PI/2)};
const BLOCK_FORMS = [['box','Box'],['ball','Ball'],['cylinder','Tube'],['cone','Cone'],['pyramid','Pyramid'],['donut','Donut']];
// ---- v0.26 brushes: playground tube, picket / chain link / barbed wire / Victorian trim, rocks, rainbow
const UPY = new THREE.Vector3(0,1,0);
function smoothPath(P, r){   // wide shapes follow the gist of your hand, not every wobble (wobbles pinch a thick tube)
  if (P.length < 3) return P; let Q = along(P, Math.max(r*0.6, 1e-4)).pts; if (Q.length < 3) return P;
  for (let it=0; it<4; it++){ const out = [Q[0]]; for (let i=1;i<Q.length-1;i++) out.push(Q[i-1].clone().add(Q[i].clone().multiplyScalar(2)).add(Q[i+1]).multiplyScalar(0.25)); out.push(Q[Q.length-1]); Q = out; }
  return Q;
}
function turnToward(up, t, target, maxA){   // spin up around the line toward target, at most maxA per step (works even when they point opposite ways)
  const ang = Math.acos(clamp(up.dot(target), -1, 1)); if (ang < 1e-4) return; const sgn = t.dot(new THREE.Vector3().crossVectors(up, target)) >= 0 ? 1 : -1;
  up.applyQuaternion(new THREE.Quaternion().setFromAxisAngle(t, sgn*Math.min(ang, maxA))).addScaledVector(t, -up.dot(t)).normalize();
}
function pathFrames(P, step, s, flat){   // points along the line with a side and an up; flat = up leans to the world's up (slides open to the sky)
  // 1) carry an up along the line with no twist at all; 2) work out how far it should roll toward the wanted up at each point;
  // 3) smooth that roll along the line (near-vertical bits borrow from their neighbours) so turning upright is a gentle spiral, never a sudden crease
  const A = along(P, step), N = A.pts.length, n = P.length, fr = [];
  const want = i => { if (flat === true) return UPY; const k = Math.min(n-1, Math.round(i/Math.max(1, N-1)*(n-1))); return new THREE.Vector3(s.ups?.[k*3] ?? 0, s.ups?.[k*3+1] ?? 1, s.ups?.[k*3+2] ?? 0); };
  const U = [], up = new THREE.Vector3();
  for (let i=0;i<N;i++){ const t = A.tans[i];
    if (i === 0){ const w0 = want(0).clone().addScaledVector(t, -want(0).dot(t)); up.copy(w0.lengthSq() > 0.02 ? w0.normalize() : new THREE.Vector3(1,0,0).addScaledVector(t, -t.x).normalize()); }
    else up.addScaledVector(t, -up.dot(t)).normalize();
    U.push(up.clone()); }
  const roll = new Float32Array(N);
  if (flat !== 'carry' && N > 1){
    const ang = new Float32Array(N), conf = [];
    for (let i=0;i<N;i++){ const t = A.tans[i], w2 = want(i).clone().addScaledVector(t, -want(i).dot(t));
      if (w2.lengthSq() < 0.09) continue;   // line nearly along the wanted up: no clear answer here, borrow from neighbours
      w2.normalize(); let a2 = Math.atan2(t.dot(new THREE.Vector3().crossVectors(U[i], w2)), U[i].dot(w2));
      if (conf.length){ const pv = ang[conf[conf.length-1]]; while (a2 - pv > Math.PI) a2 -= Math.PI*2; while (a2 - pv < -Math.PI) a2 += Math.PI*2; }   // unwrap: never a full extra turn
      ang[i] = a2; conf.push(i); }
    if (conf.length){
      for (let i=0;i<conf[0];i++) ang[i] = ang[conf[0]];
      for (let i=conf[conf.length-1]+1;i<N;i++) ang[i] = ang[conf[conf.length-1]];
      for (let q=0;q<conf.length-1;q++){ const i0 = conf[q], i1 = conf[q+1]; for (let i=i0+1;i<i1;i++) ang[i] = ang[i0] + (ang[i1]-ang[i0])*(i-i0)/(i1-i0); }   // spread a flip evenly across the gap
      const K = Math.max(3, Math.round((s.r || 0.02)*4/Math.max(1e-6, step)));   // then soften over about 4 brush-widths
      for (let i=0;i<N;i++){ let sw = 0, sa = 0; for (let j=Math.max(0,i-K); j<=Math.min(N-1,i+K); j++){ const g2 = 1 - Math.abs(j-i)/(K+1); sw += g2; sa += g2*ang[j]; } roll[i] = sa/sw; } } }
  for (let i=0;i<N;i++){ const t = A.tans[i], u = U[i].clone().applyAxisAngle(t, roll[i]).addScaledVector(t, -U[i].dot(t)).normalize();
    fr.push({p:A.pts[i], t, up:u, side:new THREE.Vector3().crossVectors(t, u).normalize()}); }

function changeDetail(L, dir){

    for (const ch of L.chunks.values()) dropMesh(L, ch);
    for (const k of [...dirty.keys()]) if (k.startsWith(L.id+'|')) dirty.delete(k);
    L.chunks = new Map(); L.vs = nv; toast('"'+L.name+'" detail '+fmtLen(nv)); sceneDirty = true; requestUI(); return;

  const keys = resampleKeys(L, nv), key = 'detail'+L.id+':'+nv;

}

function resampleKeys(L, nv){

function resampleLayer(L, nv, keys){

      const v = clamp(((c00*(1-ty) + c10*ty)*(1-tz) + (c01*(1-ty) + c11*ty)*tz)/q, -DMAX, DMAX);

function loadPitchWorklet(a){

  const code = `class P extends AudioWorkletProcessor{static get parameterDescriptors(){return [{name:'ratio',defaultValue:1,minValue:0.25,maxValue:4}]}
  constructor(){super();this.N=8192;this.b=new Float32Array(this.N);this.w=0;this.ph=0;this.W=2400;}
  rd(p){const N=this.N;p=((p%N)+N)%N;const i=Math.floor(p),f=p-i;return this.b[i]*(1-f)+this.b[(i+1)%N]*f;}

  registerProcessor('cmm-pitch',P);`;

// diatonic step within a scale (for harmonies a third/sixth away)
function dia(m, steps, scale, rootPc){ const pcs = scale.map(x => (x + rootPc) % 12); let pc = ((m % 12) + 12) % 12, i = pcs.indexOf(pc), oct = Math.floor(m/12);

  let idx = i + steps, octs = Math.floor(idx / pcs.length); idx = ((idx % pcs.length) + pcs.length) % pcs.length;
  let out = oct*12 + pcs[idx] + octs*12; if (steps > 0 && out <= m) out += 12; if (steps < 0 && out >= m) out -= 12; return out; }
function tempoMap(beats, rateOf){   // beat -> seconds for a tempo that changes (rateOf(beat) = beats per second)
  const N = Math.ceil(beats*48) + 48, T = new Float64Array(N+1); for (let i=0;i<N;i++){ const b = i/48; T[i+1] = T[i] + (1/48)/rateOf(b + 1/96); }
  return b => { const x = clamp(b*48, 0, N - 1e-6), i = Math.floor(x); return T[i] + (T[i+1]-T[i])*(x-i); };
}
