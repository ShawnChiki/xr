<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Rampsmith: carve a skate ramp from a block with cylinders, cones, bowls and fillets, pick the coping, and get a buildable plywood frame with a cut list and DXF. Works in VR on Quest.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rampsmith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height workbench. 3D viewport left, tabbed spec panel right; stacks with a sticky viewport on phones. */
:root{
  --bg:#e9edeb; --panel:#f6f8f7; --raise:#ffffff; --ink:#18201e; --muted:#58645f; --line:#d0d8d4;
  --accent:#23577b; --accent-ink:#ffffff; --accent-soft:#dbe7ef;
  --warn:#9b520a; --warn-soft:#f7ead9;
  --scene:#dde3e0; --ground:#cdd5d1; --grid:#aeb9b4; --ride:#4d4945; --side:#c29a63; --edge:#1d78b7; --hover:#e2a90c;
  --sub:#c4473c; --add:#2c8a55; --wood:#cfa66c; --pine:#dcc38f; --steel:#9aa4ad;
  --f-disp:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --panel:#171d1b; --raise:#1e2523; --ink:#e3e9e6; --muted:#94a19b; --line:#2a3330;
  --accent:#7db4dd; --accent-ink:#0c1822; --accent-soft:#1d3141;
  --warn:#e6a453; --warn-soft:#33271a;
  --scene:#1a201e; --ground:#212926; --grid:#34403b; --ride:#6b645d; --side:#a8814f; --edge:#58b0ee; --hover:#f2c230;
  --sub:#e2675c; --add:#55b67f; --wood:#b8905a; --pine:#c7ad78; --steel:#b3bcc4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --panel:#171d1b; --raise:#1e2523; --ink:#e3e9e6; --muted:#94a19b; --line:#2a3330;
  --accent:#7db4dd; --accent-ink:#0c1822; --accent-soft:#1d3141;
  --warn:#e6a453; --warn-soft:#33271a;
  --scene:#1a201e; --ground:#212926; --grid:#34403b; --ride:#6b645d; --side:#a8814f; --edge:#58b0ee; --hover:#f2c230;
  --sub:#e2675c; --add:#55b67f; --wood:#b8905a; --pine:#c7ad78; --steel:#b3bcc4; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* header */
.bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand .bn{font-family:var(--f-disp);font-weight:700;font-size:21px;letter-spacing:.01em}
.brand .bs{color:var(--muted);font-size:13px}
.mark{width:22px;height:14px;align-self:center;border:2.5px solid var(--ink);border-top:0;border-radius:0 0 14px 14px;position:relative}
.mark::before,.mark::after{content:"";position:absolute;top:-3px;width:5px;height:5px;border-radius:50%;background:var(--steel);border:1.5px solid var(--ink)}
.mark::before{left:-5px}.mark::after{right:-5px}
.bar label.pick{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
select,.btn,.bar button{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:32px}
.btn{display:inline-flex;align-items:center;cursor:pointer}
.bar button:hover,.btn:hover{border-color:var(--accent)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:9ch}
.status.busy{color:var(--accent)} .status.err{color:var(--sub)}

/* main */
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
#view{position:relative;min-width:0;min-height:0;background:var(--scene);overflow:hidden;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
.vtools{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.vtools>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:5px;padding:5px 11px;font-family:var(--f-disp);font-weight:600;font-size:14px;letter-spacing:.02em;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer}
.chip input{margin:0;accent-color:var(--accent)}
.vtools .spacer{flex:1}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:44px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.dims{position:absolute;left:12px;bottom:12px;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--scene) 80%,transparent);padding:3px 8px;border-radius:5px;max-width:calc(100% - 24px)}
.axes{position:absolute;right:12px;bottom:12px;font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;gap:10px}
.axes b{font-weight:500}.ax-x{color:#c4473c}.ax-y{color:#2c8a55}.ax-z{color:#2e6fb5}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

/* panel */
#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding-inline:8px}
.tabs button{flex:1;border:0;background:none;padding:12px 6px 10px;font-family:var(--f-disp);font-weight:600;font-size:16px;letter-spacing:.03em;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;font-weight:400;margin-left:4px;color:var(--muted)}
.tabbody{flex:1;overflow:auto;padding-block:16px 28px;padding-inline:16px;display:flex;flex-direction:column;gap:22px;min-width:0}
h3{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.09em;text-transform:uppercase;margin:0;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sechead small{color:var(--muted);font-size:12px}
.note{color:var(--muted);font-size:13px;margin:0;text-wrap:pretty}

/* fields */
.fld{display:grid;grid-template-columns:92px minmax(0,1fr) 92px;align-items:center;gap:10px}
.fld .fl{font-size:13px;color:var(--ink);line-height:1.2}
.fld .fl small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.fld input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.num{display:flex;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding-right:7px;min-width:0}
.num:focus-within{border-color:var(--accent)}
.num input{width:100%;min-width:0;border:0;background:transparent;padding:5px 4px 5px 7px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;outline:none}
.num em{font-style:normal;color:var(--muted);font-size:12px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>h4{margin:6px 0 0;font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sbtn{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:5px 10px;font-size:13px}
.sbtn:hover{border-color:var(--accent)}
.sbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.sel{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.sel select{width:100%;min-width:0}

/* op cards */
.adds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.adds button{border:1px dashed var(--line);background:transparent;border-radius:7px;padding:8px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.adds button:hover{border-color:var(--accent);border-style:solid;background:var(--raise)}
.adds svg{width:26px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.4}
ol.ops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:op}
.op{background:var(--raise);border:1px solid var(--line);border-radius:8px;counter-increment:op;min-width:0}
.op.open{border-color:var(--accent)}
.op.off .ophead{opacity:.5}
.ophead{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;cursor:pointer;min-width:0}
.ophead::before{content:counter(op);font-family:var(--f-mono);font-size:11px;color:var(--muted);width:14px}
.badge{font-family:var(--f-disp);font-weight:700;font-size:11px;letter-spacing:.06em;padding:2px 6px;border-radius:4px;color:#fff;flex:none}
.bar button.vrb{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}.pchip{position:absolute;left:12px;bottom:44px;max-width:min(300px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:13px;z-index:4}
.pchip .ib{float:right;margin:-4px -6px 0 6px}.pchip .pl b{font-family:var(--mono);font-size:17px;margin-right:8px}.pchip .pl span{color:var(--muted)}.pchip p{margin:6px 0 0;color:var(--muted)}.pchip svg{margin-top:8px}
svg.flat{display:block;max-width:100%;height:auto;overflow:visible}svg.flat .cut{fill:color-mix(in srgb,var(--wood) 35%,transparent);stroke:var(--ink);stroke-width:1.2}svg.flat .far{fill:none;stroke:var(--muted);stroke-width:.8;stroke-dasharray:3 2}svg.flat .bh{fill:#E5261F}svg.flat .sh{fill:#1F5FE0}svg.flat .pk{fill:rgba(31,166,74,.35);stroke:#1FA64A;stroke-width:1}
.flats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.flats figure{margin:0;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel)}.flats figcaption{font-family:var(--mono);font-size:12px;margin-top:4px}.flats figcaption b{font-size:13px}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:8px 0}.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.chkrow{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:14px;cursor:pointer}.chkrow input{width:18px;height:18px;accent-color:var(--accent)}.badge.m-fil{background:var(--accent)}.run.fil{grid-template-columns:auto minmax(0,1fr) 0 auto}.run.fil .fld{margin-top:6px;grid-template-columns:54px minmax(0,1fr) 84px}
.badge.m-sub,.badge.m-cut{background:var(--sub)} .badge.m-add,.badge.m-fill{background:var(--add)}
.opt{display:flex;flex-direction:column;min-width:0;flex:1}
.opt b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt span{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtns{display:flex;gap:2px;flex:none}
.ib{width:28px;height:28px;border:0;background:transparent;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--bg);color:var(--ink)}
.ib svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.opbody{border-top:1px solid var(--line);padding:12px 10px 14px;display:flex;flex-direction:column;gap:10px}
.opname{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:5px 8px;width:100%}
.cpgrid{display:grid;gap:4px;overflow-x:auto}
.cpgrid .lab{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:center;align-self:center}
.cpgrid input{width:100%;min-width:44px;border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:4px 1px;font-family:var(--f-mono);font-size:11.5px;text-align:center;-moz-appearance:textfield}
.cpgrid input::-webkit-inner-spin-button{display:none}
.cpgrid input.sel{border-color:var(--hover);box-shadow:0 0 0 1px var(--hover)}
.pted{background:var(--bg);border-radius:7px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pted h4{margin:0;font-size:12px;font-weight:600}

/* coping list */
.runs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.run{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:8px 8px 8px 10px}
.run .sw{width:10px;height:10px;border-radius:50%;background:var(--steel);border:1.5px solid var(--ink)}
.run .rl{display:flex;flex-direction:column;min-width:0}
.run .rl b{font-family:var(--f-mono);font-weight:500;font-size:13px}
.run .rl span{font-size:12px;color:var(--muted)}
.run select{padding:4px 6px;min-height:28px;font-size:12px}
.run.lost{border-style:dashed}
.empty{border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted);font-size:13px;text-align:center}

/* build */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile b{display:block;font-family:var(--f-disp);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.warns{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.warns li{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);border-radius:4px;padding:8px 10px;font-size:13px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--raise)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-disp);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.cat td{background:var(--bg);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:0}
.ribs{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.plist{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.plist b{font-family:var(--f-mono);font-weight:500}
.cutsheet{background:var(--bg);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.cutsheet b{font-family:var(--f-mono);font-weight:500}
.mods{display:flex;flex-direction:column;gap:8px}
.mod{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mod.on{border-color:var(--hover);box-shadow:0 0 0 1px var(--hover)}
.modhead{display:flex;align-items:baseline;gap:8px;border:0;background:none;padding:0;text-align:left;min-width:0;width:100%}
.modhead b{font-family:var(--f-disp);font-weight:700;font-size:18px;min-width:18px}
.modhead .mn{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modhead .role{font-size:11px;font-family:var(--f-mono);color:var(--muted);background:var(--bg);border-radius:4px;padding:1px 6px;white-space:nowrap}
.mstats{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.mod details summary{cursor:pointer;font-size:12.5px;color:var(--accent)}
.rib .rib,.ribs .rib{background:var(--bg)}
.rib{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rib>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rib header b{font-family:var(--f-disp);font-weight:700;font-size:16px}
.rib header span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rib svg{width:100%;height:auto;max-height:170px;display:block}
.rib details summary{cursor:pointer;font-size:12.5px;color:var(--accent)}
.ords{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:2px 10px;font-family:var(--f-mono);font-size:11.5px;margin-top:6px}
.ords.two{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.ords span{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);font-variant-numeric:tabular-nums}
.ords i{font-style:normal;color:var(--muted)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
ol.steps li::marker{font-family:var(--f-mono);color:var(--muted)}
.dl{display:flex;gap:6px;flex-wrap:wrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width: 860px){
  #app{height:auto;display:block}
  main{display:block}
  #view{position:sticky;top:env(safe-area-inset-top,0px);height:48vh;z-index:3;border-bottom:1px solid var(--line)}
  #panel{border-left:0}
  .tabs{position:sticky;top:calc(48vh + env(safe-area-inset-top,0px));background:var(--panel);z-index:2}
  .tabbody{overflow:visible}
  .brand .bs{display:none}
  .axes{display:none}
}
@media (max-width: 420px){
  .fld{grid-template-columns:78px minmax(0,1fr) 80px;gap:8px}
  .adds{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span class="bn">Rampsmith</span><span class="bs">Boolean ramp modeler with coping and framing</span></div>
    <label class="pick">Start from
      <select id="preset">
        <option value="">Choose a template…</option>
        <option value="mini">Mini ramp · 3′ tall, 6′ radius</option>
        <option value="qp">Quarterpipe · 4′ tall, 7′ radius</option>
        <option value="spine">Spine · 4′, 7′ radius</option>
        <option value="waves">Wave bowls · rolled lips and a volcano</option>
        <option value="funnel">Funnel pocket · cone cut</option>
        <option value="wave">Wave bank · NURBS cut</option>
        <option value="hump">Hump on a pad · NURBS fill</option>
        <option value="blank">Blank box</option>
      </select>
    </label>
    <div class="hbtns">
      <button id="vrBtn" type="button" class="vrb" hidden>Enter VR</button>
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <button id="saveDesign" type="button">Save design</button>
      <label class="btn" for="openDesign">Open design<input type="file" id="openDesign" accept=".json,application/json" hidden></label>
    </div>
    <div id="status" class="status" role="status">Loading…</div>
  </header>
  <main>
    <section id="view" aria-label="3D view">
      <div class="vtools">
        <div class="seg" id="viewmode" role="group" aria-label="View">
          <button type="button" data-view="model" class="on">Model</button>
          <button type="button" data-view="framing">Framing</button>
        </div>
        <label class="chip"><input type="checkbox" id="showCut"> Show cutters</label>
        <label class="chip" id="fastChip" hidden><input type="checkbox" id="showFast" checked> Screws</label>
        <span class="spacer"></span>
        <button type="button" class="chip" id="fit">Fit view</button>

function stickSVGFile(){
  const gap=4,parts=[];let x=gap,y=gap,rowH=0,W=0;
  const put=(w,h,fn)=>{if(x+w>Math.max(144,w+gap*2)&&x>gap){x=gap;y+=rowH+gap+3;rowH=0;}fn(x,y);x+=w+gap;rowH=Math.max(rowH,h);W=Math.max(W,x);};
  const poly=pts=>`<polygon points="${pts.join(' ')}" fill="none" stroke="#000" stroke-width="0.04"/>`;
  const frame=(label,sp,S)=>{const w=sp.ub-sp.ua,h=sp.h+1;put(w,h,(x0,y0)=>{const T=(u,yy)=>`${(x0+u-sp.ua).toFixed(3)},${(y0+h-yy).toFixed(3)}`;
    parts.push(`<g><text x="${x0.toFixed(2)}" y="${(y0-.6).toFixed(2)}" font-size="2" font-family="sans-serif">${label}</text>`);
    if(S){parts.push(poly([[sp.ua,0],[sp.ub,0],[sp.ub,1.5],[sp.ua,1.5]].map(p=>T(...p))));
      for(const p of S.posts)parts.push(poly([[p.u-1.75,1.5],[p.u+1.75,1.5],[p.u+1.75,p.yr],[p.u-1.75,p.yl]].map(q=>T(...q))));
      for(const c of S.chords){parts.push(poly(c.outline.map(q=>T(...q))));const mu=(c.Ab[0]+c.Bb[0])/2,my=(c.Ab[1]+c.a[1])/2,[tx,ty]=T(mu,my).split(',');parts.push(`<text x="${tx}" y="${ty}" font-size="1.6" font-family="sans-serif" text-anchor="middle">${c.part&&c.part.g?c.part.g.label:''}</text>`);}}
    else parts.push(poly([[sp.ua,0],...sp.top,[sp.ub,0]].map(q=>T(...q))));
    parts.push('</g>');});};
  for(const m of FR.mods){for(const g of m.groups)if(g.sp.stick)frame(`Rib ${g.name} x${g.items.length}`,g.sp,g.sp.stick);
    m.rims.forEach((p,i)=>p.rib.spans.forEach(sp=>frame(`Rim ${m.letter} panel ${i+1}`,sp,sp.stick||null)));}
  const H=y+rowH+gap;
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${W.toFixed(2)}in" height="${H.toFixed(2)}in" viewBox="0 0 ${W.toFixed(2)} ${H.toFixed(2)}">\n<!-- Rampsmith rib and rim layouts, full size (1 unit = 1 inch). Assemble each frame over its outline. -->\n${parts.join('\n')}\n</svg>`;
}

  for(const m of FR.mods)for(const g of m.pgroups||[]){const p=g.ex,n=[];if(p.rip>=1)n.push(`rip top ${angR(p.rip)}`+(p.kind==='rimchord'?` low toward ${p.lowSeam?'seam':'inside'}`:''));if(p.sag>=1/16)n.push('curve top '+d16(p.sag));if(p.ripTo)n.push('rip to '+d16(p.ripTo)+' wide');if(p.notch)n.push('notch at rim corner');if(p.proud)n.push('plane top '+d16(p.proud));

$('#partChip').addEventListener('click',e=>{if(e.target.closest('[data-partx]'))showPart(null);});
$('#fit').addEventListener('click',fitView);

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function setRay(ev){const r=renderer.domElement.getBoundingClientRect();mouse.x=((ev.clientX-r.left)/r.width)*2-1;mouse.y=-((ev.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);}
function pickEdge(){if(!edgeGroup.visible)return-1;const d=camera.position.distanceTo(controls.target);ray.params.Line.threshold=Math.max(1.5,d*.012);const h=ray.intersectObjects(edgeGroup.children,false)[0];return h?h.object.userData.ci:-1;}
let drag=null,down=null;
view.addEventListener('pointerdown',ev=>{
  if(ev.target!==renderer.domElement)return;
  down={x:ev.clientX,y:ev.clientY};setRay(ev);
  if(cpMeshes.length){const h=ray.intersectObjects(cpMeshes,false)[0];if(h){const{uid,k}=h.object.userData;const op=state.ops.find(o=>o.uid===uid);
    const n=new THREE.Vector3();camera.getWorldDirection(n);n.y=0;if(n.lengthSq()<1e-6)n.set(0,0,1);n.normalize();
    drag={op,k,plane:new THREE.Plane().setFromNormalAndCoplanarPoint(n,h.object.position.clone()),pid:ev.pointerId};controls.enabled=false;
    selectPoint(uid,k,true);ev.preventDefault();}}
},true);
window.addEventListener('pointermove',ev=>{
  if(drag){setRay(ev);const p=new THREE.Vector3();if(ray.ray.intersectPlane(drag.plane,p)){const h=Math.round((p.y-(drag.op.lift||0))*4)/4;const pt=drag.op.pts[drag.k];if(pt.h!==h){pt.h=h;
    body.querySelectorAll(`[data-path="op.${drag.op.uid}.pts.${drag.k}.h"]`).forEach(el=>el.value=el.type==='number'?numStr(h):h);const ft=body.querySelector(`[data-ft="op.${drag.op.uid}.pts.${drag.k}.h"]`);if(ft)ft.textContent=fft(h);
    updateGhost();scheduleRebuild();}}return;}
  if(ev.target===renderer.domElement&&!ev.buttons&&state.ui.tab==='coping'){setRay(ev);setHover(pickEdge());}
});
window.addEventListener('pointerup',ev=>{
  if(drag){drag=null;controls.enabled=true;pushHist();return;}
  if(!down||ev.target!==renderer.domElement){down=null;return;}
  const moved=Math.hypot(ev.clientX-down.x,ev.clientY-down.y);down=null;
  if(moved<6&&state.ui.tab==='coping'){setRay(ev);const ci=pickEdge();if(ci>=0){state.ui.etool==='fillet'?addFillet(ci):toggleRun(ci);}}
  else if(moved<6&&state.ui.view==='framing'&&FR){setRay(ev);const p=pickPart();showPart(p&&p!==state.ui.part?p:null);}
});
renderer.domElement.addEventListener('pointerleave',()=>{if(!drag)setHover(-1);});

/* ---------- theme ---------- */
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- boot ---------- */
function afterLoad(fit){
  $('#showCut').checked=!!state.ui.showCut;
  if(!state.ui.view)state.ui.view='model';
  refreshTab();updateGhost();syncView();if(fit)pendingFit=true;runRebuild();
}
let saved=null;try{saved=localStorage.getItem(LS);}catch(e){}
if(saved){try{state=null;restore(saved,false);}catch(e){saved=null;}}
if(!saved)loadPreset('mini');
state.ui.view='model';
lastSnap=snapshot();
resize();applyTheme();afterLoad(true);
})();

</script>
<script src="../updated.js"></script>
</body>
</html>
