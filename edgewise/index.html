<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Edgewise XR</title>
<style>

  #title small{display:block;font:600 12px system-ui,sans-serif;opacity:.7;max-width:520px}
  #menu2d{position:fixed;left:12px;top:12px;width:340px;border:3px solid #111;border-radius:14px;box-shadow:5px 5px 0 #111;background:#FFF6E5;z-index:5;touch-action:none}
  #status{font-weight:600}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar"><span id="status"></span><button id="drag" title="What dragging on the page does"></button><button id="vr" disabled>Enter VR</button><button id="mr" disabled>Enter MR</button></div>
<div id="title">Edgewise XR<small id="help"></small></div>
<script src="polygon-clipping.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import * as C from './core.js';
import { joinSolids } from './join.js';

const V3 = THREE.Vector3, $ = s => document.querySelector(s);
const toV = a => new V3(a[0], a[1], a[2]), toA = v => [v.x, v.y, v.z];

// ======================================================================
// Settings and the sketch
// ======================================================================
const SET_KEY = 'edgewise:set', SK_KEY = 'edgewise:sketch', LIB_KEY = 'edgewise:lib';
const S = Object.assign({ join: true, tags: true, tool: 'draw', tab: 'draw', snap: 6, square: true, sqDeg: 10, floor: true, slide: false, strokes: true, points: true, hand: 'right' },
  (() => { try { return JSON.parse(localStorage.getItem(SET_KEY)) || {}; } catch (e) { return {}; } })());
const saveSet = () => { try { localStorage.setItem(SET_KEY, JSON.stringify(S)); } catch (e) {} };
let sk = (() => { try { const j = JSON.parse(localStorage.getItem(SK_KEY)); if (j && j.v) return j; } catch (e) {} return null; })();
const firstRun = !sk;
if (!sk) sk = C.emptySketch();
let saveT = 0;
const saveSketch = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(SK_KEY, JSON.stringify(sk)); } catch (e) {} }, 250); };

// undo: whole-sketch snapshots (they're small)
const undoS = [], redoS = [];
const snap = () => JSON.stringify(sk);
function pushUndo(s){ undoS.push(s || snap()); if (undoS.length > 120) undoS.shift(); redoS.length = 0; }
function undo(){ if (!undoS.length) return flash('Nothing to undo'); redoS.push(snap()); sk = JSON.parse(undoS.pop()); afterEdit(); flash('Undo'); }
function redo(){ if (!redoS.length) return flash('Nothing to redo'); undoS.push(snap()); sk = JSON.parse(redoS.pop()); afterEdit(); flash('Redo'); }

// ======================================================================
// Three.js scene
// ======================================================================
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
const scene = new THREE.Scene();
const BG = new THREE.Color('#E9E4DA');
scene.background = BG;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 200);
camera.position.set(1.9, 1.7, 1.6);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.3, -0.6);
// On the flat page, dragging either turns the view or uses the tool (draw, grab, erase). In the Quest browser, before
// you go into the headset view, the controller is a one-button mouse, so there it starts on turning the view.
const onQuestPage = /OculusBrowser|Quest/i.test(navigator.userAgent) || matchMedia('(pointer: coarse)').matches;
let dragDraws = (() => { try { const v = localStorage.getItem('edgewise:dragDraws'); return v === null ? !onQuestPage : v === '1'; } catch (e) { return !onQuestPage; } })();
function applyDragMode(){
  orbit.mouseButtons = { LEFT: dragDraws ? null : THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
  orbit.touches = { ONE: dragDraws ? null : THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
  const b = document.querySelector('#drag');
  b.textContent = dragDraws ? '✏️ Dragging draws' : '↻ Dragging turns the view'; b.classList.toggle('on', dragDraws);
  document.querySelector('#help').textContent = dragDraws
    ? 'Dragging uses the tool: Draw starts on the floor or on the face you start on (hold Shift for an upright line). Right-drag turns the view, wheel zooms. Grab tool + Alt on a face pulls it out as a block. Ctrl+Z undoes.'
    : 'Dragging turns the view, wheel or thumbstick zooms. Tap the button at the top to draw instead. Holes and Lock still work with a tap.';
}
document.querySelector('#drag').onclick = () => { dragDraws = !dragDraws; try { localStorage.setItem('edgewise:dragDraws', dragDraws ? '1' : '0'); } catch (e) {} applyDragMode(); };
applyDragMode();
orbit.update();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8070, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(2, 4, 3); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-3, 1, -2); scene.add(fill);

// everything you make lives in "world", which you can grab, turn and scale; 1 unit = 1 m at 1:1
const world = new THREE.Group(); scene.add(world);
const floorGrid = new THREE.GridHelper(6, 30, 0x9a907f, 0xc9c0b0); floorGrid.material.transparent = true; floorGrid.material.opacity = 0.7; world.add(floorGrid);
const ws = () => world.scale.x;
// in the headset the session is always MR-capable, so "VR" draws its own backdrop and floor over the room
const backdrop = new THREE.Mesh(new THREE.SphereGeometry(80, 32, 16), new THREE.MeshBasicMaterial({ color: BG, side: THREE.BackSide, depthWrite: false }));
backdrop.renderOrder = -10; backdrop.frustumCulled = false;
const floorFill = new THREE.Mesh(new THREE.CircleGeometry(40, 48), new THREE.MeshStandardMaterial({ color: '#D8CFBF', roughness: 1, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 }));
floorFill.rotation.x = -Math.PI / 2; floorFill.position.y = -0.002; floorFill.renderOrder = -9;
scene.add(backdrop, floorFill);

// bold playground colours, one per piece
const PAL = ['#FF3B30', '#1E5EFF', '#FFC400', '#18B85C', '#FF8A00', '#9B4DFF', '#00B8D9', '#FF2D95'];
// colour by the order pieces were started (their oldest corner), so a piece keeps its colour as you add to it
let colorCache = null;
function pieceColor(F, pc){
  if (!colorCache || colorCache.F !== F){
    const minId = new Map(); for (const [id, c] of F.comp) if (!minId.has(c) || id < minId.get(c)) minId.set(c, id);
    const order = [...minId.entries()].sort((a, b) => a[1] - b[1]).map(x => x[0]);
    colorCache = { F, idx: new Map(order.map((c, i) => [c, i])) };
  }
  return PAL[(colorCache.idx.get(pc) || 0) % PAL.length];
}

const faceMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.75, metalness: 0, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const holeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false });
const faceMesh = new THREE.Mesh(new THREE.BufferGeometry(), faceMat), holeMesh = new THREE.Mesh(new THREE.BufferGeometry(), holeMat);
world.add(faceMesh, holeMesh);
const MAXI = 4096;
const edgeInst = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 8, 1, true), new THREE.MeshBasicMaterial({ color: 0xffffff }), MAXI);
const cornInst = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 14, 10), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }), MAXI);
edgeInst.count = cornInst.count = 0; edgeInst.frustumCulled = cornInst.frustumCulled = false;
const seamInst = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 6, 1, true), new THREE.MeshBasicMaterial({ color: 0x141414 }), MAXI);
seamInst.count = 0; seamInst.frustumCulled = false; world.add(seamInst);
// Join: worked out from what's on screen, at most about ten times a second while things move
let joinCache = { F: null, at: 0, J: null };
function joinFor(M){
  if (!S.join || !window.polygonClipping) return null;
  const now = performance.now(), moving = !!drag || !!preview || gliding;
  if (joinCache.F === M.F && (!moving || now - joinCache.at < 100)) return joinCache.J;
  let J = null;
  try { J = joinSolids(M.sk, M.F, M.P, window.polygonClipping); } catch (e) { J = null; }
  joinCache = { F: M.F, at: now, J };
  return J;
}
let gliding = false;
world.add(edgeInst, cornInst);
const strokeLines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0x3b3a36, transparent: true, opacity: 0.35 }));
world.add(strokeLines);
const liveBuf = new Float32Array(3 * 4000);
const liveGeo = new THREE.BufferGeometry(); liveGeo.setAttribute('position', new THREE.BufferAttribute(liveBuf, 3)); liveGeo.setDrawRange(0, 0);
const liveLine = new THREE.Line(liveGeo, new THREE.LineBasicMaterial({ color: 0x111111 })); liveLine.frustumCulled = false; world.add(liveLine);

// ======================================================================
// Build: sketch → faces → solved corners
// ======================================================================
let F = null, X = {}, D = {};         // faces, solved corners, corners as drawn on screen (they glide to X)
let preview = null;                     // while drawing: the sketch as it would be with this stroke
let dragF = null;                       // faces held still while you drag
function solveOpts(extra){
  const k = 1 / ws();
  return Object.assign({ square: S.square, squareDeg: S.sqDeg, floor: S.floor, floorR: 0.05 * k, flat: 1, minTol: 0.015 * k, rel: 0.18, iters: 60 }, extra);
}
function rebuild(){
  if (!sk.locks) sk.locks = [];
  if (!sk.open) sk.open = [];
  const o = C.build(sk, solveOpts({ warm: X, iters: sk.locks.length ? 120 : 60 }));
  F = o.F; X = o.X;
  for (const v of sk.v) if (!D[v.id]) D[v.id] = (preview && preview.P[v.id]) || X[v.id];
  for (const id in D) if (!X[id]) delete D[id];
  strokesDirty = true; menuDirty = true;
  if (sel.a && !faceByKey(sel.a)) sel = { a: null, b: null };
  if (sel.b && !faceByKey(sel.b)) sel.b = null;
}
function afterEdit(){ rebuild(); saveSketch(); }

// ======================================================================
// Drawing the model
// ======================================================================
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), UP = new V3(0, 1, 0), tmpC = new THREE.Color();
let strokesDirty = true;
let hover = null;              // { kind: 'vert'|'edge'|'face', id / key }
let eraseMarks = new Set(), eraseMarksV = new Set();
function drawModel(){
  const M = preview ? { sk: preview.sk, F: preview.F, P: preview.P, newEdge: preview.edge } : { sk, F, P: D };
  if (!M.F) return;
  const k = 1 / ws();
  const J = joinFor(M);
  // faces: each one a flat polygon of any number of sides (filled for display only)
  const pos = [], col = [], nrm = [], hpos = [];
  const colorOf = pc => pieceColor(M.F, J ? (J.group.get(pc) ?? pc) : pc);
  for (const f of M.F.faces){
    if (J && J.replaced.has(f.key)) continue;     // drawn trimmed, below
    const P = f.all.map(id => M.P[id]);
    if (P.some(p => !p)) continue;
    const pl = C.planeOf(P.slice(0, f.ids.length)), [u, w] = C.basis(pl.n);
    const c2 = P.map(p => { const d = C.V.sub(p, pl.c); return new THREE.Vector2(C.V.dot(d, u), C.V.dot(d, w)); });

    let tris, at = f.ids.length;
    const holes2 = f.holes.map(H => { const r = c2.slice(at, at + H.length); at += H.length; return r; });
    try { tris = THREE.ShapeUtils.triangulateShape(c2.slice(0, f.ids.length), holes2); } catch (e) { continue; }
    const out = f.open ? hpos : pos;
    tmpC.set(colorOf(f.piece));
    if (S.tool === 'lock' && sel.a === f.key) tmpC.lerp(new THREE.Color('#FFF27A'), 0.6);
    else if (S.tool === 'lock' && sel.b === f.key) tmpC.lerp(new THREE.Color('#FF8A00'), 0.6);
    else if (hover && hover.kind === 'face' && hover.key === f.key && !preview) tmpC.lerp(new THREE.Color('#FFFFFF'), 0.4);
    for (const t of tris){
      // every triangle wound the same way as the face, with the face's own normal, so it shades as one flat face
      const [i0, i1, i2] = t, nn = C.V.cross(C.V.sub(P[i1], P[i0]), C.V.sub(P[i2], P[i0])), tt = C.V.dot(nn, pl.n) < 0 ? [i0, i2, i1] : t;
      for (const i of tt){ out.push(...P[i]); if (!f.open){ col.push(tmpC.r, tmpC.g, tmpC.b); nrm.push(...pl.n); } }
    }
  }
  // faces of solids that overlap, trimmed to what's outside the others
  let sn = 0;
  if (J) for (const f of J.faces){
    const [u, w] = C.basis(f.n), o = f.rings[0][0], to2 = p => { const d = C.V.sub(p, o); return new THREE.Vector2(C.V.dot(d, u), C.V.dot(d, w)); };
    const all = f.rings.flat(), c2 = f.rings.map(r => r.map(to2));
    let tris; try { tris = THREE.ShapeUtils.triangulateShape(c2[0], c2.slice(1)); } catch (e) { continue; }
    tmpC.set(colorOf(f.piece));
    for (const t of tris){
      const [i0, i1, i2] = t, nn = C.V.cross(C.V.sub(all[i1], all[i0]), C.V.sub(all[i2], all[i0])), tt = C.V.dot(nn, f.n) < 0 ? [i0, i2, i1] : t;
      for (const i of tt){ pos.push(...all[i]); col.push(tmpC.r, tmpC.g, tmpC.b); nrm.push(...f.n); }
    }
    // the seams where solids meet, drawn like lines
    for (const r of f.rings) for (let i = 0; i < r.length && sn < MAXI; i++){
      const A = toV(r[i]), B = toV(r[(i + 1) % r.length]), L = A.distanceTo(B); if (L < 1e-5) continue;
      tmpQ.setFromUnitVectors(UP, B.clone().sub(A).normalize());
      tmpM.compose(A.add(B).multiplyScalar(0.5), tmpQ, new V3(0.003 * k, L, 0.003 * k)); seamInst.setMatrixAt(sn++, tmpM);
    }
  }
  seamInst.count = sn; seamInst.instanceMatrix.needsUpdate = true;
  setGeo(faceMesh.geometry, pos, col, nrm); setGeo(holeMesh.geometry, hpos, null);
  // edges
  const r = 0.0038 * k;
  let n = 0;
  for (const e of M.sk.e){
    const a = M.P[e.a], b = M.P[e.b]; if (!a || !b || n >= MAXI) continue;
    const A = toV(a), B = toV(b), L = A.distanceTo(B);
    tmpQ.setFromUnitVectors(UP, B.clone().sub(A).normalize());
    tmpM.compose(A.add(B).multiplyScalar(0.5), tmpQ, new V3(r, L, r));
    edgeInst.setMatrixAt(n, tmpM);
    const use = M.F.edgeUse.get(e.id) || 0;
    let c = use ? '#141414' : '#FF2D95';
    if (e.id === M.newEdge) c = '#1E5EFF';
    if (eraseMarks.has(e.id)) c = '#FF3B30';
    if (hover && hover.kind === 'edge' && hover.id === e.id) c = '#FFD60A';
    edgeInst.setColorAt(n++, tmpC.set(c));
  }
  edgeInst.count = n; edgeInst.instanceMatrix.needsUpdate = true; if (edgeInst.instanceColor) edgeInst.instanceColor.needsUpdate = true;
  // corners: the control points
  n = 0;
  if (S.points || preview){
    const deg = new Map(); for (const e of M.sk.e){ deg.set(e.a, (deg.get(e.a) || 0) + 1); deg.set(e.b, (deg.get(e.b) || 0) + 1); }
    for (const v of M.sk.v){
      const p = M.P[v.id]; if (!p || n >= MAXI) continue;
      const hot = hover && ((hover.kind === 'vert' && hover.id === v.id) || (hover.kind === 'face' && hover.ids?.includes(v.id)) || (hover.kind === 'edge' && hover.ids?.includes(v.id)));
      const rr = (hot ? 0.012 : 0.0085) * k;
      tmpM.compose(toV(p), tmpQ.identity(), new V3(rr, rr, rr)); cornInst.setMatrixAt(n, tmpM);
      cornInst.setColorAt(n++, tmpC.set(eraseMarksV.has(v.id) ? '#FF3B30' : hot ? '#FFD60A' : (deg.get(v.id) || 0) < 2 ? '#FF2D95' : v.pin ? '#2EC4B6' : '#FFFFFF'));
    }
  }
  cornInst.count = n; cornInst.instanceMatrix.needsUpdate = true; if (cornInst.instanceColor) cornInst.instanceColor.needsUpdate = true;
  if (strokesDirty){
    strokesDirty = false;
    const sp = [];
    for (const s of sk.s) for (let i = 1; i < s.p.length; i++) sp.push(...s.p[i - 1], ...s.p[i]);
    setGeo(strokeLines.geometry, sp, null);
  }
  strokeLines.visible = S.strokes;
  drawBadges(M);
}
// little tags on locked faces and locked angles
const badgeGroup = new THREE.Group(); world.add(badgeGroup);
const badgeTex = new Map();
function badgeMat(text, bg){
  const k = text + bg; if (badgeTex.has(k)) return badgeTex.get(k);
  const c = document.createElement('canvas'); c.width = 256; c.height = 96; const g = c.getContext('2d');
  g.fillStyle = '#111'; g.beginPath(); g.roundRect(6, 8, 244, 84, 22); g.fill();
  g.fillStyle = bg; g.beginPath(); g.roundRect(2, 2, 242, 82, 22); g.fill(); g.lineWidth = 5; g.strokeStyle = '#111'; g.stroke();
  g.fillStyle = '#111'; g.font = '900 44px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 123, 46);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.SpriteMaterial({ map: t, transparent: true });
  badgeTex.set(k, m); return m;
}
function drawBadges(M){
  const want = [];
  const byKey = new Map(M.F.faces.map(f => [f.key, f]));
  for (const L of M.sk.locks || []){
    if (L.f){
      const f = byKey.get(L.f); if (!f || f.ids.some(id => !M.P[id])) continue;
      const pl = C.planeOf(f.ids.map(id => M.P[id]));
      want.push({ at: pl.c, text: L.mode === 'level' ? 'LEVEL' : L.mode === 'upright' ? 'UPRIGHT' : 'HELD', bg: PINK });
    } else {
      const A = byKey.get(L.a), B = byKey.get(L.b); if (!A || !B) continue;
      const g = C.faceAngle(A.ids, B.ids, M.P); if (!g) continue;
      const mid = C.V.mul(C.V.add(M.P[g.se[0]], M.P[g.se[1]]), 0.5), into = C.V.norm(C.V.add(g.dA, g.dB));
      want.push({ at: C.V.add(mid, C.V.mul(into, 0.06 / ws())), text: Math.round(g.deg) + '°', bg: L.mode === 'step' ? '#2EC4B6' : YEL });
    }
  }
  while (badgeGroup.children.length > want.length) badgeGroup.remove(badgeGroup.children[badgeGroup.children.length - 1]);
  while (badgeGroup.children.length < want.length){ const sp = new THREE.Sprite(); sp.renderOrder = 20; badgeGroup.add(sp); }
  // a tag stands a little off its face toward you, and grows and shrinks with the model
  const eye = toA(world.worldToLocal(camera.getWorldPosition(new V3())));
  want.forEach((w, i) => { const sp = badgeGroup.children[i]; sp.material = badgeMat(w.text, w.bg); const t = C.V.mul(C.V.norm(C.V.sub(eye, w.at)), 0.03); sp.position.set(...C.V.add(w.at, t)); sp.scale.set(0.11, 0.041, 1); });
  badgeGroup.visible = S.tags;
}
function setGeo(g, pos, col, nrm){
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  if (col) g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  if (nrm) g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  else if (pos.length) g.computeVertexNormals();
  g.computeBoundingSphere();
}

// ======================================================================
// Picking (model space)
// ======================================================================
function pickVert(p, r){
  let best = null, bd = r;
  for (const v of sk.v){ const q = D[v.id]; if (!q) continue; const d = C.V.dist(p, q); if (d < bd){ bd = d; best = { kind: 'vert', id: v.id, ids: [v.id], d }; } }
  return best;
}
function segDist(p, a, b){ const ab = C.V.sub(b, a), t = Math.max(0, Math.min(1, C.V.dot(C.V.sub(p, a), ab) / (C.V.dot(ab, ab) || 1))); return C.V.dist(p, C.V.add(a, C.V.mul(ab, t))); }
function pickEdge(p, r){
  let best = null, bd = r;
  for (const e of sk.e){ const a = D[e.a], b = D[e.b]; if (!a || !b) continue; const d = segDist(p, a, b); if (d < bd){ bd = d; best = { kind: 'edge', id: e.id, ids: [e.a, e.b], d }; } }
  return best;
}
function facePoly(f){
  const P = f.ids.map(id => D[id]), pl = C.planeOf(P), [u, w] = C.basis(pl.n), to2 = p => { const d = C.V.sub(p, pl.c); return [C.V.dot(d, u), C.V.dot(d, w)]; };
  return { P, pl, u, w, poly: P.map(to2), holes: f.holes.map(H => H.map(id => to2(D[id]))) };
}
const inFace = (q, fp) => inPoly(q, fp.poly) && !fp.holes.some(h => inPoly(q, h));
function inPoly(q, poly){ let ins = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){ const a = poly[i], b = poly[j]; if ((a[1] > q[1]) !== (b[1] > q[1]) && q[0] < (b[0] - a[0]) * (q[1] - a[1]) / (b[1] - a[1]) + a[0]) ins = !ins; } return ins; }
function pickFace(p, r){
  if (!F) return null;
  let best = null, bd = r;
  for (const f of F.faces){

const rc = new THREE.Raycaster();

    }

}
function toggleDrawErase(){

}
function setHover(hv){
  const k = hv ? hv.kind + (hv.id ?? hv.key) : '', cur = hover ? hover.kind + (hover.id ?? hover.key) : '';

// ======================================================================
// Computer: mouse
// ======================================================================
const ndc = new THREE.Vector2();
let mouse = null;   // { kind: 'draw'|'grab'|'erase', plane }
function mouseRay(e){
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  rc.setFromCamera(ndc, camera);
  const inv = new THREE.Matrix4().copy(world.matrixWorld).invert();
  const o = rc.ray.origin.clone().applyMatrix4(inv), d = rc.ray.direction.clone().transformDirection(inv).normalize();
  return { o: toA(o), d: toA(d), ray: rc.ray.clone() };
}
function screenOf(p){ const v = world.localToWorld(toV(p)).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight, v.z]; }
function cornerAtMouse(e, px = 16, plane){
  let best = null, bd = px;
  for (const v of sk.v){ const q = D[v.id]; if (!q) continue;
    if (plane && Math.abs(C.V.dot(plane.n, C.V.sub(q, plane.c))) > S.snap / 100 / ws()) continue; const s = screenOf(q); if (s[2] > 1) continue; const d = Math.hypot(s[0] - e.clientX, s[1] - e.clientY); if (d < bd){ bd = d; best = { kind: 'vert', id: v.id, ids: [v.id] }; } }
  return best;
}
function edgeAtMouse(e, px = 9){
  let best = null, bd = px;

    const a = D[ed.a], b = D[ed.b]; if (!a || !b) continue;
    const A = screenOf(a), B = screenOf(b), ab = [B[0] - A[0], B[1] - A[1]], L2 = ab[0] * ab[0] + ab[1] * ab[1];
    const t = L2 ? Math.max(0, Math.min(1, ((e.clientX - A[0]) * ab[0] + (e.clientY - A[1]) * ab[1]) / L2)) : 0;
    const d = Math.hypot(e.clientX - A[0] - ab[0] * t, e.clientY - A[1] - ab[1] * t);

  }
  return best;
}
function eraseMouse(e){ const v = cornerAtMouse(e, 10); if (v){ eraseMarksV.add(v.id); return; } const h = edgeAtMouse(e); if (h) eraseMarks.add(h.id); }
function planeHit(r, pl){ const dn = C.V.dot(r.d, pl.n); if (Math.abs(dn) < 1e-6) return null; const t = C.V.dot(C.V.sub(pl.c, r.o), pl.n) / dn; return t > 0 ? C.V.add(r.o, C.V.mul(r.d, t)) : null; }

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0 || renderer.xr.isPresenting) return;

  if (!dragDraws && (S.tool === 'draw' || S.tool === 'grab' || S.tool === 'erase')) return;

    else if (fh && !e.shiftKey){ start = fh.hit; pl = { n: fh.n, c: fh.c }; }

renderer.domElement.addEventListener('pointermove', e => {

addEventListener('keydown', e => {

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ======================================================================
// Entering the headset
// ======================================================================
const vrBtn = $('#vr'), mrBtn = $('#mr'), status = $('#status');
let arOK = false, mrOn = false, sessionAR = false;

async function setupButtons(){

  const [vr, ar] = await Promise.all([navigator.xr.isSessionSupported('immersive-vr').catch(() => false), navigator.xr.isSessionSupported('immersive-ar').catch(() => false)]);

vrBtn.onclick = () => start('immersive-vr');

// ======================================================================
// Loop
// ======================================================================
const clock = new THREE.Clock();
let menuT = 0;
renderer.setAnimationLoop(() => {
