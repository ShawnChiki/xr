<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Edgewise XR</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#E9E4DA;font:600 14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:#111}
  canvas#gl{display:block;width:100%;height:100%;touch-action:none}
  #bar{position:fixed;top:12px;right:12px;display:flex;gap:10px;align-items:center;z-index:5}
  #bar button{font:800 15px system-ui,sans-serif;padding:10px 16px;border:3px solid #111;border-radius:10px;background:#FFD60A;box-shadow:4px 4px 0 #111;cursor:pointer}
  #bar button:disabled{opacity:.45;cursor:default}
  #bar button#mr{background:#2EC4B6}
  #title{position:fixed;left:12px;bottom:10px;font:900 20px system-ui,sans-serif;letter-spacing:.02em;z-index:5;pointer-events:none}
  #title small{display:block;font:600 12px system-ui,sans-serif;opacity:.7;max-width:520px}
  #menu2d{position:fixed;left:12px;top:12px;width:340px;border:3px solid #111;border-radius:14px;box-shadow:5px 5px 0 #111;background:#FFF6E5;z-index:5;touch-action:none}
  #status{font-weight:600}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar"><span id="status"></span><button id="vr" disabled>Enter VR</button><button id="mr" disabled>Enter MR</button></div>
<div id="title">Edgewise XR<small>Left-drag draws a line (on the floor, or on the face you start on; hold Shift for an upright line). Right-drag turns the view, wheel zooms. Ctrl+Z undoes.</small></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import * as C from './core.js';

const V3 = THREE.Vector3, $ = s => document.querySelector(s);
const toV = a => new V3(a[0], a[1], a[2]), toA = v => [v.x, v.y, v.z];

// ======================================================================
// Settings and the sketch
// ======================================================================
const SET_KEY = 'edgewise:set', SK_KEY = 'edgewise:sketch', LIB_KEY = 'edgewise:lib';
const S = Object.assign({ tool: 'draw', tab: 'draw', snap: 6, square: true, sqDeg: 10, floor: true, slide: false, strokes: true, points: true, hand: 'right' },
  (() => { try { return JSON.parse(localStorage.getItem(SET_KEY)) || {}; } catch (e) { return {}; } })());
const saveSet = () => { try { localStorage.setItem(SET_KEY, JSON.stringify(S)); } catch (e) {} };
let sk = (() => { try { const j = JSON.parse(localStorage.getItem(SK_KEY)); if (j && j.v) return j; } catch (e) {} return null; })();
const firstRun = !sk;
if (!sk) sk = C.emptySketch();
let saveT = 0;
const saveSketch = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(SK_KEY, JSON.stringify(sk)); } catch (e) {} }, 250); };

// undo: whole-sketch snapshots (they're small)
const undoS = [], redoS = [];
const snap = () => JSON.stringify(sk);
function pushUndo(s){ undoS.push(s || snap()); if (undoS.length > 120) undoS.shift(); redoS.length = 0; }
function undo(){ if (!undoS.length) return flash('Nothing to undo'); redoS.push(snap()); sk = JSON.parse(undoS.pop()); afterEdit(); flash('Undo'); }
function redo(){ if (!redoS.length) return flash('Nothing to redo'); undoS.push(snap()); sk = JSON.parse(redoS.pop()); afterEdit(); flash('Redo'); }

// ======================================================================
// Three.js scene
// ======================================================================
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
const scene = new THREE.Scene();
const BG = new THREE.Color('#E9E4DA');
scene.background = BG;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 200);
camera.position.set(1.9, 1.7, 1.6);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.3, -0.6);
orbit.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
orbit.update();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8070, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(2, 4, 3); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-3, 1, -2); scene.add(fill);

// everything you make lives in "world", which you can grab, turn and scale; 1 unit = 1 m at 1:1
const world = new THREE.Group(); scene.add(world);
const floorGrid = new THREE.GridHelper(6, 30, 0x9a907f, 0xc9c0b0); floorGrid.material.transparent = true; floorGrid.material.opacity = 0.7; world.add(floorGrid);
const ws = () => world.scale.x;

// bold playground colours, one per piece
const PAL = ['#FF3B30', '#1E5EFF', '#FFC400', '#18B85C', '#FF8A00', '#9B4DFF', '#00B8D9', '#FF2D95'];
// colour by the order pieces were started (their oldest corner), so a piece keeps its colour as you add to it
let colorCache = null;
function pieceColor(F, pc){
  if (!colorCache || colorCache.F !== F){
    const minId = new Map(); for (const [id, c] of F.comp) if (!minId.has(c) || id < minId.get(c)) minId.set(c, id);
    const order = [...minId.entries()].sort((a, b) => a[1] - b[1]).map(x => x[0]);
    colorCache = { F, idx: new Map(order.map((c, i) => [c, i])) };
  }
  return PAL[(colorCache.idx.get(pc) || 0) % PAL.length];
}

const faceMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.75, metalness: 0, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const holeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false });
const faceMesh = new THREE.Mesh(new THREE.BufferGeometry(), faceMat), holeMesh = new THREE.Mesh(new THREE.BufferGeometry(), holeMat);
world.add(faceMesh, holeMesh);
const MAXI = 4096;
const edgeInst = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 8, 1, true), new THREE.MeshBasicMaterial({ color: 0xffffff }), MAXI);
const cornInst = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 14, 10), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }), MAXI);
edgeInst.count = cornInst.count = 0; edgeInst.frustumCulled = cornInst.frustumCulled = false;
world.add(edgeInst, cornInst);
const strokeLines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0x3b3a36, transparent: true, opacity: 0.35 }));
world.add(strokeLines);
const liveBuf = new Float32Array(3 * 4000);
const liveGeo = new THREE.BufferGeometry(); liveGeo.setAttribute('position', new THREE.BufferAttribute(liveBuf, 3)); liveGeo.setDrawRange(0, 0);
const liveLine = new THREE.Line(liveGeo, new THREE.LineBasicMaterial({ color: 0x111111 })); liveLine.frustumCulled = false; world.add(liveLine);

// ======================================================================
// Build: sketch → faces → solved corners
// ======================================================================
let F = null, X = {}, D = {};         // faces, solved corners, corners as drawn on screen (they glide to X)
let preview = null;                     // while drawing: the sketch as it would be with this stroke
let dragF = null;                       // faces held still while you drag
function solveOpts(extra){
  const k = 1 / ws();
  return Object.assign({ square: S.square, squareDeg: S.sqDeg, floor: S.floor, floorR: 0.05 * k, flat: 1, minTol: 0.015 * k, rel: 0.18, iters: 60 }, extra);
}
function rebuild(){
  const o = C.build(sk, solveOpts({ warm: X }));
  F = o.F; X = o.X;
  for (const v of sk.v) if (!D[v.id]) D[v.id] = (preview && preview.P[v.id]) || X[v.id];
  for (const id in D) if (!X[id]) delete D[id];
  strokesDirty = true; menuDirty = true;
}
function afterEdit(){ rebuild(); saveSketch(); }

// ======================================================================
// Drawing the model
// ======================================================================
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), UP = new V3(0, 1, 0), tmpC = new THREE.Color();
let strokesDirty = true;
let hover = null;              // { kind: 'vert'|'edge'|'face', id / key }
let eraseMarks = new Set();
function drawModel(){
  const M = preview ? { sk: preview.sk, F: preview.F, P: preview.P, newEdge: preview.edge } : { sk, F, P: D };
  if (!M.F) return;
  const k = 1 / ws();
  // faces: each one a flat polygon of any number of sides (filled for display only)
  const pos = [], col = [], nrm = [], hpos = [];
  for (const f of M.F.faces){
    const P = f.ids.map(id => M.P[id]);
    if (P.some(p => !p)) continue;
    const pl = C.planeOf(P), [u, w] = C.basis(pl.n);
    const c2 = P.map(p => { const d = C.V.sub(p, pl.c); return new THREE.Vector2(C.V.dot(d, u), C.V.dot(d, w)); });
    let tris;
    try { tris = THREE.ShapeUtils.triangulateShape(c2, []); } catch (e) { continue; }
    const out = f.open ? hpos : pos;
    tmpC.set(pieceColor(M.F, f.piece));
    if (hover && hover.kind === 'face' && hover.key === f.key && !preview) tmpC.lerp(new THREE.Color('#FFF27A'), 0.55);
    for (const t of tris){
      // every triangle wound the same way as the face, with the face's own normal, so it shades as one flat face
      const [i0, i1, i2] = t, nn = C.V.cross(C.V.sub(P[i1], P[i0]), C.V.sub(P[i2], P[i0])), tt = C.V.dot(nn, pl.n) < 0 ? [i0, i2, i1] : t;
      for (const i of tt){ out.push(...P[i]); if (!f.open){ col.push(tmpC.r, tmpC.g, tmpC.b); nrm.push(...pl.n); } }
    }
  }
  setGeo(faceMesh.geometry, pos, col, nrm); setGeo(holeMesh.geometry, hpos, null);
  // edges
  const r = 0.0038 * k;
  let n = 0;
  for (const e of M.sk.e){
    const a = M.P[e.a], b = M.P[e.b]; if (!a || !b || n >= MAXI) continue;
    const A = toV(a), B = toV(b), L = A.distanceTo(B);
    tmpQ.setFromUnitVectors(UP, B.clone().sub(A).normalize());
    tmpM.compose(A.add(B).multiplyScalar(0.5), tmpQ, new V3(r, L, r));
    edgeInst.setMatrixAt(n, tmpM);
    const use = M.F.edgeUse.get(e.id) || 0;
    let c = use ? '#141414' : '#FF2D95';
    if (e.id === M.newEdge) c = '#1E5EFF';
    if (eraseMarks.has(e.id)) c = '#FF3B30';
    if (hover && hover.kind === 'edge' && hover.id === e.id) c = '#FFD60A';
    edgeInst.setColorAt(n++, tmpC.set(c));
  }
  edgeInst.count = n; edgeInst.instanceMatrix.needsUpdate = true; if (edgeInst.instanceColor) edgeInst.instanceColor.needsUpdate = true;
  // corners: the control points
  n = 0;
  if (S.points || preview){
    const deg = new Map(); for (const e of M.sk.e){ deg.set(e.a, (deg.get(e.a) || 0) + 1); deg.set(e.b, (deg.get(e.b) || 0) + 1); }
    for (const v of M.sk.v){
      const p = M.P[v.id]; if (!p || n >= MAXI) continue;
      const hot = hover && ((hover.kind === 'vert' && hover.id === v.id) || (hover.kind === 'face' && hover.ids?.includes(v.id)) || (hover.kind === 'edge' && hover.ids?.includes(v.id)));
      const rr = (hot ? 0.012 : 0.0085) * k;
      tmpM.compose(toV(p), tmpQ.identity(), new V3(rr, rr, rr)); cornInst.setMatrixAt(n, tmpM);
      cornInst.setColorAt(n++, tmpC.set(hot ? '#FFD60A' : (deg.get(v.id) || 0) < 2 ? '#FF2D95' : v.pin ? '#2EC4B6' : '#FFFFFF'));
    }
  }
  cornInst.count = n; cornInst.instanceMatrix.needsUpdate = true; if (cornInst.instanceColor) cornInst.instanceColor.needsUpdate = true;
  if (strokesDirty){
    strokesDirty = false;
    const sp = [];
    for (const s of sk.s) for (let i = 1; i < s.p.length; i++) sp.push(...s.p[i - 1], ...s.p[i]);
    setGeo(strokeLines.geometry, sp, null);
  }
  strokeLines.visible = S.strokes;
}
function setGeo(g, pos, col, nrm){
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  if (col) g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  if (nrm) g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  else if (pos.length) g.computeVertexNormals();
  g.computeBoundingSphere();
}

// ======================================================================
// Picking (model space)
// ======================================================================
function pickVert(p, r){
  let best = null, bd = r;
  for (const v of sk.v){ const q = D[v.id]; if (!q) continue; const d = C.V.dist(p, q); if (d < bd){ bd = d; best = { kind: 'vert', id: v.id, ids: [v.id], d }; } }
  return best;
}
function segDist(p, a, b){ const ab = C.V.sub(b, a), t = Math.max(0, Math.min(1, C.V.dot(C.V.sub(p, a), ab) / (C.V.dot(ab, ab) || 1))); return C.V.dist(p, C.V.add(a, C.V.mul(ab, t))); }
function pickEdge(p, r){
  let best = null, bd = r;
  for (const e of sk.e){ const a = D[e.a], b = D[e.b]; if (!a || !b) continue; const d = segDist(p, a, b); if (d < bd){ bd = d; best = { kind: 'edge', id: e.id, ids: [e.a, e.b], d }; } }
  return best;
}
function facePoly(f){ const P = f.ids.map(id => D[id]); const pl = C.planeOf(P), [u, w] = C.basis(pl.n); return { P, pl, u, w, poly: P.map(p => { const d = C.V.sub(p, pl.c); return [C.V.dot(d, u), C.V.dot(d, w)]; }) }; }
function inPoly(q, poly){ let ins = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){ const a = poly[i], b = poly[j]; if ((a[1] > q[1]) !== (b[1] > q[1]) && q[0] < (b[0] - a[0]) * (q[1] - a[1]) / (b[1] - a[1]) + a[0]) ins = !ins; } return ins; }
function pickFace(p, r){
  if (!F) return null;
  let best = null, bd = r;
  for (const f of F.faces){
    if (f.ids.some(id => !D[id])) continue;
    const { pl, u, w, poly } = facePoly(f), d = C.V.sub(p, pl.c), h = Math.abs(C.V.dot(d, pl.n));
    if (h < bd && inPoly([C.V.dot(d, u), C.V.dot(d, w)], poly)){ bd = h; best = { kind: 'face', key: f.key, ids: f.ids.slice(), n: pl.n, c: pl.c, d: h }; }
  }
  return best;
}
// what a grab at p would take: a corner first, then an edge, then a face
function pickAny(p, r){ return pickVert(p, r) || pickEdge(p, r * 0.8) || pickFace(p, r); }
// ray (model space) against faces
function rayFace(o, dir){
  if (!F) return null;
  let best = null;
  for (const f of F.faces){
    if (f.ids.some(id => !D[id])) continue;
    const { pl, u, w, poly } = facePoly(f), dn = C.V.dot(dir, pl.n);
    if (Math.abs(dn) < 1e-6) continue;
    const t = C.V.dot(C.V.sub(pl.c, o), pl.n) / dn; if (t <= 0) continue;
    const hit = C.V.add(o, C.V.mul(dir, t)), d = C.V.sub(hit, pl.c);
    if (inPoly([C.V.dot(d, u), C.V.dot(d, w)], poly) && (!best || t < best.t)) best = { kind: 'face', key: f.key, ids: f.ids.slice(), n: pl.n, c: pl.c, t, hit };
  }
  return best;
}

// ======================================================================
// Strokes, erasing, holes, grabbing (shared by headset and computer)
// ======================================================================
let stroke = null;   // { pts: [[x,y,z]...] in model space }
let lastPrev = 0;
function strokeStart(p){ stroke = { pts: [p] }; liveGeo.setDrawRange(0, 0); pushLive(p); }
function pushLive(p){ const n = liveGeo.drawRange.count; if (n >= 4000) return; liveBuf.set(p, n * 3); liveGeo.setDrawRange(0, n + 1); liveGeo.attributes.position.needsUpdate = true; liveGeo.computeBoundingSphere(); }
function strokeMove(p){
  if (!stroke) return;
  const last = stroke.pts[stroke.pts.length - 1];
  if (C.V.dist(last, p) < 0.004 / ws()) return;
  stroke.pts.push(p); pushLive(p);
  const now = performance.now();
  if (now - lastPrev > 60){ lastPrev = now; updatePreview(); }
}
function updatePreview(){
  if (!stroke || stroke.pts.length < 3){ preview = null; return; }
  const psk = C.clone(sk), r = C.addStroke(psk, stroke.pts, D, { snapR: S.snap / 100 / ws() });
  if (!r.ok){ preview = null; return; }
  const o = C.build(psk, solveOpts({ warm: X, iters: 30 }));
  // new corners start where the stroke put them; the rest show where they'd settle
  preview = { sk: psk, F: o.F, P: o.X, edge: r.edge };
}
function strokeEnd(){
  if (!stroke) return;
  const pts = stroke.pts; stroke = null; liveGeo.setDrawRange(0, 0);
  if (pts.length < 3){ preview = null; return; }
  const before = snap();
  const r = C.addStroke(sk, pts, D, { snapR: S.snap / 100 / ws() });
  if (!r.ok){ preview = null; flash(r.why === 'too short' ? 'Too short for a line' : 'That runs along an edge already'); return; }
  pushUndo(before); afterEdit(); preview = null;
  const nf = F.faces.filter(f => f.ids.includes(r.a) && f.ids.includes(r.b)).length;
  flash(nf ? (nf === 1 ? 'Line in: it closed a face' : 'Line in: it closed ' + nf + ' faces') : 'Line in');
}
function eraseAt(p){
  const e = pickEdge(p, 0.025 / ws());
  if (e && !eraseMarks.has(e.id)){ eraseMarks.add(e.id); buzz(0.3, 20); }
}
function eraseEnd(){
  if (!eraseMarks.size) return;
  pushUndo(); C.removeEdges(sk, [...eraseMarks]); flash(eraseMarks.size === 1 ? 'Erased a line' : 'Erased ' + eraseMarks.size + ' lines'); eraseMarks.clear(); afterEdit();
}
function toggleHole(h){
  if (!h || h.kind !== 'face') return;
  pushUndo();
  const i = sk.open.indexOf(h.key);
  if (i >= 0){ sk.open.splice(i, 1); flash('Face closed'); } else { sk.open.push(h.key); flash('Face opened: it\'s a hole now'); }
  afterEdit();
}

// Grabbing a corner, edge or face. "frame" is where the hand (or mouse) was at the start: world position + rotation.
let drag = null;
function grabStart(h, frame){
  if (!h) return false;
  const P0 = {}; for (const id of h.ids) P0[id] = world.localToWorld(toV(D[id]));
  drag = { kind: h.kind, ids: h.ids, P0, f0: { p: frame.p.clone(), q: frame.q.clone() }, before: snap(), key: h.key };
  if (h.kind === 'face'){
    drag.c0 = world.localToWorld(toV(h.c));
    drag.n0 = toV(h.n).transformDirection(world.matrixWorld).normalize();
  }
  dragF = F;
  buzz(0.5, 30);
  return true;
}
function grabMove(frame){
  if (!drag) return;
  const T = frame.p.clone().sub(drag.f0.p), R = frame.q.clone().multiply(drag.f0.q.clone().invert());
  const targets = {};
  for (const id of drag.ids){
    let w;
    if (drag.kind === 'face'){
      // push along the face (and tilt with your wrist); slide too only if you asked for it
      const t = S.slide ? T : drag.n0.clone().multiplyScalar(T.dot(drag.n0));
      w = drag.P0[id].clone().sub(drag.c0).applyQuaternion(frame.noTilt ? tmpQ.identity() : R).add(drag.c0).add(t);
    } else w = drag.P0[id].clone().add(T);
    targets[id] = toA(world.worldToLocal(w));
  }
  drag.targets = targets;
  X = C.solve(sk, dragF, solveOpts({ drag: targets, warm: X, iters: 30 }));
  for (const id in X) D[id] = X[id];
}
function grabEnd(){
  if (!drag) return;
  if (drag.targets){
    // where you let go is where those corners stay (they no longer follow their strokes)
    for (const id of drag.ids){ const v = sk.v.find(x => x.id === id); if (v) v.pin = X[id].map(x => +x.toFixed(4)); }
    pushUndo(drag.before); afterEdit();
    flash(drag.kind === 'face' ? 'Face moved' : drag.kind === 'edge' ? 'Edge moved' : 'Corner moved');
  }
  drag = null; dragF = null;
}
function unpinAll(){
  if (!sk.v.some(v => v.pin)) return flash('Every corner already follows your strokes');
  pushUndo(); for (const v of sk.v) delete v.pin; afterEdit(); flash('Moved corners go back to your strokes');
}

// ======================================================================
// Menu: one canvas, on your left controller in the headset, at the top left on a computer
// ======================================================================
const MW = 768, MH = 1040, RAIL = 128;
const menuCanvas = document.createElement('canvas'); menuCanvas.width = MW; menuCanvas.height = MH; menuCanvas.id = 'menu2d';
document.body.appendChild(menuCanvas);
const mx = menuCanvas.getContext('2d'), menuTex = new THREE.CanvasTexture(menuCanvas); menuTex.colorSpace = THREE.SRGBColorSpace; menuTex.anisotropy = 4;
const MENU_W = 0.2, MENU_H = MENU_W * MH / MW, MENU_TILT = -1.2;
const menuMesh = new THREE.Mesh(new THREE.PlaneGeometry(MENU_W, MENU_H), new THREE.MeshBasicMaterial({ map: menuTex, side: THREE.DoubleSide, transparent: true }));
menuMesh.rotation.x = MENU_TILT; menuMesh.position.set(0, 0.035 + MENU_H / 2 * Math.cos(MENU_TILT), -0.035 + MENU_H / 2 * Math.sin(MENU_TILT));
menuMesh.visible = false; menuMesh.renderOrder = 10;
let menuDirty = true, menuHover = null, menuShown = true, flashText = '', flashT = 0, clearArmed = 0;
const BTN = [];
function flash(t, secs){ flashText = t; flashT = secs || 2.4; menuDirty = true; if (!renderer.xr.isPresenting) $('#status').textContent = t; }

const INK = '#111', CREAM = '#FFF6E5', BLUE = '#1E5EFF', YEL = '#FFD60A', PINK = '#FF2D95';
function rr(x, y, w, h, r){ mx.beginPath(); mx.moveTo(x + r, y); mx.arcTo(x + w, y, x + w, y + h, r); mx.arcTo(x + w, y + h, x, y + h, r); mx.arcTo(x, y + h, x, y, r); mx.arcTo(x, y, x + w, y, r); mx.closePath(); }
function button(x, y, w, h, label, act, on, opt = {}){
  const hot = menuHover && menuHover.x === x && menuHover.y === y;
  rr(x + 6, y + 6, w, h, 14); mx.fillStyle = INK; mx.fill();
  rr(x, y, w, h, 14); mx.fillStyle = on ? (opt.onColor || BLUE) : hot ? '#FFF27A' : opt.bg || '#FFFFFF'; mx.fill();
  mx.lineWidth = 5; mx.strokeStyle = INK; mx.stroke();

      if (Math.abs(sx) > 0.75 && !h.stickHeld){ h.stickHeld = true; const i = TOOLS.findIndex(t => t[0] === S.tool); S.tool = TOOLS[(i + (sx > 0 ? 1 : TOOLS.length - 1)) % TOOLS.length][0]; saveSet(); menuDirty = true; flash('Trigger: ' + TOOLS.find(t => t[0] === S.tool)[1]); }
      if (Math.abs(sx) < 0.3) h.stickHeld = false;
      // hover: show what grip would take
      if (!h.act && !drag && !onMenu){
        const hv = S.tool === 'hole' ? pickFace(p, reach * 1.5) : S.tool === 'erase' ? pickEdge(p, 0.025 / ws()) : S.tool === 'draw' ? pickVert(p, S.snap / 100 / ws()) : pickAny(p, reach);
        setHover(hv);
      }
      h.tip.material.color.set(S.tool === 'erase' ? '#FF3B30' : S.tool === 'hole' ? '#2EC4B6' : S.tool === 'grab' ? '#FFD60A' : '#111111');
    } else {
      if (down(4) || down(5)){ menuShown = !menuShown; placeMenu(); }
    }
    h.prev = b;
  }
  if (!menuHit && menuHover){ menuHover = null; menuDirty = true; }
  worldGrabMove();
}
function setHover(hv){
  const k = hv ? hv.kind + (hv.id ?? hv.key) : '', cur = hover ? hover.kind + (hover.id ?? hover.key) : '';
  if (k !== cur){ hover = hv; if (hv) buzz(0.15, 8); }
}

// ======================================================================
// Computer: mouse
// ======================================================================
const ndc = new THREE.Vector2();
let mouse = null;   // { kind: 'draw'|'grab'|'erase', plane }
function mouseRay(e){
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  rc.setFromCamera(ndc, camera);
  const inv = new THREE.Matrix4().copy(world.matrixWorld).invert();
  const o = rc.ray.origin.clone().applyMatrix4(inv), d = rc.ray.direction.clone().transformDirection(inv).normalize();
  return { o: toA(o), d: toA(d), ray: rc.ray.clone() };
}
function screenOf(p){ const v = world.localToWorld(toV(p)).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight, v.z]; }
function cornerAtMouse(e, px = 16, plane){
  let best = null, bd = px;
  for (const v of sk.v){ const q = D[v.id]; if (!q) continue;
    if (plane && Math.abs(C.V.dot(plane.n, C.V.sub(q, plane.c))) > S.snap / 100 / ws()) continue; const s = screenOf(q); if (s[2] > 1) continue; const d = Math.hypot(s[0] - e.clientX, s[1] - e.clientY); if (d < bd){ bd = d; best = { kind: 'vert', id: v.id, ids: [v.id] }; } }
  return best;
}
function edgeAtMouse(e, px = 9){
  let best = null, bd = px;
  for (const ed of sk.e){
    const a = D[ed.a], b = D[ed.b]; if (!a || !b) continue;
    const A = screenOf(a), B = screenOf(b), ab = [B[0] - A[0], B[1] - A[1]], L2 = ab[0] * ab[0] + ab[1] * ab[1];
    const t = L2 ? Math.max(0, Math.min(1, ((e.clientX - A[0]) * ab[0] + (e.clientY - A[1]) * ab[1]) / L2)) : 0;
    const d = Math.hypot(e.clientX - A[0] - ab[0] * t, e.clientY - A[1] - ab[1] * t);
    if (d < bd){ bd = d; best = { kind: 'edge', id: ed.id, ids: [ed.a, ed.b] }; }
  }
  return best;
}
function planeHit(r, pl){ const dn = C.V.dot(r.d, pl.n); if (Math.abs(dn) < 1e-6) return null; const t = C.V.dot(C.V.sub(pl.c, r.o), pl.n) / dn; return t > 0 ? C.V.add(r.o, C.V.mul(r.d, t)) : null; }
function camFacingUpright(c){ const d = new V3(); camera.getWorldDirection(d); d.applyQuaternion(world.quaternion.clone().invert()); d.y = 0; if (d.lengthSq() < 1e-6) d.set(0, 0, 1); d.normalize(); return { n: toA(d), c }; }
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0 || renderer.xr.isPresenting) return;
  const r = mouseRay(e);
  if (S.tool === 'draw'){
    // start on a corner, a face, or the floor; the line is drawn in a flat plane through that start
    const cv = cornerAtMouse(e), fh = rayFace(r.o, r.d);
    let start, pl;
    if (cv){ start = D[cv.id].slice(); pl = e.shiftKey ? camFacingUpright(start) : { n: [0, 1, 0], c: start }; }
    else if (fh && !e.shiftKey){ start = fh.hit; pl = { n: fh.n, c: fh.c }; }
    else { pl = { n: [0, 1, 0], c: [0, 0, 0] }; start = planeHit(r, pl); if (start && e.shiftKey) pl = camFacingUpright(start); }
    if (!start) return;
    mouse = { kind: 'draw', plane: pl }; strokeStart(start);
    renderer.domElement.setPointerCapture(e.pointerId);
  } else if (S.tool === 'grab'){
    const h = cornerAtMouse(e) || edgeAtMouse(e) || rayFace(r.o, r.d);
    if (!h) return;
    const p0 = h.kind === 'face' ? h.hit : D[h.ids[0]];
    const pl = h.kind === 'face' ? null : (e.shiftKey ? camFacingUpright(p0) : { n: [0, 1, 0], c: p0 });
    mouse = { kind: 'grab', plane: pl, p0, h, n: h.n };
    grabStart(h, { p: world.localToWorld(toV(p0)), q: new THREE.Quaternion() });
    renderer.domElement.setPointerCapture(e.pointerId);
  } else if (S.tool === 'erase'){ mouse = { kind: 'erase' }; const h = edgeAtMouse(e); if (h) eraseMarks.add(h.id); renderer.domElement.setPointerCapture(e.pointerId); }
  else if (S.tool === 'hole'){ toggleHole(rayFace(r.o, r.d)); }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (renderer.xr.isPresenting) return;
  const r = mouseRay(e);
  if (!mouse){
    setHover(S.tool === 'grab' ? (cornerAtMouse(e) || edgeAtMouse(e) || rayFace(r.o, r.d)) : S.tool === 'erase' ? edgeAtMouse(e) : S.tool === 'hole' ? rayFace(r.o, r.d) : cornerAtMouse(e));
    return;
  }
  if (mouse.kind === 'draw'){
    let p = planeHit(r, mouse.plane); if (!p) return;
    // the end clicks onto a corner under the mouse
    const cv = cornerAtMouse(e, 16, mouse.plane); if (cv) p = D[cv.id].slice();
    strokeMove(p);
  } else if (mouse.kind === 'grab'){
    let p;
    if (mouse.plane) p = planeHit(r, mouse.plane);
    else {
      // a face slides out and in along its normal: the point on that line closest to the mouse ray
      const n = mouse.n, w0 = C.V.sub(mouse.p0, r.o), b = C.V.dot(n, r.d), dd = C.V.dot(n, w0), e2 = C.V.dot(r.d, w0), den = 1 - b * b;
      const s = den > 1e-6 ? (b * e2 - dd) / den : 0; p = C.V.add(mouse.p0, C.V.mul(n, s));
    }
    if (p) grabMove({ p: world.localToWorld(toV(p)), q: new THREE.Quaternion(), noTilt: true });
  } else if (mouse.kind === 'erase'){ const h = edgeAtMouse(e); if (h) eraseMarks.add(h.id); }
});
addEventListener('pointerup', () => {
  if (!mouse) return;
  if (mouse.kind === 'draw') strokeEnd();
  if (mouse.kind === 'grab') grabEnd();
  if (mouse.kind === 'erase') eraseEnd();
  mouse = null;
});
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); }
  else if ('1234'.includes(e.key) && !e.ctrlKey){ S.tool = TOOLS[+e.key - 1][0]; saveSet(); menuDirty = true; flash('Mouse: ' + TOOLS[+e.key - 1][1]); }
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
// no accidental browser zoom
addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

// ======================================================================
// Entering the headset
// ======================================================================
const vrBtn = $('#vr'), mrBtn = $('#mr'), status = $('#status');
let arOK = false, mrOn = false;
async function setupButtons(){
  if (!('xr' in navigator)){ status.textContent = 'Open this page in the Quest browser to draw in the headset.'; return; }
  const [vr, ar] = await Promise.all([navigator.xr.isSessionSupported('immersive-vr').catch(() => false), navigator.xr.isSessionSupported('immersive-ar').catch(() => false)]);
  arOK = ar; vrBtn.disabled = !vr; mrBtn.disabled = !ar;
  status.textContent = ar ? 'MR draws over your real room.' : vr ? 'Headset found.' : '';
}
async function start(kind){
  const live = renderer.xr.getSession(); if (live){ live.end(); return; }
  const session = await navigator.xr.requestSession(kind, { requiredFeatures: ['local-floor'] }).catch(err => { status.textContent = 'Could not start: ' + err.message; return null; });
  if (!session) return;
  mrOn = kind === 'immersive-ar';
  scene.background = mrOn ? null : BG; floorGrid.material.opacity = mrOn ? 0.25 : 0.7;
  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(session);
  placeMenu(); menuCanvas.style.display = 'none';
  (mrOn ? mrBtn : vrBtn).textContent = 'Exit';
  session.addEventListener('end', () => {
    for (const h of hands){ h.act = null; h.grab = null; }
    stroke = null; preview = null; drag = null; worldGrab = null; liveGeo.setDrawRange(0, 0);
    scene.background = BG; floorGrid.material.opacity = 0.7; menuMesh.visible = false; menuCanvas.style.display = '';
    vrBtn.textContent = 'Enter VR'; mrBtn.textContent = 'Enter MR'; setupButtons();
  });
}
vrBtn.onclick = () => start('immersive-vr');
mrBtn.onclick = () => start('immersive-ar');
setupButtons();

// ======================================================================
// Loop
// ======================================================================
const clock = new THREE.Clock();
let menuT = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (renderer.xr.isPresenting) xrInput();
  // corners glide to where the solver put them
  if (!drag){ for (const id in X){ const d = D[id], x = X[id]; if (!d){ D[id] = x.slice(); continue; } for (let k = 0; k < 3; k++) d[k] += (x[k] - d[k]) * Math.min(1, dt * 12); } }
  if (flashT > 0){ flashT -= dt; if (flashT <= 0){ menuDirty = true; if (!renderer.xr.isPresenting) status.textContent = ''; } }
  if (clearArmed > 0){ clearArmed -= dt; if (clearArmed <= 0) menuDirty = true; }
  menuT += dt;
  if (menuDirty && menuT > 0.05){ menuT = 0; drawMenu(); }
  drawModel();
  if (!renderer.xr.isPresenting) orbit.update();
  renderer.render(scene, camera);
});

rebuild(); for (const id in X) D[id] = X[id].slice();
if (firstRun) loadSample();
window.edgewise = { orbit, get sk(){ return sk; }, get F(){ return F; }, get X(){ return X; }, loadSample, rebuild, S, C, world, camera, grabStart, grabMove, grabEnd, pickFace, strokeStart, strokeMove, strokeEnd };
</script>
