<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squiggle Bender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
:root{
  /* Layout: blue icon rail down the left, white tool panel, full-bleed 3D view. One bold light look. */
  --ink:#14161B; --paper:#ECE9E2; --panel:#FFFFFF; --line:#E3DFD6; --muted:#596070;
  --blue:#1E56D9; --red:#E5352B; --yellow:#FFC20E; --green:#18A04A; --orange:#FF7A1A; --purple:#7B3FE4;
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
#app{display:grid;grid-template-columns:66px 336px minmax(0,1fr);height:100%}
#rail{background:var(--blue);display:flex;flex-direction:column;gap:3px;padding:10px 7px;overflow-y:auto;scrollbar-width:none}
.rb{appearance:none;border:0;background:transparent;color:#fff;border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:700 10px/1 var(--body);letter-spacing:.02em}
.rb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rb:hover{background:rgba(255,255,255,.16)}
.rb.on{background:var(--yellow);color:var(--ink)}
.rb:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.rb .badge{position:absolute}
#panel{position:relative;background:var(--panel);border-right:3px solid var(--ink);overflow-y:auto;padding:20px 18px 32px;display:flex;flex-direction:column;gap:18px;min-width:0}
#panel h1{font:800 28px/1 var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--muted);margin:0;line-height:1.45}
.grp{display:flex;flex-direction:column;gap:8px;min-width:0}
.lab{font:800 11px/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{flex:1;appearance:none;border:0;background:#fff;color:var(--ink);font:700 13px var(--body);padding:9px 6px;cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.btn{appearance:none;border:2px solid var(--ink);background:var(--ink);color:#fff;font:700 13px var(--body);padding:9px 13px;border-radius:10px;cursor:pointer;white-space:nowrap}
.btn.alt{background:#fff;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.yellow{background:var(--yellow);border-color:var(--ink);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slider{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.slider label{font-weight:600}
.slider input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--blue);margin:0}
.val{font-variant-numeric:tabular-nums;font-weight:800}
select,input[type=number],textarea{font:500 13px var(--body);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:9px;padding:7px 8px;min-width:0}
input[type=number]{width:84px;font-variant-numeric:tabular-nums}
textarea{width:100%;box-sizing:border-box;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.verdict{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;border:2px solid var(--ink)}
.verdict.ok{background:var(--green);color:#fff}
.verdict.warn{background:var(--yellow);color:var(--ink)}
.verdict.bad{background:var(--red);color:#fff}
.verdict.none{background:#fff}
.verdict strong{font:800 21px/1.1 var(--display)}
.checks{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.ck{display:grid;grid-template-columns:52px minmax(0,1fr);gap:3px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ck b{font-weight:700}
.ck p{margin:0;color:var(--muted);grid-column:2;line-height:1.4}
.ck .btn{grid-column:2;justify-self:start;margin-top:4px}
.chip{font:800 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 0;border-radius:6px;align-self:start;margin-top:1px;text-align:center;border:2px solid var(--ink)}
.chip.ok{background:var(--green);color:#fff;border-color:var(--green)}
.chip.warn{background:var(--yellow);color:var(--ink)}
.chip.bad{background:var(--red);color:#fff;border-color:var(--red)}
.chip.info{background:#fff;color:var(--ink)}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat div{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.stat span{font:700 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font:800 22px/1.05 var(--display);font-variant-numeric:tabular-nums}
.big{font:800 44px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:last-child{text-align:right;font-weight:800;padding-left:8px}
.tbl td.r{white-space:nowrap;padding-left:8px;color:var(--muted)}
.tbl small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.jrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.note{background:var(--paper);border-radius:12px;padding:12px 14px;line-height:1.45;color:var(--ink);margin:0}
.pieces{display:flex;gap:6px;flex-wrap:wrap}
.pc{width:26px;height:26px;border-radius:7px;border:2px solid var(--ink);font:800 11px/22px var(--body);text-align:center;cursor:pointer;background:#fff;color:var(--ink)}
.pc.on{outline:3px solid var(--ink);outline-offset:1px}
.pc.flag{background:var(--red);color:#fff}
#view{position:relative;overflow:hidden;min-width:0;background:var(--paper)}
#view canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#panes{position:absolute;inset:0}
.pane{position:absolute;box-sizing:border-box}
.pbody{position:absolute;inset:0;touch-action:none}
.phead{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:2;align-items:center}
.phead select{font:700 12px var(--body);padding:4px 6px;border-radius:8px;border-width:2px}
.phead button{width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);background:#fff;color:var(--ink);font:800 15px/1 var(--body);cursor:pointer;padding:0}
.phead button:hover{background:var(--yellow)}
.divider{position:absolute;background:var(--ink);z-index:3;touch-action:none}
.divider:hover,.divider[data-drag]{background:var(--yellow)}
#hovertip{position:absolute;z-index:5;background:#fff;color:var(--ink);border:2px solid var(--ink);font:600 12px var(--body);padding:6px 9px;border-radius:8px;pointer-events:none;transform:translate(12px,12px);max-width:260px}
#hovertip b{display:block;font-weight:800}
#callout{position:absolute;z-index:4;background:var(--ink);color:#fff;font:700 12px var(--body);padding:6px 9px;border-radius:8px;pointer-events:none;transform:translate(-50%,-140%);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.vt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.vt th{font:800 10px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:2px solid var(--ink)}
.vt th:first-child,.vt td:first-child{text-align:left}
.vt td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.vt td.best{color:var(--green);font-weight:800}
.vt b{font:800 18px var(--display)}
.scrollx{overflow-x:auto;max-width:100%}
.jrow.pickable{cursor:pointer}
.jrow.on{background:var(--paper);box-shadow:inset 4px 0 0 var(--yellow)}
.steptext{font-weight:600;line-height:1.4}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:2px solid var(--ink);background:#fff;border-radius:10px;padding:9px 11px;cursor:pointer;font:500 13px/1.35 var(--body);color:var(--ink)}
.opt b{font-weight:800;font-size:14px}.opt span{color:var(--muted)}
.opt.on{background:var(--ink);color:#fff}.opt.on span{color:#d6d9e0}
.ask{background:var(--yellow);padding:12px;border-radius:14px;border:2px solid var(--ink)}
.ask .lab{color:var(--ink)}
.code{position:absolute;inset:0;background:#0E1A2B;display:flex;flex-direction:column;z-index:1}
.code[hidden]{display:none}
.chead{padding:10px 12px;padding-right:215px;font:700 12px var(--body);color:#fff;background:#1E56D9;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:30px;align-items:center}
.chead small{font-weight:500;color:#cfd8f5}
.lines{position:relative;flex:1;overflow-y:auto;padding:6px 0 30px;color:#d6dbe4;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ln{padding:0 12px;white-space:pre}
.ln .n{color:#6b7a93}.ln .cm{color:#8593ad}
.ln.cur{background:#FFC20E;color:#14161B}.ln.cur .n,.ln.cur .cm{color:#14161B}
.ln.hd{color:#5fd88a}
.hud{position:absolute;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
#hudTL{top:12px;left:12px;flex-wrap:wrap}
#hudTR{top:12px;right:12px}
#hudBL{bottom:12px;left:12px;flex-wrap:wrap}
.pill{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font:700 12px var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.busy{background:var(--yellow)}
.leg{display:flex;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:7px 11px;font:600 12px var(--body);flex-wrap:wrap}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--ink)}
#toast{z-index:6;position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;max-width:80%;text-align:center}
@media (max-width:760px){
  #app{grid-template-columns:58px minmax(0,1fr)}
  #rail{padding:8px 5px}
  .rb{font-size:9px}
  #panel{position:absolute;left:58px;right:0;bottom:0;max-height:54%;z-index:8;border-right:0;border-top:3px solid var(--ink);border-radius:18px 18px 0 0;padding:16px 16px 26px;padding-bottom:max(26px,env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(20,22,27,.18)}
  #panel h1{font-size:23px}
  #view{grid-column:2}
  #hudBL{bottom:auto;top:52px}
}
#panel.collapsed{display:none}
body.xr #app{grid-template-columns:66px 336px minmax(0,1fr)!important}
body.xr #panel{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;width:auto!important;max-height:none!important;border-radius:0!important;border-top:0!important;border-right:3px solid var(--ink)!important;box-shadow:none!important;display:flex!important}
body.xr #view{grid-column:3!important}
body.xr .rb{font-size:10px!important;padding:8px 0 6px!important;gap:4px!important}
body.xr .rb svg{width:24px!important;height:24px!important}
body.xr .pclose{display:none!important}
body.xr #panel .subtabs{margin-right:0!important}
.rb.xrb{margin-top:auto;background:var(--ink)}
.rb.xrb2{display:none;background:var(--ink)}
body.xr .rb.xrb2{display:flex!important}
body.xr #rail{overflow:visible!important;height:max-content!important;align-self:start!important}
body.xr .rb.xrb{margin-top:10px!important}
.subtabs{margin-bottom:-4px;flex-shrink:0}
#panel>*{flex-shrink:0}
.rb.xrb:hover{background:#2a2e37}
.pclose{display:none;position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);font:800 20px/1 var(--body);cursor:pointer;z-index:2}
@media (max-width:760px){.pclose{display:block}#panel h1{padding-right:44px}#panel .subtabs{margin-right:44px}}
@media (max-height:520px) and (orientation:landscape){
  #app{grid-template-columns:50px minmax(0,1fr)}
  #rail{padding:6px 5px;gap:2px}
  .rb{padding:7px 0;font-size:0;gap:0}
  .rb svg{width:22px;height:22px}
  #panel{position:absolute;left:50px;right:auto;top:0;bottom:0;width:min(310px,46vw);max-height:none;z-index:8;border-top:0;border-right:3px solid var(--ink);border-radius:0;padding:14px 14px 22px;gap:12px;box-shadow:8px 0 24px rgba(20,22,27,.18)}
  #panel h1{font-size:21px;padding-right:44px}
  .pclose{display:block}
  #panel .subtabs{margin-right:44px}
  #view{grid-column:2}
  .big{font-size:32px}
  .stat b{font-size:18px}
  .leg{font-size:11px;padding:5px 8px;gap:7px}
  #hudBL{top:auto;bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <nav id="rail" aria-label="Tools"></nav>

  <main id="view">
    <div id="panes"></div>
    <div class="hud" id="hudTL"><span class="pill" id="status">Loading…</span><button class="btn red" id="btnMR" hidden>Enter MR</button><button class="btn blue" id="btnVR" hidden>Enter VR</button></div>
    <div class="hud" id="hudBL"></div>
    <div id="callout" hidden></div>
    <div id="hovertip" hidden></div>
    <div id="toast" hidden></div>
  </main>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================= constants ================= */
const DS = 0.02;               // analysis sample spacing (m)
const IN = 0.0254, FT = 0.3048, LBF = 4.448;
const PIECE_COLS = [0xE5352B, 0xFFC20E, 0x1E56D9, 0x18A04A, 0xFF7A1A, 0x7B3FE4];
const C_OK = 0x18A04A, C_WARN = 0xFFC20E, C_BAD = 0xE5352B;
// Tube sizes the Nissin NPB range can take (030M: 19–31.8 mm, 040M: 27.2–42.6 (48.6 power), 050M: 38–60.5)
const TUBES = [
  { name: '1" OD tube', od: 25.4, wall: 1.65, model: 'NPB-030M', rec: 100 },
  { name: '1¼" OD tube', od: 31.8, wall: 1.65, model: 'NPB-030M', rec: 100 },
  { name: '1½" OD tube', od: 38.1, wall: 2.11, model: 'NPB-040M', rec: 100 },
  { name: '1¼" pipe, 1.66" OD', od: 42.7, wall: 2.77, model: 'NPB-040M', rec: 100 },
  { name: '1½" pipe, 1.90" OD', od: 48.3, wall: 2.77, model: 'NPB-040M (power spec)', rec: 75 },
  { name: '2" pipe, 2.375" OD', od: 60.5, wall: 2.77, model: 'NPB-050M', rec: 50 },
];
const ENVS = [
  { name: 'Crate 8 × 4 × 4 ft', L: 8 * FT, W: 4 * FT, H: 4 * FT },
  { name: 'Crate 12 × 4 × 4 ft', L: 12 * FT, W: 4 * FT, H: 4 * FT },
  { name: 'Flatbed 48 × 8.5 × 8 ft', L: 48 * FT, W: 8.5 * FT, H: 8 * FT },
  { name: 'Custom size', custom: true },
];
const JOINTS = {
  shop:     { name: 'Shop weld',        color: 0x14161B, site: false, k: 1.0,  zone: 0.85, wiggle: false, desc: 'Welded and polished in the shop before shipping. Permanent and seamless.' },
  swage:    { name: 'Swaged slip joint', color: 0x1E56D9, site: true,  k: 0.6,  zone: 0.70, wiggle: false, desc: 'One end is narrowed and slid into the next, then locked with hidden bolts. Stiff and almost invisible.' },
  flange:   { name: 'Bolted flanges',   color: 0x7B3FE4, site: true,  k: 0.5,  zone: 0.70, wiggle: false, desc: 'Plates welded on in the shop, bolted tight on site. Rigid, and you can see them.' },
  siteweld: { name: 'Site weld',        color: 0xFF7A1A, site: true,  k: 1.0,  zone: 0.75, wiggle: false, desc: 'Fitted, welded and polished in place. Permanent, and the priciest joint.' },
  sleeve:   { name: 'Sleeve and bolt',  color: 0xE5352B, site: true,  k: 0.08, zone: 0.50, wiggle: true,  desc: 'A sleeve with a through-bolt. Cheap, but the fit has play, so it wiggles.' },
};
const JORDER = ['shop', 'swage', 'flange', 'siteweld', 'sleeve'];
// Where two tubes meet (an end landing on another tube, or two tubes crossing)
const JUNCS = {
  siteweld: { name: 'Welded junction', color: 0xFF7A1A, k: 1, zone: 0.75, rate: 'teeweld', desc: 'The tube is cut to fit around the other one and welded where they meet. Permanent.' },
  clamp:    { name: 'Saddle clamp',    color: 0x1E56D9, k: 0.35, zone: 0.6, rate: 'clamp', desc: 'A bolted two-piece clamp. Removable, but it can slip if the bolts loosen.' },
  none:     { name: 'Not connected',   color: 0x8A919E, k: 0, zone: 1, desc: 'The tubes touch without being fixed together. They will rattle and wear.' },
};
const JUNC_ORDER = ['siteweld', 'clamp', 'none'];
const REASONS = {
  end: 'Last piece of this tube.',
  stock: 'Split here to keep the piece within your length limit (13 ft is the longest tube the machine takes).',
  floor: 'Split here because the bent end would swing into the floor.',
  machine: 'Split here because the bent end would swing into the machine.',
  die: 'Split here because the tube would curl back into the bending head.',
  feed: 'Split here because the bent end would hit the straight tube still feeding in.',
  ship: 'Split here so the piece fits your shipping size.',
  user: 'You placed this cut by dragging its ring.',
  post: 'Split here because the bent end would swing into a light-curtain post.',
  operator: 'Split here because the bent end would swing into the operator at the console.',
  stuck: 'This piece hits the machine even when it is very short. Redraw this spot with a wider curve.',
};
const MODES_XR = ['draw', 'check', 'joints', 'bend', 'strength', 'ship'];

const DEF = () => ({
  units: 'imp', tubeIdx: 4, smooth: 4, planeH: 1.0, plane: 'upright', pull: 0.8, heights: false, gen: { len: 20 * FT, h: 7 * FT, twist: 5, loops: 1, feet: 'both' }, split: null, handleLen: 8 * FT, cutaway: false, helpers: true, labels: false, progWin: true, v2: true, v3: true,
  machine: { kR: 3, maxStock: 4.0, grip: 0.15, dieH: 1.0, bodyLen: 4.4 },
  safety: { on: true, minR: 9 * IN },
  shipIdx: 1, shipCustom: { L: 12 * FT, W: 4 * FT, H: 4 * FT },
  load: { lb: 250, sid: null, idx: null }, exag: 15,
  pricing: 'time', nest: true,
  rates: { matKg: 8, shopHr: 150, setupHr: 1, loadHr: 0.25, feed: 75, perFt: 14, perPiece: 85, perPieceFt: 4, polishFt: 6,
           shop: 120, swage: 160, flange: 220, siteweld: 380, sleeve: 60, cap: 15, crate: 250,
           teeweld: 300, clamp: 90, footing: 450, crewHr: 95, installBase: 4 },
});

/* ================= state ================= */
let S = DEF();
let strokes = [];           // {id, raw:[[x,y,z]...]}
let seamOverrides = {};     // key -> joint type
let nextId = 1;
let A = null;               // analysis results
let tab = 'draw', tool = 'draw';
let hist = [];
let selPiece = 0, bendF = 0, bendPlay = true, explode = 0, buildStep = null, fitNext = true, hlKey = null;
const $ = s => document.querySelector(s);
const tube = () => { const t = TUBES[S.tubeIdx]; return { ...t, od: t.od / 1000, wall: t.wall / 1000 }; };
const env = () => { const e = ENVS[S.shipIdx].custom ? S.shipCustom : ENVS[S.shipIdx]; return [e.L, e.H, e.W]; };
const machineMinR = () => S.machine.kR * tube().od;
const limitR = () => Math.max(machineMinR(), S.safety.on ? S.safety.minR : 0);

function save() { try { localStorage.setItem('squiggle-bender-v1', JSON.stringify({ S, strokes, seamOverrides, nextId })); } catch (e) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('squiggle-bender-v1'));
    if (!d || !d.strokes) return false;
    const base = DEF();
    for (const k in d.S) { if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) Object.assign(base[k], d.S[k]); else base[k] = d.S[k]; }
    if (!d.S.v2) { base.cutaway = false; base.labels = false; base.v2 = true; }

    else { const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : pulse.p.cam; pulse.m.lookAt(cam.getWorldPosition(_p)); pulse.m.scale.setScalar(1 + 0.45 * Math.sin(a * 9)); pulse.m.material.opacity = 1 - a / 3; }
  }
  const tk = now / 1000;
  designMeshes.children.forEach(o => { const k = o.userData.seamKey || o.userData.juncKey; if (!k) return; const s = k === hlKey ? 1.45 + 0.25 * Math.sin(tk * 8) : 1; o.scale.setScalar(s); });
  const bendShown = renderer.xr.isPresenting ? tab === 'bend' : leaves().some(p => p.view === 'bend' || p.view === 'program');
  clipPlane.setFromNormalAndCoplanarPoint(V3(0, 0, -1).applyQuaternion(machineGroup.getWorldQuaternion(_q)), machineGroup.getWorldPosition(_p));
  if (A && bendShown) {
    if (bendPlay) { jobT += dt * jobSpeed; const pl = jobPlan(); if (pl.length && jobT >= pl[pl.length - 1].t1 - 0.01) jobT = 0; }
    updateBend();
    const js = jobState();
    if (js && tab === 'bend') {
      const sl = document.getElementById('jobT'); if (sl && !sl.matches(':active')) { sl.max = js.total; sl.value = jobT; }
      const o = document.querySelector('[data-out="jobT"]'); if (o) o.textContent = `${PHNAME[js.phase]} · ${clock(jobT)} of ${clock(js.total)}`;
    }
  }
  if (renderer.xr.isPresenting) {
    xrTick();
    if (tabDirty && now - tabLastDraw > 120) { tabDirty = false; tabLastDraw = now; renderTablet(); }
    progBoard.visible = tab === 'bend'; if (progBoard.visible) drawProgBoard();
    const v = viewForTab(tab);
    designGroup.visible = v !== 'strength'; strengthGroup.visible = v === 'strength'; heightGroup.visible = S.heights && v !== 'ship' && v !== 'bend';
    machineGroup.visible = v === 'bend'; shipGroup.visible = v === 'ship'; planeMesh.visible = false;
    renderer.render(scene, xrCam);
  }
  else { for (const p of leaves()) if (p.ctrl.enabled) p.ctrl.update(); updateCallout(); renderPanes(); }
});

if (!load()) strokes = [{ id: nextId++, raw: exLoop() }, { id: nextId++, raw: exSpiral(3.4, -0.6) }, { id: nextId++, raw: exBench(0, 2.3) }].map(s => ({ ...s, raw: s.raw.map(a => a.map(v => +v.toFixed(4))) }));
layout = makePane('model');
buildGrid(); buildMachine(); resize();
document.querySelectorAll('.rb').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
fitNext = true;
schedule();
checkXR();
</script>
<script src="../updated.js"></script>
