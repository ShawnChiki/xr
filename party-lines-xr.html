<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Lines XR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: full-bleed 3D viewport, one small floating control card top-left. Single dark look on purpose. */
  :root{
    --bg:#16181d; --panel:rgba(22,24,29,.86); --ink:#f1ece2; --muted:#a59e92;
    --birch:#e9cfa3; --accent:#ff6b3d; --line:rgba(241,236,226,.14);
    --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
  canvas{display:block}
  .card{position:fixed;top:16px;left:16px;max-width:300px;padding:16px 18px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);display:grid;gap:10px}
  h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:600 14px var(--display);padding:9px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--ink);color:var(--bg);cursor:pointer}
  button.ghost{background:transparent;color:var(--ink)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #status{font-size:12px;color:var(--birch)}
</style>
</head>
<body>
<div class="card">
  <h1>Party Lines <span>XR</span></h1>
  <p>Grab an orange handle to bend the line. Grab the line itself to move and turn the whole thing. Trigger, grip or a pinch all grab.</p>
  <div class="row">
    <button id="vr" disabled>Enter VR</button>
    <button id="mr" disabled>Enter MR</button>
    <button id="reset" class="ghost">Reset line</button>
  </div>
  <div id="status">Checking for a headset…</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- scene ----------
const BG = new THREE.Color(0x16181d);
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = BG;
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 50);
camera.position.set(0.35, 1.35, 0.35);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1.0, -0.5); orbit.update();

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x30343c, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(1,3,1); scene.add(sun);

const room = new THREE.Group();            // floor stuff, hidden in MR
const grid = new THREE.GridHelper(6, 24, 0x3a3f49, 0x262a31); room.add(grid);
scene.add(room);

// ---------- the line ----------
const DESK_POS = new THREE.Vector3(0, 1.0, -0.5);
const START = [  // meters, fingerboard scale (~50 cm loop)
  [-0.25,0.00, 0.00],[-0.10,0.09,-0.13],[0.13,0.02,-0.15],
  [ 0.26,0.13, 0.00],[ 0.10,0.00, 0.14],[-0.15,0.07, 0.12]
];
const park = new THREE.Group(); park.position.copy(DESK_POS); scene.add(park);
const pts = START.map(p => new THREE.Vector3(...p));
const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');

const N = 240, WIDTH = 0.055, UP = new THREE.Vector3(0,1,0);
const ribbonGeo = new THREE.BufferGeometry();
ribbonGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*2*3), 3));
const idx = [];
for (let i=0;i<N;i++){ const a=2*i,b=a+1,c=2*((i+1)%N),d=c+1; idx.push(a,c,b, b,c,d); }
ribbonGeo.setIndex(idx);
const ribbon = new THREE.Mesh(ribbonGeo, new THREE.MeshStandardMaterial({ color:0xe9cfa3, roughness:.75, side:THREE.DoubleSide }));
park.add(ribbon);
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*4*3), 3));
const edges = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color:0x6b4f2a }));
park.add(edges);
const samples = Array.from({length:N}, () => new THREE.Vector3());

function frameAt(u, p, t, n, s){
  curve.getPointAt(u, p); curve.getTangentAt(u, t);
  s.crossVectors(t, UP); if (s.lengthSq() < 1e-6) s.set(0,0,1); s.normalize();
  n.crossVectors(s, t).normalize();
}
const _p=new THREE.Vector3(), _t=new THREE.Vector3(), _n=new THREE.Vector3(), _s=new THREE.Vector3();
function rebuild(){
  curve.updateArcLengths();
  const pos = ribbonGeo.attributes.position.array, e = edgeGeo.attributes.position.array;
  for (let i=0;i<N;i++){
    frameAt(i/N, _p, _t, _n, _s);
    samples[i].copy(_p);
    const l = _p.clone().addScaledVector(_s, -WIDTH/2), r = _p.clone().addScaledVector(_s, WIDTH/2);
    pos.set([l.x,l.y,l.z, r.x,r.y,r.z], i*6);
  }
  for (let i=0;i<N;i++){ // two edge rails as segments
    const j=(i+1)%N;
    e.set([pos[i*6],pos[i*6+1],pos[i*6+2], pos[j*6],pos[j*6+1],pos[j*6+2]], i*6);
    e.set([pos[i*6+3],pos[i*6+4],pos[i*6+5], pos[j*6+3],pos[j*6+4],pos[j*6+5]], (N+i)*6);
  }
  ribbonGeo.attributes.position.needsUpdate = true; ribbonGeo.computeVertexNormals(); ribbonGeo.computeBoundingSphere();
  edgeGeo.attributes.position.needsUpdate = true; edgeGeo.computeBoundingSphere();
}

// handles
const handleGeo = new THREE.SphereGeometry(0.016, 20, 14);
const handles = pts.map((p) => {
  const m = new THREE.Mesh(handleGeo, new THREE.MeshStandardMaterial({ color:0xff6b3d, emissive:0x000000, roughness:.4 }));
  m.position.copy(p); park.add(m); return m;
});

// fingerboard: 96 x 28 mm deck
const board = new THREE.Group();
const deck = new THREE.Mesh(new THREE.BoxGeometry(0.096, 0.003, 0.028), new THREE.MeshStandardMaterial({ color:0x2fb3a5, roughness:.6 }));
deck.position.y = 0.011; board.add(deck);
const grip = new THREE.Mesh(new THREE.BoxGeometry(0.094, 0.0006, 0.026), new THREE.MeshStandardMaterial({ color:0x1b1b1b, roughness:1 }));
grip.position.y = 0.0128; board.add(grip);
const wheelGeo = new THREE.CylinderGeometry(0.0045, 0.0045, 0.005, 14); wheelGeo.rotateX(Math.PI/2);
const wheelMat = new THREE.MeshStandardMaterial({ color:0xf4f0e8, roughness:.5 });
for (const x of [-0.032, 0.032]) for (const z of [-0.011, 0.011]){
  const w = new THREE.Mesh(wheelGeo, wheelMat); w.position.set(x, 0.0045, z); board.add(w);
}
park.add(board);

let u = 0, speed = 0.25;
const basis = new THREE.Matrix4(), _z = new THREE.Vector3();
function moveBoard(dt){
  frameAt(u, _p, _t, _n, _s);
  speed += -9.8 * _t.y * dt * 0.35;            // a little gravity: faster downhill
  speed = THREE.MathUtils.clamp(speed, 0.12, 0.7);
  u = (u + speed*dt / curve.getLength()) % 1;
  _z.crossVectors(_t, _n);
  basis.makeBasis(_t, _n, _z);
  board.quaternion.setFromRotationMatrix(basis);
  board.position.copy(_p);
}

function resetLine(){
  START.forEach((p,i) => { pts[i].set(...p); handles[i].position.copy(pts[i]); });
  park.rotation.set(0,0,0);
  if (!renderer.xr.isPresenting) park.position.copy(DESK_POS); else needsPlace = 1;
  rebuild();
}
rebuild();

// ---------- XR input: controllers + hands ----------
const GRAB_HANDLE = 0.06, GRAB_LINE = 0.05;
const inputs = [0,1].map(i => {
  const ctrl = renderer.xr.getController(i);
  const gripSpace = renderer.xr.getControllerGrip(i);
  const hand = renderer.xr.getHand(i);
  scene.add(ctrl, gripSpace, hand);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.012, 16, 10), new THREE.MeshStandardMaterial({ color:0xf1ece2 }));
  gripSpace.add(dot);
  const st = { ctrl, gripSpace, hand, grab:null };
  const start = () => tryGrab(st), end = () => { st.grab = null; };
  ctrl.addEventListener('selectstart', start); ctrl.addEventListener('squeezestart', start);
  ctrl.addEventListener('selectend', end);     ctrl.addEventListener('squeezeend', end);
  return st;
});
const jointMat = new THREE.MeshStandardMaterial({ color:0xf1ece2, roughness:.6 });
const jointGeo = new THREE.SphereGeometry(0.006, 10, 8);

const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _m = new THREE.Matrix4(), _inv = new THREE.Matrix4();
function handActive(st){
  const it = st.hand.joints && st.hand.joints['index-finger-tip'];
  return it && it.visible;
}
function grabPoint(st, out){
  if (handActive(st)){
    st.hand.joints['index-finger-tip'].getWorldPosition(out);
    st.hand.joints['thumb-tip'].getWorldPosition(_b);
    return out.add(_b).multiplyScalar(0.5);
  }
  return st.gripSpace.getWorldPosition(out);
}
function grabMatrix(st){
  if (handActive(st) && st.hand.joints['wrist']) return st.hand.joints['wrist'].matrixWorld;
  return st.gripSpace.matrixWorld;
}
function nearestHandle(worldP){
  const local = park.worldToLocal(worldP.clone());
  let best = -1, bd = GRAB_HANDLE;
  pts.forEach((p,i) => { const d = p.distanceTo(local); if (d < bd){ bd = d; best = i; } });
  return best;
}
function nearLine(worldP){
  const local = park.worldToLocal(worldP.clone());
  return samples.some(s => s.distanceTo(local) < GRAB_LINE);
}
function tryGrab(st){
  grabPoint(st, _a);
  const h = nearestHandle(_a);
  if (h >= 0){ st.grab = { type:'handle', i:h }; return; }
  if (nearLine(_a)){
    park.updateMatrixWorld();
    st.grab = { type:'line', offset: _inv.copy(grabMatrix(st)).invert().multiply(park.matrixWorld).clone() };
    return;
  }
  // grabbing empty air far from the line brings it back in front of you
  if (park.position.distanceTo(_a) > 1.0) needsPlace = 1;
}
function updateGrabs(){
  let changed = false;
  for (const st of inputs){
    if (!st.grab) continue;
    if (st.grab.type === 'handle'){
      grabPoint(st, _a);
      pts[st.grab.i].copy(park.worldToLocal(_a));
      handles[st.grab.i].position.copy(pts[st.grab.i]);
      changed = true;
    } else {
      _m.multiplyMatrices(grabMatrix(st), st.grab.offset);
      _m.decompose(park.position, park.quaternion, _a);
    }
  }
  if (changed) rebuild();
}
function updateHover(){
  const hot = new Set();
  for (const st of inputs){
    if (st.grab?.type === 'handle'){ hot.add(st.grab.i); continue; }
    if (!st.gripSpace.visible && !handActive(st)) continue;
    const h = nearestHandle(grabPoint(st, _a)); if (h >= 0) hot.add(h);
  }
  handles.forEach((m,i) => {
    const on = hot.has(i) || i === mouseDrag?.i;
    m.scale.setScalar(on ? 1.5 : 1);
    m.material.emissive.setHex(on ? 0x662200 : 0x000000);
  });
}
function updateHandVisuals(){
  for (const st of inputs){
    const j = st.hand.joints; if (!j) continue;
    for (const k in j){ if (!j[k].userData.vis){ j[k].add(new THREE.Mesh(jointGeo, jointMat)); j[k].userData.vis = true; } }
  }
}

// ---------- mouse fallback on the monitor ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane();
let mouseDrag = null;
function setNdc(e){ ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera); }
renderer.domElement.addEventListener('pointerdown', e => {
  setNdc(e);
  const hit = ray.intersectObjects(handles)[0]; if (!hit) return;
  mouseDrag = { i: handles.indexOf(hit.object) };
  plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(_a).negate(), hit.point);
  orbit.enabled = false;
});
addEventListener('pointermove', e => {
  if (!mouseDrag) return; setNdc(e);
  if (ray.ray.intersectPlane(plane, _b)){
    pts[mouseDrag.i].copy(park.worldToLocal(_b.clone())); handles[mouseDrag.i].position.copy(pts[mouseDrag.i]); rebuild();
  }
});
addEventListener('pointerup', () => { mouseDrag = null; orbit.enabled = true; });

// ---------- sessions ----------
const vrBtn = document.getElementById('vr'), mrBtn = document.getElementById('mr'), status = document.getElementById('status');
document.getElementById('reset').onclick = resetLine;
let needsPlace = 0, mode = null;

async function setupButtons(){
  if (!('xr' in navigator)){ status.textContent = 'This browser has no WebXR. Use Chrome or Edge on the PC, or the Quest browser.'; return; }
  const [vr, ar] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false),
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false)
  ]);
  vrBtn.disabled = !vr; mrBtn.disabled = !ar;
  status.textContent = vr && ar ? 'Headset ready. VR or MR.'
    : vr ? 'Headset found. MR only works from the Quest browser.'
    : 'No headset found. Start Link, then reload this page.';
}
let starting = false;
async function start(kind){
  const live = renderer.xr.getSession();
  if (live){ live.end(); return; }                 // button doubles as Exit
  if (starting) return;                            // ignore double clicks while Link wakes up
  starting = true; vrBtn.disabled = mrBtn.disabled = true;
  status.textContent = 'Starting… if you are in the Link desktop view, close it to see the scene.';
  const session = await navigator.xr.requestSession(kind, {
    requiredFeatures:['local-floor'], optionalFeatures:['hand-tracking']
  }).catch(err => { status.textContent = 'Could not start: ' + err.message; return null; });
  starting = false;
  if (!session){ setupButtons(); return; }
  mode = kind;
  (kind === 'immersive-ar' ? mrBtn : vrBtn).disabled = false;
  (kind === 'immersive-ar' ? mrBtn : vrBtn).textContent = 'Exit';
  status.textContent = 'In the headset. Lost the line? Grab empty air far from it.';
  if (kind === 'immersive-ar'){ scene.background = null; room.visible = false; renderer.setClearColor(0x000000, 0); }
  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(session);
  needsPlace = 1;
  session.addEventListener('end', () => {
    mode = null; scene.background = BG; room.visible = true;
    park.position.copy(DESK_POS); park.quaternion.identity();
    inputs.forEach(s => s.grab = null);
    vrBtn.textContent = 'Enter VR'; mrBtn.textContent = 'Enter MR';
    setupButtons();
  });
}
vrBtn.onclick = () => start('immersive-vr');
mrBtn.onclick = () => start('immersive-ar');
navigator.xr?.addEventListener?.('devicechange', setupButtons);
setupButtons();

// put the line ~45 cm in front of you, a bit below eye level
function placeInFront(){
  const cam = renderer.xr.getCamera();
  cam.getWorldPosition(_a); cam.getWorldDirection(_b); _b.y = 0;
  if (_b.lengthSq() < 1e-4 || _a.lengthSq() < 1e-4) return false;
  _b.normalize();
  park.position.copy(_a).addScaledVector(_b, 0.45); park.position.y = _a.y - 0.35;
  park.quaternion.setFromAxisAngle(UP, Math.atan2(_b.x, _b.z) + Math.PI);
  return true;
}

// ---------- loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (renderer.xr.isPresenting){
    if (needsPlace && ++needsPlace > 6 && placeInFront()) needsPlace = 0;
    updateHandVisuals(); updateGrabs();
  }
  updateHover();
  moveBoard(dt);
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
