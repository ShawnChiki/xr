<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Lines XR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: full-bleed 3D viewport with one small control card. Single dark look on purpose. */
  :root{
    --bg:#16181d; --panel:rgba(22,24,29,.88); --ink:#f1ece2; --muted:#a59e92;
    --birch:#e9cfa3; --accent:#ff6b3d; --line:rgba(241,236,226,.14);
    --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
  canvas{display:block}
  .card{position:fixed;top:16px;left:16px;width:min(340px,calc(100vw - 32px));box-sizing:border-box;padding:16px 18px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;display:grid;gap:10px}
  .lab{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{flex:1;border:0;border-radius:0;background:transparent;color:var(--ink);padding:9px 6px;font-size:13px}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#16181d}
  select{flex:1;min-width:0;font:500 14px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  select option{background:#16181d}
  .row.small button{font-size:12px;padding:7px 10px}
  h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
  h1 span{color:var(--accent)}
  p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
  p b{color:var(--ink);font-weight:500}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:600 14px var(--display);padding:9px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--ink);color:var(--bg);cursor:pointer}
  button.ghost{background:transparent;color:var(--ink)}
  button.warn{background:var(--accent);color:#16181d}
  button:disabled{opacity:.35;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #status{font-size:12px;color:var(--birch)}
</style>
</head>
<body>
<div class="card">
  <h1>Party Lines <span>XR</span></h1>
  <p>Open this page in the Quest browser and tap <b>Enter MR</b>. The menu floats over your left hand and walks you through three steps:
     <b>1 Fit board</b> under your fingertips, <b>2 Record</b> runs with A, <b>3 Compose</b> them and sketch the surface underneath.</p>
  <div class="row">
    <button id="mr" disabled>Enter MR</button>
    <button id="vr" disabled>Enter VR</button>
  </div>
  <div class="lab">Rider on playback</div>
  <div class="seg" id="riderSeg">
    <button data-r="none">Empty</button><button data-r="fingers">Fingers</button><button data-r="person">Little skater</button>
  </div>
  <div class="lab">Scene</div>
  <div class="row">
    <select id="sceneSel" aria-label="Open a scene"></select>
    <button id="sceneSave">Save</button>
    <button id="sceneNew" class="ghost">New</button>
  </div>
  <div class="row small">
    <button id="dl" class="ghost">Download file</button>
    <button id="openFile" class="ghost">Open file</button>
    <button id="sceneDel" class="ghost">Delete</button>
    <input id="fileIn" type="file" accept=".json,application/json" hidden>
  </div>
  <div id="status">Checking for a headset…</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const modelFactory = new XRControllerModelFactory();

// ================= storage =================
const KEY = 'partylines.v2';
const COLORS = [0xff6b3d, 0x2fb3a5, 0xff5fa2, 0xf2c230, 0x4f8cff, 0x6fd16a, 0xa87bff, 0xe8463b];
// board placement relative to the controller grip: 11.5 cm out along your fingers, deck across the two fingertips
const DEFAULT_FIT = () => ({ p: [0, -0.07, 0], q: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI / 2).toArray() });
let store = { lines: [], strokes: [], surfaces: [], fit: {}, brush: 0.0022, ride: 'right', view: {} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.lines) store = Object.assign(store, s); } catch (e) {}
if (store.fitVersion !== 3){ store.fit = {}; store.fitVersion = 3; }      // start everyone from the new close-in default
for (const h of ['left', 'right']) if (!store.fit[h] || !store.fit[h].p) store.fit[h] = DEFAULT_FIT();
store.strokes = store.strokes.map(s => Array.isArray(s) ? { r: 0.0022, a: s, used: false } : s);   // older saves
store.surfaces = store.surfaces || [];
store.tool = store.tool || 'sketch';
store.view = Object.assign({ paths: true, trails: false, boards: true, rider: 'fingers', sketches: true, nets: true, labels: true }, store.view);
if ('hands' in store.view){ if (!store.view.hands) store.view.rider = 'none'; delete store.view.hands; }   // older saves had a hands on/off toggle
delete store.view.ghosts;
let saveTimer = 0;
function saveNow(){ clearTimeout(saveTimer); try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
const r4 = v => Math.round(v * 10000) / 10000;

// ================= scene =================
const BG = new THREE.Color(0x16181d);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = BG;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 50);
camera.position.set(0.5, 1.4, 0.6);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.85, -0.3); orbit.update();
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x30343c, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(1, 3, 1); scene.add(sun);
const room = new THREE.Group(); room.add(new THREE.GridHelper(6, 24, 0x3a3f49, 0x262a31)); scene.add(room);

// ================= fingerboard: 96 x 30 mm deck, 7-ply edge, 19° kicks, concave, real truck stack =================
function roundedRect(hw, hd, r){
  // long edges get extra points so the kicks and concave bend smoothly
  const s = new THREE.Shape(), N = 20, x0 = -hw + r, x1 = hw - r;
  s.moveTo(x0, -hd);
  for (let i = 1; i <= N; i++) s.lineTo(x0 + (x1 - x0) * i / N, -hd);
  s.quadraticCurveTo(hw, -hd, hw, -hd + r); s.lineTo(hw, hd - r); s.quadraticCurveTo(hw, hd, x1, hd);
  for (let i = 1; i <= N; i++) s.lineTo(x1 - (x1 - x0) * i / N, hd);
  s.quadraticCurveTo(-hw, hd, -hw, hd - r); s.lineTo(-hw, -hd + r); s.quadraticCurveTo(-hw, -hd, x0, -hd);
  return s;
}
const KICK_START = 0.034, KICK_SLOPE = Math.tan(19 * Math.PI / 180);
function kick(geo){ // nose and tail bend up past the trucks; the deck dishes about 0.8 mm across its width
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), z = p.getZ(i), ax = Math.abs(x);
    p.setY(i, p.getY(i) + (ax > KICK_START ? (ax - KICK_START) * KICK_SLOPE : 0) + z * z * 3.5);
  }
  geo.computeVertexNormals(); return geo;
}
function deckGeo(hw, hd, r, depth, y, bevel){
  const g = new THREE.ExtrudeGeometry(roundedRect(hw, hd, r), {
    depth, curveSegments: 14, steps: 1,
    bevelEnabled: bevel, bevelThickness: 0.0003, bevelSize: 0.0003, bevelSegments: 2 });
  g.rotateX(-Math.PI / 2); g.translate(0, y, 0);
  return kick(g);
}
const DECK_Y = 0.0092, DECK_T = 0.0014;
const DECK_GEO = deckGeo(0.048, 0.015, 0.0135, DECK_T, DECK_Y, true);
const TAPE_GEO = deckGeo(0.0476, 0.0146, 0.0131, 0.0002, DECK_Y + DECK_T + 0.0003, false);
const metal = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, metalness: .85, roughness: .3 });
const darkMetal = new THREE.MeshStandardMaterial({ color: 0x5b5f66, metalness: .8, roughness: .35 });
const tapeMat = new THREE.MeshStandardMaterial({ color: 0x1b1b1d, roughness: 1 });
const WHEEL_R = 0.0037;
const WHEEL_GEO = new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, 0.0045, 24); WHEEL_GEO.rotateX(Math.PI / 2);
const BEARING_GEO = new THREE.CylinderGeometry(0.0014, 0.0014, 0.0047, 12); BEARING_GEO.rotateX(Math.PI / 2);
const BASE_GEO = new THREE.BoxGeometry(0.011, 0.0012, 0.010);
const BUSH_GEO = new THREE.CylinderGeometry(0.0022, 0.0022, 0.0018, 14);
const KING_GEO = new THREE.CylinderGeometry(0.0007, 0.0007, 0.0042, 8);
const HANGER_GEO = new THREE.BoxGeometry(0.0055, 0.0028, 0.017);
const AXLE_GEO = new THREE.CylinderGeometry(0.0006, 0.0006, 0.031, 8); AXLE_GEO.rotateX(Math.PI / 2);
const BOLT_GEO = new THREE.CylinderGeometry(0.0006, 0.0006, 0.0004, 8);
const dotGeo = new THREE.SphereGeometry(0.0028, 8, 6);
const SHARED = new Set([DECK_GEO, TAPE_GEO, WHEEL_GEO, BEARING_GEO, BASE_GEO, BUSH_GEO, KING_GEO, HANGER_GEO, AXLE_GEO, BOLT_GEO, dotGeo]);

// each board gets a bottom graphic, coloured plies, wheels and bushings from the run's colour + two partners
const hex = c => '#' + c.toString(16).padStart(6, '0');
const boardLook = new Map();
function lookFor(color){
  if (boardLook.has(color)) return boardLook.get(color);
  const idx = COLORS.indexOf(color), main = idx >= 0 ? color : 0xf4efe6;
  const a2 = COLORS[((idx >= 0 ? idx : 2) + 3) % COLORS.length], a3 = COLORS[((idx >= 0 ? idx : 4) + 5) % COLORS.length];
  // bottom graphic
  const gc = document.createElement('canvas'); gc.width = 640; gc.height = 200; const g = gc.getContext('2d');
  g.fillStyle = hex(main); g.fillRect(0, 0, 640, 200);
  const style = idx >= 0 ? idx % 4 : 4;
  if (style === 0){ g.fillStyle = hex(a2); for (let x = -200; x < 700; x += 70){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 30, 0); g.lineTo(x + 130, 200); g.lineTo(x + 100, 200); g.fill(); } }
  if (style === 1){ g.fillStyle = hex(a2); for (let y = 25; y < 200; y += 50) for (let x = 25 + (y % 100 ? 25 : 0); x < 640; x += 50){ g.beginPath(); g.arc(x, y, 13, 0, 7); g.fill(); } }
  if (style === 2){ g.strokeStyle = hex(a2); g.lineWidth = 22; for (let x = -40; x < 700; x += 90){ g.beginPath(); g.moveTo(x, 20); g.lineTo(x + 45, 100); g.lineTo(x, 180); g.stroke(); } }
  if (style === 3){ g.fillStyle = hex(a2); g.beginPath(); g.arc(320, 100, 82, 0, 7); g.fill(); g.fillStyle = hex(a3); g.beginPath(); g.arc(320, 100, 42, 0, 7); g.fill(); }
  if (style === 4){ COLORS.forEach((c, i) => { g.fillStyle = hex(c); g.fillRect(i * 80, 0, 80, 200); }); }
  g.fillStyle = 'rgba(255,255,255,0.92)'; g.font = '800 38px "Bricolage Grotesque", Arial Black, sans-serif';
  g.textAlign = 'center'; g.fillText('PARTY LINES', 320, 186);
  const gt = new THREE.CanvasTexture(gc); gt.colorSpace = THREE.SRGBColorSpace;
  gt.repeat.set(1 / 0.096, 1 / 0.030); gt.offset.set(0.5, 0.5);
  // seven plies on the edge
  const pc = document.createElement('canvas'); pc.width = 4; pc.height = 70; const p = pc.getContext('2d');
  [0xf1e2c4, main, 0xf1e2c4, a2, 0xf1e2c4, main, 0xf1e2c4].forEach((c, i) => { p.fillStyle = hex(c); p.fillRect(0, i * 10, 4, 10); });
  const pt = new THREE.CanvasTexture(pc); pt.colorSpace = THREE.SRGBColorSpace;
  pt.wrapS = pt.wrapT = THREE.RepeatWrapping; pt.magFilter = THREE.NearestFilter;
  pt.repeat.set(1, 500); pt.offset.set(0, -0.16);                 // maps the 2 mm edge onto one set of plies
  const look = {
    graphic: new THREE.MeshStandardMaterial({ map: gt, roughness: .5 }),
    ply: new THREE.MeshStandardMaterial({ map: pt, roughness: .75 }),
    wheel: new THREE.MeshStandardMaterial({ color: a2, roughness: .4 }),
    bush: new THREE.MeshStandardMaterial({ color: a3, roughness: .5 })
  };
  boardLook.set(color, look); return look;
}
function makeBoard(color){
  // origin = where the wheels touch; deck runs along local X, nose at +X
  const g = new THREE.Group(), L = lookFor(color);
  g.add(new THREE.Mesh(DECK_GEO, [L.graphic, L.ply]));
  g.add(new THREE.Mesh(TAPE_GEO, tapeMat));
  for (const x of [-0.027, 0.027]){
    const at = (geo, mat, y, z = 0, dx = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x + dx, y, z); g.add(m); return m; };
    at(BASE_GEO, metal, DECK_Y - 0.0006);                          // baseplate
    at(BUSH_GEO, L.bush, DECK_Y - 0.0021);                         // bushing
    at(KING_GEO, darkMetal, DECK_Y - 0.0024);                      // kingpin
    at(HANGER_GEO, metal, WHEEL_R + 0.0008);                       // hanger
    at(AXLE_GEO, metal, WHEEL_R);                                  // axle
    for (const z of [-0.0135, 0.0135]){ at(WHEEL_GEO, L.wheel, WHEEL_R, z); at(BEARING_GEO, metal, WHEEL_R, z); }
    for (const bx of [-0.0032, 0.0032]) for (const bz of [-0.0032, 0.0032]) at(BOLT_GEO, metal, DECK_Y + DECK_T + 0.0006, bz, bx);   // bolt heads on the grip
  }
  return g;
}
// Riders, rebuilt from Fingerline: drawn there in Fingerline units (deck = 40 long, y grows downward from the
// fingertips' plane at -10.4), converted here to board metres (x along the deck, y up, z across)
const PALM_GEO = new THREE.SphereGeometry(1, 16, 12);
SHARED.add(PALM_GEO);
const FL_DECK = -10.4, GRIP_TOP = DECK_Y + DECK_T + 0.0003;
function riderKit(k, lift){
  const g = new THREE.Group(), up = new THREE.Vector3(0, 1, 0);
  const V = (x, y, z = 0) => new THREE.Vector3(x * k, GRIP_TOP + lift + (FL_DECK - y) * k, -z * k);
  const bone = (a, b, r, mat) => {
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(r * k, a.distanceTo(b), 4, 10), mat);
    m.position.copy(a).lerp(b, .5); m.quaternion.setFromUnitVectors(up, b.clone().sub(a).normalize()); g.add(m); return m;
  };
  const ball = (p, r, mat) => { const m = new THREE.Mesh(PALM_GEO, mat); m.position.copy(p); m.scale.setScalar(r * k); g.add(m); return m; };
  return { g, V, bone, ball, up };
}
const SKIN = 0xd9a47c, SKIN_DARK = 0xb98660;
// a fingerboarding hand: index on the tail, middle on the nose, ring and pinky curled, thumb tucked; sleeve cuff in the run's colour
const HAND_K = 0.0028;                                               // Fingerline's hand, about 30% bigger against this board
function makeHand(color){
  const { g, V, bone, ball, up } = riderKit(HAND_K, 2.7 * HAND_K);
  const std = (c, r = .7) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
  const skin = std(SKIN), dark = std(SKIN_DARK), nail = std(0xf2d9cc, .25), sleeve = std(color, .6);
  const c = 0.3, pb = FL_DECK - 23 + 6 * c;
  bone(V(1, pb - 12), V(-6, pb - 30), 6.2, skin);                   // forearm
  bone(V(-5.2, pb - 27), V(-6.6, pb - 31), 7.6, sleeve);            // cuff
  ball(V(-8.8, pb - 2.5, -3.2), 3.6, dark); ball(V(-10.6, pb - 7.5, -5.4), 3.3, dark);   // curled ring + pinky
  const palm = new THREE.Mesh(new RoundedBoxGeometry(20 * HAND_K, 19.5 * HAND_K, 13 * HAND_K, 3, 5 * HAND_K), skin);
  palm.position.copy(V(0.5, pb - 9)); palm.rotation.z = -0.12; g.add(palm);
  const F = [{ tip: [-8.5, FL_DECK, -2.4], pip: [-6 + 3 * c, FL_DECK - 12 + 3 * c, -2.4], mcp: [-4.5, pb, -2.4], m: dark },
             { tip: [7.5, FL_DECK, 2.4], pip: [10 + 3 * c, FL_DECK - 12 + 3 * c, 2.4], mcp: [5, pb, 2.4], m: skin }];
  for (const f of F){
    const tip = V(...f.tip), pip = V(...f.pip), mcp = V(...f.mcp);
    bone(mcp, pip, 2.8, f.m); bone(pip, tip, 2.7, f.m); ball(pip, 2.8, f.m); ball(tip, 2.7, f.m);
    const d = [f.pip[0] - f.tip[0], f.pip[1] - f.tip[1]], L = Math.hypot(...d);
    const n = ball(V(f.tip[0] + d[0] / L * 2.2, f.tip[1] + d[1] / L * 2.2, f.tip[2] + 2.2), 1, nail);
    n.scale.set(1.8 * HAND_K, 2.4 * HAND_K, 0.9 * HAND_K); n.quaternion.setFromUnitVectors(up, pip.clone().sub(tip).normalize());
  }
  const A = V(6, pb - 7, 5), B = V(10.5, pb - 4.5, 5), C = V(11, pb - 0.5, 5);   // thumb
  bone(A, B, 2.4, skin); bone(B, C, 2.3, skin); ball(B, 2.4, skin); ball(C, 2.3, skin);
  return g;
}
// a little skater from Fingerline's figure: knees bent, arms out, facing the nose. SKATER_H is the whole height in metres.
const SKATER_H = 0.0183;
function ik2(a, b, L1, L2, sgn){
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.01) || 0.01;
  const ang = Math.atan2(dy, dx) + sgn * Math.acos(THREE.MathUtils.clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  return [a[0] + Math.cos(ang) * L1, a[1] + Math.sin(ang) * L1];
}
function makeSkater(color){
  const u = SKATER_H / 45, { g, V, bone, ball } = riderKit(u, 0);
  const idx = COLORS.indexOf(color), std = (c, r = .6) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
  const shirt = std(color), pants = std(0x2c3038), skin = std(SKIN, .7), shoes = std(0xf1ece2), ink = std(0x1d2026);
  const hat = std(COLORS[((idx >= 0 ? idx : 2) + 3) % COLORS.length]);
  const c = 0.35, th = 11.5, sh = 11.5, tor = 14, ua = 7.5, fa = 7.5;
  const fb = [-8.5, FL_DECK - 1.2], ff = [8.5, FL_DECK - 1.2];
  const hip = [-0.6 - c * 1.2, FL_DECK - (th + sh) * (0.92 - 0.34 * c)], lean = 0.1 + 0.22 * c;
  const sho = [hip[0] + Math.sin(lean) * tor, hip[1] - Math.cos(lean) * tor];
  const kb = ik2(hip, fb, th, sh, 1), kf = ik2(hip, ff, th, sh, -1);
  const arm = (a1, a2) => { const e = [sho[0] + Math.cos(a1) * ua, sho[1] + Math.sin(a1) * ua]; return [e, [e[0] + Math.cos(a2) * fa, e[1] + Math.sin(a2) * fa]]; };
  const back = arm(Math.PI - 0.35 + 0.35 * c, Math.PI + 0.25 + 0.3 * c), front = arm(0.45 - 0.25 * c, 1.05 - 0.2 * c);
  const P = (q, z = 0) => V(q[0], q[1], z);
  for (const [knee, foot, z] of [[kb, fb, -2.6], [kf, ff, 2.6]]){
    bone(P(hip, z * 0.6), P(knee, z), 2.2, pants); bone(P(knee, z), P(foot, z), 2.0, pants); ball(P(knee, z), 2.1, pants);
    const shoe = new THREE.Mesh(new THREE.CapsuleGeometry(1.4 * u, 3.6 * u, 4, 8), shoes);
    shoe.position.copy(V(foot[0] + 0.8, foot[1] + 0.4, z)); shoe.rotation.z = Math.PI / 2; g.add(shoe);
  }
  bone(P(hip), P(sho), 4.2, shirt); ball(P(hip), 3.6, pants); ball(P(sho), 4.2, shirt);
  for (const [a, z] of [[back, -5], [front, 5]]){
    bone(P(sho, z), P(a[0], z), 1.8, shirt); bone(P(a[0], z), P(a[1], z), 1.4, skin); ball(P(a[0], z), 1.8, shirt); ball(P(a[1], z), 1.8, skin);
  }
  const R = 5.3, hc = [sho[0] + Math.sin(lean) * 6.2, sho[1] - Math.cos(lean) * 6.2];
  ball(P(hc), R, skin);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), hat);
  cap.position.copy(V(hc[0], hc[1] - 0.6)); cap.scale.setScalar((R + 0.6) * u); cap.rotation.z = lean * 0.6; g.add(cap);
  const brim = new THREE.Mesh(new THREE.BoxGeometry(4.5 * u, 0.8 * u, 7 * u), hat);
  brim.position.copy(V(hc[0] + R * 0.9, hc[1] - 0.6)); brim.rotation.z = lean * 0.6; g.add(brim);

function edgeVecs(e){ const v = []; for (let i = 0; i < e.pts.length; i += 3) v.push(new THREE.Vector3(e.pts[i], e.pts[i+1], e.pts[i+2])); return v; }
function edgeCurve(e){

  return new THREE.CatmullRomCurve3(v, false, 'centripetal');
}
function findFaces(){
  const E = store.cage.edges, adj = new Map();
  E.forEach((e, i) => { if (e.a === e.b) return;
    for (const [x, y] of [[e.a, e.b], [e.b, e.a]]){ if (!adj.has(x)) adj.set(x, []); adj.get(x).push({ to: y, ei: i }); } });
  const nb = x => adj.get(x) || [], linked = (x, y) => nb(x).some(o => o.to === y);
  const seen = new Set(), cands = [];
  const tryAdd = (nodes, eis) => {
    const key = [...eis].sort((p, q) => p - q).join(','); if (seen.has(key)) return; seen.add(key);
    const n = nodes.length;                                      // skip loops cut through by another edge
    for (let i = 0; i < n; i++) for (let j = i + 2; j < n; j++){ if (i === 0 && j === n - 1) continue; if (linked(nodes[i], nodes[j])) return; }
    cands.push({ nodes, eis });
  };
  E.forEach((e, i) => {
    if (e.a === e.b) return;
    const path = [e.a, e.b], eis = [i];
    const dfs = () => {
      const last = path[path.length - 1];
      for (const o of nb(last)){
        if (eis.includes(o.ei)) continue;
        if (o.to === path[0]){ if (path.length >= 3) tryAdd([...path], [...eis, o.ei]); continue; }
        if (path.includes(o.to) || path.length >= 6) continue;
        path.push(o.to); eis.push(o.ei); dfs(); path.pop(); eis.pop();

  cands.sort((p, q) => p.nodes.length - q.nodes.length);

  for (const f of cands){
    if (f.eis.some(ei => (use.get(ei) || 0) >= 2)) continue;
    f.eis.forEach(ei => use.set(ei, (use.get(ei) || 0) + 1)); faces.push(f);

}
function sidePoints(ei, from){ const e = store.cage.edges[ei], v = edgeVecs(e); return e.a === from ? v : v.reverse(); }

  while (sides.length > 4){
    let best = 0, bestA = Infinity;
    for (let k = 0; k < sides.length; k++){

      const t1 = A[A.length - 1].clone().sub(A[A.length - 2]).normalize(), t2 = B[1].clone().sub(B[0]).normalize();
      const ang = t1.angleTo(t2); if (ang < bestA){ bestA = ang; best = k; }
    }
    const k2 = (best + 1) % sides.length, merged = sides[best].concat(sides[k2].slice(1));
    if (k2 === 0){ sides[best] = merged; sides.shift(); } else sides.splice(best, 2, merged);

}
function sampleSide(pts){
  const v = pts.map(p => p.clone()); if (v.length === 2) v.splice(1, 0, v[0].clone().lerp(v[1], 0.5));
  const c = new THREE.CatmullRomCurve3(v, false, 'centripetal');
  return Array.from({ length: PATCH_RES + 1 }, (_, i) => c.getPointAt(i / PATCH_RES));
}
function coonsGeometry(face){
  const S = faceSides(face), R = PATCH_RES, rev = a => [...a].reverse();
  let c0, c1, d0, d1, P00, P10, P01, P11;
  if (S.length === 4){
    c0 = sampleSide(S[0]); d1 = sampleSide(S[1]); c1 = sampleSide(rev(S[2])); d0 = sampleSide(rev(S[3]));
    P00 = S[0][0]; P10 = S[1][0]; P11 = S[2][0]; P01 = S[3][0];
  } else {                                                       // triangle: one side shrinks to a point
    c0 = sampleSide(S[0]); d1 = sampleSide(S[1]); c1 = sampleSide(rev(S[2]));
    P00 = S[0][0]; P10 = S[1][0]; P11 = S[2][0]; P01 = P00; d0 = Array.from({ length: R + 1 }, () => P00);
  }
  const pos = new Float32Array((R + 1) * (R + 1) * 3), p = new THREE.Vector3();
  for (let i = 0; i <= R; i++) for (let j = 0; j <= R; j++){
    const u = i / R, v = j / R;
    p.set(0, 0, 0)
      .addScaledVector(c0[i], 1 - v).addScaledVector(c1[i], v).addScaledVector(d0[j], 1 - u).addScaledVector(d1[j], u)

    pos.set([p.x, p.y, p.z], (i * (R + 1) + j) * 3);

  applyGuides(pos, R);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const idx = []; for (let i = 0; i < R; i++) for (let j = 0; j < R; j++){ const q = i * (R + 1) + j; idx.push(q, q + R + 1, q + 1, q + 1, q + R + 1, q + R + 2); }
  geo.setIndex(idx); geo.computeVertexNormals(); return geo;
}
function rebuildCage(){
  disposeTree(cageGroup); cageGroup.clear(); nodeMeshes = [];

    const n = e.pts.length / 3;
    cageGroup.add(new THREE.Mesh(new THREE.TubeGeometry(edgeCurve(e), Math.max(8, n * 2), 0.0025, 6, false), edgeMatC));
  }
  for (const g of store.cage.guides){
    const v = []; for (let i = 0; i < g.length; i += 3) v.push(new THREE.Vector3(g[i], g[i+1], g[i+2]));
    if (v.length >= 2) cageGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(v), Math.max(8, v.length * 2), 0.0018, 6, false), guideMatC));
  }
  store.cage.nodes.forEach(n => { const m = new THREE.Mesh(nodeGeo, nodeMatC); m.position.set(...n); cageGroup.add(m); nodeMeshes.push(m); });

function setCage(c){ store.cage = JSON.parse(JSON.stringify(c)); rebuildCage(); save(); }
const cageAct = (before, after) => ({ redo: () => setCage(after), undo: () => setCage(before) });

function nearestNode(p, max = SNAP){
  let best = -1, bd = max;
  store.cage.nodes.forEach((n, i) => { const d = _c.set(...n).distanceTo(p); if (d < bd){ bd = d; best = i; } });
  return best;
}
function nearestEdgePoint(p, max = 0.025){
  let best = null, bd = max;
  store.cage.edges.forEach((e, ei) => { const n = e.pts.length / 3;
    for (let i = 1; i < n - 1; i++){ const d = _c.set(e.pts[i*3], e.pts[i*3+1], e.pts[i*3+2]).distanceTo(p); if (d < bd){ bd = d; best = { ei, i }; } } });
  return best;
}
const _c = new THREE.Vector3();
function snapTo(p){ // join an existing corner, split an edge you landed on, or start a new corner
  const C = store.cage; let k = nearestNode(p); if (k >= 0) return k;
  const ep = nearestEdgePoint(p);
  if (ep){
    const e = C.edges[ep.ei];
    C.nodes.push([e.pts[ep.i*3], e.pts[ep.i*3+1], e.pts[ep.i*3+2]]); k = C.nodes.length - 1;
    C.edges.splice(ep.ei, 1, { a: e.a, b: k, pts: e.pts.slice(0, (ep.i + 1) * 3) }, { a: k, b: e.b, pts: e.pts.slice(ep.i * 3) });
    return k;
  }
  C.nodes.push([r4(p.x), r4(p.y), r4(p.z)]); return C.nodes.length - 1;
}
function resample(pts, step){
  const out = [pts[0].clone()]; let carry = 0;
  for (let i = 1; i < pts.length; i++){
    const a = pts[i - 1], b = pts[i], L = a.distanceTo(b); let t = step - carry;
    while (t <= L){ out.push(a.clone().lerp(b, t / L)); t += step; }
    carry = L - (t - step);
  }
  if (out[out.length - 1].distanceTo(pts[pts.length - 1]) > step * 0.3) out.push(pts[pts.length - 1].clone());
  else out[out.length - 1] = pts[pts.length - 1].clone();

}
const flat = vs => vs.flatMap(v => [r4(v.x), r4(v.y), r4(v.z)]);
function addEdgeStroke(arr){
  let pts = []; for (let i = 0; i < arr.length; i += 3) pts.push(new THREE.Vector3(arr[i], arr[i+1], arr[i+2]));
  if (pts.length < 2) return;
  pts = resample(pts, 0.01);
  let len = 0; for (let i = 1; i < pts.length; i++) len += pts[i].distanceTo(pts[i - 1]);
  if (len < 0.03 || pts.length < 3) return;
  const before = cloneCage(), C = store.cage;
  if (pts[0].distanceTo(pts[pts.length - 1]) < 0.035 && len > 0.16){
    // a closed loop becomes four edges with corners at quarter lengths, so it fills right away
    pts[pts.length - 1] = pts[0].clone();
    const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
    const cut = [0, 1, 2, 3].map(q => { if (!q) return 0; let i = 0; while (cum[i] < len * q / 4) i++; return i; });
    cut.push(pts.length - 1);
    const corners = cut.slice(0, 4).map(i => snapTo(pts[i]));
    corners.push(corners[0]);
    for (let s = 0; s < 4; s++){
      const seg = pts.slice(cut[s], cut[s + 1] + 1);
      seg[0] = nodeV(corners[s]); seg[seg.length - 1] = nodeV(corners[s + 1]);
      C.edges.push({ a: corners[s], b: corners[s + 1], pts: flat(seg) });
    }
  } else {
    const a = snapTo(pts[0]), b = snapTo(pts[pts.length - 1]);
    if (a === b){ setCage(before); return; }
    pts[0] = nodeV(a); pts[pts.length - 1] = nodeV(b);

// guides: curves drawn across a patch from one side to another. The patch bends smoothly through them (no crease).
function applyGuides(pos, R){

  const onBorder = p => { let bd = Infinity, best = null;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++){
      if (i && j && i !== R && j !== R) continue;
      const k = at(i, j), d = (pos[k] - p[0]) ** 2 + (pos[k+1] - p[1]) ** 2 + (pos[k+2] - p[2]) ** 2;
      if (d < bd){ bd = d; best = [i, j]; } }
    return { ij: best, d: Math.sqrt(bd) }; };

    const n = g.length / 3; if (n < 3) continue;
    const ea = onBorder(g.slice(0, 3)), eb = onBorder(g.slice((n - 1) * 3, n * 3));
    if (ea.d > 0.04 || eb.d > 0.04) continue;                     // this guide doesn't start and end on this patch

    if ((ia === ib && (ia === 0 || ia === R)) || (ja === jb && (ja === 0 || ja === R))) continue;   // runs along one side

      const e = fix.get(key); if (e){ e.s[0] += r[0]; e.s[1] += r[1]; e.s[2] += r[2]; e.n++; } else fix.set(key, { s: r, n: 1 });
    }

}
function addGuideStroke(arr){
  let pts = []; for (let i = 0; i < arr.length; i += 3) pts.push(new THREE.Vector3(arr[i], arr[i+1], arr[i+2]));
  if (pts.length < 2) return;
  pts = resample(pts, 0.01); if (pts.length < 4) return;
  const before = cloneCage();
  for (const end of [0, pts.length - 1]){                         // land the ends exactly on the edges they touch
    const nk = nearestNode(pts[end]);
    if (nk >= 0) pts[end] = nodeV(nk);
    else { const ep = nearestEdgePoint(pts[end], 0.04); if (ep){ const e = store.cage.edges[ep.ei]; pts[end].set(e.pts[ep.i*3], e.pts[ep.i*3+1], e.pts[ep.i*3+2]); } }

// drag a corner: the edges that meet there bend with it, most at the corner and fading to nothing at their far ends
function moveNode(h, target){
  const C = store.cage, base = h.base, d = target.clone().sub(new THREE.Vector3(...base.nodes[h.k]));
  C.nodes[h.k] = [target.x, target.y, target.z];
  C.edges.forEach((e, ei) => {
    const be = base.edges[ei]; if (!be || (e.a !== h.k && e.b !== h.k)) return;
    const n = be.pts.length / 3;
    for (let i = 0; i < n; i++){
      const s = n > 1 ? i / (n - 1) : 0, w = (e.a === h.k ? 1 - s : 0) + (e.b === h.k ? s : 0);
      for (let c = 0; c < 3; c++) e.pts[i*3 + c] = be.pts[i*3 + c] + d.getComponent(c) * w;
    }

}
function deleteNode(k){
  const C = store.cage;
  C.edges = C.edges.filter(e => e.a !== k && e.b !== k).map(e => ({ ...e, a: e.a > k ? e.a - 1 : e.a, b: e.b > k ? e.b - 1 : e.b }));
  C.nodes.splice(k, 1);
}
function rayNode(ro, rd){
  let best = null, bs = Infinity;
  store.cage.nodes.forEach((n, k) => {
    _c.set(...n).sub(ro); const t = _c.dot(rd); if (t < 0.03 || t > 3) return;
    const d = Math.sqrt(Math.max(0, _c.lengthSq() - t * t));
    if (d < Math.max(0.012, t * 0.025) && d / t < bs){ bs = d / t; best = { kind: 'node', k, t }; }

// ================= undo / redo =================
const undoStack = [], redoStack = [];
function act(a){ a.redo(); undoStack.push(a); redoStack.length = 0; }
function undo(){ const a = undoStack.pop(); if (a){ a.undo(); redoStack.push(a); } }
function redo(){ const a = redoStack.pop(); if (a){ a.redo(); undoStack.push(a); } }
const addLineAct = d => ({ redo: () => showLine(d), undo: () => hideLine(d) });
const delLineAct = d => ({ redo: () => hideLine(d), undo: () => showLine(d) });
const addStrokeAct = s => ({ redo: () => showStroke(s), undo: () => hideStroke(s) });
const moveAct = (d, from, to) => ({ redo: () => placeLine(d, to.p, to.q), undo: () => placeLine(d, from.p, from.q) });
const addSurfAct = (d, used) => ({ redo: () => { showSurface(d); markUsed(used, true); }, undo: () => { hideSurface(d); markUsed(used, false); } });
const delSurfAct = d => ({ redo: () => hideSurface(d), undo: () => showSurface(d) });
const cpAct = (d, from, to) => ({ redo: () => setCP(d, to), undo: () => setCP(d, from) });

function makeSurfaceFromScribbles(){
  const fresh = store.strokes.filter(s => !s.used); if (!fresh.length) return false;
  let pts = [];
  fresh.forEach(sd => { for (let i = 0; i < sd.a.length; i += 3) pts.push(new THREE.Vector3(sd.a[i], sd.a[i+1], sd.a[i+2])); });
  if (pts.length > 500){ const k = Math.ceil(pts.length / 500); pts = pts.filter((p, i) => i % k === 0); }
  const cp = fitSurface(pts); if (!cp) return false;
  act(addSurfAct({ cp }, fresh)); return true;
}

// A sphere at the pen tip. They work on recorded paths, sketches, teal edges and purple guides (Erase lines also
// takes whole patches). Each trigger pull is one undo step.
const BRUSH_TOOLS = new Set(['smooth', 'cut', 'erase']);
const TOOL_INFO = {
  sketch: { label: 'Sketch', icon: 'draw', col: '#f3eee4', note: 'trigger draws, stick ↕ sets brush size' },
  edge:   { label: 'Edges', icon: 'edge', col: '#35c2b0', note: 'close a loop or cross one and it fills' },
  guide:  { label: 'Guides', icon: 'guide', col: '#b79bff', note: 'the patch bends smoothly through them' },
  smooth: { label: 'Smooth', icon: 'smooth', col: '#5fe0b8', note: 'sweep the sphere through wobbly paths and sketches' },
  cut:    { label: 'Erase bits', icon: 'cut', col: '#f04348', note: 'cuts away whatever the sphere touches' },
  erase:  { label: 'Erase lines', icon: 'erase', col: '#ff8a3d', note: 'touch a path, sketch, edge or patch to remove it' } };
const TOOL_ORDER = ['sketch', 'edge', 'guide', 'smooth', 'cut', 'erase'];
store.toolR = store.toolR || 0.015;

// undo for brush strokes: remember every line and sketch by identity plus its contents, so older undo steps still work
function capture(){
  const k = arr => arr.map(o => ({ o, v: JSON.stringify(o) }));
  return { lines: k(store.lines), strokes: k(store.strokes), surfaces: store.surfaces.slice(), cage: JSON.stringify(store.cage) };
}
function restore(c){
  const put = arr => arr.map(({ o, v }) => { const d = JSON.parse(v); Object.keys(o).forEach(key => delete o[key]); return Object.assign(o, d); });
  store.lines = put(c.lines); store.strokes = put(c.strokes); store.surfaces = c.surfaces.slice(); store.cage = JSON.parse(c.cage);
  rebuildVisuals(); save();
}
function rebuildVisuals(){
  lineObjs.splice(0).forEach(o => { scene.remove(o.group); disposeTree(o.group); });
  strokeObjs.splice(0).forEach(o => { scene.remove(o.mesh); o.mesh.geometry.dispose(); });
  surfObjs.splice(0).forEach(o => { scene.remove(o.group); disposeTree(o.group); });
  store.lines.forEach(buildLine); [...store.strokes].forEach(showStroke); store.surfaces.forEach(buildSurface); rebuildCage();
  if (selectedLine && !store.lines.includes(selectedLine)) selectedLine = null;
  syncReplay();
}
function pushAct(a){ undoStack.push(a); redoStack.length = 0; }

function inSphere(a, j, c, R2){ const dx = a[j] - c.x, dy = a[j + 1] - c.y, dz = a[j + 2] - c.z; return dx * dx + dy * dy + dz * dz < R2; }
function anyIn(a, stride, off, c, R){ const R2 = R * R; for (let j = off; j < a.length; j += stride) if (inSphere(a, j, c, R2)) return true; return false; }
const _lp = new THREE.Vector3();
const lineVisible = o => !o.data.hidden && store.view.paths;
const localOf = (o, p) => o.group.worldToLocal(_lp.copy(p));
function pruneNodes(){ const C = store.cage; for (let k = C.nodes.length - 1; k >= 0; k--) if (!C.edges.some(e => e.a === k || e.b === k)) deleteNode(k); }
function eraseCageAt(p, R){ // edges and guides go whole: an edge cut in half has no corner to end on
  const C = store.cage, n0 = C.edges.length + C.guides.length;
  C.edges = C.edges.filter(e => !anyIn(e.pts, 3, 0, p, R)); C.guides = C.guides.filter(g => !anyIn(g, 3, 0, p, R));
  if (C.edges.length + C.guides.length === n0) return false;
  pruneNodes(); rebuildCage(); return true;
}
function eraseAt(p, R){
  let did = false;
  for (const o of [...lineObjs]) if (lineVisible(o) && anyIn(o.data.s, 8, 1, localOf(o, p), R)){ hideLine(o.data); did = true; }
  if (store.view.sketches) for (const so of [...strokeObjs]) if (anyIn(so.sd.a, 3, 0, p, R)){ hideStroke(so.sd); did = true; }
  if (eraseCageAt(p, R)) did = true;
  let so; while ((so = nearestSurf(p, R))){ hideSurface(so.data); did = true; }
  return did;
}
// split a recorded run, keeping each piece's timing and tricks
function sliceLine(d, i0, i1){
  const s = d.s, t0 = s[i0 * 8], t1 = s[i1 * 8], out = s.slice(i0 * 8, (i1 + 1) * 8);
  for (let i = 0; i < out.length; i += 8) out[i] = r4(out[i] - t0);
  let y0 = d.y0 || 0; const tricks = [];
  for (const tr of d.tricks || []){ if (tr.t + tr.d <= t0) y0 += tr.y || 0; else if (tr.t < t1) tricks.push({ ...tr, t: r4(tr.t - t0) }); }

const GROW_SIDES = 6, GROW_MAX = 3000, GROW_R = 0.0018;
const growIdx = (() => {

  geo.setIndex(growIdx); geo.setDrawRange(0, 0);

        laserGeo.attributes.position.setXYZ(0, ro.x, ro.y, ro.z); laserGeo.attributes.position.setXYZ(1, beam.x, beam.y, beam.z);
        laserGeo.attributes.position.needsUpdate = true;
      }

      st.grip.getWorldPosition(_a);
      if (!st.held && !aim){ const nk = nearestNode(_a); if (nk >= 0) hotNode = nk; else { const c = nearestCP(_a, 0.03); if (c) hotCP = c; } }
      if (down(1) && !st.held){
        const nk = nearestNode(_a), c = nk >= 0 ? null : nearestCP(_a, 0.03);
        if (nk >= 0) st.held = { type: 'node', k: nk, base: cloneCage(), off: nodeV(nk).sub(_a) };
        else if (c) st.held = { type: 'cp', o: c.o, k: c.k, from: c.o.data.cp.slice(),
          off: _b.set(c.o.data.cp[c.k*3], c.o.data.cp[c.k*3+1], c.o.data.cp[c.k*3+2]).sub(_a).clone() };
        else {
          const o = nearestLine(_a, 0.06);
          if (o){ o.group.updateMatrixWorld();
            st.held = { type: 'line', o, from: { p: o.data.p.slice(), q: o.data.q.slice() },
              offset: new THREE.Matrix4().copy(st.grip.matrixWorld).invert().multiply(o.group.matrixWorld) }; }
          else { const so = nearestSurf(_a, 0.05);
            if (so) st.held = { type: 'surf', o: so, from: so.data.cp.slice(), inv: new THREE.Matrix4().copy(st.grip.matrixWorld).invert() }; }
        }
      }
      if (st.held && !isRay(st.held) && pressed(1)){
        const h = st.held;
        if (h.type === 'node'){ moveNode(h, _b.copy(_a).add(h.off).clone()); hotNode = h.k; }
        else if (h.type === 'line'){ _m.multiplyMatrices(st.grip.matrixWorld, h.offset); _m.decompose(h.o.group.position, h.o.group.quaternion, _s); }
        else if (h.type === 'cp'){ const p = _b.copy(_a).add(h.off), cp = h.o.data.cp; cp[h.k*3] = p.x; cp[h.k*3+1] = p.y; cp[h.k*3+2] = p.z; refreshSurface(h.o); }
        else { _m.multiplyMatrices(st.grip.matrixWorld, h.inv); const cp = h.o.data.cp;
          for (let k = 0; k < NC * NC; k++){ _b.set(h.from[k*3], h.from[k*3+1], h.from[k*3+2]).applyMatrix4(_m); cp[k*3] = _b.x; cp[k*3+1] = _b.y; cp[k*3+2] = _b.z; }
          refreshSurface(h.o); }
        if (down(5)){                                 // delete what you're holding
          st.held = null; usedB = true;
          if (h.type === 'line'){ placeLine(h.o.data, h.from.p, h.from.q); act(delLineAct(h.o.data)); }
          else if (h.type === 'node'){ setCage(h.base); deleteNode(h.k); act(cageAct(h.base, cloneCage())); }
          else { setCP(h.o.data, h.from); act(delSurfAct(h.o.data)); }
        }
      }
      if (up(1) && !isRay(st.held)) releaseHeld(st);
      if (down(5) && !usedB && !st.held && !st.brushing) undo();
      if (down(0) && !st.menuClick && !myDial){
        if (brushTool) st.brushing = startBrush();
        else st.sketch = { r: store.brush, a: [], used: false, kind: store.tool };
      }
      if (st.brushing && pressed(0)){ st.pen.getWorldPosition(_c); applyBrush(st.brushing, _c, dt); }
      if (st.brushing && !pressed(0)) endBrush(st);
      if ((store.tool === 'edge' || store.tool === 'guide') && !st.held){ st.pen.getWorldPosition(_c); const nk = nearestNode(_c), ep = nk >= 0 ? null : nearestEdgePoint(_c);
        if (nk >= 0){ snapMarker.position.copy(nodeV(nk)); snapMarker.visible = true; }
        else if (ep){ const e = store.cage.edges[ep.ei]; snapMarker.position.set(e.pts[ep.i*3], e.pts[ep.i*3+1], e.pts[ep.i*3+2]); snapMarker.visible = true; } }
      if (st.sketch && pressed(0)){
        st.pen.getWorldPosition(_a);
        const a = st.sketch.a, k = a.length;
        if (!k || _b.set(a[k-3], a[k-2], a[k-1]).distanceTo(_a) > 0.004){
          const live = st.sketch.kind === 'sketch' ? st.liveSketch : st.liveEdge;
          a.push(r4(_a.x), r4(_a.y), r4(_a.z)); live.visible = true; livePush(live, _a);
        }
      }
      if (up(0) && st.sketch){
        const sd = st.sketch; st.sketch = null; liveReset(st.liveSketch); liveReset(st.liveEdge);
        const kind = sd.kind; delete sd.kind;
        if (kind === 'edge') addEdgeStroke(sd.a);
        else if (kind === 'guide') addGuideStroke(sd.a);
        else if (sd.a.length >= 6) act(addStrokeAct(sd));
      }
      // A: hold for the tool dial, tap for scribble → patch
      if (down(4) && !dial && !st.sketch && !st.brushing){ st.grip.getWorldPosition(_a); openDial(st, _a.clone()); }
      if (myDial){ st.grip.getWorldPosition(_a); updateDial(gp, _a); }
      if (myDial && !pressed(4) && closeDial(true) === 'tap' && !makeSurfaceFromScribbles())
        flash = { text: 'Scribble a bit more first', until: now + 1.5, color: '#ff9a6a' };
    }
    st.prev = gp.buttons.map(b => b.pressed);
  }
  if (!rider) laser.visible = false;
  surfObjs.forEach(o => o.handles.forEach(h => h.material = cpMat));
  if (hotCP) hotCP.o.handles[hotCP.k].material = cpHot;
  nodeMeshes.forEach((m, k) => m.material = k === hotNode ? nodeHotC : nodeMatC);

  trickSprite.visible = !!rider && now < trickUntil;
  if (trickSprite.visible){ rider.board.getWorldPosition(trickSprite.position); trickSprite.position.y += 0.07; }
  // button labels above the riding controller
  labelCard.visible = !!rider && store.view.labels;
  if (labelCard.visible){
    rider.grip.getWorldPosition(labelCard.position); labelCard.position.y += 0.09;
    labelCard.lookAt(renderer.xr.getCamera().getWorldPosition(_b)); drawLabels(riderLines());
  }
  // menu text
  if (off){
    const A1 = recKey(), B1 = fitKeyName();
    const recSt = inputs.find(s => s.rec), fitSt = inputs.find(s => s.adjust);
    let title = mode === 'record' ? 'Record' : 'Compose', color = '', hint;
    if (menuPage === 'scenes'){ title = 'Scenes'; hint = 'Opening another scene keeps this one saved'; }
    else if (mode === 'record') hint = store.fitDone ? 'Hold ' + A1 + ' and ride · trigger flips the board' : 'Start with Fit board so the board sits under your fingers.';
    else hint = TOOL_INFO[store.tool] ? TOOL_INFO[store.tool].label + ': ' + TOOL_INFO[store.tool].note : '';
    if (recSt){ title = '● REC ' + (now - recSt.rec.t0).toFixed(1) + ' s'; color = '#ff5a4a'; hint = 'Let go of ' + A1 + ' to save this line'; }
    else if (fitSt){ title = 'Fit board'; color = '#e9cfa3'; hint = 'Set your two fingertips on it, then press ' + B1 + ' to lock'; }
    else if (now < flash.until){ title = flash.text; color = flash.color || '#ff9a6a'; }
    drawMenu(title, color, hint, rider ? rider.hover : '');
  }
}

// ================= view toggles =================
function applyView(){
  const v = store.view;
  lineObjs.forEach(o => {
    o.group.visible = !o.data.hidden;
    o.group.traverse(c => { if (c.userData.view) c.visible = v[c.userData.view]; if (c.userData.rider) c.visible = c.userData.rider === v.rider; });
    if (o.tube) o.tube.material.emissive.setHex(o.data === selectedLine ? 0x666666 : 0x000000);
  });
  strokeObjs.forEach(o => { o.mesh.visible = v.sketches; });
  showNets(renderer.xr.isPresenting && mode === 'compose' && v.nets);
  nodeMeshes.forEach(m => { m.visible = renderer.xr.isPresenting && mode === 'compose'; });
}

// ================= page buttons =================
const vrBtn = document.getElementById('vr'), mrBtn = document.getElementById('mr'), status = document.getElementById('status');

// ================= scenes =================
// A scene is everything you made: lines, sketches, patches and the edge cage. Board fit, riding hand and view
// settings stay with you, not the scene. Scenes live in this browser (IndexedDB, plenty of room for long runs);
// Download file / Open file move them between devices.
const sceneDB = {
  db: null,
  async open(){
    if (!this.db) this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('partylines', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('scenes', { keyPath: 'id' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async run(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('scenes', mode), req = fn(tx.objectStore('scenes'));
      tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); });
  },
  all(){ return this.run('readonly', s => s.getAll()); },
  put(sc){ return this.run('readwrite', s => s.put(sc)); },
  del(id){ return this.run('readwrite', s => s.delete(id)); }
};
let scenes = [], delArmUntil = 0;
const currentScene = () => scenes.find(s => s.id === store.sceneId) || null;
const hasContent = () => store.lines.length || store.strokes.length || store.surfaces.length || store.cage.nodes.length;
const snapshot = () => JSON.parse(JSON.stringify({ lines: store.lines, strokes: store.strokes, surfaces: store.surfaces, cage: store.cage }));
function sceneSub(sc){
  const n = sc.lines || 0, d = new Date(sc.at || sc.id);
  return n + (n === 1 ? ' line · ' : ' lines · ') + d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function note(text, color){ flash = { text, until: performance.now() / 1000 + 1.8, color: color || '#e9cfa3' }; status.textContent = text; }
function nextSceneName(){ let n = 0; scenes.forEach(s => { const m = /^Scene (\d+)$/.exec(s.name); if (m) n = Math.max(n, +m[1]); }); return 'Scene ' + (n + 1); }
function putScene(sc){ sceneDB.put(sc).catch(() => note('Could not save here. Use Download file.', '#ff9a6a')); }

function loadSceneData(d){
  settleAll();
  const c = JSON.parse(JSON.stringify(d || {}));
  store.lines = Array.isArray(c.lines) ? c.lines : [];
  store.strokes = (c.strokes || []).map(s => Array.isArray(s) ? { r: 0.0022, a: s, used: false } : s);
  store.surfaces = c.surfaces || [];
  store.cage = c.cage && c.cage.nodes ? c.cage : { nodes: [], edges: [], guides: [] };
  store.cage.guides = store.cage.guides || [];
  selectedLine = null; undoStack.length = 0; redoStack.length = 0;
  rebuildVisuals();
  nextColor = store.lines.length ? Math.max(...store.lines.map(l => l.c)) + 1 : 0;
  if (!renderer.xr.isPresenting) frameDesktop(); saveNow();
}
function saveScene(asNew, quiet){
  settleAll();
  let sc = asNew ? null : currentScene();
  if (!sc){ sc = { id: Date.now(), name: nextSceneName() }; scenes.push(sc); store.sceneId = sc.id; }
  sc.data = snapshot(); sc.at = Date.now(); sc.lines = store.lines.length;
  putScene(sc); saveNow(); refreshPageUI();
  if (!quiet) note('Saved ' + sc.name);
  return sc;
}
function keepCurrent(){ if (hasContent()) saveScene(false, true); }       // switching never loses work
function openScene(id){
  const sc = scenes.find(s => s.id === id); if (!sc) return;
  if (id === store.sceneId){ note(sc.name + ' is open'); return; }
  keepCurrent(); loadSceneData(sc.data); store.sceneId = id; saveNow(); refreshPageUI(); note('Opened ' + sc.name);
}
function newScene(){ keepCurrent(); loadSceneData(null); store.sceneId = null; saveNow(); refreshPageUI(); note('New empty scene'); }
function deleteScene(){
  const now = performance.now() / 1000;
  if (now > delArmUntil){ delArmUntil = now + 3; refreshPageUI(); setTimeout(refreshPageUI, 3100); return; }
  delArmUntil = 0;
  const sc = currentScene();
  if (sc){ scenes.splice(scenes.indexOf(sc), 1); sceneDB.del(sc.id).catch(() => {}); }
  loadSceneData(null); store.sceneId = null; saveNow(); refreshPageUI(); note(sc ? 'Deleted ' + sc.name : 'Cleared');
}

// desktop card: rider switch, scene picker, files
const riderSeg = document.getElementById('riderSeg'), sceneSel = document.getElementById('sceneSel');
const sceneSaveBtn = document.getElementById('sceneSave'), sceneDelBtn = document.getElementById('sceneDel'), fileIn = document.getElementById('fileIn');
function refreshPageUI(){
  riderSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.r === store.view.rider)));
  const cur = currentScene();
  sceneSel.replaceChildren();
  if (!cur) sceneSel.append(new Option('Unsaved scene', ''));
  [...scenes].reverse().forEach(sc => sceneSel.append(new Option(sc.name + ' · ' + (sc.lines || 0) + (sc.lines === 1 ? ' line' : ' lines'), sc.id)));
  sceneSel.value = cur ? String(cur.id) : '';
  const armed = performance.now() / 1000 < delArmUntil;
  sceneDelBtn.textContent = armed ? 'Tap again' : cur ? 'Delete' : 'Clear';
  sceneDelBtn.className = armed ? 'warn' : 'ghost';
}
riderSeg.onclick = e => { const b = e.target.closest('button'); if (!b) return; store.view.rider = b.dataset.r; save(); refreshPageUI(); };
sceneSel.onchange = () => { if (sceneSel.value) openScene(+sceneSel.value); };
sceneSaveBtn.onclick = () => saveScene(false);
document.getElementById('sceneNew').onclick = newScene;
sceneDelBtn.onclick = deleteScene;
document.getElementById('dl').onclick = () => {
  const cur = currentScene(), name = cur ? cur.name : 'Party Lines';
  const blob = new Blob([JSON.stringify({ app: 'party-lines', version: 1, name, ...snapshot() })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
document.getElementById('openFile').onclick = () => fileIn.click();
fileIn.onchange = async () => {
  const f = fileIn.files[0]; fileIn.value = ''; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch (e) { d = null; }
  if (!d || !Array.isArray(d.lines)){ note('That file isn’t a Party Lines scene', '#ff9a6a'); return; }
  keepCurrent(); loadSceneData(d); store.sceneId = null;                 // older save files (whole app state) open too
  const sc = saveScene(true, true);
  sc.name = (d.name || f.name.replace(/\.json$/i, '')).slice(0, 28) || sc.name; putScene(sc); refreshPageUI();
  note('Opened ' + sc.name);
};
refreshPageUI();
sceneDB.all().then(list => {
  scenes = list.sort((a, b) => a.id - b.id);
  if (store.sceneId && !currentScene()) store.sceneId = null;
  refreshPageUI();
}).catch(() => { scenes = []; refreshPageUI(); });

async function setupButtons(){
  if (!('xr' in navigator)){ status.textContent = 'This browser has no WebXR. Open this page in the Quest browser.'; return; }
  const [vr, ar] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false),
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false)]);
  vrBtn.disabled = !vr; mrBtn.disabled = !ar;
  status.textContent = ar ? 'Ready. MR lets you see your real fingers on the board.'
    : vr ? 'Headset found. MR only works in the Quest browser.' : 'No headset here. Your saved lines still show below.';
}
let starting = false;
async function start(kind){
  const live = renderer.xr.getSession(); if (live){ live.end(); return; }
  if (starting) return; starting = true; vrBtn.disabled = mrBtn.disabled = true;
  const session = await navigator.xr.requestSession(kind, { requiredFeatures: ['local-floor'] })
    .catch(err => { status.textContent = 'Could not start: ' + err.message; return null; });
  starting = false;
  if (!session){ setupButtons(); return; }
  if (kind === 'immersive-ar'){ scene.background = null; room.visible = false; renderer.setClearColor(0x000000, 0); }
  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(session);
  const btn = kind === 'immersive-ar' ? mrBtn : vrBtn; btn.disabled = false; btn.textContent = 'Exit';
  session.addEventListener('end', () => {
    scene.background = BG; room.visible = true; menu.visible = false; laser.visible = false; labelCard.visible = false;
    inputs.forEach(s => { if (s.rec) finishRecording(s); endFit(s); releaseHeld(s); s.sketch = null; liveReset(s.liveSketch); });
    vrBtn.textContent = 'Enter VR'; mrBtn.textContent = 'Enter MR'; setupButtons();
  });
}
vrBtn.onclick = () => start('immersive-vr');
mrBtn.onclick = () => start('immersive-ar');
navigator.xr?.addEventListener?.('devicechange', setupButtons);
setupButtons();

// frame saved work on the monitor view
function frameDesktop(){
  const box = new THREE.Box3();
  lineObjs.forEach(o => { o.group.updateMatrix(); o.pts.forEach(p => box.expandByPoint(p.clone().applyMatrix4(o.group.matrix))); });
  strokeObjs.forEach(o => box.expandByObject(o.mesh));
  surfObjs.forEach(o => box.expandByObject(o.mesh));
  if (cageGroup.children.length) box.expandByObject(cageGroup);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), r = Math.max(0.2, box.getSize(new THREE.Vector3()).length());
  orbit.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(0.6, 0.5, 0.8).multiplyScalar(r)); orbit.update();
}
frameDesktop();
showNets(false);

// ================= loop =================
let last = performance.now() / 1000;
renderer.setAnimationLoop(() => {
  const now = performance.now() / 1000, dt = Math.min(now - last, 0.05); last = now;
  if (renderer.xr.isPresenting) updateInputs(now, dt);
  applyView();
  lineObjs.forEach(o => animateGhost(o, now));
  renderer.render(scene, camera);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
