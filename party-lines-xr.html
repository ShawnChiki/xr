<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Lines XR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: full-bleed 3D viewport with one small control card. Single dark look on purpose. */
  :root{
    --bg:#16181d; --panel:rgba(22,24,29,.88); --ink:#f1ece2; --muted:#a59e92;
    --birch:#e9cfa3; --accent:#ff6b3d; --line:rgba(241,236,226,.14);
    --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
  canvas{display:block}
  .card{position:fixed;top:16px;left:16px;max-width:320px;padding:16px 18px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;display:grid;gap:10px}
  h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
  h1 span{color:var(--accent)}
  p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
  p b{color:var(--ink);font-weight:500}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:600 14px var(--display);padding:9px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--ink);color:var(--bg);cursor:pointer}
  button.ghost{background:transparent;color:var(--ink)}
  button.warn{background:var(--accent);color:#16181d}
  button:disabled{opacity:.35;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #status{font-size:12px;color:var(--birch)}
</style>
</head>
<body>
<div class="card">
  <h1>Party Lines <span>XR</span></h1>
  <p><b>Record:</b> hold A or X and ride the board with your two fingers. Each run joins the bank with its timing.<br>
     <b>Compose:</b> click the thumbstick, then grip to move lines and pull the trigger to sketch.</p>
  <div class="row">
    <button id="mr" disabled>Enter MR</button>
    <button id="vr" disabled>Enter VR</button>
  </div>
  <div class="row">
    <button id="save" class="ghost">Save file</button>
    <button id="clear" class="ghost">Clear all</button>
  </div>
  <div id="status">Checking for a headset…</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================= storage =================
const KEY = 'partylines.v2';
const COLORS = [0xff6b3d, 0x2fb3a5, 0xff5fa2, 0xf2c230, 0x4f8cff, 0x6fd16a, 0xa87bff, 0xe8463b];
// board placement relative to the controller grip: 11.5 cm out along your fingers, deck across the two fingertips
const DEFAULT_FIT = () => ({ p: [0, -0.128, 0.01], q: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI / 2).toArray() });
let store = { lines: [], strokes: [], fit: {} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.lines) store = Object.assign(store, s); } catch (e) {}
for (const h of ['left', 'right']) if (!store.fit[h] || !store.fit[h].p) store.fit[h] = DEFAULT_FIT();
let saveTimer = 0;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }, 300); }
const r4 = v => Math.round(v * 10000) / 10000;

// ================= scene =================
const BG = new THREE.Color(0x16181d);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = BG;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 50);
camera.position.set(0.5, 1.4, 0.6);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.85, -0.3); orbit.update();
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x30343c, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(1, 3, 1); scene.add(sun);
const room = new THREE.Group(); room.add(new THREE.GridHelper(6, 24, 0x3a3f49, 0x262a31)); scene.add(room);

// ================= fingerboard (96 x 28 mm, kicked nose and tail) =================
function roundedRect(hw, hd, r){
  // long edges get extra points so the kicks bend smoothly
  const s = new THREE.Shape(), N = 16, x0 = -hw + r, x1 = hw - r;
  s.moveTo(x0, -hd);
  for (let i = 1; i <= N; i++) s.lineTo(x0 + (x1 - x0) * i / N, -hd);
  s.quadraticCurveTo(hw, -hd, hw, -hd + r); s.lineTo(hw, hd - r); s.quadraticCurveTo(hw, hd, x1, hd);
  for (let i = 1; i <= N; i++) s.lineTo(x1 - (x1 - x0) * i / N, hd);
  s.quadraticCurveTo(-hw, hd, -hw, hd - r); s.lineTo(-hw, -hd + r); s.quadraticCurveTo(-hw, -hd, x0, -hd);
  return s;
}
const KICK_START = 0.031, KICK_SLOPE = 0.36;
function kick(geo){ // bend the ends up past the trucks, plus a hint of concave across the width
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), z = p.getZ(i), ax = Math.abs(x);
    let y = p.getY(i) + (ax > KICK_START ? (ax - KICK_START) * KICK_SLOPE : 0) + z * z * 1.4;
    p.setY(i, y);
  }
  geo.computeVertexNormals(); return geo;
}
function deckGeo(hw, hd, r, depth, y, bevel){
  const g = new THREE.ExtrudeGeometry(roundedRect(hw, hd, r), {
    depth, curveSegments: 12, steps: 1,
    bevelEnabled: bevel, bevelThickness: 0.0003, bevelSize: 0.0003, bevelSegments: 2 });
  g.rotateX(-Math.PI / 2); g.translate(0, y, 0);
  // subdivide-free bend still reads fine because the rounded ends carry many vertices
  return kick(g);
}
const DECK_GEO = deckGeo(0.048, 0.014, 0.012, 0.0014, 0.0098, true);
const TAPE_GEO = deckGeo(0.0475, 0.0135, 0.0115, 0.0002, 0.0115, false);
const metal = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, metalness: .8, roughness: .35 });
const tapeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 1 });
const plyMat = new THREE.MeshStandardMaterial({ color: 0xe2c494, roughness: .8 });
const wheelMat = new THREE.MeshStandardMaterial({ color: 0xf6f2ea, roughness: .45 });
const WHEEL_GEO = new THREE.CylinderGeometry(0.0045, 0.0045, 0.0042, 20); WHEEL_GEO.rotateX(Math.PI / 2);
const BEARING_GEO = new THREE.CylinderGeometry(0.0018, 0.0018, 0.0045, 12); BEARING_GEO.rotateX(Math.PI / 2);
const BASE_GEO = new THREE.BoxGeometry(0.010, 0.0012, 0.012);
const HANGER_GEO = new THREE.CylinderGeometry(0.0022, 0.0028, 0.020, 12); HANGER_GEO.rotateX(Math.PI / 2);
const KING_GEO = new THREE.CylinderGeometry(0.0016, 0.0016, 0.004, 10);
const SHARED = new Set([DECK_GEO, TAPE_GEO, WHEEL_GEO, BEARING_GEO, BASE_GEO, HANGER_GEO, KING_GEO]);
function makeBoard(color){
  // origin = where the wheels touch; deck runs along local X
  const g = new THREE.Group();
  const graphic = new THREE.MeshStandardMaterial({ color, roughness: .55 });
  g.add(new THREE.Mesh(DECK_GEO, [graphic, plyMat]));          // caps get the graphic color, edges show ply
  g.add(new THREE.Mesh(TAPE_GEO, tapeMat));
  for (const x of [-0.029, 0.029]){
    const base = new THREE.Mesh(BASE_GEO, metal); base.position.set(x, 0.0092, 0); g.add(base);
    const king = new THREE.Mesh(KING_GEO, metal); king.position.set(x, 0.0072, 0); g.add(king);
    const hanger = new THREE.Mesh(HANGER_GEO, metal); hanger.position.set(x, 0.0050, 0); g.add(hanger);
    for (const z of [-0.0125, 0.0125]){
      const w = new THREE.Mesh(WHEEL_GEO, wheelMat); w.position.set(x, 0.0045, z); g.add(w);
      const b = new THREE.Mesh(BEARING_GEO, metal); b.position.set(x, 0.0045, z); g.add(b);
    }
  }
  return g;
}
function disposeTree(obj){ obj.traverse(o => { if (o.geometry && !SHARED.has(o.geometry) && o.geometry !== dotGeo) o.geometry.dispose(); }); }

// ================= bank of recorded lines =================
// a line = samples [t, px,py,pz, qx,qy,qz,qw] in world space + a placement (group transform)
const lineObjs = [];
const dotGeo = new THREE.SphereGeometry(0.0028, 8, 6);
function buildLine(data){
  const s = data.s, n = s.length / 8;
  const color = COLORS[data.c % COLORS.length];
  const group = new THREE.Group();
  group.position.fromArray(data.p || [0, 0, 0]); group.quaternion.fromArray(data.q || [0, 0, 0, 1]);
  const pts = [];
  for (let i = 0; i < n; i++) pts.push(new THREE.Vector3(s[i*8+1], s[i*8+2], s[i*8+3]));
  const trailPts = pts.filter((p, i) => i % 2 === 0 || i === n - 1);
  if (trailPts.length >= 2){
    const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(trailPts), Math.min(900, trailPts.length * 3), 0.0018, 6, false),
      new THREE.MeshStandardMaterial({ color, roughness: .5 }));
    group.add(tube);
  }
  // timing dots every 0.1 s (spread out = fast, bunched = slow)
  const dotsAt = []; let next = 0;
  for (let i = 0; i < n; i++) if (s[i*8] >= next){ dotsAt.push(pts[i]); next += 0.1; }
  const dots = new THREE.InstancedMesh(dotGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: color, emissiveIntensity: .4 }), Math.max(1, dotsAt.length));
  const m = new THREE.Matrix4();
  dotsAt.forEach((p, i) => dots.setMatrixAt(i, m.makeTranslation(p.x, p.y, p.z)));
  dots.count = dotsAt.length; group.add(dots);
  const ghost = makeBoard(color); group.add(ghost);
  scene.add(group);
  const obj = { data, group, pts, ghost, dur: s[(n - 1) * 8], cursor: 0, t0: performance.now() / 1000 };
  lineObjs.push(obj);
  return obj;
}
const objOf = data => lineObjs.find(o => o.data === data);
function showLine(data){ if (!store.lines.includes(data)) store.lines.push(data); buildLine(data); save(); }
function hideLine(data){
  const o = objOf(data); if (o){ scene.remove(o.group); disposeTree(o.group); lineObjs.splice(lineObjs.indexOf(o), 1); }
  const i = store.lines.indexOf(data); if (i >= 0) store.lines.splice(i, 1);
  save();
}
function placeLine(data, p, q){
  data.p = p; data.q = q; const o = objOf(data);
  if (o){ o.group.position.fromArray(p); o.group.quaternion.fromArray(q); }
  save();
}
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion();
function animateGhost(obj, now){
  const s = obj.data.s, n = s.length / 8, PAUSE = 0.8;
  const t = (now - obj.t0) % (obj.dur + PAUSE);
  if (t > obj.dur){ obj.ghost.visible = false; return; }
  obj.ghost.visible = true;
  if (s[obj.cursor * 8] > t) obj.cursor = 0;
  while (obj.cursor < n - 2 && s[(obj.cursor + 1) * 8] <= t) obj.cursor++;
  const a = obj.cursor * 8, b = a + 8;
  const k = THREE.MathUtils.clamp((t - s[a]) / Math.max(1e-4, s[b] - s[a]), 0, 1);
  obj.ghost.position.set(s[a+1] + (s[b+1]-s[a+1])*k, s[a+2] + (s[b+2]-s[a+2])*k, s[a+3] + (s[b+3]-s[a+3])*k);
  _q1.set(s[a+4], s[a+5], s[a+6], s[a+7]); _q2.set(s[b+4], s[b+5], s[b+6], s[b+7]);
  obj.ghost.quaternion.slerpQuaternions(_q1, _q2, k);
}
function syncReplay(){ const now = performance.now() / 1000; lineObjs.forEach(o => { o.t0 = now; o.cursor = 0; }); }

// ================= sketch strokes =================
const strokeObjs = [];
const strokeMat = new THREE.MeshStandardMaterial({ color: 0xe9e4d8, roughness: .7, emissive: 0x222018 });
function showStroke(arr){
  if (!store.strokes.includes(arr)) store.strokes.push(arr);
  const pts = []; for (let i = 0; i < arr.length; i += 3) pts.push(new THREE.Vector3(arr[i], arr[i+1], arr[i+2]));
  if (pts.length >= 2){
    const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), Math.min(600, pts.length * 3), 0.0022, 6, false), strokeMat);
    scene.add(mesh); strokeObjs.push({ arr, mesh });
  }
  save();
}
function hideStroke(arr){
  const o = strokeObjs.find(s => s.arr === arr);
  if (o){ scene.remove(o.mesh); o.mesh.geometry.dispose(); strokeObjs.splice(strokeObjs.indexOf(o), 1); }
  const i = store.strokes.indexOf(arr); if (i >= 0) store.strokes.splice(i, 1);
  save();
}

store.lines.forEach(buildLine);
[...store.strokes].forEach(showStroke);

// ================= undo / redo (covers lines, sketches, moves, deletes) =================
const undoStack = [], redoStack = [];
function act(a){ a.redo(); undoStack.push(a); redoStack.length = 0; }
function undo(){ const a = undoStack.pop(); if (a){ a.undo(); redoStack.push(a); } }
function redo(){ const a = redoStack.pop(); if (a){ a.redo(); undoStack.push(a); } }
const addLineAct = d => ({ redo: () => showLine(d), undo: () => hideLine(d) });
const delLineAct = d => ({ redo: () => hideLine(d), undo: () => showLine(d) });
const addStrokeAct = a => ({ redo: () => showStroke(a), undo: () => hideStroke(a) });
const moveAct = (d, from, to) => ({ redo: () => placeLine(d, to.p, to.q), undo: () => placeLine(d, from.p, from.q) });

// live preview line used while recording or sketching
function makeLive(color){
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3 * 6000), 3));
  geo.setDrawRange(0, 0);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color }));
  line.frustumCulled = false; line.visible = false; scene.add(line); return line;
}
function livePush(line, p){
  const g = line.geometry, c = g.drawRange.count; if (c >= 6000) return;
  g.attributes.position.setXYZ(c, p.x, p.y, p.z); g.attributes.position.needsUpdate = true; g.setDrawRange(0, c + 1);
}
function liveReset(line){ line.geometry.setDrawRange(0, 0); line.visible = false; }

// ================= HUD (floats above your left controller) =================
const hudCanvas = document.createElement('canvas'); hudCanvas.width = 640; hudCanvas.height = 260;
const hudCtx = hudCanvas.getContext('2d');
const hudTex = new THREE.CanvasTexture(hudCanvas); hudTex.colorSpace = THREE.SRGBColorSpace;
const hud = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.065), new THREE.MeshBasicMaterial({ map: hudTex, transparent: true, depthTest: false }));
hud.renderOrder = 10; hud.visible = false; scene.add(hud);
let hudKey = '';
function drawHud(title, lines, color){
  const key = title + lines.join('|') + color; if (key === hudKey) return; hudKey = key;
  const c = hudCtx; c.clearRect(0, 0, 640, 260);
  c.fillStyle = 'rgba(22,24,29,0.88)'; c.beginPath(); c.roundRect(0, 0, 640, 260, 28); c.fill();
  c.fillStyle = color || '#f1ece2'; c.font = '800 54px "Bricolage Grotesque", Arial Black, sans-serif'; c.fillText(title, 32, 72);
  c.fillStyle = '#c9c1b4'; c.font = '500 28px "IBM Plex Sans", Arial, sans-serif';
  lines.forEach((l, i) => c.fillText(l, 32, 128 + i * 42));
  hudTex.needsUpdate = true;
}

// ================= controllers =================
let mode = 'record';
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _m = new THREE.Matrix4(), _s = new THREE.Vector3(), _q = new THREE.Quaternion();
const inputs = [0, 1].map(i => {
  const ray = renderer.xr.getController(i), grip = renderer.xr.getControllerGrip(i);
  scene.add(ray, grip);
  const board = makeBoard(0xe9cfa3); grip.add(board);   // locked to the controller
  const pen = new THREE.Mesh(new THREE.SphereGeometry(0.005, 12, 8), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444 }));
  ray.add(pen);
  const st = { ray, grip, board, pen, source: null, hand: '', prev: [], rec: null, live: makeLive(0xff3b3b),
    sketch: null, liveSketch: makeLive(0xe9e4d8), held: null, fitting: false, flick: 0 };
  ray.addEventListener('connected', e => { st.source = e.data; st.hand = e.data.handedness; applyFit(st); });
  ray.addEventListener('disconnected', () => { st.source = null; });
  return st;
});
const fitKey = st => (st.hand === 'left' ? 'left' : 'right');
function applyFit(st){ const f = store.fit[fitKey(st)]; st.board.position.fromArray(f.p); st.board.quaternion.fromArray(f.q); }

function nearestLine(worldP, maxD){
  let best = null, bd = maxD;
  for (const o of lineObjs){
    const local = o.group.worldToLocal(_b.copy(worldP));
    for (let i = 0; i < o.pts.length; i += 2){ const d = o.pts[i].distanceTo(local); if (d < bd){ bd = d; best = o; } }
  }
  return best;
}

let nextColor = store.lines.length ? (Math.max(...store.lines.map(l => l.c)) + 1) : 0;
function finishRecording(st){
  const rec = st.rec; st.rec = null; liveReset(st.live);
  if (!rec || rec.s.length < 8 * 6 || rec.s[rec.s.length - 8] < 0.3) return;
  act(addLineAct({ c: nextColor++, s: rec.s.map(r4), p: [0, 0, 0], q: [0, 0, 0, 1] }));
}
function endFit(st){
  if (!st.fitting) return; st.fitting = false;
  st.grip.attach(st.board);                         // keeps where it is now, relative to your hand
  store.fit[fitKey(st)] = { p: st.board.position.toArray().map(r4), q: st.board.quaternion.toArray().map(r4) };
  save();
}

function updateInputs(now){
  for (const st of inputs){
    const gp = st.source && st.source.gamepad;
    st.board.visible = !!gp && mode === 'record';
    st.pen.visible = !!gp && mode === 'compose';
    if (!gp) continue;
    const pressed = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const down = i => pressed(i) && !st.prev[i], up = i => !pressed(i) && st.prev[i];

    // stick flick: right = redo, left = undo (both modes)
    const ax = gp.axes[2] || 0;
    if (st.flick === 0 && ax > 0.7){ st.flick = 1; redo(); }
    else if (st.flick === 0 && ax < -0.7){ st.flick = -1; undo(); }
    else if (Math.abs(ax) < 0.3) st.flick = 0;

    if (down(3)){                                    // click thumbstick: switch mode
      inputs.forEach(o => { if (o.rec) finishRecording(o); endFit(o); o.held = null; });
      mode = mode === 'record' ? 'compose' : 'record';
    }
    else if (mode === 'record'){
      // grip: pin the board in the air, set your fingertips on it, let go to lock it to the controller
      if (down(1) && !st.rec){ st.fitting = true; scene.attach(st.board); }
      if (up(1)) endFit(st);
      if (down(4) && !st.fitting) st.rec = { s: [], t0: now, last: -1 };
      if (st.rec && pressed(4)){
        const t = now - st.rec.t0;
        if (t - st.rec.last >= 1 / 40){
          st.board.matrixWorld.decompose(_a, _q, _s);
          st.rec.s.push(t, _a.x, _a.y, _a.z, _q.x, _q.y, _q.z, _q.w); st.rec.last = t;
          st.live.visible = true; livePush(st.live, _a);
        }
      }
      if (up(4) && st.rec) finishRecording(st);
      if (down(5) && !st.rec) undo();
    }
    else { // compose
      let usedB = false;
      if (down(1)){
        st.grip.getWorldPosition(_a);
        const o = nearestLine(_a, 0.06);
        if (o){
          o.group.updateMatrixWorld();
          st.held = { o, from: { p: o.data.p.slice(), q: o.data.q.slice() },
            offset: new THREE.Matrix4().copy(st.grip.matrixWorld).invert().multiply(o.group.matrixWorld) };
        }
      }
      if (st.held && pressed(1)){
        _m.multiplyMatrices(st.grip.matrixWorld, st.held.offset);
        _m.decompose(st.held.o.group.position, st.held.o.group.quaternion, _s);
        if (down(5)){                                 // delete the line you're holding
          const h = st.held; st.held = null; usedB = true;
          placeLine(h.o.data, h.from.p, h.from.q);
          act(delLineAct(h.o.data));
        }
      }
      if (up(1) && st.held){
        const h = st.held, g = h.o.group; st.held = null;
        act(moveAct(h.o.data, h.from, { p: g.position.toArray().map(r4), q: g.quaternion.toArray().map(r4) }));
      }
      if (down(5) && !usedB && !st.held) undo();
      if (down(0)) st.sketch = [];
      if (st.sketch && pressed(0)){
        st.pen.getWorldPosition(_a);
        const k = st.sketch.length;
        if (!k || _b.set(st.sketch[k-3], st.sketch[k-2], st.sketch[k-1]).distanceTo(_a) > 0.004){
          st.sketch.push(r4(_a.x), r4(_a.y), r4(_a.z)); st.liveSketch.visible = true; livePush(st.liveSketch, _a);
        }
      }
      if (up(0) && st.sketch){
        const arr = st.sketch; st.sketch = null; liveReset(st.liveSketch);
        if (arr.length >= 6) act(addStrokeAct(arr));
      }
      if (down(4)) syncReplay();
    }
    st.prev = gp.buttons.map(b => b.pressed);
  }

  // HUD above the left controller
  const host = inputs.find(s => s.source && s.hand === 'left') || inputs.find(s => s.source);
  hud.visible = !!host;
  if (host){
    host.grip.getWorldPosition(hud.position); hud.position.y += 0.1;
    hud.lookAt(renderer.xr.getCamera().getWorldPosition(_b));
    const rec = inputs.find(s => s.rec), fit = inputs.find(s => s.fitting);
    if (rec) drawHud('● REC ' + (now - rec.rec.t0).toFixed(1) + ' s', ['Let go of A / X to save this line'], '#ff5a4a');
    else if (fit) drawHud('Fit board', ['Put your two fingertips on the board', 'Let go of grip to lock it to your hand'], '#e9cfa3');
    else if (mode === 'record') drawHud('Record', ['Hold A / X: record a line', 'Grip: pin board, place fingers, let go', 'B / Y undo  ·  Stick ← undo  → redo'], '');
    else drawHud('Compose', ['Grip: move a line  ·  Trigger: sketch', 'A / X: replay together', 'B / Y undo  ·  Stick ← undo  → redo'], '');
  }
}

// ================= page buttons =================
const vrBtn = document.getElementById('vr'), mrBtn = document.getElementById('mr'), status = document.getElementById('status');
const clearBtn = document.getElementById('clear');
let clearArmed = false;
clearBtn.onclick = () => {
  if (!clearArmed){ clearArmed = true; clearBtn.textContent = 'Tap again to clear'; clearBtn.className = 'warn';
    setTimeout(() => { clearArmed = false; clearBtn.textContent = 'Clear all'; clearBtn.className = 'ghost'; }, 3000); return; }
  [...store.lines].forEach(hideLine); [...store.strokes].forEach(hideStroke);
  undoStack.length = 0; redoStack.length = 0;
  clearArmed = false; clearBtn.textContent = 'Clear all'; clearBtn.className = 'ghost'; save();
};
document.getElementById('save').onclick = () => {
  const blob = new Blob([JSON.stringify(store)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'party-lines-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

async function setupButtons(){
  if (!('xr' in navigator)){ status.textContent = 'This browser has no WebXR. Open this page in the Quest browser.'; return; }
  const [vr, ar] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false),
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false)]);
  vrBtn.disabled = !vr; mrBtn.disabled = !ar;
  status.textContent = ar ? 'Ready. MR lets you see your real fingers on the board.'
    : vr ? 'Headset found. MR only works in the Quest browser.' : 'No headset here. Your saved lines still show below.';
}
let starting = false;
async function start(kind){
  const live = renderer.xr.getSession(); if (live){ live.end(); return; }
  if (starting) return; starting = true; vrBtn.disabled = mrBtn.disabled = true;
  const session = await navigator.xr.requestSession(kind, { requiredFeatures: ['local-floor'] })
    .catch(err => { status.textContent = 'Could not start: ' + err.message; return null; });
  starting = false;
  if (!session){ setupButtons(); return; }
  if (kind === 'immersive-ar'){ scene.background = null; room.visible = false; renderer.setClearColor(0x000000, 0); }
  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(session);
  const btn = kind === 'immersive-ar' ? mrBtn : vrBtn; btn.disabled = false; btn.textContent = 'Exit';
  session.addEventListener('end', () => {
    scene.background = BG; room.visible = true; hud.visible = false;
    inputs.forEach(s => { if (s.rec) finishRecording(s); endFit(s); s.held = null; s.sketch = null; liveReset(s.liveSketch); });
    vrBtn.textContent = 'Enter VR'; mrBtn.textContent = 'Enter MR'; setupButtons();
  });
}
vrBtn.onclick = () => start('immersive-vr');
mrBtn.onclick = () => start('immersive-ar');
navigator.xr?.addEventListener?.('devicechange', setupButtons);
setupButtons();

// frame saved work on the monitor view
(function frameDesktop(){
  const box = new THREE.Box3();
  lineObjs.forEach(o => { o.group.updateMatrix(); o.pts.forEach(p => box.expandByPoint(p.clone().applyMatrix4(o.group.matrix))); });
  strokeObjs.forEach(o => box.expandByObject(o.mesh));
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), r = Math.max(0.2, box.getSize(new THREE.Vector3()).length());
  orbit.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(0.6, 0.5, 0.8).multiplyScalar(r)); orbit.update();
})();

// ================= loop =================
renderer.setAnimationLoop(() => {
  const now = performance.now() / 1000;
  if (renderer.xr.isPresenting) updateInputs(now);
  lineObjs.forEach(o => animateGhost(o, now));
  renderer.render(scene, camera);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
