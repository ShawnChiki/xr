<style>
:root{--ink:#1d1b26;--card:rgba(255,255,255,.9);--line:rgba(29,27,38,.14)}

.sheet{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 110px);overflow:auto;background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:22px;padding:12px;box-shadow:0 12px 34px rgba(0,0,0,.22);display:flex;flex-direction:column;gap:8px}

.tapfx{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid #fff;pointer-events:none;animation:tapring .5s ease-out forwards;z-index:4}
.tapfx.no{border-color:#ff3b5c;animation:tapno .9s ease-out forwards}
.tapfx.no::after{content:attr(data-t);position:absolute;left:50%;top:50px;transform:translateX(-50%);white-space:nowrap;background:#ff3b5c;color:#fff;font-weight:600;font-size:12.5px;padding:3px 9px;border-radius:999px}

@keyframes tapno{0%{transform:translateX(0) scale(.7);opacity:1}15%{transform:translateX(-6px) scale(1)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(0);opacity:1}100%{opacity:0}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { MeshBVH, acceleratedRaycast } from 'three-mesh-bvh';

/* ============================================================
   TAFFY STRATA
   KIT OF PARTS (reverse-engineered from the photos)
   - every piece = a 2D profile curve (arch, cup, slab, step,
     L, bench, ramp, ring, wall, comb, puddle)
   - its thickness is split into BANDS (concentric colour strips)
   - its length is cut into SLICES (parallel plates that can
     shrink toward the ends like stacked contour sheets)
   - pieces stack on a coarse grid shaped like a mound
   - MELT warps everything with one smooth noise field + droop
   GAME: one giant baby eats the candy strip by strip; gummy bears
   hide inside. Any role can be a phone, a computer or a Quest,
   joined by a 4-digit room code (PeerJS). Bots fill empty roles.
   ============================================================ */

const U = 1.8, H = 1.8, TBASE = 0.4;   // cell width, level height, piece thickness (metres)

const PALETTES = {
  candy:{name:'Candy',cols:[['#f59ab8',3],['#e8467c',2],['#f8c9d6',2],['#ffd84d',2.5],['#f4ece0',1.3],['#fdfbf7',.9],['#7fb2ec',2],['#3d63d6',1.8],['#25307a',.6],['#a3e37a',1.5],['#4fbf6a',.7],['#d8344a',1],['#ff8a3d',1],['#b79be8',.8],['#1d1b24',.6],['#8a8c96',.5]]},
};
const BACKDROPS = {blue:['Blue','#3a4fd6'],pink:['Pink','#e6489f'],sky:['Sky','#7fc4ff'],mint:['Mint','#5fd3a6'],lemon:['Lemon','#ffd84a'],tangerine:['Tangerine','#ff7a45'],lilac:['Lilac','#a58be6'],grass:['Grass','#3fae5c'],night:['Night','#1c1e2b']};

const P = {foot:5,height:5,fill:6,bands:3,slices:4,melt:5,palette:'candy',backdrop:'blue',seed:7};

/* ---------------- random + noise ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function makeNoise(seed){
  const r=mulberry32(seed*7919+13), perm=new Uint16Array(512), vals=new Float32Array(256), p=[];
  for(let i=0;i<256;i++)p.push(i);
  for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)perm[i]=p[i&255];
  for(let i=0;i<256;i++)vals[i]=r()*2-1;
  const h=(x,y,z)=>vals[perm[perm[perm[x&255]+(y&255)]+(z&255)]];
  return (x,y,z)=>{
    const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
    let u=x-xi,v=y-yi,w=z-zi; u=u*u*(3-2*u); v=v*v*(3-2*v); w=w*w*(3-2*w);
    const L=(a,b,t)=>a+(b-a)*t;
    return L(L(L(h(xi,yi,zi),h(xi+1,yi,zi),u),L(h(xi,yi+1,zi),h(xi+1,yi+1,zi),u),v),
             L(L(h(xi,yi,zi+1),h(xi+1,yi,zi+1),u),L(h(xi,yi+1,zi+1),h(xi+1,yi+1,zi+1),u),v),w);
  };
}
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};

/* ---------------- 1. mound grid + stacking ---------------- */
function makePlan(rnd,noise){
  const nx=P.foot,nz=P.foot,ny=P.height;
  const id=(x,y,z)=>(y*nz+z)*nx+x;
  const occ=new Uint8Array(nx*ny*nz);
  const inside=(x,y,z)=>x>=0&&z>=0&&x<nx&&z<nz&&y>=0&&y<ny;
  const O=(x,y,z)=>inside(x,y,z)&&occ[id(x,y,z)]===1;
  const cx=(nx-1)/2+(rnd()-.5)*nx*.25, cz=(nz-1)/2+(rnd()-.5)*nz*.25;
  const fill=.3+.07*P.fill;
  for(let z=0;z<nz;z++)for(let x=0;x<nx;x++){
    const d=Math.hypot((x-cx)/(nx/2),(z-cz)/(nz/2));
    let hc=ny*(1.02-Math.pow(d/1.15,1.25))+noise(x*.55+11,z*.55+7,3.3)*1.4+(rnd()-.5)*.9;
    hc=Math.max(0,Math.min(ny,Math.round(hc)));
    if(d>1.15&&rnd()<.5)hc=0;
    for(let y=0;y<hc;y++)occ[id(x,y,z)]=rnd()<(y===0?Math.min(1,fill+.2):fill)?1:0;
  }
  // gravity: keep a cell if it sits on something, or bridges off a supported neighbour
  const N4=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let y=1;y<ny;y++)for(let z=0;z<nz;z++)for(let x=0;x<nx;x++){
    if(!O(x,y,z)||O(x,y-1,z))continue;
    let ok=false;for(const[dx,dz]of N4)if(O(x+dx,y,z+dz)&&O(x+dx,y-1,z+dz))ok=true;
    if(!ok||rnd()<.35)occ[id(x,y,z)]=0;
  }
  let count=0;for(const v of occ)count+=v;
  if(count<3){const mx=Math.floor(nx/2),mz=Math.floor(nz/2);for(let y=0;y<Math.min(ny,3);y++)occ[id(mx,y,mz)]=1;}

  // group cells into pieces (1x1, 2x1, 1x2, 2x2) and pick a profile from context
  const used=new Uint8Array(occ.length);
  const can=(x,y,z)=>O(x,y,z)&&!used[id(x,y,z)];
  const parts=[];
  for(let y=0;y<ny;y++){
    const order=[];for(let z=0;z<nz;z++)for(let x=0;x<nx;x++)order.push([x,z]);
    for(let i=order.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=order[i];order[i]=order[j];order[j]=t;}
    for(const[x,z]of order){
      if(!can(x,y,z))continue;
      let sx=1,sz=1;const r=rnd();
      if(r<.3&&can(x+1,y,z))sx=2;else if(r<.6&&can(x,y,z+1))sz=2;
      if(sx===2&&rnd()<.22&&can(x,y,z+1)&&can(x+1,y,z+1))sz=2;
      let above=false,below=y===0;
      for(let a=0;a<sx;a++)for(let b=0;b<sz;b++){used[id(x+a,y,z+b)]=1;if(O(x+a,y+1,z+b))above=true;if(y>0&&O(x+a,y-1,z+b))below=true;}
      const axis=sx>sz?(rnd()<.7?'x':'z'):sz>sx?(rnd()<.7?'z':'x'):(rnd()<.5?'x':'z');
      const W=(axis==='x'?sx:sz)*U, D=(axis==='x'?sz:sx)*U;
      parts.push(makePart(rnd,pickType(rnd,above,below,W),axis,x,y,z,W,D,nx,nz));
    }
  }
  // barnacles: small ledges, cups and brackets stuck on open faces (handholds + clutter)
  const BAR=['ell','cup','slab','zed','ell','arch','cup'];
  for(let y=0;y<ny;y++)for(let z=0;z<nz;z++)for(let x=0;x<nx;x++){
    if(!O(x,y,z))continue;
    for(const[dx,dz]of N4){
      if(O(x+dx,y,z+dz)||rnd()>.17)continue;
      const W=.6+rnd()*.35,D=.5+rnd()*.8,h=H*(.35+rnd()*.25),ov=.12,cxw=(x-nx/2)*U,czw=(z-nz/2)*U;
      let axis,flip,x0,z0;
      if(dx!==0){axis='x';z0=czw+rnd()*(U-D);if(dx>0){x0=cxw+U-ov;flip=false;}else{x0=cxw-W+ov;flip=true;}}
      else{axis='z';x0=cxw+rnd()*(U-D);if(dz>0){z0=czw+U-ov;flip=false;}else{z0=czw-W+ov;flip=true;}}
      parts.push({type:BAR[Math.floor(rnd()*BAR.length)],axis,flip,x0,y0:y*H+rnd()*(H-h),z0,W,D,h,droopR:rnd(),tScale:.7});
    }
  }
  // melted puddles around the base
  for(let z=-1;z<=nz;z++)for(let x=-1;x<=nx;x++){
    if(O(x,0,z))continue;
    let adj=false;for(const[dx,dz]of N4)if(O(x+dx,0,z+dz))adj=true;
    if(!adj||rnd()>.4)continue;
    const W=U*(.7+rnd()*.6),D=U*(.7+rnd()*.6);
    parts.push({type:'puddle',x0:(x-nx/2)*U+(U-W)/2+(rnd()-.5)*.5,z0:(z-nz/2)*U+(U-D)/2+(rnd()-.5)*.5,y0:0,W,D,h:.2});
  }
  return {parts,occ,nx,ny,nz};
}

function pickType(rnd,above,below,W){
  const wide=W>U*1.5;
  let w=above
    ?{arch:5,ring:2,walls:2.2,slab:1.6,zed:.8}
    :{cup:2.4,arch:2,slab:2,step:wide?2.6:1.6,wave:wide?2.8:.5,ell:1.6,comb:1.8,ring:.8,zed:1};
  if(!below){w.slab=(w.slab||0)+3;w.ring=(w.ring||0)+1;w.walls=0;w.comb=0;}
  let s=0;for(const k in w)s+=w[k];let r=rnd()*s;
  for(const k in w){r-=w[k];if(r<=0)return k;}
  return 'arch';
}

function makePart(rnd,type,axis,x,y,z,W,D,nx,nz){
  const grow=type==='puddle'?1:1+rnd()*.06;
  return {type,axis,flip:rnd()<.5,
    x0:(x-nx/2)*U+(rnd()-.5)*.12, y0:y*H+(y>0?rnd()*.04:0), z0:(z-nz/2)*U+(rnd()-.5)*.12,
    W:W*grow, D, h:H, droopR:rnd()};
}

/* ---------------- 2. profile library (u across, v up) ---------------- */
function profileFor(type,W,h,T,rnd){
  const e=T/2, L=[];
  switch(type){
    case 'arch':{const round=rnd()<.55;const r=round?Math.min((W-2*e)/2,h-e):.35+rnd()*.25;
      L.push({pts:[[e,0],[e,h-e],[W-e,h-e],[W-e,0]],r});break;}
    case 'cup':{const ch=h*(.4+rnd()*.45);L.push({pts:[[e,ch],[e,e],[W-e,e],[W-e,ch]],r:.3+rnd()*.3});break;}
    case 'slab':{const lipL=Math.max(.5,h*(.25+rnd()*.45)),lipR=rnd()<.3?0:Math.max(.5,h*(.25+rnd()*.45));

/* polyline -> filleted centreline with exact tangents */
function centerline(P0,prof){
  const n=P0.length,out=[];let rmin=Infinity;
  const dir=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l];};
  const dist=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);

  if(!closed)out.push({p:P0[0].slice(),t:dir(P0[0],P0[1])});
  const i0=closed?0:1,i1=closed?n:n-1;
  for(let i=i0;i<i1;i++){
    const A=P0[(i-1+n)%n],B=P0[i],C=P0[(i+1)%n],a=dir(A,B),b=dir(B,C);
    const cr=a[0]*b[1]-a[1]*b[0],dt=a[0]*b[0]+a[1]*b[1],phi=Math.atan2(Math.abs(cr),dt);
    if(prof.sampled){const tx=a[0]+b[0],ty=a[1]+b[1],l=Math.hypot(tx,ty)||1;out.push({p:B.slice(),t:[tx/l,ty/l]});continue;}
    if(phi<1e-3||r<=0){out.push({p:B.slice(),t:a});continue;}
    const endA=!closed&&i===1,endB=!closed&&i===n-2;
    const maxA=dist(A,B)*(endA?.92:.499),maxB=dist(B,C)*(endB?.92:.499),th2=Math.tan(phi/2);
    const d=Math.min(r*th2,maxA,maxB),rr=d/th2;rmin=Math.min(rmin,rr);
    const s=cr>0?1:-1,T1=[B[0]-a[0]*d,B[1]-a[1]*d],Cc=[T1[0]-a[1]*rr*s,T1[1]+a[0]*rr*s];
    const steps=Math.max(3,Math.ceil(phi/(Math.PI/12))),vx=T1[0]-Cc[0],vy=T1[1]-Cc[1];
    for(let k=0;k<=steps;k++){const th=s*phi*k/steps,c=Math.cos(th),sn=Math.sin(th);
      out.push({p:[Cc[0]+vx*c-vy*sn,Cc[1]+vx*sn+vy*c],t:[a[0]*c-a[1]*sn,a[0]*sn+a[1]*c]});}
  }
  if(!closed)out.push({p:P0[n-1].slice(),t:dir(P0[n-2],P0[n-1])});

  const res=[],maxSeg=.3;
  const pushRun=(from,to)=>{const L=dist(from.p,to.p);if(L>maxSeg){const k=Math.ceil(L/maxSeg),td=dir(from.p,to.p);
    for(let j=1;j<k;j++)res.push({p:[from.p[0]+(to.p[0]-from.p[0])*j/k,from.p[1]+(to.p[1]-from.p[1])*j/k],t:td});}};
  for(const q of out){const pr=res[res.length-1];if(pr&&dist(pr.p,q.p)<2e-3)continue;if(pr)pushRun(pr,q);res.push(q);}
  if(closed){const f=res[0],l=res[res.length-1];if(dist(f.p,l.p)<2e-3)res.pop();else pushRun(l,f);}

const offsetPts=(cl,d)=>cl.map(q=>[q.p[0]-q.t[1]*d,q.p[1]+q.t[0]*d]);

function stripShape(cl,d0,d1,closed){
  const A=offsetPts(cl,d0),B=offsetPts(cl,d1);

    let outer=Math.abs(area(A))>Math.abs(area(B))?A:B,inner=outer===A?B:A;
    if(area(outer)>0)outer=outer.slice().reverse();   // outer clockwise
    if(area(inner)<0)inner=inner.slice().reverse();   // hole counter-clockwise
    const s=new THREE.Shape(outer.map(V2));s.holes.push(new THREE.Path(inner.map(V2)));return s;
  }

/* ---------------- 3. build the whole mound ---------------- */
function generate(){

  const pick=()=>{let r=rnd()*wsum;for(let i=0;i<palC.length;i++){r-=palW[i];if(r<=0)return palC[i];}return palC[palC.length-1];};

  const sliceCap=est>2000?Math.max(1,Math.floor(P.slices*2000/est)):P.slices,bseg=est>1500?1:2;
  const est1=plan.parts.length*1.3*sliceCap*P.bands,bandCap=est1>2400?Math.max(1,Math.floor(P.bands*2400/est1)):P.bands;
  const A=.035*P.melt,F=.3;

  const newUnit=p=>{units.push({part:p,ranges:[],cx:0,cy:0,cz:0,n:0});return units.length-1;};

    const u=units[uid],vs=vb,is=idx.length;

    const g=mergeVertices(geo,1e-4);geo.dispose();
    const pa=g.attributes.position.array,ia=g.index.array,n=pa.length/3;
    for(let i=0;i<n;i++){
      map(pa[3*i],pa[3*i+1],pa[3*i+2],o3);let X=o3[0],Y=o3[1],Z=o3[2];
      if(A>0){const qx=X*F,qy=Y*F,qz=Z*F,gy=Math.min(1,Math.max(0,Y/.8));
        const dx=noise(qx,qy,qz),dy=noise(qx+31.7,qy+5.1,qz+17.3),dz=noise(qx+71.3,qy+13.9,qz+3.7);
        X+=A*dx;Y+=A*.6*dy*gy;Z+=A*dz;}
      pos.push(X,Y,Z);vU.push(uid);u.cx+=X;u.cy+=Y;u.cz+=Z;u.n++;
      let m=0;if(marble)m=smooth(.05,.45,noise(X*2.1+9.1,Y*2.1+2.7,Z*2.1+5.3))*marble;
      col.push(c1.r+(c2.r-c1.r)*m,c1.g+(c2.g-c1.g)*m,c1.b+(c2.b-c1.b)*m);
    }
    for(let i=0;i<ia.length;i+=3){
      if(mirrored)idx.push(ia[i]+vb,ia[i+2]+vb,ia[i+1]+vb);else idx.push(ia[i]+vb,ia[i+1]+vb,ia[i+2]+vb);
    }

  }

  for(let pi=0;pi<plan.parts.length;pi++){
    const part=plan.parts[pi],{type,W,h}=part;
    if(type==='puddle'){   // terraced blob, lying flat
      const layers=Math.min(3,P.bands),ph=rnd()*10,cx=part.x0+W/2,cz=part.z0+part.D/2;

/* cheap ambient occlusion from the coarse grid: surfaces looking into filled cells get darker */
function bakeAO(geom,plan){

    f[id(x,y,z)]=(2*O(x,y,z)+O(x+1,y,z)+O(x-1,y,z)+O(x,y+1,z)+O(x,y-1,z)+O(x,y,z+1)+O(x,y,z-1))/8;
  const S=(x,y,z)=>x>=0&&z>=0&&y>=0&&x<nx&&z<nz&&y<ny?f[id(x,y,z)]:0;
  const sample=(X,Y,Z)=>{const gx=X/U+nx/2-.5,gy=Y/H-.5,gz=Z/U+nz/2-.5;
    const x0=Math.floor(gx),y0=Math.floor(gy),z0=Math.floor(gz),u=gx-x0,v=gy-y0,w=gz-z0;let s=0;

function frame(reset){
  const bb=mesh.geometry.boundingBox,sph=mesh.geometry.boundingSphere;
  const target=new THREE.Vector3(sph.center.x,bb.max.y*.4,sph.center.z);
  const vf=THREE.MathUtils.degToRad(camera.fov)/2,hf=Math.atan(Math.tan(vf)*camera.aspect);

  else dir=camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(target);camera.position.copy(target).addScaledVector(dir,dist);
  if(scene.fog){scene.fog.near=dist*1.3;scene.fog.far=dist*4.5;}
  const r=sph.radius;
  sun.position.copy(target).add(new THREE.Vector3(-r*.8,r*2.2,r*1.4));sun.target.position.copy(target);
  const sc=sun.shadow.camera;sc.left=-r*1.4;sc.right=r*1.4;sc.top=r*1.4;sc.bottom=-r*1.4;sc.near=.5;sc.far=r*6;sc.updateProjectionMatrix();
}

  if(AC.state==='suspended')AC.resume().catch(()=>{});return AC;
}
function tone(f0,f1,dur,type='sine',vol=.12,delay=0){
  const ac=AC;if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
function rip(dur){
  const ac=AC;if(!ac||ac.state!=='running')return;
  if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=ac.currentTime,src=ac.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=2.5;bp.frequency.setValueAtTime(600,t);bp.frequency.exponentialRampToValueAtTime(2800,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(0,t);
  for(let k=0;k<dur;k+=.04)g.gain.setValueAtTime(.03+Math.random()*.08,t+k);
  g.gain.linearRampToValueAtTime(0,t+dur+.05);
  src.connect(bp).connect(g).connect(ac.destination);src.start(t);src.stop(t+dur+.1);
}

}
function peelSetup(c,G,dir){
  const pos=c.mesh.geometry.attributes.position.array,n=pos.length/3,mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
  for(let i=0;i<n;i++)for(let k=0;k<3;k++){const v=pos[3*i+k];if(v<mn[k])mn[k]=v;if(v>mx[k])mx[k]=v;}
  let ai=0;for(let k=1;k<3;k++)if(mx[k]-mn[k]>mx[ai]-mn[ai])ai=k;      // peel along the strip's long direction
  const g=[G.x,G.y,G.z][ai];
  c.ai=ai;c.G=G.clone();c.dir=dir.clone();c.a=new V3(ai===0?1:0,ai===1?1:0,ai===2?1:0);
  c.Lm=Math.max(.05,g-mn[ai]);c.Lp=Math.max(.05,mx[ai]-g);
  c.base=pos.slice();c.s=new Float32Array(n);c.q=new Float32Array(3*n);
  for(let i=0;i<n;i++){c.s[i]=pos[3*i+ai]-g;c.q[3*i]=pos[3*i]-G.x;c.q[3*i+1]=pos[3*i+1]-G.y;c.q[3*i+2]=pos[3*i+2]-G.z;c.q[3*i+ai]=0;}
  c.local=false;c.sc=1;
}
// p: 0 → 1.35. Both halves lift off from the pinch point, then hang from the fingers.
const pH=[new V3(),new V3()],pC=[new V3(),new V3()];
function peelUpdate(c,p,T){
  const attr=c.mesh.geometry.attributes.position,pos=attr.array,n=c.s.length,maxL=Math.max(c.Lm,c.Lp),dp=p*maxL,hh=[0,0];
  for(let k=0;k<2;k++){
    const sg=k?1:-1,L=k?c.Lp:c.Lm,h=Math.min(dp,L),lift=clamp((dp-L)/(.3*maxL+1e-3),0,1);hh[k]=h;
    const H=pH[k].copy(c.G).addScaledVector(c.a,sg*h);
    tv1.copy(T).addScaledVector(c.a,sg*.2*L);tv1.y-=.55*L;H.lerp(tv1,lift);
    pC[k].copy(H).lerp(T,.5).addScaledVector(c.dir,H.distanceTo(T)*.35);
  }
  for(let i=0;i<n;i++){
    const s=c.s[i],k=s<0?0:1,d=Math.abs(s),b=3*i;
    if(d>hh[k]+1e-5){pos[b]=c.base[b];pos[b+1]=c.base[b+1];pos[b+2]=c.base[b+2];continue;}
    const u=hh[k]>1e-4?(hh[k]-d)/hh[k]:1,w=1-u,pin=1-.55*u,H=pH[k],C=pC[k];
    pos[b]=H.x*w*w+C.x*2*u*w+T.x*u*u+c.q[b]*pin;
    pos[b+1]=H.y*w*w+C.y*2*u*w+T.y*u*u+c.q[b+1]*pin;
    pos[b+2]=H.z*w*w+C.z*2*u*w+T.z*u*u+c.q[b+2]*pin;
  }
  attr.needsUpdate=true;c.mesh.geometry.computeVertexNormals();
}
function localizeBite(c,T){
  const attr=c.mesh.geometry.attributes.position,pos=attr.array;
  for(let i=0;i<pos.length;i+=3){pos[i]-=T.x;pos[i+1]-=T.y;pos[i+2]-=T.z;}
  attr.needsUpdate=true;c.mesh.position.copy(T);c.local=true;
}
function disposeBite(c){if(!c)return;scene.remove(c.mesh);c.mesh.geometry.dispose();}
function dropBite(c){if(!c)return;if(!c.local)localizeBite(c,c.G||c.mesh.position);falling.push({c,v:new V3((Math.random()-.5)*2,1,(Math.random()-.5)*2),t:0,spin:new V3(Math.random()*4,Math.random()*4,Math.random()*4)});}
function updateFalling(dt){
  for(const f of falling){f.t+=dt;f.v.y-=18*dt;f.c.mesh.position.addScaledVector(f.v,dt);f.c.mesh.rotation.x+=f.spin.x*dt;f.c.mesh.rotation.z+=f.spin.z*dt;
    if(f.c.mesh.position.y<.05){f.c.mesh.position.y=.05;f.v.multiplyScalar(.3);}
    f.c.mesh.scale.setScalar(f.c.sc*Math.max(.01,1-Math.max(0,f.t-.8)/.6));}
  falling=falling.filter(f=>{if(f.t>1.4){disposeBite(f.c);return false;}return true;});
}
// how the hand's carried strip or bear looks this frame (same on every device)
function handVisual(h,dt){
  const c=h.carry;
  if(c){
    if(!c.local){if(h.st==='grab'||h.st==='peel'||h.st==='vpeel')peelUpdate(c,h.peelP,tip(h,tv3));else localizeBite(c,tip(h,tv3));}
    if(c.local){
      c.mesh.position.copy(tip(h,tv3));
      const want=h.st==='feed'?.3:(h.st==='lift'||h.st==='vhold')?.78:1;c.sc+=(want-c.sc)*Math.min(1,dt*5);c.mesh.scale.setScalar(c.sc);
    }
  }
  if(h.bear){h.bear.pos.copy(tip(h,tv3));h.bear.pos.y+=.22;}
  for(const f of h.fingers)f.rotation.x=h.curl*1.35;h.th.rotation.x=h.curl*.9;
}

/* ---------------- baby actions (whoever drives the baby calls these; they're sent to everyone) ---------------- */
function act(e){applyEvent(e,true);netSend(Object.assign({t:'ev'},e));}
function applyEvent(e,local){
  const h=hands[e.h];
  switch(e.e){
    case 'grab':{
      if(h.carry){disposeBite(h.carry);h.carry=null;}
      if(!removeUnit(e.u))break;
      h.carry=makeBite(e.u);peelSetup(h.carry,tv1.fromArray(e.G),tv2.fromArray(e.d));h.peelP=0;
      BB.bitten&&(BB.bitten[mesh.geometry.userData.units[e.u].part]=1);
      if(!local)rip(1);
      break;}
    case 'swallow':disposeBite(h.carry);h.carry=null;BB.chew=1.1;SFX.nom();break;
    case 'drop':dropBite(h.carry);h.carry=null;break;
    case 'catch':{const a=agents.find(a=>a.id===e.id);if(!a)break;a.carried=true;h.bear=a;SFX.squeak();if(a===me){$('seen').style.opacity=1;hud('Grabbed! Wiggle won\'t help…',2);}break;}
    case 'release':{const a=h.bear||agents.find(a=>a.id===e.id);h.bear=null;if(!a)break;a.carried=false;a.pos.fromArray(e.p);a.vel.set(0,0,0);a.tgt.copy(a.pos);break;}
    case 'eatbear':{
      for(const x of hands)if(x.bear&&x.bear.id===e.id)x.bear=null;
      const a=agents.find(a=>a.id===e.id);BB.chew=2.5;SFX.gulp();
      if(a){const mine=a===me;removeBear(a);if(mine)iGotEaten();}
      statusTick(true);
      break;}
  }
}

/* ---------------- baby brain (when nobody plays the baby) ---------------- */
function grabPoint(uid){
  const D=mesh.geometry.userData;D.grab=D.grab||{};if(D.grab[uid])return D.grab[uid];
  const u=D.units[uid],P=mesh.geometry.attributes.position.array;
  const o=new V3(u.cx-BB.C.x,0,u.cz-BB.C.z);if(o.lengthSq()<1e-4)o.set(0,1,0);else{o.normalize().multiplyScalar(.8);o.y=.6;o.normalize();}
  let best=-1e9,bi=0;
  for(const[vs,vn]of u.ranges)for(let i=vs;i<vs+vn;i++){const d=P[3*i]*o.x+P[3*i+1]*o.y+P[3*i+2]*o.z;if(d>best){best=d;bi=i;}}
  return D.grab[uid]={p:new V3(P[3*bi],P[3*bi+1],P[3*bi+2]),dir:o};
}
function pickUnit(){
  const D=mesh.geometry.userData,list=[];
  for(let i=0;i<D.units.length;i++){
    if(D.dead[i])continue;const u=D.units[i];
    const dx=u.cx-BB.C.x,dz=u.cz-BB.C.z,out=Math.hypot(dx,dz),side=Math.cos(Math.atan2(dx,dz)-BB.ang);
    let smell=30;for(const a of agents)smell=Math.min(smell,Math.hypot(u.cx-a.pos.x,u.cy-a.pos.y,u.cz-a.pos.z));
    list.push([u.cy*.55+out*.35+side*1.2+(BB.bitten[u.part]?2.5:0)-smell*.18+Math.random()*1.5,i]);
  }
  list.sort((a,b)=>b[0]-a[0]);
  for(let k=0;k<Math.min(12,list.length);k++){const uid=list[k][1],g=grabPoint(uid);if(reachable(g.p,g.dir,uid))return{uid,p:g.p,dir:g.dir};}
  if(list.length){const uid=list[0][1],g=grabPoint(uid);return{uid,p:g.p,dir:g.dir};}
  return null;
}
function babyBrain(dt){
  BB.check-=dt;
  if(BB.check<=0){
    BB.check=.2;
    for(const a of agents){if(a.carried)continue;const vis=canSee(BB.view,a);a.seenB=vis?Math.min(1.8,a.seenB+.2):Math.max(0,a.seenB-.25);a.hidB=vis?0:a.hidB+.2;}
    for(const h of hands)if(h.st==='hunt'&&(!agents.includes(h.prey)||h.prey.hidB>=1.2)){h.st='idle';h.prey=null;}
    if(!hands.some(h=>h.st==='hunt')){
      const t=agents.filter(a=>!a.carried&&a.seenB>=1.1).sort((a,b)=>b.seenB-a.seenB)[0];
      if(t){const i=hands.findIndex(h=>h.st==='idle'||h.st==='reach');if(i>=0){startHunt(hands[i],t);}}
    }
  }
  BB.cool-=dt;
  if(!hands.some(h=>h.st==='hunt'||h.st==='reach'||h.st==='grab'||h.st==='peel')&&BB.cool<=0){
    const i=hands[BB.cur].st==='idle'?BB.cur:hands[1-BB.cur].st==='idle'?1-BB.cur:-1;
    if(i>=0){const r=pickUnit();if(r){startReach(hands[i],r.uid,r.p,r.dir);BB.cur=1-i;BB.cool=.35;}}
  }
}
function startReach(h,uid,G,dir){
  const hs=h.g.scale.x;
  h.uid=uid;h.st='reach';h.t=0;h.from.copy(h.g.position);h.look.copy(G);h.dir.copy(dir);
  h.to.copy(G).addScaledVector(dir,.72*hs);                               // fingertips land on the strip
  h.c2.copy(G).addScaledVector(dir,1.3+.72*hs);                           // come in from outside, along the clear line
  h.ctrl.copy(h.from).lerp(h.c2,.5);h.ctrl.y=Math.max(h.from.y,h.c2.y,BB.top+BB.headR*.25);   // arc over the top
  h.dur=.55+(h.from.distanceTo(h.ctrl)+h.ctrl.distanceTo(h.to))/18;
}
function startHunt(h,prey){h.st='hunt';h.prey=prey;h.huntT=0;h.hid=0;h.chk=0;h.canReach=false;}

/* ---------------- phone / computer baby: tap to grab ---------------- */
function tapFx(x,y,ok,txt){const d=document.createElement('div');d.className='tapfx'+(ok?'':' no');if(!ok)d.dataset.t=txt;d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000);}
function nope(txt,x,y){SFX.nope();BB.shake=1;if(x!==undefined)tapFx(x,y,false,txt);hud(txt,1.2);}
function babyCommand(cmd){
  const i=hands[BB.cur].st==='idle'?BB.cur:hands[1-BB.cur].st==='idle'?1-BB.cur:-1;
  if(i<0){BB.queue=cmd;return;}
  BB.cur=1-i;
  if(cmd.prey)startHunt(hands[i],cmd.prey);else startReach(hands[i],cmd.uid,cmd.point,cmd.dir);
}
function babyTap(x,y){
  audio();
  ray.setFromCamera(tv1.set(x/innerWidth*2-1,-(y/innerHeight)*2+1,0),camera);ray.far=Infinity;
  const toCam=ray.ray.direction.clone().negate();
  const live=agents.filter(a=>!a.carried);for(const a of live)a.obj.updateMatrixWorld(true);
  const bh=ray.intersectObjects(live.map(a=>a.obj),true)[0];
  const sh=aliveHit();
  if(bh&&(!sh||bh.distance<sh.distance+.05)){
    let o=bh.object;while(o&&!live.some(a=>a.obj===o))o=o.parent;
    const a=live.find(a=>a.obj===o);
    if(a&&!hands.some(h=>h.prey===a)){
      const bc=a.pos.clone();bc.y-=.2;
      if(reachable(bc,toCam,-1)){babyCommand({prey:a});tapFx(x,y,true);SFX.pop();}else nope('too deep',x,y);
      return;
    }
  }
  if(sh){
    const D=mesh.geometry.userData,uid=D.vUnit[sh.face.a];if(D.dead[uid])return;
    if(hands.some(h=>(h.st==='reach'||h.st==='grab'||h.st==='peel')&&h.uid===uid))return;
    const n=sh.face.normal.clone();if(n.dot(toCam)<0)n.negate();
    const dir=n.multiplyScalar(.6).addScaledVector(toCam,.4).normalize();
    if(reachable(sh.point,dir,uid)){babyCommand({uid,point:sh.point.clone(),dir});tapFx(x,y,true);SFX.pop();}
    else nope("can't reach",x,y);
  }
}

/* ---------------- VR baby: your real hands ---------------- */
function vrBabyHands(dt){
  const S=XR.scale,hs=.09*S;
  for(const h of hands){
    const inp=XR.in[h.side<0?'left':'right'];
    if(!inp||!inp.ok){h.g.visible=false;continue;}
    h.g.visible=true;h.g.scale.setScalar(hs);
    h.g.quaternion.copy(inp.quat).multiply(QFLIP);
    h.g.position.copy(inp.pos).addScaledVector(tv1.set(0,0,-1).applyQuaternion(inp.quat),inp.tracked?.05*S:.02*S);
    h.g.updateMatrixWorld(true);
    const grip=inp.grip;h.curl+=((grip?1:inp.squeeze*.5+.15)-h.curl)*Math.min(1,dt*14);
    const down=grip&&!h.wasGrip,up=!grip&&h.wasGrip;h.wasGrip=grip;
    const T=tip(h,tv2),mouth=mouthIn(tv3);
    if(h.st!=='vr'&&h.st!=='vpeel'&&h.st!=='vhold'&&h.st!=='vbear'){if(h.carry){dropBite(h.carry);h.carry=null;}h.st='vr';}
    switch(h.st){
      case 'vr':if(down)vrGrab(h,inp);break;
      case 'vpeel':{
        const p=clamp(T.distanceTo(h.look)/h.pullLen,0,1)*1.35;h.peelP=Math.max(h.peelP,p);
        if(up){act({e:'drop',h:hands.indexOf(h)});h.st='vr';}
        else if(h.peelP>=1.35){h.st='vhold';buzz(inp,.4,40);}
        break;}
      case 'vhold':
        if(T.distanceTo(mouth)<1.1){act({e:'swallow',h:hands.indexOf(h)});h.st='vr';buzz(inp,.6,80);}
        else if(up){act({e:'drop',h:hands.indexOf(h)});h.st='vr';}
        break;
      case 'vbear':
        if(!h.bear){h.st='vr';break;}
        if(T.distanceTo(mouth)<1.3){act({e:'eatbear',h:hands.indexOf(h),id:h.bear.id});h.st='vr';buzz(inp,1,150);}
        else if(up){const p=tip(h,tv4);p.y+=.22;act({e:'release',h:hands.indexOf(h),id:h.bear.id,p:p.toArray()});h.st='vr';}
        break;
    }
    handVisual(h,dt);
  }
}
function vrGrab(h,inp){
  const T=tip(h,new V3()),eye=XR.headPos;
  let best=null,bd=.75;
  for(const a of agents){if(a.carried)continue;const bc=tv4.copy(a.pos);bc.y-=.2;const d=bc.distanceTo(T);if(d<bd){bd=d;best=a;}}
  if(best){
    const bc=best.pos.clone();bc.y-=.2;
    if(reachable(bc,eye.clone().sub(bc).normalize(),-1)){act({e:'catch',h:hands.indexOf(h),id:best.id});h.st='vbear';buzz(inp,.7,60);}
    else{nope('too deep');buzz(inp,1,30);}
    return;
  }
  const hit=nearestAlive(T,.5);if(!hit)return;
  const dir=eye.clone().sub(hit.p).normalize();
  if(!reachable(hit.p,dir,hit.uid)){nope("can't reach");buzz(inp,1,30);setTimeout(()=>buzz(inp,1,30),90);return;}
  act({e:'grab',h:hands.indexOf(h),u:hit.uid,G:hit.p.toArray(),d:dir.toArray()});
  const c=h.carry;h.look.copy(hit.p);h.pullLen=clamp(.4+Math.max(c.Lm,c.Lp)*.4,.6,1.6);h.st='vpeel';h.peelP=0;rip(.8);buzz(inp,.5,50);

/* ---------------- baby update: drive it here, or show what the network says ---------------- */
const QFLIP=new QT().setFromAxisAngle(UP,Math.PI);
function setupBaby(){
  const bb=mesh.geometry.boundingBox;
  BB.C.set((bb.min.x+bb.max.x)/2,0,(bb.min.z+bb.max.z)/2);
  BB.R=Math.max(bb.max.x-bb.min.x,bb.max.z-bb.min.z)/2;BB.top=bb.max.y;
  BB.headR=Math.min(7,Math.max(2.4,Math.max(BB.R,BB.top*.5)*.42));
  head.scale.setScalar(BB.headR);
  BB.ang=Math.atan2(camera.position.x-BB.C.x,camera.position.z-BB.C.z)+Math.PI;
  BB.chew=0;BB.mouth=0;BB.cool=2.5;BB.check=0;BB.queue=null;BB.has=false;BB.shake=0;
  BB.focus.set(BB.C.x,BB.top*.5,BB.C.z);BB.bitten=new Uint8Array(mesh.geometry.userData.nParts);
  headPos(head.position);head.lookAt(BB.focus);head.visible=true;
  BB.view.copy(head.localToWorld(new V3(0,.14,.92)));
  for(const h of hands){h.g.scale.setScalar(BB.headR*.42);resetHand(h);restPos(h,h.g.position);h.g.visible=true;h.has=false;}
  for(const f of falling)disposeBite(f.c);falling=[];
  baby.visible=true;BB.on=true;
}
function resetHand(h){disposeBite(h.carry);h.carry=null;if(h.bear){h.bear.carried=false;h.bear=null;}h.st='idle';h.uid=-1;h.t=0;h.prey=null;h.peelP=0;}
function stopBaby(){BB.on=false;baby.visible=false;for(const h of hands)resetHand(h);for(const f of falling)disposeBite(f.c);falling=[];}
function updateBaby(dt){
  if(!BB.on)return;
  BB.clk+=dt;
  if(babyMine())driveBaby(dt);else showRemoteBaby(dt);
  const puff=BB.chew>0?.08*Math.sin(BB.clk*15):0;for(const c of cheeks)c.scale.set(1+puff,.78+puff,.55);
  if(BB.chew>0)BB.chew-=dt;
}
function driveBaby(dt){
  const D=mesh.geometry.userData,live=mode==='play',ctrl=babyCtrl();
  if(live&&ctrl==='bot')babyBrain(dt);
  if(live&&ctrl==='tap'&&BB.queue&&hands.some(h=>h.st==='idle')){const q=BB.queue;BB.queue=null;
    if(q.prey?agents.includes(q.prey):!D.dead[q.uid])babyCommand(q);}
  const hunter=hands.find(h=>h.st==='hunt');
  if(ctrl==='vr'){
    // your head is the baby's head
    head.position.copy(XR.headPos);head.quaternion.copy(XR.headQuat).multiply(QFLIP);head.scale.setScalar(.1*XR.scale);
    head.visible=false;BB.view.copy(XR.headPos);
    if(live)vrBabyHands(dt);else for(const h of hands){const inp=XR.in[h.side<0?'left':'right'];h.g.visible=!!(inp&&inp.ok);if(inp&&inp.ok){h.g.scale.setScalar(.09*XR.scale);h.g.quaternion.copy(inp.quat).multiply(QFLIP);h.g.position.copy(inp.pos);}}
    for(const e of eyes)e.lookAt(tv1.copy(XR.headPos).addScaledVector(tv2.set(0,0,-1).applyQuaternion(XR.headQuat),10));
  }else{
    head.visible=true;
    let want=hunter?hunter.prey.pos:null;
    if(!want){const a=hands.find(h=>h.st==='reach');if(a)want=a.look;}
    if(ctrl==='tap'){
      let d=Math.atan2(camera.position.x-BB.C.x,camera.position.z-BB.C.z)+Math.PI-BB.ang;d=Math.atan2(Math.sin(d),Math.cos(d));
      BB.ang+=d*Math.min(1,dt*2.5);BB.focus.lerp(want||tv1.set(BB.C.x,BB.top*.45,BB.C.z),Math.min(1,dt*3));
    }else if(want){
      let d=Math.atan2(want.x-BB.C.x,want.z-BB.C.z)-BB.ang;d=Math.atan2(Math.sin(d),Math.cos(d));
      BB.ang+=Math.max(-.7*dt,Math.min(.7*dt,d));BB.focus.lerp(want,Math.min(1,dt*3));
    }
    head.scale.setScalar(BB.headR);
    headPos(head.position);head.position.y+=Math.sin(BB.clk*1.3)*BB.headR*.03;
    head.lookAt(tv1.set(BB.focus.x,head.position.y+(BB.focus.y-head.position.y)*.6,BB.focus.z));
    head.rotateZ(Math.sin(BB.clk*.9)*.06);
    if(BB.shake>0){BB.shake=Math.max(0,BB.shake-dt*1.6);head.rotateY(Math.sin(BB.clk*26)*.22*BB.shake);}
    head.updateMatrixWorld(true);
    BB.view.copy(ctrl==='tap'?camera.position:head.localToWorld(tv1.set(0,.14,.92)));
    const eyeT=hunter?hunter.prey.pos:BB.focus;for(const e of eyes)e.lookAt(eyeT);
    for(const h of hands)handStep(h,dt,live,ctrl);

  if(hands.some(h=>(h.st==='lift'&&h.t>.55)||h.st==='feed'||((h.st==='vhold'||h.st==='vbear')&&tip(h,tv1).distanceTo(mouthIn(tv2))<2.5)))mt=1;
  BB.mouth+=(mt-BB.mouth)*Math.min(1,dt*12);
  cav.scale.y=.12+.85*BB.mouth;tongue.position.y=-.04-.08*BB.mouth;
}
function handStep(h,dt,live,ctrl){
  const D=mesh.geometry.userData,p=h.g.position,hs=h.g.scale.x;let curl=.25;
  h.g.visible=true;

  switch(h.st){

/* ---------------- playing together: PeerJS with 4-digit codes (same as Toy Box) ----------------
   The room maker hosts: it runs the clock and the bots, and passes everyone's moves along.
   ?nettest uses a BroadcastChannel instead, so two tabs on one computer can test without the internet. */
const NET={host:false,code:'',peer:null,conns:{},conn:null,on:false,test:/[?&]nettest/.test(location.search),ice:null,myId:''};
const NET_PREFIX='chiki-taffy-',MAX_JOIN=5;
function Em(){this._h={};}Em.prototype.on=function(k,f){(this._h[k]=this._h[k]||[]).push(f);return this;};Em.prototype.emit=function(k,...a){(this._h[k]||[]).forEach(f=>f(...a));};

BCConn.prototype.ready=function(){if(this.open)return;this.open=true;setTimeout(()=>this.emit('open'),0);};
BCConn.prototype.send=function(d){this.o.bc.postMessage({to:this.peer,from:this.o.id,k:'data',d});};

function BCPeer(id){Em.call(this);this.id=id||'g'+Math.random().toString(36).slice(2,9);this.conns={};this.bc=new BroadcastChannel('taffy-net');
  this.bc.onmessage=e=>{const m=e.data;if(m.to!==this.id)return;const c=this.conns[m.from];
    if(m.k==='conn'){const n=new BCConn(this,m.from);this.conns[m.from]=n;this.emit('connection',n);n.ready();this.bc.postMessage({to:m.from,from:this.id,k:'ok'});}
    else if(m.k==='ok')c&&c.ready();else if(m.k==='data')c&&c.emit('data',m.d);else if(m.k==='close')c&&c.emit('close');};
  setTimeout(()=>this.emit('open',this.id),10);}
BCPeer.prototype=Object.create(Em.prototype);
BCPeer.prototype.connect=function(id){const c=new BCConn(this,id);this.conns[id]=c;this.bc.postMessage({to:id,from:this.id,k:'conn'});setTimeout(()=>{if(!c.open)this.emit('error',{type:'peer-unavailable'});},1500);return c;};

async function makeIce(){
  const stun=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
  try{const user=Math.floor(Date.now()/1000+24*3600)+':taffy';
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode('openrelayprojectsecret'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(user))),H='staticauth.openrelay.metered.ca';
    return stun.concat([{urls:['turn:'+H+':80','turn:'+H+':80?transport=tcp','turn:'+H+':443','turns:'+H+':443?transport=tcp'],username:user,credential:btoa(String.fromCharCode(...sig))}]);
  }catch(e){return stun;}}
async function loadPeer(){if(NET.test)return;if(!NET.ice)NET.ice=await makeIce();if(window.Peer)return;
  await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('load'));document.head.append(sc);});}
function makePeer(id){if(NET.test)return new BCPeer(id);const o={debug:1,config:{iceServers:NET.ice}};return id?new window.Peer(id,o):new window.Peer(o);}
function errText(e){return e.type==='peer-unavailable'?'No room with that code. Check it and try again.':(e.type==='network'||e.type==='server-error'||e.type==='socket-error')?"Can't reach the matchmaker. Check the internet and try again.":'Something went wrong ('+e.type+'). Try again.';}
function netReset(){
  for(const id in NET.conns)try{NET.conns[id].close();}catch(e){}
  try{NET.conn&&NET.conn.close();}catch(e){}try{NET.peer&&NET.peer.destroy();}catch(e){}
  Object.assign(NET,{host:false,code:'',peer:null,conns:{},conn:null,on:false,myId:''});
}
async function netHost(onStatus){
  netReset();onStatus('Making a room…');
  try{await loadPeer();}catch(e){return onStatus("Couldn't load the multiplayer part. Check the internet.");}
  const go=()=>{const code=NET.test?'1234':String(1000+Math.floor(Math.random()*9000)),peer=makePeer(NET_PREFIX+code);NET.peer=peer;
    peer.on('open',()=>{Object.assign(NET,{host:true,on:true,code});onStatus('',code);});
    peer.on('connection',c=>{
      c.on('open',()=>{if(Object.keys(NET.conns).length>=MAX_JOIN){try{c.send({t:'full'});}catch(e){}setTimeout(()=>c.close(),400);return;}NET.conns[c.peer]=c;});
      c.on('data',m=>onHostData(c.peer,m));
      const drop=()=>{if(NET.conns[c.peer]){delete NET.conns[c.peer];onLeave(c.peer);}};c.on('close',drop);c.on('error',drop);
    });
    peer.on('error',e=>{if(e.type==='unavailable-id'){try{peer.destroy();}catch(_){}go();return;}if(!NET.on)onStatus(errText(e));});

}
function sendTo(pid,m){const c=NET.conns[pid];if(c)try{c.send(m);}catch(e){}}
function sendAll(m,except){for(const pid in NET.conns)if(pid!==except)sendTo(pid,m);}
async function netJoin(code,onStatus){
  code=String(code||'').trim();if(!/^\d{4}$/.test(code))return onStatus('Type the 4-digit room code.');
  netReset();NET.code=code;onStatus('Joining '+code+'…');
  try{await loadPeer();}catch(e){return onStatus("Couldn't load the multiplayer part. Check the internet.");}
  const peer=makePeer();NET.peer=peer;let done=false;
  peer.on('open',()=>{const c=peer.connect(NET_PREFIX+code,{reliable:true});NET.conn=c;
    c.on('open',()=>{done=true;NET.on=true;NET.myId=peer.id;onStatus('ok');});
    c.on('data',m=>onClientData(m));
    c.on('close',()=>onHostGone());c.on('error',()=>onHostGone());});
  peer.on('error',e=>{if(!done)onStatus(errText(e));});

function sendHost(m){if(NET.conn)try{NET.conn.send(m);}catch(e){}}

/* messages */
const myPlat=()=>XR.supported?'Quest':touchy?'Phone':'Computer';
function onHostData(pid,m){
  switch(m.t){
    case 'hello':{if(!M.players.some(p=>p.id===pid))M.players.push({id:pid,role:M.players.some(p=>p.role==='baby')?'bear':'bear',plat:m.plat||'Phone'});sendLobby();break;}
    case 'role':{const p=M.players.find(p=>p.id===pid);if(p)setRole(p,m.role);break;}
    case 'b':case 'k':case 'ev':handleMsg(m,pid);sendAll(m,pid);break;
  }
}
function onLeave(pid){
  M.players=M.players.filter(p=>p.id!==pid);
  if(mode==='play'||mode==='over'){
    for(const a of agents.slice())if(a.owner===pid){
      if(a.carried)continue;                     // the baby has it already
      a.owner='bot';a.hasTgt=false;              // a bot takes over their bear
      sendAll({t:'own',id:a.id,owner:'bot'});
    }
    if(BB.owner===pid){BB.owner='bot';for(const h of hands)resetHand(h);sendAll({t:'own',baby:'bot'});toast('The baby left, a bot took over');}
  }
  sendLobby();
}
function onClientData(m){
  switch(m.t){
    case 'full':toast('That room is full');leaveRoom();break;
    case 'lobby':M.players=m.players;if(mode==='lobby')renderLobby();else if(mode==='view'||mode==='over'&&!m.inMatch){showLobby();}break;
    case 'start':beginMatch(m);break;
    case 'over':showOver(m);break;
    case 'own':if(m.baby){BB.owner=m.baby;for(const h of hands)h.has=false;}else{const a=agents.find(a=>a.id===m.id);if(a)a.owner=m.owner;}break;

  if(!mesh||!BB.on)return;
  if(m.t==='b'){const a=agents.find(a=>a.id===m.id);if(!a||isMine(a.owner)||a.carried)return;a.tgt.fromArray(m.p);a.tgtYaw=m.y;if(!a.hasTgt){a.pos.copy(a.tgt);a.last.copy(a.pos);a.faceYaw=m.y;}a.hasTgt=true;a.obj.visible=!(a===me&&XR.on);}

    BB.hp.fromArray(m.h,0);BB.hq.fromArray(m.h,3);BB.hs=m.h[7];BB.nm=m.m;BB.ne.fromArray(m.e);BB.nch=m.c;BB.view.fromArray(m.v);

      if(!h.has){h.g.position.copy(h.np);h.g.quaternion.copy(h.nq);}h.has=true;});

}
const r3=v=>Math.round(v*1000)/1000;
function netTick(dt){
  if(!NET.on||mode!=='play')return;
  for(const a of agents){if(!isMine(a.owner)||a.carried)continue;a.sendT-=dt;if(a.sendT<=0){a.sendT=.08;netSend({t:'b',id:a.id,p:a.pos.toArray().map(r3),y:r3(a.faceYaw)});}}

}

/* ---------------- a match ---------------- */
function setRole(p,role){
  if(role==='baby')for(const o of M.players)if(o!==p&&o.role==='baby')o.role='bear';
  p.role=role;sendLobby();

  const bears=M.players.filter(p=>p.role==='bear').map((p,i)=>({id:'b'+i,owner:p.id,color:GUMMY[i%GUMMY.length]}));
  while(bears.length<3)bears.push({id:'b'+bears.length,owner:'bot',color:GUMMY[bears.length%GUMMY.length]});
  const st={t:'start',P:Object.assign({},P),bears,baby:babyP?babyP.id:'bot',dur:ROUND,k:M.k};

    if(isMine(a.owner))placeBear(a,findHidingSpot(null,0,a));else{a.obj.visible=false;a.pos.set(0,-50,0);}}

  h.innerHTML=M.role==='baby'
    ?(vr?'You\'re the baby! Grab a strip with your hand and pull to peel it, then bring it to your mouth.<br>Grab a gummy bear and eat it too. You can only reach what you can see.'
        :'You\'re the baby! Tap the candy to peel off a strip and eat it.<br>Gummy bears hide inside: tap one when you can see it to grab it.')

    ?('You\'re a gummy bear. The giant baby eats the candy strip by strip, so stay hidden for 3 minutes!<br>'+

  if(mode==='play'&&(NET.on||agents.some(a=>a.owner!=='bot'))){toast('Gulp! You got eaten. Watch the rest of the round');setupView();}
}
let statusLast='';
function statusTick(force){
  if(mode!=='play')return;

  if(!agents.length)return endMatch('baby');
  if(el>M.dur)return endMatch('bears');
  if(BB.owner==='bot'&&!agents.some(a=>a.owner!=='bot'))return endMatch('baby');   // nobody left to play
}
function endMatch(win){const m={t:'over',win,n:agents.length,s:Math.round((performance.now()-M.t0)/1000)};if(NET.on)sendAll(m);showOver(m);}
function showOver(m){
  if(M.overShown)return;M.overShown=true;mode='over';$('seen').style.opacity=0;

function readXR(){

    const src=s.src;if(!src)continue;const side=src.handedness==='left'?'left':'right',o={side,ok:false,grip:false,squeeze:0,a:false,b:false,stick:[0,0]};
    if(src.hand&&s.hd.joints&&s.hd.joints['wrist']&&s.hd.joints['index-finger-tip']&&s.hd.joints['thumb-tip']){
      const J=s.hd.joints,w=J['wrist'],it=J['index-finger-tip'],tt=J['thumb-tip'];
      if(w.visible!==false){
        const sc=new V3();o.pos=new V3();o.quat=new QT();w.matrixWorld.decompose(o.pos,o.quat,sc);
        const pd=it.getWorldPosition(tv1).distanceTo(tt.getWorldPosition(tv2))/XR.scale;

      const sc=new V3();o.pos=new V3();o.quat=new QT();s.g.matrixWorld.decompose(o.pos,o.quat,sc);
      o.grip=bt(1)||bt(0);o.squeeze=Math.max(gp.buttons[1]?gp.buttons[1].value:0,gp.buttons[0]?gp.buttons[0].value:0);
      o.a=bt(4);o.b=bt(5);o.stick=[ax.length>=4?ax[2]:ax[0]||0,ax.length>=4?ax[3]:ax[1]||0];o.ok=true;o.gp=gp;

const S_BABY=10,S_BEAR=.3;
function placeDolly(reset){
  const d=XR.dolly,cl=camera.position,bearView=mode==='play'&&me&&!me.carried;
  const S=bearView?S_BEAR:S_BABY;
  if(S!==XR.scale||reset){XR.scale=S;d.scale.setScalar(S);reset=true;}
  if(bearView){
    // you are the bear: the bear's head is your head
    const c=Math.cos(XR.yaw),s=Math.sin(XR.yaw),lx=cl.x*S,lz=cl.z*S;
    d.rotation.y=XR.yaw;d.position.set(me.pos.x-(lx*c+lz*s),me.pos.y-PL-PR,me.pos.z-(-lx*s+lz*c));
  }else if(reset){
    // you are the baby (or watching): stand next to the candy, which is knee-high to you
    const bb=mesh.geometry.boundingBox,cx=(bb.min.x+bb.max.x)/2,cz=(bb.min.z+bb.max.z)/2,R=Math.max(bb.max.x-bb.min.x,bb.max.z-bb.min.z)/2;

  if(bearView){
    me.faceYaw=Math.atan2(f.x,f.z);me.obj.visible=false;
    const aBtn=(R&&R.a)||(L&&L.a);if(aBtn&&!XR.prevA)me.jumpQ=true;XR.prevA=aBtn;

      const n=5,mv=me&&!me.carried?(XR.on?XR.move:myMove()):null;
      const bots=M.amHost?agents.filter(a=>a.owner==='bot'&&!a.carried).map(a=>[a,botThink(a,dt)]):[];
      for(let i=0;i<n;i++){if(mv)stepAgent(me,mv[0],mv[1],dt/n,!XR.on);for(const[a,m]of bots)stepAgent(a,m[0],m[1],dt/n);}
      for(const a of agents)if(!isMine(a.owner)&&!a.carried&&a.hasTgt){a.pos.lerp(a.tgt,Math.min(1,dt*12));let d=a.tgtYaw-a.faceYaw;d=Math.atan2(Math.sin(d),Math.cos(d));a.faceYaw+=d*Math.min(1,dt*10);}
      if(me&&!me.carried){   // does the baby see you?
        seenT-=dt;if(seenT<=0){seenT=.25;const v=canSee(BB.view,me);seenMe=v?Math.min(1.5,seenMe+.25):Math.max(0,seenMe-.3);if(v&&seenMe>=.75&&seenMe<1)hud('The baby can see you!',1.2);}
        const hunted=hands.some(h=>h.st==='hunt'&&(h.prey===me||h.npr===me.id));
        $('seen').style.opacity=hunted?1:Math.min(1,seenMe/1.1)*.7;
      }
    }
    updateBaby(dt);for(const a of agents)animBear(a,dt);
    netTick(dt);hostCheck();statusTick();
    if(XR.on)placeDolly(false);else if(me&&mode==='play')updatePlayCam(dt);else controls.update();
  }else{if(XR.on)placeDolly(false);else controls.update();}
  updateFalling(dt);
  renderer.render(scene,camera);
});
applyBackdrop();
rebuild();
window.__taffy={P,M,BB,NET,hands,get mesh(){return mesh;},get agents(){return agents;},get me(){return me;},get mode(){return mode;},solo,babyTap,camera,
  tick(sec){const dt=1/30;for(let i=0;i<sec*30;i++){if(mode==='play'){const bots=M.amHost?agents.filter(a=>a.owner==='bot'&&!a.carried).map(a=>[a,botThink(a,dt)]):[];for(let k=0;k<5;k++)for(const[a,m]of bots)stepAgent(a,m[0],m[1],dt/5);}updateBaby(dt);for(const a of agents)animBear(a,dt);updateFalling(dt);hostCheck();}
    const D=mesh.geometry.userData;return {mode,role:M.role,eaten:D.dead.reduce((a,b)=>a+b,0),units:D.units.length,states:hands.map(h=>h.st),bears:agents.map(a=>a.id+':'+a.owner+(a.carried?'(c)':''))};},
  fakeXR(inp){XR.in=inp;},vrBabyHands,XR};
</script>
