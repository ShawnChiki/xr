<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Lathe — 4-axis log carving simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --rail:#3a1f7a; --panel:#fff6e6; --card:#fff; --text:#2a1846; --accent:#ff4fa3; --accent2:#ffd23f; --bgTop:#8fe3ff; --bgBottom:#ffc2e6;
  --railInk:#fff; --accentInk:#fff; --accent2Ink:#1b1530;
  --line:color-mix(in srgb,var(--text) 15%,var(--panel));
  --dim:color-mix(in srgb,var(--text) 66%,var(--panel));
  --faint:color-mix(in srgb,var(--text) 46%,var(--panel));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--panel);color:var(--text);font:13px/1.45 Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
#app{display:flex;height:100vh;height:100dvh}

/* ---------- icon rail ---------- */
#rail{width:66px;flex:none;position:relative;z-index:4;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:12px 0 10px;gap:4px}
#rail .logo{font:700 11px/1 'Space Grotesk';letter-spacing:.04em;color:var(--accent2);text-align:center;margin-bottom:10px}
#rail .logo svg{width:28px;height:28px;display:block;margin:0 auto 4px}
.rb{width:54px;padding:7px 0 5px;border:0;border-radius:12px;background:transparent;color:color-mix(in srgb,var(--railInk) 72%,var(--rail));cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500}
.rb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rb:hover{background:color-mix(in srgb,var(--railInk) 12%,var(--rail));color:var(--railInk)}
.rb.on{background:var(--accent);color:var(--accentInk)}
#rail .grow{flex:1}

/* ---------- panel ---------- */
#panel{width:304px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 16px 60px;transition:margin .2s}
#panel.hidden{margin-left:-304px}
#panel h2{font:700 19px/1.2 'Space Grotesk';margin:0 0 4px}
#panel .sub{color:var(--dim);margin:0 0 16px}
.sec{margin:18px 0 8px;font:600 11px/1 Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.row{margin:0 0 12px}
.row.off{opacity:.38}
.rowtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
.lab{font-weight:500}
.num{width:76px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:3px 6px;text-align:right}
.num:focus{outline:none;border-color:var(--accent)}
.hint{color:var(--dim);font-size:11.5px;margin-top:2px}
/* sliders are little logs: bark track, carved grooves up to the thumb, a sawn end-grain thumb */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:26px;margin:1px 0;cursor:pointer}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:7px;border:1.5px solid var(--barkD);
  background:
    linear-gradient(to bottom,rgba(255,255,255,.55) 0%,rgba(255,255,255,.08) 38%,rgba(0,0,0,0) 55%,rgba(0,0,0,.3) 100%),
    repeating-linear-gradient(118deg,var(--woodD) 0 2px,var(--woodL) 2px 7px) 0 0/var(--p,0%) 100% no-repeat,
    repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),
    var(--stockC)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-6.5px;border-radius:50%;
  border:2px solid var(--barkD);
  background:radial-gradient(circle,var(--woodD) 0 1.4px,transparent 1.8px),repeating-radial-gradient(circle,var(--woodL) 0 2.3px,var(--woodD) 2.3px 3.1px);
  box-shadow:0 2px 0 var(--barkD),inset 0 0 0 1.5px rgba(255,255,255,.35);transition:transform .12s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12) rotate(25deg)}
input[type=range]::-moz-range-track{height:12px;border-radius:7px;border:1.5px solid var(--barkD);
  background:linear-gradient(to bottom,rgba(255,255,255,.55) 0%,rgba(255,255,255,.08) 38%,rgba(0,0,0,0) 55%,rgba(0,0,0,.3) 100%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),var(--stockC)}
input[type=range]::-moz-range-progress{height:12px;border-radius:7px 0 0 7px;
  background:linear-gradient(to bottom,rgba(255,255,255,.5) 0%,rgba(0,0,0,0) 50%,rgba(0,0,0,.28) 100%),repeating-linear-gradient(118deg,var(--woodD) 0 2px,var(--woodL) 2px 7px)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:2px solid var(--barkD);
  background:radial-gradient(circle,var(--woodD) 0 1.4px,transparent 1.8px),repeating-radial-gradient(circle,var(--woodL) 0 2.3px,var(--woodD) 2.3px 3.1px);
  box-shadow:0 2px 0 var(--barkD)}
input[type=range]:disabled{cursor:default}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 4px;cursor:pointer;color:var(--dim);font-weight:500;font-size:12.5px}
.seg button.on{background:var(--text);color:var(--panel)}
.chk{display:flex;gap:9px;align-items:flex-start;margin:0 0 10px;cursor:pointer}
.chk input{accent-color:var(--accent);margin-top:2px}
.chk small{display:block;color:var(--dim);font-size:11.5px}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--dim);font-size:12px;margin:6px 0 10px}
.note b{color:var(--text);font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12px}
.kv span:nth-child(odd){color:var(--dim)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:12px}
.chip.on{background:var(--accent2);border-color:var(--accent2);color:var(--accent2Ink)}
.chip.add{color:var(--dim)}
.zonehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.seedrow{display:flex;gap:6px;align-items:flex-end}
.seedrow .row{flex:1;margin:0}
/* pattern card + picker */
.pcard{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:8px;cursor:pointer}
.pthumb{flex:none;border-radius:9px;overflow:hidden;display:block;line-height:0;border:1px solid var(--line)}
.ptxt{flex:1;min-width:0}
.ptxt b{display:block;font:700 15px 'Space Grotesk'}
.ptxt span{display:block;color:var(--dim);font-size:11.5px;line-height:1.3}
.pchev{font-size:14px;color:var(--dim);padding:0 4px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}
.ptile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 4px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;line-height:1.15;text-align:center}
.ptile canvas{border-radius:7px;width:100%!important;height:auto!important}
.ptile:hover{border-color:var(--accent)}
.ptile.on{border:2px solid var(--accent)}
/* style page */
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preset{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px;cursor:pointer;text-align:left}
.preset b{display:block;font-size:12px;margin-bottom:5px}
.preset.on{border:2px solid var(--accent)}
.swrow{display:flex;gap:2px}
.swrow i{flex:1;height:14px;border-radius:3px}
.swgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sw{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px 7px;cursor:pointer;font-size:12px;font-weight:500}
.sw input{width:26px;height:22px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.sw input::-webkit-color-swatch-wrapper{padding:0}
.sw input::-webkit-color-swatch{border:1px solid var(--line);border-radius:5px}
/* export */
.exp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.exp .t{flex:1}
.exp .t b{display:block;font-weight:600}
.exp .t span{color:var(--dim);font-size:11.5px}
.exp .bs{display:flex;gap:5px;flex:none}
details{margin:8px 0}
summary{cursor:pointer;color:var(--dim);font-weight:500;padding:4px 0}
p.help{color:var(--dim);margin:0 0 10px}
p.help b{color:var(--text)}

/* ---------- stage ---------- */
#stage{flex:1;position:relative;min-width:0;background:linear-gradient(180deg,var(--bgTop),var(--bgBottom))}
#gl,#flat{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
#flat{display:none;cursor:grab}
.glass{background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px);color:var(--text)}
.topbar{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:3}
.topbar .seg,.topbar .btn{background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px)}
#drawPill{position:absolute;left:50%;transform:translateX(-50%);top:calc(46% + 10px);z-index:4;display:none;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;font:500 13px Inter;white-space:nowrap}
#drawPill.show{display:flex}
#stage.v-flat #drawPill{top:64px}
#drawPill span{color:var(--dim)}
#drawPill button{border:0;border-radius:999px;padding:6px 12px;font:600 13px Inter;cursor:pointer;background:var(--card);color:var(--text)}
#drawPill #dpDone{background:var(--accent);color:var(--accentInk)}
.drawbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.drawbar .btn.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.drawbar .btn:disabled{opacity:.45;cursor:default}
#app.m-port #drawPill span,#app.m-land #drawPill span{display:none}
#modeTag{position:absolute;top:14px;left:14px;z-index:3;font:600 12px Inter;padding:6px 10px;border-radius:9px;max-width:55%}
#transport{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:16px;padding:8px 12px;width:min(560px,calc(100% - 24px))}
#transport button{border:0;background:var(--card);color:var(--text);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;cursor:pointer;flex:none}
#transport button svg{width:18px;height:18px;fill:currentColor}
#transport button.big{background:var(--accent);color:var(--accentInk);width:46px;height:46px;border-radius:14px}
#transport button:hover{filter:brightness(1.08)}
.prog{flex:1;height:8px;background:var(--card);border-radius:5px;overflow:hidden;min-width:60px}
#progFill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px}
#progTxt{font-size:12px;color:var(--dim);min-width:118px;text-align:right;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:var(--text);color:var(--panel);padding:9px 16px;border-radius:10px;font-weight:600;z-index:20;transition:transform .25s;max-width:90vw}
#toast.show{transform:translate(-50%,0)}
#err{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:var(--text);z-index:5}

#transport{flex-wrap:wrap;row-gap:6px}
.trow2{flex-basis:100%;display:flex;align-items:center;gap:10px;padding-top:2px}
#dial{width:44px;height:44px;flex:none;cursor:grab;touch-action:none}
#dial svg{width:44px;height:44px;display:block}
#dial .dRing{fill:var(--card);stroke:var(--line);stroke-width:2}
#dial line{stroke:var(--accent);stroke-width:3.2;stroke-linecap:round}
#dial .dHub{fill:var(--text)}
#dial .dTick{stroke:var(--faint);stroke-width:1.4;stroke-linecap:round}
#dialTxt{font-size:12px;color:var(--dim);min-width:44px;font-variant-numeric:tabular-nums}
.tlab{font-size:12px;color:var(--dim);margin-left:4px}
#speed{flex:1}
#speedTxt{font-size:12px;color:var(--dim);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
#stage.v-flat #gl{display:none}
#stage.v-flat #flat,#stage.v-both #flat{display:block}
#stage.v-both #gl{height:46%}
#stage.v-both #flat{top:46%;height:54%;border-top:2px solid var(--line)}

/* ---------- phones ---------- */
.sheetHead{display:none}
#app.m-port .sheetHead,#app.m-land .sheetHead{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;z-index:2;background:var(--panel);margin:-18px -16px 12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.sheetHead .grab{width:38px;height:5px;border-radius:3px;background:var(--line);position:absolute;left:50%;top:5px;transform:translateX(-50%)}
.sheetHead b{flex:1;font:700 16px 'Space Grotesk';padding-top:4px}
.sheetHead button{border:1px solid var(--line);background:var(--card);border-radius:9px;width:34px;height:30px;cursor:pointer;font-size:14px}
/* upright phone: tab bar at the bottom, settings as a bottom sheet */
#app.m-port{flex-direction:column}
#app.m-port #rail{position:fixed;left:0;right:0;bottom:0;width:auto;height:60px;flex-direction:row;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:8;gap:0}
#app.m-port #rail .logo,#app.m-port #rail .grow{display:none}
#app.m-port .rb{width:auto;flex:1;padding:6px 0 4px;font-size:9.5px}
#app.m-port #stage{position:fixed;left:0;right:0;top:0;bottom:60px}
#app.m-port #panel{position:fixed;left:0;right:0;bottom:60px;width:auto;height:58vh;margin:0;border-right:0;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);z-index:7;transition:transform .25s;padding-bottom:30px}
#app.m-port #panel.hidden{margin:0;transform:translateY(calc(100% - 50px));overflow:hidden}
#app.m-port #transport{bottom:58px;width:calc(100% - 16px);padding:6px 10px;gap:6px}
#app.m-port #transport button{width:34px;height:34px}
#app.m-port #transport button.big{width:40px;height:40px}
#app.m-port #progTxt{min-width:0;font-size:11px}
#app.m-port #dial,#app.m-port #dial svg{width:36px;height:36px}
#app.m-port #modeTag{display:none}
#app.m-port .topbar{top:8px;right:8px}
/* sideways phone: rail stays, settings float over the views */
#app.m-land #panel{position:fixed;left:66px;top:0;bottom:0;width:290px;margin:0;z-index:7;box-shadow:8px 0 30px rgba(0,0,0,.25);transition:transform .22s}
#app.m-land #panel.hidden{margin:0;transform:translateX(calc(-100% - 70px))}
#app.m-land #transport{bottom:8px;padding:5px 10px}
#app.m-land .trow2{flex-basis:auto;flex:1}
#app.m-land #modeTag{display:none}

#app.m-port #panel h2,#app.m-land #panel h2{display:none}
#app.m-land #rail{padding:6px 0;gap:0;overflow-y:auto}
#app.m-land #rail .logo,#app.m-land #rail .grow{display:none}
#app.m-land .rb{padding:5px 0 3px;font-size:9px}
#app.m-land .rb svg{width:19px;height:19px}
#app.m-land #transport{flex-wrap:nowrap;width:calc(100% - 140px);max-width:760px;left:auto;right:10px;transform:none;padding:5px 8px;gap:6px;border-radius:13px}
#app.m-land #transport button{width:32px;height:32px}
#app.m-land #transport button.big{width:36px;height:36px}
#app.m-land #progTxt,#app.m-land .tlab,#app.m-land #dialTxt{display:none}
#app.m-land .trow2{flex:1.4;padding:0;gap:6px}
#app.m-land #dial,#app.m-land #dial svg{width:32px;height:32px}
@media (max-width:760px){
  #panel{width:250px}
  #panel.hidden{margin-left:-250px}
  #progTxt{min-width:70px;font-size:11px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <nav id="rail">
    <div class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="8" cy="16" rx="4" ry="8"/><path d="M8 8h16M8 24h16"/><ellipse cx="24" cy="16" rx="4" ry="8"/><path d="M14 9c2 3 0 6 2 9s0 4 2 6" stroke="var(--accent)"/></svg>LOG<br>LATHE</div>
    <button class="rb" data-tab="stock"><svg viewBox="0 0 24 24"><ellipse cx="6" cy="12" rx="3" ry="7"/><path d="M6 5h12M6 19h12"/><ellipse cx="18" cy="12" rx="3" ry="7"/></svg>Log</button>
    <button class="rb" data-tab="pattern"><svg viewBox="0 0 24 24"><path d="M12 12a1.2 1.2 0 1 1 1.2 1.2 3 3 0 1 1-3-3 4.8 4.8 0 1 1 4.8 4.8 6.8 6.8 0 1 1-6.8-6.8"/></svg>Pattern</button>
    <button class="rb" data-tab="carve"><svg viewBox="0 0 24 24"><path d="M9 2h6M12 2v4M10 6h4v8a2 2 0 0 1-4 0z"/><path d="M4 20c3-2 5 1 8-1s5 1 8-1"/></svg>Carve</button>
    <button class="rb" data-tab="paths"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14c3-4 5 2 8-2s5 2 10-3"/></svg>Paths</button>
    <button class="rb" data-tab="export"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>Export</button>
    <div class="grow"></div>
    <button class="rb" data-tab="style"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.9 1.4-1.9-.5-1.1.3-2.1 1.5-2.1H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.3"/><circle cx="10.5" cy="7" r="1.3"/><circle cx="15.5" cy="7.5" r="1.3"/></svg>Style</button>
    <button class="rb" data-tab="help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.7.3-1 .9-1 1.6v.4"/><path d="M12 17h.01"/></svg>Help</button>
  </nav>
  <aside id="panel"></aside>
  <main id="stage">
    <canvas id="gl"></canvas>
    <canvas id="flat"></canvas>
    <div id="modeTag" class="glass"></div>
    <div id="drawPill" class="glass"><b>✏️ Drawing</b><span>drag on the sheet</span><button id="dpUndo" title="Undo last stroke">↶</button><button id="dpDone">Done</button></div>
    <div class="topbar">
      <div class="seg" id="viewSeg"><button data-v="3d">3D</button><button data-v="both" class="on">Both</button><button data-v="flat">Flat</button></div>
      <button class="btn" id="fitBtn" title="Frame the whole log">Fit</button>
    </div>
    <div id="transport" class="glass">
      <button id="bRestart" title="Start the carve over"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      <button id="bPlay" class="big" title="Play / pause (space)"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="bFinish" title="Carve everything now"><svg viewBox="0 0 24 24"><path d="M5 5v14l9-7zM15 5h3v14h-3z"/></svg></button>
      <div class="prog"><div id="progFill"></div></div>
      <span id="progTxt">ready</span>
      <div class="trow2">
        <div id="dial" title="Drag to turn the log (A axis)">
          <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" class="dRing"/><g id="dialTicks"></g><line id="dialHand" x1="22" y1="22" x2="22" y2="6"/><circle cx="22" cy="22" r="3.2" class="dHub"/></svg>
        </div>
        <span id="dialTxt">A 0°</span>
        <span class="tlab">Speed</span>
        <input type="range" id="speed" min="0" max="100" step="0.5">
        <span id="speedTxt">×40</span>
      </div>
    </div>
    <div id="err"></div>

async function loadScan(file, asCheck) {
  try {
    toast(asCheck ? 'Reading check scan…' : 'Reading scan…');
    await new Promise(r => setTimeout(r, 30));
    const buf = await file.arrayBuffer();
    const toMM = { mm: 1, cm: 10, in: 25.4 }[S.stock.scanUnits] || 1, scale = toMM * mmUnit();
    const A = alignMesh(parseMesh(buf, file.name), scale, S.stock.axis);
    if (!(A.L > 0) || !(A.meanR > 0)) throw new Error('empty');
    const nTh = 720, nT = Math.max(32, Math.min(4096, Math.round(A.L / (TWO_PI * A.meanR / nTh)) + 1));
    const map = rasterCyl(A, nTh, nT);
    if (asCheck) {
      const g = deriveG(S), out = new Float32Array(CV.nTh * CV.nT);
      sampleMap(map, nTh, nT, A.L, CV.nTh, CV.nT, g.L, 0, false, out);
      runCheck(out, file.name);
    } else {
      SCAN = { map, nTh, nT, L: A.L, meanR: A.meanR, name: file.name, file };
      S.length = A.L; S.diameter = 2 * A.meanR;
      renderPanel(); schedule(); toast('Scan loaded: ' + fmtLen(A.L) + ' long');
    }
  } catch (e) { toast('Could not read that file as an STL or OBJ mesh'); }
}

const thumbCache = new Map();
function thumbFor(key, p, w, h) {
  const G = BUILD.G, th = S.theme.c, id = key + JSON.stringify(p) + G.C.toFixed(3) + G.gw.toFixed(4) + th.card + th.text + w + 'x' + h;
  if (thumbCache.has(id)) return thumbCache.get(id);
  const dpr = Math.min(window.devicePixelRatio || 1, 2), cv = document.createElement('canvas');
  cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const x = cv.getContext('2d'), Lt = G.C * h / w, sc = w * dpr / G.C;
  x.fillStyle = th.card; x.fillRect(0, 0, cv.width, cv.height);
  let res; try { res = modeInfo(key).gen(p, Lt, G); } catch (e) { res = { tracks: [] }; }
  x.setTransform(sc, 0, 0, -sc, 0, cv.height);
  x.strokeStyle = th.text; x.fillStyle = th.text; x.lineWidth = Math.max(G.gw * 0.7, 1.2 / sc); x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath();
  res.tracks.forEach(tr => {
    const raw = tr.pts.map(q => [G.R * q[1], q[0]]);
    if (tr.dot) { const a = raw[0], X = _wrap(a[0], G.C); x.moveTo(X + G.gw * 0.4, a[1]); x.arc(X, a[1], G.gw * 0.4, 0, TWO_PI); return; }
    seamSplit(raw, G.C).forEach(pc => { x.moveTo(pc[0][0], pc[0][1]); for (let i = 1; i < pc.length; i++) x.lineTo(pc[i][0], pc[i][1]); });
  });
  x.stroke(); res.tracks.some(t => t.dot) && x.fill();
  if (thumbCache.size > 120) thumbCache.clear();
  thumbCache.set(id, cv);
  return cv;
}

function panelHelp() {

function hsl(h, s, l) {

  const f = n => { const k = (n + h / 30) % 12; const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
function surprise() {
  // bold playground colours: shuffle a primary set into the roles
  const P = ['#e8231e', '#ffd400', '#1d3fd6', '#14b04a', '#ff7a00', '#7b2ff7', '#00b7c7', '#ff3fa4'];
  const pick = () => P.splice(Math.floor(Math.random() * P.length), 1)[0];
  const darken = (h, f) => { const c = hexRGB(h).map(v => Math.round(v * f)); return '#' + c.map(v => v.toString(16).padStart(2, '0')).join(''); };
  const c = S.theme.c, bg = pick(), rail = pick(), a1 = pick(), a2 = pick(), stock = pick(), m1 = pick(), m2 = pick();
  Object.assign(c, {
    rail: darken(rail, 0.85), panel: '#fffaf0', card: '#ffffff', text: '#111111', accent: a1, accent2: a2,
    bgTop: bg, bgBottom: darken(bg, 0.6), grid: '#ffffff',
    chuck: m1, jaws: a2, tail: m2, spindle: rail, band: a1, bit: '#e9e9e9',
    stock: stock, woodLight: '#f3c89c', woodDark: '#b4703f', paths: '#111111',
    d0: m2, d1: a2, d2: a1, flatBg: '#fffaf0', flatPath: darken(rail, 0.85), sheet: '#111111'
  });
  S.theme.preset = 'custom';
}
function ink(hex) { const [r, g, b] = hexRGB(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#1b1530' : '#ffffff'; }
function applyTheme() {
  const c = S.theme.c, st = document.documentElement.style;
  ['rail', 'panel', 'card', 'text', 'accent', 'accent2', 'bgTop', 'bgBottom'].forEach(k => st.setProperty('--' + k, c[k]));
  { const sc = hexRGB(c.stock), bk = sc.map(v => Math.round(v * 0.42));
    st.setProperty('--stockC', c.stock); st.setProperty('--woodL', c.woodLight); st.setProperty('--woodD', c.woodDark);
    st.setProperty('--barkD', 'rgb(' + bk.join(',') + ')'); }
  st.setProperty('--railInk', ink(c.rail)); st.setProperty('--accentInk', ink(c.accent)); st.setProperty('--accent2Ink', ink(c.accent2));
  const v3 = (u, h) => { const a = hexRGB(h); logMat.uniforms[u].value.set(a[0] / 255, a[1] / 255, a[2] / 255); };
  v3('uStock', c.stock); v3('uEarly', c.woodLight); v3('uLate', c.woodDark); v3('uD0', c.d0); v3('uD1', c.d1); v3('uD2', c.d2);
  makeLUT(); mapDirty = true; flatDirty = true; thumbCache.clear();
  if (BUILD && renderer) { buildTool(BUILD.G); buildFixtures(BUILD.G); if (pathLines) pathLines.material.color.set(c.paths); }
}
function updateReadouts() {
  if (!BUILD) return;

  const set = (id, pairs) => { const e = document.getElementById(id); if (!e) return; e.innerHTML = ''; pairs.forEach(([a, b]) => e.append(el('span', null, a), el('span', null, b))); };
  if (stockMode() === 'cyl') set('stockKV', [['Tool-centre radius', fmtLen(G.rho)], ['Groove width (auto spacing)', fmtLen(G.gw)], ['Circumference', fmtLen(G.C)]]);
  else { let mn = 1e9; for (let i = 0; i < CV.stock.length; i++) if (CV.stock[i] < mn) mn = CV.stock[i];
    set('stockKV', [['Stock radius', fmtLen(mn) + ' – ' + fmtLen(STOCK.max)], ['Groove width (auto spacing)', fmtLen(G.gw)], ['Length', fmtLen(G.L)]]); }
  const mins = st.minutes, tStr = mins >= 60 ? Math.floor(mins / 60) + ' h ' + Math.round(mins % 60) + ' min' : Math.max(1, Math.round(mins)) + ' min';
  set('carveKV', [['Paths', String(st.paths)], ['Cutting distance', fmtLen(st.length)], ['Machine time ≈', tStr + ' (cutting only)'], ['Sim grid', CV.nTh + ' × ' + CV.nT]]);
  set('pathsKV', [['Sheet', fmtLen(G.C) + ' × ' + fmtLen(G.L)], ['Paths', String(BUILD.tracks.length)], ['Wrapped pieces', String(FLAT.wrapped.length)]]);
  const pn = document.getElementById('patNote');
  if (pn) {
    const z = S.zones[S.zi], mi = modeInfo(z.mode), p = (z.params || {})[mi.key] || {};
    pn.innerHTML = '';

    if (mi.gh) { const g = mi.gh(p).map(v => fmtNum(+(+v).toPrecision(4))); ghTxt = 'In Grasshopper: count ' + g[0] + ' · paramA ' + g[1] + ' · paramB ' + g[2] + (mi.extra && mi.extra(p) ? ' (some settings here go beyond the component)' : ''); }
    else ghTxt = 'New pattern, not in the Grasshopper component.';
    pn.append(el('div', { style: 'margin-top:6px;font-size:11.5px' }, ghTxt));
    const ct = document.getElementById('curThumb');

  }
  const zs = document.getElementById('zoneSpan'); if (zs && BUILD.spans[S.zi]) { const sp = BUILD.spans[S.zi]; zs.textContent = 'Zone ' + (S.zi + 1) + ': ' + fmtNum(sp[0]) + ' → ' + fmtNum(sp[1]) + ' ' + S.units; }
  $('#modeTag').textContent = BUILD.spans.map(sp => modeInfo(sp[2]).name).join(' · ') + '  —  ' + BUILD.tracks.length + ' path' + (BUILD.tracks.length === 1 ? '' : 's');
}

// =====================================================================
// saving
// =====================================================================
const ALLOWED = new Set(['gif', 'png', 'jpg', 'jpeg', 'webp', 'mp4', 'webm', 'txt', 'json', 'md', 'csv', 'svg', 'html', 'zip', 'pdf']);
let DL = null, inFrame = true;
try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
async function getDL() {
  if (DL) return DL;
  try { if (window.claude && typeof window.claude.use === 'function') DL = await window.claude.use('downloads'); } catch (e) { DL = null; }
  return DL;
}
setTimeout(getDL, 0);
async function toBytes(d) {
  if (d instanceof Uint8Array) return d;
  if (d instanceof ArrayBuffer) return new Uint8Array(d);
  if (d instanceof Blob) return new Uint8Array(await d.arrayBuffer());
  return new TextEncoder().encode(String(d));
}
async function saveFile(name, data) {
  const dl = await getDL();
  if (dl) {
    let fname = name, payload = data;
    const ext = name.split('.').pop().toLowerCase();
    if (!ALLOWED.has(ext)) { payload = makeZip([{ name, data: await toBytes(data) }]); fname = name.replace(/\.[^.]+$/, '') + '_' + ext + '.zip'; }
    try { await dl.save({ filename: fname, data: payload }); toast('Saved ' + fname); }
    catch (e) {
      const c = e && e.code;
      toast(c === 'declined' ? 'Save cancelled' : c === 'rate_limited' ? 'One save at a time, try again' : c === 'too_large' ? 'Too large here, try a smaller mesh' : 'Could not save here, use Copy');
    }
    return;
  }
  if (inFrame) { toast('Saving is not available in this view, use Copy'); return; }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Saved ' + name);
}
function saveSTL(base) {
  if (CV.cursor < CV.planN) toast('Note: the carve is not finished, the STL shows it as it is now');
  const buf = stlFromGrid(CV.rad, CV.nTh, CV.nT, BUILD.G.L, +S.stlStep || 1);
  saveFile(base + '_carved.stl', new Uint8Array(buf));
}
function snapshot(base) {
  if (!renderer) return toast('3D view is off in this browser');
  if (viewMode !== '3d') setView('3d');
  renderer.render(scene, cam);
  canvas.toBlob(b => { if (b) saveFile(base + '.png', b); }, 'image/png');
}
function loadPreset(file) {
  if (!file) return;
  file.text().then(t => {
    const o = JSON.parse(t), s = o.settings || o;
    if (!s.zones) throw new Error('no zones');
    mergeSettings(s); renderPanel(); schedule(); toast('Settings loaded');
  }).catch(() => toast('That file is not a Log Lathe JSON'));
}

// =====================================================================
// transport + loop
// =====================================================================
// ---------- dial (log rotation) + speed ----------
let manualA = 0, lastDialDeg = -1;
(() => {
  const g = $('#dialTicks');
  for (let k = 0; k < 12; k++) {
    const a = k * Math.PI / 6, r1 = k % 3 ? 16 : 14.5;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 22 + Math.sin(a) * r1); l.setAttribute('y1', 22 - Math.cos(a) * r1);
    l.setAttribute('x2', 22 + Math.sin(a) * 18); l.setAttribute('y2', 22 - Math.cos(a) * 18); l.setAttribute('class', 'dTick');
    g.append(l);
  }
  const dial = $('#dial');
  const setFrom = e => {
    const b = dial.getBoundingClientRect(), dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2);
    manualA = Math.atan2(dx, -dy); if (manualA < 0) manualA += TWO_PI;
    flatDirty = true;
  };
  dial.addEventListener('pointerdown', e => { dial.setPointerCapture(e.pointerId); CV.playing = false; CV.instant = false; setFrom(e); });
  dial.addEventListener('pointermove', e => { if (dial.hasPointerCapture(e.pointerId)) setFrom(e); });
  const sp = $('#speed'), st = $('#speedTxt');
  sp.value = Math.log(S.simSpeed) / Math.log(1000) * 100; st.textContent = '×' + Math.round(S.simSpeed); setP(sp);
  sp.addEventListener('input', () => { S.simSpeed = Math.max(1, Math.round(Math.pow(1000, sp.value / 100))); st.textContent = '×' + S.simSpeed; persist(); });
})();
function updateDial(A) {
  const deg = Math.round(((A * 180 / Math.PI) % 360 + 360) % 360);
  if (deg === lastDialDeg) return;
  lastDialDeg = deg;
  $('#dialHand').setAttribute('transform', 'rotate(' + deg + ' 22 22)');
  $('#dialTxt').textContent = 'A ' + deg + '°';
  if (viewMode !== '3d') flatDirty = true;
}
const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
function togglePlay() {
  if (CV.instant) return;
  if (CV.playing) { CV.playing = false; return; }
  if (CV.cursor >= CV.planN) resetCarve();
  CV.playing = true;
}
$('#bPlay').onclick = togglePlay;
$('#bRestart').onclick = () => { resetCarve(); CV.playing = true; };
$('#bFinish').onclick = () => { CV.playing = false; CV.instant = true; };
$('#fitBtn').onclick = () => { if (viewMode === 'both') fitSide(); else if (viewMode === '3d') fit3D(); else fitFlat(); };
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => setView(b.dataset.v));
document.querySelectorAll('.rb').forEach(b => b.onclick = () => {
  const t = b.dataset.tab;
  if (t === S.tab && !panel.classList.contains('hidden')) { togglePanel(false); return; }
  panel.classList.remove('hidden'); S.tab = t; renderPanel(); persist();
  if (t === 'paths' && viewMode === '3d') setView('both'); else if (t === 'carve' && viewMode === 'flat') setView('both');
  setTimeout(onResize, 220);
});

  if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); togglePlay(); }
});

function onResize() {
  const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
  if (renderer) { renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix(); sizeSide(); }
  resizeFlat();
}
new ResizeObserver(onResize).observe($('#stage'));

let lastT = performance.now(), lastFlat = 0, lastPlayState = null, lastCamKey = '';
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;

      if (runStamps(14, want) < want) CV.acc = 0;
      if (CV.cursor >= CV.planN) CV.playing = false;
    }
    // tool pose

    if (busy && CV.cursor > 0) manualA = th;          // the dial follows the machine while carving

    const tk = Math.round(CV.plan[o + 3]) + 1;

  }

  }
}

if (viewMode === 'both') { controls.mouseButtons.LEFT = THREE.MOUSE.PAN; controls.touches.ONE = THREE.TOUCH.PAN; }

if (viewMode === 'both') fitSide();
