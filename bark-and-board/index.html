<style>
/* Layout: full-bleed 3D diorama; title card top-left, one control bar along the bottom */
:root{
  --sky-top:#aebcc0; --sky-bot:#ddd8cc; --ink:#1c2520; --soft:#56615a;
  --paper:rgba(247,244,235,.9); --paper-solid:#f7f4eb; --line:rgba(28,37,32,.14);
  --bark:#5e4c3d; --build:#a2533c; --leaf:#5c8743;
  --font:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 78%);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{position:fixed;top:14px;left:max(16px,env(safe-area-inset-left,0px));width:min(330px,calc(100% - 32px));background:var(--paper);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 6px 24px rgba(40,50,40,.12)}
h1{margin:0 0 6px;font-size:1.35rem;font-weight:800;letter-spacing:-.02em;line-height:1}
h1 span{color:var(--build)}
.hint{margin:0;font-size:.86rem;line-height:1.4;color:var(--soft);text-wrap:pretty}
.hint b{color:var(--ink)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
  width:max-content;max-width:calc(100% - 24px);background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 6px 24px rgba(40,50,40,.14)}
.btn{font:inherit;font-size:.88rem;font-weight:600;color:var(--ink);background:transparent;border:0;border-radius:11px;padding:9px 12px;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{background:rgba(28,37,32,.07)}
.btn[aria-pressed="true"]{background:rgba(28,37,32,.12)}
.btn.primary{background:var(--build);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.spd{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.spd button{font:inherit;font-size:.8rem;border:0;background:transparent;color:var(--ink);padding:0 10px;min-height:38px;cursor:pointer}
.spd button[aria-pressed="true"]{background:var(--bark);color:#fff}
:focus-visible{outline:2px solid var(--build);outline-offset:2px}
.fail{position:fixed;inset:0;display:grid;place-content:center;padding:24px;text-align:center;font-size:1rem}
</style>

<body>
<div class="card">
  <h1>Bark <span>&amp;</span> Board</h1>
  <p class="hint" id="hint">A tree and a crew of tiny builders share this patch of ground. In your Quest, <b>draw lines</b> for the tree to grow along and <b>draw boxes</b> for the builders to fill.</p>
</div>
<nav class="bar" aria-label="Controls">
  <button class="btn" id="bPlay">Pause</button>
  <div class="spd" role="group" aria-label="Speed">
    <button data-s="1" aria-pressed="false">1×</button><button data-s="2" aria-pressed="true">2×</button><button data-s="4" aria-pressed="false">4×</button><button data-s="8" aria-pressed="false">8×</button>
  </div>
  <button class="btn" id="bAuto" aria-pressed="true">Builders pick spots</button>
  <button class="btn" id="bDemo">Try a line + box</button>
  <button class="btn" id="bNew">New tree</button>
  <button class="btn primary" id="bXR" hidden>Enter MR</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V3 = THREE.Vector3;
const TAU = Math.PI * 2;

/* ================= random ================= */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let rng = mulberry(17);
const R = () => rng(), RR = (a,b) => a+(b-a)*rng(), RI = (a,b) => Math.floor(a+(b-a+1)*rng());
const pick = a => a[Math.floor(rng()*a.length)];
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hash3(x,y,z,s){ let h=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(z,1274126177)^Math.imul(s,1442695041); h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function vnoise(x,y,z,s){ const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z); let fx=x-X,fy=y-Y,fz=z-Z; fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy); fz=fz*fz*(3-2*fz);
  const l=(a,b,t)=>a+(b-a)*t;
  return l(l(l(hash3(X,Y,Z,s),hash3(X+1,Y,Z,s),fx),l(hash3(X,Y+1,Z,s),hash3(X+1,Y+1,Z,s),fx),fy),
           l(l(hash3(X,Y,Z+1,s),hash3(X+1,Y,Z+1,s),fx),l(hash3(X,Y+1,Z+1,s),hash3(X+1,Y+1,Z+1,s),fx),fy),fz); }
function norm(d){ const l=Math.hypot(d.x,d.y,d.z)||1; d.x/=l; d.y/=l; d.z/=l; return d; }

/* ================= the shared ground: everything lives in metres, tree base at the origin =================
   Builders work on a 5 cm voxel grid. The tree is a graph of nodes drawn as tapered tubes. */
const VS = 0.05, GX = 64, GY = 52, GZ = 64, X0 = -GX*VS/2, Z0 = -GZ*VS/2;
const NV = GX*GY*GZ;
const vox = new Uint8Array(NV);            // 0 empty · 1 white · 2 second white · 3 swallowed by bark
const claimed = new Uint8Array(NV);
const vIdx = new Int32Array(NV).fill(-1);
const cid = (i,j,k) => i + GX*(j + GY*k);
const inG = (i,j,k) => i>=0 && j>=0 && k>=0 && i<GX && j<GY && k<GZ;
const cx = i => X0+(i+.5)*VS, cy = j => (j+.5)*VS, cz = k => Z0+(k+.5)*VS;
const fi = x => Math.floor((x-X0)/VS), fj = y => Math.floor(y/VS), fk = z => Math.floor((z-Z0)/VS);
const cI = c => c % GX, cJ = c => Math.floor(c/GX) % GY, cK = c => Math.floor(c/(GX*GY));

const S = { playing:true, speed:2, auto:true, tool:'curve', size:'room' };

/* ================= renderer ================= */
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true }); }
catch (e) { document.body.insertAdjacentHTML('beforeend','<div class="fail">This browser could not start 3D graphics.</div>'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.02, 60);
camera.position.set(3.1, 1.9, 3.3);
scene.add(camera);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0); controls.enableDamping = true; controls.dampingFactor = .08;
controls.autoRotate = true; controls.autoRotateSpeed = .45; controls.maxPolarAngle = Math.PI*.52;
controls.minDistance = .6; controls.maxDistance = 9; controls.update();
renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; });
addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
scene.add(new THREE.HemisphereLight(0xe6ecef, 0x5a4b3a, 1.5));
const sun = new THREE.DirectionalLight(0xfff1df, 2.2); sun.position.set(2.2, 4, 1.4); scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, .5); fill.position.set(-2, 1.5, -2.5); scene.add(fill);

// everything the tree and builders make sits in `world`, which you can move and scale in the headset
const world = new THREE.Group(); scene.add(world);

const plinth = new THREE.Mesh(new THREE.CylinderGeometry(1.62, 1.68, .08, 96), [
  new THREE.MeshLambertMaterial({ color:0x4c3f33 }), new THREE.MeshLambertMaterial({ color:0x7d8a5e }), new THREE.MeshLambertMaterial({ color:0x362c24 })]);
plinth.position.y = -.04; world.add(plinth);
const blob = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(20,16,12,.55)'); g.addColorStop(.55,'rgba(20,16,12,.22)'); g.addColorStop(1,'rgba(20,16,12,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({ map:t, transparent:true, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.position.y = .003; m.renderOrder = -1; return m;
})();
world.add(blob);

/* ================= the tree: space colonization toward a crown, plus leaders that chase your lines ================= */
const STEP = .036, DI = .3, DK = .048, TIP = .004, RMAX = .1, E = 2.6, MAXN = 2600;
let nodes = [], stepCount = 0, crownBase = .55;
let attr = [];                       // {x,y,z,on,g} g = curve id for a line's twig cloud, -1 for the crown
const inBounds = (x,y,z) => Math.abs(x) < 1.5 && Math.abs(z) < 1.5 && y > .02 && y < GY*VS - .08;

function addNode(x,y,z,parent,order,dir){
  const n = { id:nodes.length, x,y,z, parent:parent?parent.id:-1, ch:[], r:TIP, order, dir:norm({x:dir.x,y:dir.y,z:dir.z}), tip:true, alive:true, birth:stepCount, guide:-1, er:0 };
  if (parent) parent.ch.push(n);
  nodes.push(n); return n;
}
// is any built block within `r` of this point?
function blockedAt(x,y,z,r){
  const i0=fi(x-r), i1=fi(x+r), j0=fj(y-r), j1=fj(y+r), k0=fk(z-r), k1=fk(z+r), rr=(r+VS*.5)*(r+VS*.5);
  for (let k=k0;k<=k1;k++) for (let j=j0;j<=j1;j++) for (let i=i0;i<=i1;i++){
    if (!inG(i,j,k) || !vox[cid(i,j,k)]) continue;
    const dx=cx(i)-x, dy=cy(j)-y, dz=cz(k)-z; if (dx*dx+dy*dy+dz*dz < rr) return true;
  }
  return false;
}
function clampTurn(d,ref,maxA){
  const c = d.x*ref.x+d.y*ref.y+d.z*ref.z; if (c >= Math.cos(maxA)) return d;
  const p = norm({x:d.x-ref.x*c, y:d.y-ref.y*c, z:d.z-ref.z*c}), ca=Math.cos(maxA), sa=Math.sin(maxA);
  if (!isFinite(p.x)) return d;
  return { x:ref.x*ca+p.x*sa, y:ref.y*ca+p.y*sa, z:ref.z*ca+p.z*sa };
}
// grow one segment; if a block is in the way, bend around it
function placeChild(n,d,order){
  let nx=n.x+d.x*STEP, ny=n.y+d.y*STEP, nz=n.z+d.z*STEP; const clr = n.r + .03;
  if (blockedAt(nx,ny,nz,clr)){
    let best=null, bs=-9;
    for (let t=0;t<12;t++){
      const c = norm({ x:d.x+RR(-.9,.9), y:d.y+RR(-.7,.7), z:d.z+RR(-.9,.9) });
      const px=n.x+c.x*STEP, py=n.y+c.y*STEP, pz=n.z+c.z*STEP;
      if (!inBounds(px,py,pz) || blockedAt(px,py,pz,clr)) continue;
      const s = c.x*d.x+c.y*d.y+c.z*d.z; if (s > bs){ bs=s; best=c; }
    }
    if (!best) return null;
    d = best; nx=n.x+d.x*STEP; ny=n.y+d.y*STEP; nz=n.z+d.z*STEP;
  }
  if (!inBounds(nx,ny,nz)) return null;
  const c = addNode(nx,ny,nz,n,order,d); n.tip = false; return c;
}
function makeCrown(){
  attr = attr.filter(a => a.g >= 0);
  const n = 1500, lx=RR(-.15,.15), lz=RR(-.15,.15), y0=RR(.48,.64), y1=RR(1.85,2.1), rmax=RR(.66,.86), lob=[RR(0,TAU),RR(0,TAU)], ns=RI(1,9999);
  crownBase = y0;
  const inside = (x,y,z) => { if (y<y0||y>y1) return false; const t=(y-y0)/(y1-y0), a=Math.atan2(z-lz*t, x-lx*t);
    const env = rmax*Math.pow(Math.sin(Math.PI*Math.min(.98,.08+t*.92)),.75)*(1+.22*Math.cos(a-lob[0])+.12*Math.cos(2*(a-lob[1])));
    return Math.hypot(x-lx*t, z-lz*t) <= env && inBounds(x,y,z); };
  const pads=[]; let guard=0; const want=RI(5,8);
  while (pads.length<want && guard<4000){ guard++; const x=RR(-rmax,rmax), y=RR(y0+.1,y1-.08), z=RR(-rmax,rmax);
    if (!inside(x,y,z) || pads.some(p=>Math.hypot(p.x-x,p.y-y,p.z-z) < p.r+.26)) continue; pads.push({x,y,z,r:RR(.13,.24),sq:RR(.45,.7)}); }
  let k=0; guard=0;
  while (k<n && guard<n*40){ guard++;
    let x,y,z;
    if (R()<.82 && pads.length){ const p=pick(pads), g=()=>(R()+R()+R()-1.5)*1.15; x=p.x+g()*p.r; y=p.y+g()*p.r*p.sq; z=p.z+g()*p.r; }
    else { x=RR(-rmax,rmax); y=RR(y0,y1); z=RR(-rmax,rmax); if (vnoise(x*2.4,y*2.4,z*2.4,ns) < .62) continue; }
    if (!inside(x,y,z)) continue;
    attr.push({x,y,z,on:true,g:-1}); k++;
  }
}
// reach widens when the tree stalls, so far-off parts of the crown still get found
let reach = DI;
function colonize(cap){
  const DI = reach, G = Math.ceil(4/DI), key = (x,y,z) => Math.floor((x+2)/DI) + Math.floor(y/DI)*G + Math.floor((z+2)/DI)*G*G, buckets = new Map();
  for (const n of nodes){ if (n.ch.length>=3) continue; const kk=key(n.x,n.y,n.z); let b=buckets.get(kk); if (!b){ b=[]; buckets.set(kk,b); } b.push(n); }
  const acc = new Map(), di2 = DI*DI, dk2 = DK*DK;
  for (const a of attr){ if (!a.on) continue;
    const bx=Math.floor((a.x+2)/DI), by=Math.floor(a.y/DI), bz=Math.floor((a.z+2)/DI);
    let best=null, bd=di2;
    for (let dz=-1;dz<=1;dz++) for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
      const b = buckets.get((bx+dx)+(by+dy)*G+(bz+dz)*G*G); if (!b) continue;
      for (const n of b){ const ex=a.x-n.x, ey=a.y-n.y, ez=a.z-n.z, d2=ex*ex+ey*ey+ez*ez; if (d2<bd){ bd=d2; best=n; } }
    }
    if (!best) continue;
    if (bd < dk2){ a.on = false; continue; }
    const d = Math.sqrt(bd); let v = acc.get(best); if (!v){ v=[0,0,0]; acc.set(best,v); }
    v[0]+=(a.x-best.x)/d; v[1]+=(a.y-best.y)/d; v[2]+=(a.z-best.z)/d;
  }
  let grown = 0;
  for (const [n,v] of shuffle([...acc.entries()])){
    if (grown>=cap || nodes.length>=MAXN) break;
    const kids = n.ch.length;
    if (kids>=3 || (kids>=1 && R()>.43)) continue;
    let d = norm({x:v[0],y:v[1],z:v[2]}); const w = kids ? .25 : .45;
    d = norm({ x:d.x*(1-w)+n.dir.x*w+RR(-.06,.06), y:d.y*(1-w)+n.dir.y*w+.07, z:d.z*(1-w)+n.dir.z*w+RR(-.06,.06) });
    d = norm(clampTurn(d, n.dir, kids ? .9 : .32));
    if (kids){ const c0=d.x*n.dir.x+d.y*n.dir.y+d.z*n.dir.z; if (c0 > Math.cos(.38)) d = norm(clampTurn(d,n.dir,.38)); }
    if (placeChild(n, d, kids ? n.order+1 : n.order)) grown++;
  }
  reach = grown ? Math.max(DI, reach*.9) : (acc.size || attr.some(a => a.on)) ? Math.min(1.1, reach*1.25) : reach;
  return grown;
}

/* ---- your lines: each one gets a leader branch that follows it point by point ---- */
let curves = [], nextId = 1;
function nearestNode(p){ let best=null, bd=1e9; for (const n of nodes){ const d=(n.x-p.x)**2+(n.y-p.y)**2+(n.z-p.z)**2; if (d<bd){ bd=d; best=n; } } return best; }
function leaders(){
  let active = 0;
  for (const c of curves){
    if (c.idx >= c.pts.length || nodes.length >= MAXN){ c.done = true; continue; }
    active++;
    let L = c.leader!=null ? nodes[c.leader] : null;
    if (!L || !L.tip){
      const t = c.pts[c.idx]; L = nearestNode(t);
      // a leader that starts somewhere along a branch gets a new limb; one continuing its own tip keeps its order
      c.leader = L.id; c.fresh = true;
    }
    const t = c.pts[c.idx];
    let d = norm({ x:t.x-L.x, y:t.y-L.y, z:t.z-L.z });
    d = norm(clampTurn(d, L.dir, c.fresh ? .8 : .45));
    d = norm({ x:d.x+RR(-.07,.07), y:d.y+RR(-.05,.07), z:d.z+RR(-.07,.07) });
    const ch = placeChild(L, d, c.fresh ? L.order+1 : L.order);
    if (!ch){ if (++c.fail > 4){ c.fail=0; c.idx++; c.leader=null; } continue; }
    c.fail = 0; c.fresh = false; ch.guide = c.id; c.leader = ch.id;
    const dist = q => Math.hypot(q.x-ch.x, q.y-ch.y, q.z-ch.z);
    while (c.idx < c.pts.length && (dist(c.pts[c.idx]) < DK*1.3 || (c.idx+1 < c.pts.length && dist(c.pts[c.idx+1]) < dist(c.pts[c.idx])))) c.idx++;
    for (const a of attr) if (a.g===c.id && !a.on && a.i<=c.idx+2 && a.wake){ a.on = true; a.wake = false; }
  }
  return active;
}
function computeRadii(){
  for (let i=nodes.length-1;i>=0;i--){ const n=nodes[i], age=stepCount-n.birth;
    const own = n.guide>=0 ? .005 + Math.min(.01, age*.00005) : TIP + Math.min(.004, age*.000015);
    let s=0; for (const c of n.ch) s += Math.pow(c.r, E);
    n.r = Math.min(RMAX, n.ch.length ? Math.max(own, Math.pow(s, 1/E)) : own);
  }
  for (const n of nodes) if (n.order===0 && n.y < .22) n.r *= 1 + (.22-n.y)/.22*.6;
}
// bark that thickens into a block swallows it
function engulf(){
  let changed = false;
  for (const n of nodes){
    if (n.parent<0 || n.r < .02 || n.r - n.er < .004) continue; n.er = n.r;
    const p = nodes[n.parent], L = Math.hypot(n.x-p.x,n.y-p.y,n.z-p.z), st = Math.max(1, Math.ceil(L/(VS*.5))), rr = n.r - VS*.25;
    for (let s=0;s<=st;s++){ const t=s/st, x=p.x+(n.x-p.x)*t, y=p.y+(n.y-p.y)*t, z=p.z+(n.z-p.z)*t;
      for (let k=fk(z-rr);k<=fk(z+rr);k++) for (let j=fj(y-rr);j<=fj(y+rr);j++) for (let i=fi(x-rr);i<=fi(x+rr);i++){
        if (!inG(i,j,k)) continue; const c=cid(i,j,k); if (vox[c]!==1 && vox[c]!==2) continue;
        if ((cx(i)-x)**2+(cy(j)-y)**2+(cz(k)-z)**2 < rr*rr){ vox[c]=3; paintVox(c); changed = true; }
      } }
  }
  if (changed) vMesh.instanceColor.needsUpdate = true;
}
// where is the wood? a hash of branch segments the builders ask before placing a block
const WH = .15, woodHash = new Map(); let segs = [];
const wkey = (a,b,c) => a*1000003 + b*1009 + c;
function rebuildWood(){
  woodHash.clear(); segs = [];
  for (const n of nodes){ if (n.parent<0) continue; const p=nodes[n.parent]; const s={ax:p.x,ay:p.y,az:p.z,bx:n.x,by:n.y,bz:n.z,ra:Math.min(p.r, n.r*1.2),rb:n.r}; const id=segs.push(s)-1;
    const pad = Math.max(s.ra,s.rb) + .07;
    for (let a=Math.floor((Math.min(s.ax,s.bx)-pad)/WH); a<=Math.floor((Math.max(s.ax,s.bx)+pad)/WH); a++)
