<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

// ================= tuning =================
const UNIT = 0.26;        // one model unit in meters; the little people stand about 30 cm (1 ft) tall with their hats
const COM = 0.42;         // flip pivot height, in model units
const G = 9.8 * 0.8;      // gravity for jumps
const STEEP = 0.55;       // |surface normal.y| below this = climbing a wall
const CEIL = -0.4;        // normal.y below this = a ceiling; nobody walks up there
const PROBE = 0.05;       // how far above a surface the feet feel ahead
const MAX_ELVES = 14, FIRST_BATCH = 6, NEXT_BATCH = 4;
const TAU = Math.PI * 2;
const V3 = THREE.Vector3;
const Y = new V3(0, 1, 0), DOWN = new V3(0, -1, 0), ZAX = new V3(0, 0, 1);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const wrapPi = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const PREVIEW_BG = new THREE.Color('#f3e9da');
scene.background = PREVIEW_BG;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.02, 60);
camera.position.set(2.3, 1.6, 2.7);
scene.add(camera);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.3, 0.55, -0.4);
controls.enableDamping = true; controls.minDistance = 0.4; controls.maxDistance = 7;
controls.update();
addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
scene.add(new THREE.HemisphereLight(0xfff6ea, 0x9a8a7a, 1.9));
const sunLight = new THREE.DirectionalLight(0xffffff, 1.5); sunLight.position.set(1.5, 3, 1.2); scene.add(sunLight);

const grad = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toonMat = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: grad });
const mouthMat = new THREE.MeshBasicMaterial({ color: '#3a1626' });

function radialTex(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  for (const [o, col] of stops) g.addColorStop(o, col);
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const dotTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,.9)'], [1, 'rgba(255,255,255,0)']]);
const shadowTex = radialTex([[0, 'rgba(0,0,0,.55)'], [0.5, 'rgba(0,0,0,.3)'], [1, 'rgba(0,0,0,0)']]);
const shadowGeo = new THREE.CircleGeometry(0.075, 20);
const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
const starGeo = new THREE.OctahedronGeometry(0.011);
const starMat = new THREE.MeshBasicMaterial({ color: '#ffe14d' });

// ================= sound =================
// Everything is synthesized: babble is a buzzy voice pushed through two vowel filters, so it sounds like tiny gibberish talk.
const AU = { ctx: null, listener: null, noise: null, master: null };
function initAudio() {
  if (AU.ctx) { AU.ctx.resume(); return; }
  AU.listener = new THREE.AudioListener(); camera.add(AU.listener);
  AU.ctx = AU.listener.context; AU.master = AU.listener.getInput();
  const len = AU.ctx.sampleRate, buf = AU.ctx.createBuffer(1, len, len), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AU.noise = buf;
  for (const e of elves) attachVoice(e);
  AU.ctx.resume();
}
function attachVoice(e) {
  if (!AU.ctx || e.voiceIn) return;
  const pa = new THREE.PositionalAudio(AU.listener);
  const g = AU.ctx.createGain(); g.gain.value = 1.4;
  pa.setNodeSource(g); pa.setRefDistance(0.7); pa.setRolloffFactor(1.1);
  pa.position.y = 0.12; e.root.add(pa); e.audio = pa; e.voiceIn = g;
}
const VOW = { a: [800, 1200], e: [480, 1900], i: [310, 2300], o: [500, 880], u: [340, 780], y: [400, 1600] };
const CONS = { t: [3500, 1.5, 0.025], k: [2200, 1.5, 0.03], p: [900, 1, 0.02], s: [5500, 2, 0.07], b: [400, 1, 0.02], h: [1600, 0.7, 0.05] };
function noiseBurst(dest, t, dur, freq, q, vol) {
  const c = AU.ctx, s = c.createBufferSource(); s.buffer = AU.noise; s.loop = true;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function syl(dest, t, dur, f0a, f0b, vow, fs, vol, cons, vib) {
  const c = AU.ctx, o = c.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(f0a, t); o.frequency.linearRampToValueAtTime(f0b, t + dur);
  if (vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = vib; lg.gain.value = f0a * 0.07; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + 0.03); }
  const [F1, F2] = VOW[vow];
  const b1 = c.createBiquadFilter(); b1.type = 'bandpass'; b1.frequency.value = F1 * fs; b1.Q.value = 5;
  const b2 = c.createBiquadFilter(); b2.type = 'bandpass'; b2.frequency.value = F2 * fs; b2.Q.value = 7;
  const g = c.createGain(), g2 = c.createGain(); g2.gain.value = 0.7;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.setValueAtTime(vol, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(b1); o.connect(b2); b1.connect(g); b2.connect(g2); g2.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.03);
  if (cons && CONS[cons]) { const [f, q, d] = CONS[cons]; noiseBurst(dest, Math.max(c.currentTime, t - 0.012), d, f, q, vol * 0.7); }
}
function babble(e, n, question, delay = 0) {
  if (!e.voiceIn) return 0.6;
  const t0 = AU.ctx.currentTime + 0.02 + delay; let t = t0;
  const base = e.pitch * rand(0.9, 1.15);
  for (let i = 0; i < n; i++) {
    const k = i / Math.max(1, n - 1), dur = rand(0.08, 0.17) * (i === n - 1 ? 1.6 : 1);
    const f = base * (question ? 1 + 0.55 * k * k : 1.15 - 0.3 * k) * rand(0.9, 1.12);
    syl(e.voiceIn, t, dur, f, f * rand(0.88, 1.15), pick('aeiouy'), e.fs, 0.9, Math.random() < 0.55 ? pick('tkpsbh') : null);
    t += dur + rand(0.015, 0.05);
  }
  const d = t - t0 + delay; e.talkT = Math.max(e.talkT, d); return d;
}
function laugh(e, n, delay = 0) {
  if (!e.voiceIn) return 1.2;
  const t0 = AU.ctx.currentTime + 0.02 + delay; let t = t0;
  const base = e.pitch * rand(1.2, 1.5), v = pick(['e', 'a', 'i']);
  for (let i = 0; i < n; i++) {
    const dur = rand(0.06, 0.09), f = base * (1 - i * 0.035);
    noiseBurst(e.voiceIn, t, 0.04, 1700, 0.8, 0.35);
    syl(e.voiceIn, t + 0.02, dur, f, f * 0.9, v, e.fs, 1.0, null);
    t += dur + rand(0.045, 0.075);
  }
  syl(e.voiceIn, t + 0.05, 0.25, base * 1.3, base * 0.8, 'i', e.fs, 0.6, 'h'); // little wheeze at the end
  const d = t - t0 + 0.3 + delay; e.talkT = Math.max(e.talkT, d); return d;
}
function say(e, w, delay = 0) {
  if (!e.voiceIn) return 0.2;
  const t = AU.ctx.currentTime + 0.01 + delay, b = e.pitch, fs = e.fs, out = e.voiceIn; let d = 0.2;
  switch (w) {
    case 'hup': syl(out, t, 0.11, b * 1.1, b * 1.5, 'u', fs, 0.9, 'h'); d = 0.12; break;
    case 'whee': syl(out, t, 0.5, b * 1.2, b * 2.1, 'i', fs, 0.9, null, 6); d = 0.5; break;
    case 'yip': syl(out, t, 0.08, b * 1.8, b * 2.2, 'i', fs, 0.9, null); syl(out, t + 0.11, 0.12, b * 2.0, b * 1.6, 'e', fs, 0.9, null); d = 0.25; break;
    case 'waa': syl(out, t, 0.75, b * 1.5, b * 0.9, 'a', fs, 1.0, null, 9); d = 0.75; break;
    case 'oof': syl(out, t, 0.18, b * 0.95, b * 0.6, 'u', fs, 0.9, 'p'); d = 0.2; break;
    case 'ow': syl(out, t, 0.3, b * 1.6, b * 1.0, 'a', fs, 0.9, null); syl(out, t + 0.18, 0.15, b * 1.1, b * 0.9, 'u', fs, 0.7, null); d = 0.35; break;
    case 'hey': syl(out, t, 0.28, b * 1.0, b * 1.45, 'e', fs, 0.9, 'h'); d = 0.3; break;
    case 'pop': { const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
      o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(1100, t + 0.09);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.7, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.14); d = 0.1; break; }
    case 'pat': noiseBurst(out, t, 0.05, 700, 1, 0.3); d = 0.05; break;
  }
  e.talkT = Math.max(e.talkT, d); return d;
}
function thud(e, big) {
  if (!e.voiceIn) return;
  const c = AU.ctx, t = c.currentTime + 0.005, o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.22);
  g.gain.setValueAtTime(big ? 2.2 : 1.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); g.connect(e.voiceIn); o.start(t); o.stop(t + 0.32);
  noiseBurst(e.voiceIn, t, 0.1, 260, 0.7, big ? 1.3 : 0.9);
}
function chomp(t) {
  noiseBurst(AU.master, t, 0.09, rand(1400, 2600), 1.2, 0.5);
  noiseBurst(AU.master, t + 0.03, 0.07, rand(500, 900), 2, 0.45);
  syl(AU.master, t, 0.08, 95, 70, 'o', 1, 0.35, null);
}
function gulp(t) {
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(130, t + 0.2);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + 0.27);
  syl(AU.master, t + 0.45, 0.7, 170, 205, 'u', 0.8, 0.45, null, 5);  // "mmmm"
}
function shimmer() {
  const c = AU.ctx, t = c.currentTime;
  [523, 659, 784, 988, 1175, 1568, 2093].forEach((f, i) => {
    const o = c.createOscillator(), g = c.createGain(), s = t + i * 0.11;
    o.frequency.setValueAtTime(f, s); o.frequency.linearRampToValueAtTime(f * 1.03, s + 1.4);
    g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.1, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 1.6);
    o.connect(g); g.connect(AU.master); o.start(s); o.stop(s + 1.7);
  });
  const o = c.createOscillator(), g = c.createGain(); o.type = 'triangle';
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(880, t + 2.2);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + 2.5);
}

// ================= room =================
// The room is one triangle mesh: your Quest's room scan in mixed reality, a pretend living room in the preview.
// It is invisible in MR, but it still hides little people who walk behind your real furniture.
const Room = { kind: '', geo: null, collider: null, occluder: null, scan: null, visual: null, spots: [], minY: 0, sig: '', builtAt: 0 };
const colliderMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
const occluderMat = new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide });
const scanMat = new THREE.ShaderMaterial({
  uniforms: { uT: { value: 0 }, uO: { value: new V3() }, uR: { value: 0 }, uFade: { value: 0 } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uT, uR, uFade; uniform vec3 uO; varying vec3 vW;
    vec3 hue(float h){ return clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); }
    void main(){
      vec3 n = abs(normalize(cross(dFdx(vW), dFdy(vW))));
      vec3 d = 0.5 - abs(fract(vW * 7.0) - 0.5);
      float dl = n.x * min(d.y, d.z) + n.y * min(d.x, d.z) + n.z * min(d.x, d.y);
      float line = 1.0 - smoothstep(0.02, 0.07, dl);
      float r = length(vW - uO);
      float inside = 1.0 - smoothstep(uR - 0.02, uR + 0.04, r);
      float front = smoothstep(uR - 0.6, uR, r) * inside;
      vec3 col = hue(fract(vW.y * 0.5 + r * 0.3 - uT * 0.25));
      float a = (line * 0.8 + front * 0.35 + 0.06) * inside * uFade;
      if (a < 0.01) discard;
      gl_FragColor = vec4(col * (0.8 + front * 0.6), a);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
});
function geoFrom(pos, idx) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  if (idx) g.setIndex(idx);
  return g;
}
function clearRoom() {
  for (const k of ['occluder', 'scan', 'visual']) if (Room[k]) { scene.remove(Room[k]); Room[k] = null; }
  if (Room.geo && Room.kind !== 'preview') { Room.geo.disposeBoundsTree(); Room.geo.dispose(); }
  Room.geo = Room.collider = null; Room.spots = []; Room.kind = '';
}
function setRoom(geo, kind, visual) {
  clearRoom();
  if (!geo.boundsTree) geo.computeBoundsTree();
  geo.computeBoundingBox();
  Room.geo = geo; Room.kind = kind;
  Room.collider = new THREE.Mesh(geo, colliderMat); Room.collider.updateMatrixWorld(true);
  if (visual) { Room.visual = visual; scene.add(visual); }
  else { Room.occluder = new THREE.Mesh(geo, occluderMat); Room.occluder.renderOrder = -10; scene.add(Room.occluder); }
  Room.scan = new THREE.Mesh(geo, scanMat); Room.scan.renderOrder = 5; Room.scan.visible = false; Room.scan.frustumCulled = false;
  scene.add(Room.scan);
  Room.minY = geo.boundingBox.min.y;
  sampleSpots(geo);
}
// Random points spread over the room's surfaces, used to pick places to run to, jump to and appear at.
function sampleSpots(geo) {
  const P = geo.attributes.position.array, I = geo.index ? geo.index.array : null;
  const tris = I ? I.length / 3 : P.length / 9, vi = (t, k) => (I ? I[t * 3 + k] : t * 3 + k) * 3;
  const a = new V3(), b = new V3(), c = new V3(), ab = new V3(), ac = new V3();
  const cum = new Float32Array(tris); let total = 0;
  const top = Room.minY + 2.1;   // skip the ceiling
  for (let t = 0; t < tris; t++) {
    a.fromArray(P, vi(t, 0)); b.fromArray(P, vi(t, 1)); c.fromArray(P, vi(t, 2));
    const area = ab.subVectors(b, a).cross(ac.subVectors(c, a)).length() * 0.5;
    if ((a.y + b.y + c.y) / 3 < top) total += area;
    cum[t] = total;
  }
  Room.spots = [];
  if (total <= 0) return;
  for (let k = 0; k < 900; k++) {
    const r = Math.random() * total; let lo = 0, hi = tris - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < r) lo = m + 1; else hi = m; }
    a.fromArray(P, vi(lo, 0)); b.fromArray(P, vi(lo, 1)); c.fromArray(P, vi(lo, 2));
    let u = Math.random(), v = Math.random(); if (u + v > 1) { u = 1 - u; v = 1 - v; }
    const p = a.clone().addScaledVector(ab.subVectors(b, a), u).addScaledVector(ac.subVectors(c, a), v);
    const n = ab.subVectors(b, a).cross(ac.subVectors(c, a)).normalize().clone();
    Room.spots.push({ p, n });
  }
}
const randomSpot = () => Room.spots.length ? pick(Room.spots) : null;

const rc = new THREE.Raycaster(); rc.firstHitOnly = true;
// Hit point plus the surface normal turned to face where the ray came from (scan triangles can face either way).
function cast(o, d, far) {
  if (!Room.collider) return null;
  rc.set(o, d); rc.near = 0; rc.far = far;
  const h = rc.intersectObject(Room.collider, false)[0];
  if (!h || !h.face) return null;
  const n = h.face.normal.clone();
  if (n.dot(d) > 0) n.negate();
  return { p: h.point.clone(), n, d: h.distance };
}

// Pretend living room for the desktop preview.
function buildPreviewRoom() {
  const group = new THREE.Group(), pos = [], idx = [], v = new V3();
  function append(g, m) {
    const base = pos.length / 3, p = g.attributes.position;
    for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(m); pos.push(v.x, v.y, v.z); }
    for (const i of g.index.array) idx.push(base + i);
  }
  function add(g, col, x, y, z, ry = 0) {
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: col }));

  updateSparks(dt); updateScan(dt, t); updateCard(dt);
  renderer.render(scene, camera);
});

enterWorld('preview');
window.littleElves = { elves, addElf, eat: () => { initAudio(); startEating(); }, Mush, Room, V3, camera, controls };
</script>
