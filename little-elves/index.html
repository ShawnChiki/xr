<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Elves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2b2140; --pink:#ff3d7f; --sun:#ffd23f; --muted:#7a6a95; --card:rgba(255,253,248,.94); color-scheme:light; }
  html,body{margin:0;height:100%;overflow:hidden;background:#f3e9da;font-family:Fredoka,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  canvas{display:block;touch-action:none}

    border-radius:22px;padding:18px 20px 16px;box-shadow:0 10px 30px rgba(60,30,80,.18)}
  h1{margin:0;font-size:34px;line-height:1;color:var(--pink);font-weight:700}
  .for{margin:4px 0 12px;font-size:16px;color:var(--muted)}
  #hint{margin:0 0 12px;font-size:16px;line-height:1.35}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;background:var(--sun);color:var(--ink)}
  button.alt{background:#efe6fb}
  button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
  #note{margin:10px 0 0;font-size:13px;line-height:1.35;color:var(--muted)}
  #note:empty{display:none}
</style>
<script type="importmap">
{ "imports": {

</head>
<body>
<div id="card">
  <h1>Little Elves</h1>
  <p class="for">for Eliza</p>

    <button id="mr" hidden>Start in your room</button>
    <button id="add" class="alt" hidden>+ Little person</button>
  </div>
  <p id="note"></p>
</div>

const shadowGeo = new THREE.CircleGeometry(0.075, 20);

  for (let i = E.length - 1; i >= 0; i--) if (E[i] < t) E.splice(i, 1);
  const d = e.root.parent === scene ? e.root.position.distanceTo(camHead) : 0;
  if (d > 5.5 || E.length >= 16 || (E.length >= 9 && d > 1.2)) return false;
  E.push(t + dur); return true;
}
const farFrom = (e, r) => e.root.parent === scene && e.root.position.distanceTo(camHead) > r;
function initAudio() {
  if (AU.ctx) { AU.ctx.resume(); return; }

  AU.ctx = AU.listener.context; AU.master = AU.listener.getInput();

}

const now = () => AU.ctx.currentTime;
const VOW = { a: [800, 1200], e: [480, 1900], i: [310, 2300], o: [500, 880], u: [340, 780], y: [400, 1600] };
const CONS = { t: [3500, 1.5, 0.025], k: [2200, 1.5, 0.03], p: [900, 1, 0.02], s: [5500, 2, 0.07], b: [400, 1, 0.02], h: [1600, 0.7, 0.05], d: [2800, 1.2, 0.02], g: [1500, 1.2, 0.03], z: [4200, 1.5, 0.08], f: [6000, 1, 0.06] };

const KINDS = {

  elf: { w: 3, size: [0.85, 1.2], voice: [280, 380], fs: [1.25, 1.45], lang: 'tinkly' },
  pixie: { w: 2, size: [0.62, 0.78], voice: [650, 900], fs: [1.6, 1.9], lang: 'chirp' },
  bumble: { w: 2, size: [0.82, 1.02], voice: [105, 145], fs: [0.85, 0.95], lang: 'blub' },

const LANGS = {

const LAUGH_STYLES = { rumbly: ['hoho', 'haha', 'snort', 'hehe'], tinkly: ['hehe', 'trill', 'wheeze', 'haha'], chirp: ['twitter', 'trill'], blub: ['snort', 'haha', 'wheeze', 'hoho'], gobble: ['cackle', 'cackle', 'snort', 'wheeze'] };

  const init = { requiredFeatures: ['local-floor'], optionalFeatures: ['mesh-detection', 'plane-detection', 'hand-tracking', 'depth-sensing'],
    depthSensing: { usagePreference: ['gpu-optimized'], dataFormatPreference: ['luminance-alpha', 'float32', 'unsigned-short'] } };
  try { session = await navigator.xr.requestSession('immersive-ar', init); }
  catch (err) {
    // older browsers: try again without the live depth camera
    try { session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['local-floor'], optionalFeatures: ['mesh-detection', 'plane-detection', 'hand-tracking'] }); }
    catch (err2) { noteEl.textContent = 'Could not start mixed reality: ' + err2.message; return; }
  }
  enterWorld('mr');
  await renderer.xr.setSession(session);
  session.addEventListener('end', () => enterWorld('preview'));
}
mrBtn.addEventListener('click', startMR);
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-ar').then(ok => {
    mrBtn.hidden = !ok;
    noteEl.textContent = ok ? 'In your Quest: tap Start in your room, then grab the floating mushroom with your hand and eat it.'
      : 'Open this page in the Quest browser to bring the little people into your real room.';
  }).catch(() => {});
} else noteEl.textContent = 'Open this page in the Quest browser to bring the little people into your real room.';

// ================= loop =================
let last = 0;
function xrStep(frame) {
  World.frames++;
  if (Room.occluder && Room.occluder.visible && renderer.xr.hasDepthSensing && renderer.xr.hasDepthSensing()) Room.occluder.visible = false;
  if (World.frames % 15 === 1) readRoom(frame);
  if (!Room.collider && performance.now() - World.t0 > 6000) { setRoom(fallbackFloor, 'fallback'); World.noRoom = true; }
  if (!World.placed && World.frames > 20) {
    World.placed = true; placeMushroom();
    showCard(['Little Elves', 'for Eliza', 'Grab the floating mushroom with your hand', 'and bring it up to your mouth.']);
  }
  if (World.noRoom === true) {
    World.noRoom = 'told';
    showCard(['No room scan found', 'The little people will stay on the floor.', 'To fix it: Quest Settings > Physical space', '> Space setup. Then come back!'], 9);
  }
}
// As the crowd grows, people you can't see, or who are far away, are updated every few frames (with the time
// saved up), and skip the small extras. Anyone near you, in your hand, or dancing around you always runs every frame.
const LOD = { f: 0, frus: new THREE.Frustum(), m: new THREE.Matrix4(), sph: new THREE.Sphere(), last: { full: 0, part: 0, skip: 0 } };
function updateElves(dt, t, xr) {
  LOD.f++;
  const n = elves.length, busy = n > 8 && !LOD.off, st = LOD.last; st.full = st.part = st.skip = 0;
  if (busy) {
    if (!xr) camera.updateMatrixWorld();
    LOD.m.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); LOD.frus.setFromProjectionMatrix(LOD.m);
  }
  for (const e of elves) {
    e.acc = (e.acc || 0) + dt;
    if (e.slot === undefined) e.slot = (Math.random() * 12) | 0;
    let every = 1, vis = true;
    if (busy && !e.giant && e.state !== 'held' && e.state !== 'ride' && Gift.giver !== e && !(e.activity && e.activity.type === 'ring')) {
      const d = e.root.position.distanceTo(camHead);
      LOD.sph.center.copy(e.root.position).addScaledVector(Y, 0.12 * e.s); LOD.sph.radius = 0.25 * e.s + 0.1;
      vis = d < 0.9 || LOD.frus.intersectsSphere(LOD.sph);
      if (!vis) every = n > 16 ? 6 : 4;
      else if (d > 4) every = n > 16 ? 3 : 2;
      else if (d > 2.5 && n > 16) every = 2;
      if (e.state === 'air') every = Math.min(every, 2);
    }
    if (every > 1 && (LOD.f + e.slot) % every) { st.skip++; continue; }
    const step = Math.min(e.acc, 0.1); e.acc = 0;
    e.update(step, t, vis, every > 1);
    if (every > 1) st.part++; else st.full++;
  }
}
function simulate(dt, t, xr) {
  updateCamVectors();
  userPos.copy(camera.position); camHead.copy(camera.position);
  updateMouthPos();
  if (xr) readHands(dt);
  const grabbers = readGrabbers(xr);
  if (xr) { updateMenu(dt); updateMark(dt); }
  updateGrabs(grabbers);
  updatePokes(grabbers, dt);
  updateGifts(grabbers, dt);
  if (xr) updateInvites();
  updateMushroom(dt, t, grabbers);
  updateSpawner(dt);
  director(dt);
  updateElves(dt, t, xr);
  for (const v of [...visitors]) v.update(dt, t);
  updateFlyer(dt, t);
  updateSparks(dt); updateDecals(dt); updateScan(dt, t); updateCard(dt);
}
let simT = 0;
renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(0.05, last ? (time - last) / 1000 : 0.016); last = time;
  const xr = renderer.xr.isPresenting;
  if (xr) { if (frame) xrStep(frame); } else controls.update();
  simT += dt; simulate(dt, simT, xr);
  renderer.render(scene, camera);
});

enterWorld('preview');
window.littleElves = { renderer, readRoom, ff: (secs) => { for (let i = 0; i < secs * 60; i++) { simT += 1 / 60; simulate(1 / 60, simT, false); } }, elves, visitors, addElf, eat: () => { initAudio(); startEating(); }, Mush, Room, V3, camera, controls, tryPeek, tryChase, startFlyer, start: { ...STARTERS, ring: startRing, giant: spawnGiant, gift: () => { const e = elves.find(x => x.free()); return e && e.startGift(); } }, acts, Gift, LOG, Flyer, Dir, Grab, Mouse, HS, LOD, AU };
</script>
