<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Elves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2b2140; --pink:#ff3d7f; --sun:#ffd23f; --muted:#7a6a95; --card:rgba(255,253,248,.94); color-scheme:light; }
  html,body{margin:0;height:100%;overflow:hidden;background:#f3e9da;font-family:Fredoka,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  canvas{display:block;touch-action:none}
  #card{position:fixed;left:16px;top:16px;width:min(360px,calc(100vw - 32px));box-sizing:border-box;background:var(--card);
    border-radius:22px;padding:18px 20px 16px;box-shadow:0 10px 30px rgba(60,30,80,.18)}
  h1{margin:0;font-size:34px;line-height:1;color:var(--pink);font-weight:700}
  .for{margin:4px 0 12px;font-size:16px;color:var(--muted)}
  #hint{margin:0 0 12px;font-size:16px;line-height:1.35}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;background:var(--sun);color:var(--ink)}
  button.alt{background:#efe6fb}
  button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
  #note{margin:10px 0 0;font-size:13px;line-height:1.35;color:var(--muted)}
  #note:empty{display:none}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

} }
</script>
</head>
<body>
<div id="card">
  <h1>Little Elves</h1>
  <p class="for">for Eliza</p>
  <p id="hint">A funny mushroom is floating over the table. Click it to eat it.</p>
  <div class="row">
    <button id="mr" hidden>Start in your room</button>
    <button id="add" class="alt" hidden>+ Little person</button>
  </div>
  <p id="note"></p>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

// ================= tuning =================
const UNIT = 0.26;        // one model unit in meters; a medium little person is about 30 cm (1 ft) tall with a hat

const V3 = THREE.Vector3;

const rand = (a, b) => a + Math.random() * (b - a);

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.localClippingEnabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const PREVIEW_BG = new THREE.Color('#f3e9da');
scene.background = PREVIEW_BG;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.02, 60);
camera.position.set(2.3, 1.6, 2.7);
scene.add(camera);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.3, 0.6, -0.4);
controls.enableDamping = true; controls.minDistance = 0.3; controls.maxDistance = 7;
controls.update();
addEventListener('resize', () => {

  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
scene.add(new THREE.HemisphereLight(0xfff6ea, 0x9a8a7a, 1.9));
const sunLight = new THREE.DirectionalLight(0xffffff, 1.5); sunLight.position.set(1.5, 3, 1.2); scene.add(sunLight);
const camFwd = new V3(), camUp = new V3(), camRight = new V3(), camFwdH = new V3();
function updateCamVectors() {
  camFwd.set(0, 0, -1).applyQuaternion(camera.quaternion); camUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
  camRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
  camFwdH.copy(camFwd).setY(0); if (camFwdH.lengthSq() < 1e-4) camFwdH.set(0, 0, -1); camFwdH.normalize();

// ================= materials & textures =================
const grad = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toonMat = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: grad });
const toonMatDS = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: grad, side: THREE.DoubleSide });
const wingMat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false });
const mouthMat = new THREE.MeshBasicMaterial({ color: '#3a1626' });
const toonCache = new Map();
const toon = (hex, ds) => { const k = hex + (ds ? 'd' : ''); if (!toonCache.has(k)) toonCache.set(k, new THREE.MeshToonMaterial({ color: hex, gradientMap: grad, side: ds ? THREE.DoubleSide : THREE.FrontSide })); return toonCache.get(k); };

function canvasTex(w, h, draw) {

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function radialTex(stops) {

}
const dotTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,.9)'], [1, 'rgba(255,255,255,0)']]);
const softTex = radialTex([[0, 'rgba(255,255,255,.9)'], [0.6, 'rgba(255,255,255,.45)'], [1, 'rgba(255,255,255,0)']]);
const shadowTex = radialTex([[0, 'rgba(0,0,0,.55)'], [0.5, 'rgba(0,0,0,.3)'], [1, 'rgba(0,0,0,0)']]);

const heartTex = canvasTex(128, 128, x => {
  x.fillStyle = '#ff4f8b'; x.beginPath(); x.moveTo(64, 112);
  x.bezierCurveTo(10, 72, 6, 30, 38, 22); x.bezierCurveTo(54, 18, 62, 30, 64, 40);
  x.bezierCurveTo(66, 30, 74, 18, 90, 22); x.bezierCurveTo(122, 30, 118, 72, 64, 112); x.fill();
  x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.ellipse(42, 42, 10, 6, -0.6, 0, TAU); x.fill();
});
const zTex = canvasTex(64, 64, x => { x.fillStyle = '#ffffff'; x.strokeStyle = '#5a4a8a'; x.lineWidth = 6; x.font = '700 52px Fredoka, sans-serif'; x.textAlign = 'center'; x.strokeText('z', 32, 48); x.fillText('z', 32, 48); });
const glassTex = canvasTex(256, 256, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, 'rgba(200,225,255,.55)'); g.addColorStop(1, 'rgba(160,190,230,.35)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.fillStyle = 'rgba(255,255,255,.45)';
  for (const [a, b, s] of [[30, 0, 40], [90, 0, 16], [150, 0, 28]]) { x.beginPath(); x.moveTo(a, b); x.lineTo(a + s, b); x.lineTo(a + s - 140, h); x.lineTo(a - 140, h); x.fill(); }
  x.fillStyle = 'rgba(255,255,255,.6)';
  for (let i = 0; i < 26; i++) { x.beginPath(); x.ellipse(Math.random() * w, Math.random() * h, rand(1.5, 4), rand(2, 6), 0, 0, TAU); x.fill(); }
});
const shadowGeo = new THREE.CircleGeometry(0.075, 20);
const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
const starGeo = new THREE.OctahedronGeometry(0.011);
const starMat = new THREE.MeshBasicMaterial({ color: '#ffe14d' });
const planeGeo = new THREE.PlaneGeometry(1, 1);

// ================= sound =================
// Everything is synthesized. Each tribe has its own gibberish: different vowels, consonants, rhythm and buzz.
const AU = { ctx: null, listener: null, noise: null, master: null };
function initAudio() {
  if (AU.ctx) { AU.ctx.resume(); return; }
  AU.listener = new THREE.AudioListener(); camera.add(AU.listener);
  AU.ctx = AU.listener.context; AU.master = AU.listener.getInput();
  const len = AU.ctx.sampleRate, buf = AU.ctx.createBuffer(1, len, len), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AU.noise = buf;
  for (const e of [...elves, ...visitors]) attachVoice(e);
  if (Flyer.pilot) attachVoice(Flyer.pilot);
  AU.ctx.resume();
}
function attachVoice(e) {
  if (!AU.ctx || e.voiceIn) return;
  const c = AU.ctx, pa = new THREE.PositionalAudio(AU.listener), mix = c.createGain(); mix.gain.value = 1.4;
  pa.setNodeSource(mix); pa.setRefDistance(0.6); pa.setRolloffFactor(1.1);
  const voiceIn = c.createGain(), rawIn = c.createGain();
  if (e.muffled) { const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650; voiceIn.connect(lp); lp.connect(mix); }
  else voiceIn.connect(mix);
  rawIn.connect(mix);
  pa.position.y = 0.12; e.root.add(pa); e.audio = pa; e.voiceIn = voiceIn; e.rawIn = rawIn;
}
const now = () => AU.ctx.currentTime;
const VOW = { a: [800, 1200], e: [480, 1900], i: [310, 2300], o: [500, 880], u: [340, 780], y: [400, 1600] };
const CONS = { t: [3500, 1.5, 0.025], k: [2200, 1.5, 0.03], p: [900, 1, 0.02], s: [5500, 2, 0.07], b: [400, 1, 0.02], h: [1600, 0.7, 0.05], d: [2800, 1.2, 0.02], g: [1500, 1.2, 0.03], z: [4200, 1.5, 0.08], f: [6000, 1, 0.06] };
function noiseBurst(dest, t, dur, freq, q, vol, type = 'bandpass') {
  const c = AU.ctx, s = c.createBufferSource(); s.buffer = AU.noise; s.loop = true;
  const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function tone(dest, t, dur, f0, f1, vol, type = 'sine', vib = 0) {
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  if (vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = vib; lg.gain.value = f0 * 0.05; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + 0.03); }
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
}
function syl(dest, t, dur, f0a, f0b, vow, fs, vol, cons, vib, wave = 'sawtooth') {
  const c = AU.ctx, o = c.createOscillator(); o.type = wave;
  o.frequency.setValueAtTime(f0a, t); o.frequency.linearRampToValueAtTime(f0b, t + dur);
  if (vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = vib; lg.gain.value = f0a * 0.07; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + 0.03); }
  const [F1, F2] = VOW[vow] || VOW.a;
  const b1 = c.createBiquadFilter(); b1.type = 'bandpass'; b1.frequency.value = F1 * fs; b1.Q.value = 5;
  const b2 = c.createBiquadFilter(); b2.type = 'bandpass'; b2.frequency.value = F2 * fs; b2.Q.value = 7;
  const g = c.createGain(), g2 = c.createGain(); g2.gain.value = 0.7;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.setValueAtTime(vol, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let out = g;

    const am = c.createGain(), l = c.createOscillator(), lg = c.createGain(); am.gain.value = 0.6; l.frequency.value = 28; lg.gain.value = 0.4;
    l.connect(lg); lg.connect(am.gain); g.connect(am); out = am; l.start(t); l.stop(t + dur + 0.03);
  }
  o.connect(b1); o.connect(b2); b1.connect(g); b2.connect(g2); g2.connect(g); out.connect(dest);
  o.start(t); o.stop(t + dur + 0.03);
  if (cons === 'm') tone(dest, Math.max(c.currentTime, t - 0.05), 0.06, f0a * 0.9, f0a, vol * 0.25, 'triangle');
  else if (cons && CONS[cons]) { const [f, q, d] = CONS[cons]; noiseBurst(dest, Math.max(c.currentTime, t - 0.012), d, f, q, vol * 0.7); }
}
const KINDS = {
  gnome: { w: 3, size: [0.9, 1.15], voice: [150, 210], fs: [1.0, 1.15], lang: 'rumbly' },
  elf: { w: 3, size: [0.85, 1.2], voice: [280, 380], fs: [1.25, 1.45], lang: 'tinkly' },
  pixie: { w: 2, size: [0.62, 0.78], voice: [650, 900], fs: [1.6, 1.9], lang: 'chirp' },
  bumble: { w: 2, size: [0.82, 1.02], voice: [105, 145], fs: [0.85, 0.95], lang: 'blub' },
};
const LANGS = {
  rumbly: { vowels: 'ouoao', cons: 'bdgrmh', dur: [0.11, 0.2], gap: [0.03, 0.07], wave: 'sawtooth', contour: -0.35, vib: 0, laugh: { v: 'o', dur: 0.12, gap: 0.09, n: 4 } },
  tinkly: { vowels: 'ieyie', cons: 'tkspf', dur: [0.06, 0.12], gap: [0.01, 0.04], wave: 'sawtooth', contour: 0.25, vib: 0, laugh: { v: 'i', dur: 0.07, gap: 0.05, n: 6 } },
  chirp: { pure: true, dur: [0.04, 0.1], gap: [0.01, 0.035], glide: [0.6, 1.8], laugh: { chirp: true, n: 10 } },
  blub: { vowels: 'uoua', cons: 'bpmz', dur: [0.12, 0.22], gap: [0.04, 0.08], wave: 'square', contour: -0.1, vib: 7, laugh: { v: 'u', dur: 0.1, gap: 0.08, n: 4, snort: true } },

function makeSyllables(L, n) {
  return Array.from({ length: n }, () => ({ v: L.pure ? 'a' : pick(L.vowels), c: !L.pure && Math.random() < 0.55 ? pick(L.cons) : null, d: rand(...L.dur), r: rand(0.88, 1.15), g: L.pure ? rand(...L.glide) : rand(0.88, 1.15) }));
}
// Each little person has a catchphrase they keep coming back to.
const makePhrase = L => makeSyllables(L, 3 + ((Math.random() * 3) | 0));
function babble(e, n, question, delay = 0) {
  if (!e.voiceIn) return 0.6;

  sy.forEach((s, i) => {
    const k = i / Math.max(1, sy.length - 1), last = i === sy.length - 1;

}
function laugh(e, n, delay = 0) {
  if (!e.voiceIn) return 1.2;
  const L = LANGS[e.lang].laugh, t0 = now() + 0.02 + delay; let t = t0;
  const base = e.pitch * rand(1.15, 1.45);
  if (L.chirp) {
    for (let i = 0; i < n + 4; i++) { const f = base * (1 + i * 0.03); tone(e.voiceIn, t, 0.045, f, f * 1.5, 0.4); t += rand(0.03, 0.05); }
  } else {
    for (let i = 0; i < Math.max(n, L.n); i++) {

    case 'whee': S(t, 0.5, b * 1.2, b * 2.1, 'i', null, 6); d = 0.5; break;
    case 'yip': S(t, 0.08, b * 1.8, b * 2.2, 'i'); S(t + 0.11, 0.12, b * 2.0, b * 1.6, 'e'); d = 0.25; break;
    case 'waa': S(t, 0.75, b * 1.5, b * 0.9, 'a', null, 9); d = 0.75; break;
    case 'eee': S(t, 0.35, b * 2.0, b * 2.4, 'i', null, 11); d = 0.35; break;
    case 'oof': S(t, 0.18, b * 0.95, b * 0.6, 'u', 'p'); d = 0.2; break;
    case 'ow': S(t, 0.3, b * 1.6, b * 1.0, 'a'); S(t + 0.18, 0.15, b * 1.1, b * 0.9, 'u'); d = 0.35; break;

    case 'hey': S(t, 0.28, b * 1.0, b * 1.45, 'e', 'h'); d = 0.3; break;
    case 'boo': S(t, 0.3, b * 0.9, b * 1.5, 'u', 'b'); d = 0.32; break;
    case 'nono': for (let i = 0; i < 4; i++) S(t + i * 0.14, 0.1, b * (1.3 - i * 0.05), b * 1.1, 'o', 'm'); d = 0.6; break;
    case 'hic': S(t, 0.06, b * 1.6, b * 2.4, 'i', 'h'); d = 0.08; break;
    case 'mwah': S(t, 0.25, b * 1.0, b * 1.4, 'a', 'm'); noiseBurst(raw, t + 0.25, 0.025, 2200, 2, 0.6); d = 0.3; break;
    case 'yawn': S(t, 0.9, b * 1.1, b * 0.6, 'a', 'h', 3); d = 0.9; break;
    case 'achoo':

  }).catch(() => {});
} else noteEl.textContent = 'Open this page in the Quest browser to bring the little people into your real room.';

// ================= loop =================
let last = 0;
function xrStep(frame) {
  World.frames++;
  if (World.frames % 15 === 1) readRoom(frame);
  if (!Room.collider && performance.now() - World.t0 > 6000) { setRoom(fallbackFloor, 'fallback'); World.noRoom = true; }
  if (!World.placed && World.frames > 20) {
    World.placed = true; placeMushroom();
    showCard(['Little Elves', 'for Eliza', 'Grab the floating mushroom with your hand', 'and bring it up to your mouth.']);
  }
  if (World.noRoom === true) {
    World.noRoom = 'told';
    showCard(['No room scan found', 'The little people will stay on the floor.', 'To fix it: Quest Settings > Physical space', '> Space setup. Then come back!'], 9);
  }
}
function simulate(dt, t, xr) {
  updateCamVectors();
  userPos.copy(camera.position); camHead.copy(camera.position);
  updateMouthPos();
  if (xr) readHands(dt);
  const grabbers = readGrabbers(xr);
  if (xr) { updateMenu(dt); updateMark(dt); }
  updateGrabs(grabbers);
  updatePokes(grabbers, dt);
  if (xr) updateInvites();
  updateMushroom(dt, t, grabbers);
  updateSpawner(dt);
  director(dt);
  for (const e of elves) e.update(dt, t);
  for (const v of [...visitors]) v.update(dt, t);
  updateFlyer(dt, t);
  updateSparks(dt); updateDecals(dt); updateScan(dt, t); updateCard(dt);
}
let simT = 0;
renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(0.05, last ? (time - last) / 1000 : 0.016); last = time;
  const xr = renderer.xr.isPresenting;
  if (xr) { if (frame) xrStep(frame); } else controls.update();
  simT += dt; simulate(dt, simT, xr);
  renderer.render(scene, camera);
});

enterWorld('preview');
window.littleElves = { ff: (secs) => { for (let i = 0; i < secs * 60; i++) { simT += 1 / 60; simulate(1 / 60, simT, false); } }, elves, visitors, addElf, eat: () => { initAudio(); startEating(); }, Mush, Room, V3, camera, controls, tryPeek, tryVisit, tryChase, startFlyer, Flyer, Dir, Grab, Mouse, HS };
</script>
