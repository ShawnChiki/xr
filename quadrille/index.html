<!DOCTYPE html>
<html lang="en">

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<!--
  QUADRILLE XR : sketch quad SubD topology in VR / MR (Quest), with a desktop + phone fallback.
  One file: UI, WebXR, rendering, and the engine inside <script id="engine">. three.js r170 loads from a CDN (import map).
  Engine pipeline: raw strokes -> blended curves -> curve network (join distance) -> quad cage -> Catmull-Clark.
  It runs in a Web Worker built from the text of <script id="engine">, with a main-thread fallback.
  Multiplayer uses the artifact `room` capability (see MULTIPLAYER): strokes travel as messages, poses and settings as presence.
  A flat-screen view that finds a headset in the room becomes a third-person spectator of it.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1238B0; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;

  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #panelWrap { position: fixed; left: 10px; top: 10px; overflow: hidden; border-radius: 14px; touch-action: none; }
  #panel { display: block; touch-action: none; }
  #enter { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 14px 30px; font: 800 20px/1 inherit;
    font-family: inherit; letter-spacing: .04em; color: #0b0b0b; background: #FFD400; border: 4px solid #0b0b0b; border-radius: 999px;
    box-shadow: 0 6px 0 #0b0b0b; cursor: pointer; }
  #enter:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 #0b0b0b; }
  #hint { position: fixed; right: 12px; bottom: 10px; color: #fff; font-weight: 700; font-size: 12px; text-align: right;
    pointer-events: none; text-shadow: 0 1px 0 rgba(0,0,0,.5); max-width: 46vw; }
  #toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: #0b0b0b; color: #fff; font-weight: 700;
    font-size: 14px; padding: 10px 16px; border-radius: 999px; pointer-events: none; max-width: 80vw; text-align: center; }
  #watch { position: fixed; left: 10px; top: 10px; background: #E8212B; color: #fff; font-weight: 800; font-size: 13px; padding: 8px 14px;
    border: 3px solid #0b0b0b; border-radius: 999px; pointer-events: none; }

    border: 3px solid #0b0b0b; border-radius: 12px; display: flex; gap: 6px; align-items: center; }
  #roomIn { width: 4.2em; font: inherit; font-weight: 800; text-align: center; border: 2px solid #0b0b0b; border-radius: 8px; padding: 3px 2px; background: #FFD400; -webkit-user-select: text; user-select: text; }
  [hidden] { display: none !important; }

<body>
<canvas id="gl"></canvas>
<div id="panelWrap"><canvas id="panel" width="900" height="600"></canvas></div>
<button id="enter" hidden>ENTER VR</button>
<div id="hint"></div>
<div id="toast" hidden></div>
<div id="watch" hidden>WATCHING VR</div>
<button id="viewBtn" hidden>VIEW: 3RD PERSON</button>

<label id="roomBox" hidden>room <input id="roomIn" inputmode="numeric" maxlength="4" autocomplete="off"> <span id="roomN"></span></label>

<script id="engine">
(function () {
// =====================================================================
// QUADRILLE ENGINE  (no dependencies)
// raw strokes -> blended curves -> curve network -> quad cage -> SubD
// Everything is recomputed from the raw strokes, so the join distance
// ("tolerance") stays a live, non-destructive control.
// =====================================================================

// ---------- small vector helpers (plain [x,y,z] arrays) ----------
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = (a) => Math.hypot(a[0], a[1], a[2]);
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const norm = (a) => { const l = vlen(a); return l > 1e-12 ? [a[0] / l, a[1] / l, a[2] / l] : [0, 0, 0]; };
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);

// ---------- polyline helpers ----------
function cumLengths(P) {
  const c = new Array(P.length); c[0] = 0;
  for (let i = 1; i < P.length; i++) c[i] = c[i - 1] + dist(P[i - 1], P[i]);
  return c;
}
function sampleAt(P, cum, s, W) {
  const n = P.length, L = cum[n - 1];
  if (s <= 0) return { p: P[0].slice(), w: W ? W[0] : 1 };
  if (s >= L) return { p: P[n - 1].slice(), w: W ? W[n - 1] : 1 };
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const t = (s - cum[lo]) / Math.max(1e-12, cum[hi] - cum[lo]);
  return { p: lerp(P[lo], P[hi], t), w: W ? W[lo] + (W[hi] - W[lo]) * t : 1 };
}
function resampleOpen(P, W, h) {
  const cum = cumLengths(P), L = cum[P.length - 1];
  const n = Math.max(2, Math.round(L / h) + 1);
  const pts = [], w = [];
  for (let k = 0; k < n; k++) { const r = sampleAt(P, cum, (L * k) / (n - 1), W); pts.push(r.p); w.push(r.w); }
  return { pts, w };
}
function resampleClosed(P, W, h) {
  const R = P.concat([P[0]]), RW = W ? W.concat([W[0]]) : null;
  const cum = cumLengths(R), L = cum[R.length - 1];
  const n = Math.max(6, Math.round(L / h));
  const pts = [], w = [];
  for (let k = 0; k < n; k++) { const r = sampleAt(R, cum, (L * k) / n, RW); pts.push(r.p); w.push(r.w); }
  return { pts, w };
}
function smoothPts(P, iters, closed) {
  let cur = P; const n = P.length;
  for (let it = 0; it < iters; it++) {
    const nx = new Array(n);
    for (let i = 0; i < n; i++) {
      if (!closed && (i === 0 || i === n - 1)) { nx[i] = cur[i]; continue; }
      const a = cur[(i - 1 + n) % n], b = cur[(i + 1) % n], c = cur[i];
      nx[i] = [c[0] * 0.5 + (a[0] + b[0]) * 0.25, c[1] * 0.5 + (a[1] + b[1]) * 0.25, c[2] * 0.5 + (a[2] + b[2]) * 0.25];
    }
    cur = nx;
  }
  return cur;
}
let TW = 2; // tangent window in samples, set per build so it spans about 2.8 cm
function tangentAt(P, i, closed, k = TW) {
  // direction over a window of +-k samples, so hand wobble does not swing it around
  const n = P.length;
  const a = closed ? P[(((i - k) % n) + n) % n] : P[Math.max(0, i - k)];
  const b = closed ? P[(i + k) % n] : P[Math.min(n - 1, i + k)];
  return norm(sub(b, a));
}
function segTangent(P, i) { return norm(sub(P[Math.min(P.length - 1, i + TW)], P[Math.max(0, i - TW + 1)])); }
function ptSeg(q, a, b) {
  const abx = b[0] - a[0], aby = b[1] - a[1], abz = b[2] - a[2];
  const apx = q[0] - a[0], apy = q[1] - a[1], apz = q[2] - a[2];
  const ab2 = abx * abx + aby * aby + abz * abz;
  let t = ab2 > 1e-18 ? (apx * abx + apy * aby + apz * abz) / ab2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const dx = apx - abx * t, dy = apy - aby * t, dz = apz - abz * t;
  return { d: Math.sqrt(dx * dx + dy * dy + dz * dz), t };
}
function closestOnPoly(q, P, cum) {
  let best = Infinity, bi = 0, bt = 0;
  for (let i = 0; i < P.length - 1; i++) {
    const r = ptSeg(q, P[i], P[i + 1]);
    if (r.d < best) { best = r.d; bi = i; bt = r.t; }
  }
  return { d: best, i: bi, t: bt, s: cum[bi] + (cum[bi + 1] - cum[bi]) * bt, p: lerp(P[bi], P[bi + 1], bt) };
}

function strokeSpacing(tol) { return clamp(tol / 3, 0.004, 0.01); }
const minOverlap = (tol, h) => Math.max(0.6 * tol, 3 * h);

// A curve: { pts, w, closed, ring:{P,W,cum,L} }   (ring repeats the first point when closed)
function finalize(c) {
  const P = c.closed ? c.pts.concat([c.pts[0]]) : c.pts;
  const W = c.closed ? c.w.concat([c.w[0]]) : c.w;
  const cum = cumLengths(P);
  c.ring = { P, W, cum, L: cum[P.length - 1] };
  return c;
}
function makeClosed(P, W, h) {
  const r = resampleClosed(P, W, h);
  return { pts: smoothPts(r.pts, 2, true), w: r.w, closed: true };
}
// direction a curve is heading as it reaches one end, measured over a few cm so a hook or wobble does not fool it
function endHeading(P, cum, atEnd, tol) {
  const L = cum[P.length - 1], back = Math.min(L * 0.5, Math.max(2 * tol, 0.04));
  return atEnd ? norm(sub(P[P.length - 1], sampleAt(P, cum, L - back).p)) : norm(sub(P[0], sampleAt(P, cum, back).p));
}
function tryClose(c, h, tol) {
  if (c.closed) return c;
  const P = c.pts, n = P.length;
  if (n < 8) return c;
  const cum = cumLengths(P), L = cum[n - 1];
  if (L < 6 * tol) return c;
  const gap = dist(P[0], P[n - 1]);
  if (gap < tol) return makeClosed(P, c.w, h);
  if (gap < 2 * tol) { // a wider gap still closes when the two ends are heading into each other
    const out = endHeading(P, cum, true, tol), into = mul(endHeading(P, cum, false, tol), -1);
    if (dot(out, into) > 0.3 && dot(norm(sub(P[0], P[n - 1])), out) > 0.5) return makeClosed(P, c.w, h);
  }
  // the tail overshoots and runs back over the head
  const headN = Math.floor(n * 0.4);
  let bi = -1, bd = tol;
  for (let i = 0; i < headN; i++) { const d = dist(P[i], P[n - 1]); if (d < bd) { bd = d; bi = i; } }
  if (bi > 0 && dot(tangentAt(P, bi, false), tangentAt(P, n - 1, false)) > 0.5) {
    return makeClosed(P.slice(bi), c.w.slice(bi), h);
  }
  return c;
}
// cut the little hook the hand leaves when the trigger goes down or comes up
function dehook(P) {
  const cut = (Q) => {
    const cum = cumLengths(Q), L = cum[Q.length - 1]; if (L < 0.1) return Q;
    let best = 0;
    for (let i = 1; i < Q.length && cum[i] <= 0.02; i++) {
      const body = norm(sub(sampleAt(Q, cum, cum[i] + 0.03).p, Q[i])), tip = norm(sub(Q[i], Q[0]));
      if (dot(body, tip) < 0.57) best = i;
    }
    return best ? Q.slice(best) : Q;
  };
  return cut(cut(P).reverse()).reverse();
}
function prepStroke(raw, h, tol) {
  if (!raw || raw.length < 2) return null;
  let P = [raw[0]];
  for (let i = 1; i < raw.length; i++) if (dist(raw[i], P[P.length - 1]) > 1e-6) P.push(raw[i]);
  if (P.length < 2) return null;
  P = dehook(P);
  const cum = cumLengths(P);
  if (cum[P.length - 1] < h * 2) return null;
  const r = resampleOpen(P, null, h);
  const c = { pts: smoothPts(r.pts, 3, false), w: r.w, closed: false };
  return tryClose(c, h, tol);
}

// ---------- spatial hash of polyline segments ----------
class SegGrid {
  constructor(cell) { this.inv = 1 / cell; this.map = new Map(); }
  key(ix, iy, iz) { return ((ix * 73856093) ^ (iy * 19349663) ^ (iz * 83492791)) >>> 0; }
  add(cid, P) {
    const inv = this.inv;
    for (let i = 0; i < P.length - 1; i++) {
      const a = P[i], b = P[i + 1];
      const x0 = Math.floor(Math.min(a[0], b[0]) * inv), x1 = Math.floor(Math.max(a[0], b[0]) * inv);
      const y0 = Math.floor(Math.min(a[1], b[1]) * inv), y1 = Math.floor(Math.max(a[1], b[1]) * inv);
      const z0 = Math.floor(Math.min(a[2], b[2]) * inv), z1 = Math.floor(Math.max(a[2], b[2]) * inv);
      for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) {
        const k = this.key(x, y, z); let arr = this.map.get(k);
        if (!arr) { arr = []; this.map.set(k, arr); }
        arr.push(cid * 65536 + i);
      }
    }
  }
  near(q, cb) {
    const inv = this.inv;
    const cx = Math.floor(q[0] * inv), cy = Math.floor(q[1] * inv), cz = Math.floor(q[2] * inv);
    for (let x = cx - 1; x <= cx + 1; x++) for (let y = cy - 1; y <= cy + 1; y++) for (let z = cz - 1; z <= cz + 1; z++) {
      const arr = this.map.get(this.key(x, y, z));
      if (arr) for (let e = 0; e < arr.length; e++) { const v = arr[e]; cb(Math.floor(v / 65536), v % 65536); }
    }
  }
}

// =====================================================================
// 1. STROKES -> BLENDED CURVES
// Strokes that run alongside each other (within tol, roughly parallel)
// are blended into one averaged curve; chains extend it.
// =====================================================================
const PARALLEL = 0.8;

function findRun(add_, baseP, baseCum, tol) {
  const P = add_.pts, n = P.length;
  // "alongside" starts within tol, and keeps going while the two stay within 1.6 tol (a second pass that wanders)
  const on = new Array(n), strong = new Array(n), ss = new Array(n);
  for (let j = 0; j < n; j++) {
    const c = closestOnPoly(P[j], baseP, baseCum);
    ss[j] = c.s; on[j] = strong[j] = false;
    if (c.d < 1.6 * tol && Math.abs(dot(tangentAt(P, j, false), segTangent(baseP, c.i))) > PARALLEL) { on[j] = true; strong[j] = c.d < tol; }
  }
  for (let j = 1; j < n - 1; j++) if (!on[j] && on[j - 1] && (on[j + 1] || (j + 2 < n && on[j + 2]))) on[j] = true;
  const cum = cumLengths(P);
  let best = null, start = -1, nStrong = 0;
  for (let j = 0; j <= n; j++) {
    if (j < n && on[j]) { if (start < 0) { start = j; nStrong = 0; } if (strong[j]) nStrong++; }
    else if (start >= 0) {
      // trim weak ends so the run starts and stops where the two are properly close
      let a = start, b = j - 1; while (a < b && !strong[a]) a++; while (b > a && !strong[b]) b--;
      const l = cum[b] - cum[a];
      if (nStrong >= 2 && (!best || l > best.len)) best = { j0: a, j1: b, len: l, s0: ss[a], s1: ss[b] };
      start = -1;
    }
  }
  return best;
}

function curveFromPts(P, W, h) {
  if (P.length < 2) return null;
  const cum = cumLengths(P);
  if (cum[P.length - 1] < 3 * h) return null;
  const r = resampleOpen(P, W, h);
  return { pts: r.pts, w: r.w, closed: false };
}

// merge an open curve `add_` onto `base` (open or closed).
// returns null | {type:'merge'|'trimNew'|'trimBase', curve}
function mergeOnto(base, add_, tol, h) {
  const minOv = minOverlap(tol, h);
  let run = findRun(add_, base.ring.P, base.ring.cum, tol);
  if (!run || run.len < minOv) return null;
  let A = base.pts, AW = base.w;
  if (base.closed) {
    // re-cut the ring so its seam is opposite the overlap
    const R = base.ring, L = R.L;
    const jm = (run.j0 + run.j1) >> 1;
    const sm = closestOnPoly(add_.pts[jm], R.P, R.cum).s;
    const seam = (sm + L / 2) % L;
    const n = base.pts.length; A = []; AW = [];
    for (let k = 0; k <= n; k++) { const r = sampleAt(R.P, R.cum, (seam + (L * k) / n) % L, R.W); A.push(r.p); AW.push(r.w); }
    A[n] = A[0].slice();
    const cumA0 = cumLengths(A);
    run = findRun(add_, A, cumA0, tol);
    if (!run || run.len < minOv) return null;
  }
  const cumA = cumLengths(A), LA = cumA[A.length - 1];
  let B = add_.pts, BW = add_.w, j0 = run.j0, j1 = run.j1, a0 = run.s0, a1 = run.s1;
  if (a1 < a0) {
    const n = B.length; B = B.slice().reverse(); BW = BW.slice().reverse();
    const t0 = n - 1 - j1, t1 = n - 1 - j0; j0 = t0; j1 = t1;
    const t = a0; a0 = a1; a1 = t;
  }
  if (a1 - a0 < 0.3 * run.len) return null;
  const cumB = cumLengths(B), LB = cumB[B.length - 1];
  const b0 = cumB[j0], b1 = cumB[j1];
  const stub = tol;
  const hasApre = base.closed || a0 > stub, hasApost = base.closed || LA - a1 > stub;
  const hasBpre = b0 > stub, hasBpost = LB - b1 > stub;
  const forkS = hasApre && hasBpre, forkE = hasApost && hasBpost;
  if (forkS && forkE) return null;
  const Aat = (s) => sampleAt(A, cumA, s, AW);
  if (forkE) {
    if (hasBpre && !hasApre) {
      const P = [B[j1].slice()], W = [BW[j1]];
      for (let i = 0; i < A.length; i++) if (cumA[i] > a1 + 1e-9) { P.push(A[i]); W.push(AW[i]); }
      return { type: 'trimBase', curve: curveFromPts(P, W, h) };
    }
    const r = Aat(a1); const P = [r.p], W = [r.w];
    for (let j = j1 + 1; j < B.length; j++) { P.push(B[j]); W.push(BW[j]); }
    return { type: 'trimNew', curve: curveFromPts(P, W, h) };
  }
  if (forkS) {
    if (hasBpost && !hasApost) {
      const P = [], W = [];
      for (let i = 0; i < A.length; i++) if (cumA[i] < a0 - 1e-9) { P.push(A[i]); W.push(AW[i]); }
      P.push(B[j0].slice()); W.push(BW[j0]);
      return { type: 'trimBase', curve: curveFromPts(P, W, h) };
    }
    const P = [], W = [];
    for (let j = 0; j < j0; j++) { P.push(B[j]); W.push(BW[j]); }
    const r = Aat(a0); P.push(r.p); W.push(r.w);
    return { type: 'trimNew', curve: curveFromPts(P, W, h) };
  }
  // blend
  const preFrom = hasApre ? 'A' : hasBpre ? 'B' : null;
  const postFrom = hasApost ? 'A' : hasBpost ? 'B' : null;
  const ramp = (x) => { x = clamp(x / 0.4, 0, 1); return x * x * (3 - 2 * x); };
  const P = [], W = [];
  if (preFrom === 'A') { for (let i = 0; i < A.length; i++) if (cumA[i] < a0 - 1e-9) { P.push(A[i]); W.push(AW[i]); } }
  else if (preFrom === 'B') { for (let j = 0; j < j0; j++) { P.push(B[j]); W.push(BW[j]); } }
  const M = Math.max(3, Math.ceil(Math.max(a1 - a0, b1 - b0) / h) + 1);
  for (let k = 0; k < M; k++) {
    const t = k / (M - 1);
    const ra = Aat(a0 + t * (a1 - a0)), rb = sampleAt(B, cumB, b0 + t * (b1 - b0), BW);
    let fA = 1, fB = 1;
    if (preFrom === 'A') fB *= ramp(t); else if (preFrom === 'B') fA *= ramp(t);
    if (postFrom === 'A') fB *= ramp(1 - t); else if (postFrom === 'B') fA *= ramp(1 - t);
    const ca = fA * ra.w, cb = fB * rb.w, den = ca + cb;
    if (den < 1e-9) { P.push(ra.p); W.push(ra.w); }
    else { P.push([(ca * ra.p[0] + cb * rb.p[0]) / den, (ca * ra.p[1] + cb * rb.p[1]) / den, (ca * ra.p[2] + cb * rb.p[2]) / den]); W.push(Math.max(den, 0.25)); }
  }
  if (postFrom === 'A') { for (let i = 0; i < A.length; i++) if (cumA[i] > a1 + 1e-9) { P.push(A[i]); W.push(AW[i]); } }
  else if (postFrom === 'B') { for (let j = j1 + 1; j < B.length; j++) { P.push(B[j]); W.push(BW[j]); } }
  if (base.closed) {
    P.pop(); W.pop();
    return { type: 'merge', curve: makeClosed(P, W, h) };
  }
  const r = resampleOpen(P, W, h);
  const c = { pts: smoothPts(r.pts, 2, false), w: r.w, closed: false };
  return { type: 'merge', curve: tryClose(c, h, tol) };
}

function blendRings(A, B, tol, h) {
  let hit = 0;
